    if (lokal && onlineM) aus.push({ cls: "m-multi", text: "Lokal & Online", lang: "Mehrspieler: lokal am Ger\u00e4t und online" });
    else if (lokal) aus.push({ cls: "m-lokal", text: "Lokal", lang: "Mehrspieler am selben Ger\u00e4t" });
    else if (onlineM) aus.push({ cls: "m-online", text: "Online", lang: "Mehrspieler online \u00fcber den Connector" });
    else if (m.indexOf("multi") >= 0) aus.push({ cls: "m-multi", text: "Mehrspieler" });
    if (m.indexOf("computer") >= 0) aus.push({ cls: "m-bots", text: "Bots", lang: "Gegen den Computer" });
    if (m.indexOf("highscore") >= 0) aus.push({ cls: "m-extra", text: "Rekord", lang: "Highscore / Bestwert" });
    if (m.indexOf("controller") >= 0) aus.push({ cls: "m-extra", text: "Pad", lang: "Controller-Unterst\u00fctzung" });
    return aus;
  }

  function hatModus(s, key) {
    if (key === "solo") return s.merk.indexOf("solo") >= 0;
    if (key === "computer") return s.merk.indexOf("computer") >= 0;
    if (key === "online") return s.merk.indexOf("online") >= 0;
    return s.merk.indexOf("multi") >= 0 || s.merk.indexOf("lokal") >= 0 || s.merk.indexOf("online") >= 0;
  }

  function modiChips(s) {
    var box = el("span", "karte-modi");
    modiVon(s).forEach(function (m) {
      var b = el("span", "modus " + m.cls);
      b.textContent = m.text;
      if (m.lang) b.title = m.lang;
      box.appendChild(b);
    });
    return box;
  }

  function setzeTitel(text) {
    document.title = text ? text + " – Spielhalle" : "Spielhalle – TrashyGecko";
  }

  function kartenRaster(liste, mitKategorie) {
    var raster = el("div", "karten");
    liste.forEach(function (s, i) {
      var k = karte(s, mitKategorie);
      k.style.setProperty("--i", String(Math.min(i, 12)));
      raster.appendChild(k);
    });
    return raster;
  }

  /* Spiele, für die der Connector eine Online-Runde kennt, fragen zuerst den
     Modus ab. Alle anderen starten wie bisher sofort. */
  function onlineDef(s) {
    for (var i = 0; i < online.length; i++) {
      if (online[i].pfad === "/spiele/" + s.pfad) return online[i];
    }
    return null;
  }

  function karte(s, mitKategorie) {
    var k = katNach[s.kat] || {};
    var def = onlineDef(s);
    var a = el("a", "karte");
    a.href = s.pfad;
    if (k.akzent) a.style.setProperty("--akzent", k.akzent);

    var sym = el("span", "symbol");
    sym.innerHTML = spielSymbol(s);
    sym.setAttribute("aria-hidden", "true");
    if (def) {
      var punkt = el("span", "online-punkt");
      punkt.title = "Auch online spielbar";
      sym.appendChild(punkt);
    }
    a.appendChild(sym);

    var text = el("span", "karte-text");
    if (mitKategorie && k.name) {
      var kat = el("span", "karte-kat");
      kat.textContent = k.name;
      text.appendChild(kat);
    }
    var name = el("span", "karte-name");
    name.textContent = s.name;
    text.appendChild(name);

    var desc = el("span", "karte-desc");
    desc.textContent = s.text;
    text.appendChild(desc);

    var modi = modiChips(s);
    if (modi.childNodes.length) text.appendChild(modi);
    a.appendChild(text);

    var start = el("span", "karte-start");
    start.textContent = def ? "Modi ›" : "Spielen ›";
    a.appendChild(start);
    a.setAttribute("aria-label", def ? s.name + " – Spielmodus wählen" : s.name + " spielen");

    a.addEventListener("click", function (e) {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (!def || !window.TGHalle) return;
      e.preventDefault();
      window.TGHalle.auswahl(s.pfad, s.name, s.text, s.merk);
    });
    return a;
  }

  function highlightKarte(h, gross) {
    var s = spielNach(h.pfad);
    if (!s) return null;
    var k = katNach[s.kat] || {};
    var def = onlineDef(s);

    var a = el("a", "hl" + (gross ? " hl--gross" : ""));
    a.href = s.pfad;
    if (k.akzent) a.style.setProperty("--hl-akzent", k.akzent);

    var bild = el("img", "hl-bild");
    bild.src = h.bild;
    bild.alt = "";
    bild.width = 1392;
    bild.height = 752;
    bild.loading = "lazy";
    a.appendChild(bild);

    a.appendChild(el("span", "hl-schleier"));

    var badge = el("span", "hl-badge");
    var stern = el("span", "stern");
    stern.textContent = "★";
    badge.appendChild(stern);
    badge.appendChild(document.createTextNode(" Highlight"));
    a.appendChild(badge);

    if (def) {
      var onlineMarke = el("span", "hl-badge online");
      onlineMarke.appendChild(el("span", "punkt"));
      onlineMarke.appendChild(document.createTextNode(
        " Online " + (def.min || 2) + "–" + (def.max || def.min || 2)));
      a.appendChild(onlineMarke);
    }

    var text = el("div", "hl-text");
    var kat = el("span", "hl-kat");
    kat.textContent = (k.name || "Spiel") + (def ? " · Online" : "");
    text.appendChild(kat);

    var name = el("span", "hl-name");
    name.textContent = s.name;
    text.appendChild(name);

    var desc = el("span", "hl-desc");
    desc.textContent = h.text || s.text;
    text.appendChild(desc);

    /* In der großen Ansicht zusätzlich zeigen, was das Spiel kann. */
    if (gross) {
      var modi = modiChips(s);
      if (modi.childNodes.length) {
        modi.className = "hl-modi";
        text.appendChild(modi);
      }
    }

    var fuss = el("div", "hl-fuss");
    var start = el("span", "hl-start");
    start.appendChild(document.createTextNode("Jetzt spielen "));
    var pfeil = el("span", "pfeil");
    pfeil.textContent = "›";
    start.appendChild(pfeil);
    fuss.appendChild(start);
    if (def) {
      var raumMarke = el("span", "hl-modi-text");
      raumMarke.textContent = "Raum + Chat";
      fuss.appendChild(raumMarke);
    }
    text.appendChild(fuss);

    a.appendChild(text);
    a.setAttribute("aria-label", s.name + " jetzt spielen");

    a.addEventListener("click", function (e) {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (!def || !window.TGHalle) return;
      e.preventDefault();
      window.TGHalle.auswahl(s.pfad, s.name, h.text || s.text, s.merk);
    });
    return a;
  }

  function abschnittKopf(titel, linkText, linkZiel) {
    var kopf = el("div", "abschnitt");
    var h = el("h2");
    h.textContent = titel;
    kopf.appendChild(h);
    if (linkText) {
      var a = el("a", "mehr");
      a.href = linkZiel;
      a.textContent = linkText;
      kopf.appendChild(a);
    }
    return kopf;
  }

  function ansichtKopf(ikone, titel, beschreibung, zahl, akzent) {
    var kopf = el("div", "ansicht-kopf");
    if (akzent) kopf.style.setProperty("--akzent", akzent);
    var ik = el("span", "ikon");
    ik.innerHTML = ikone;
    kopf.appendChild(ik);
    var h = el("h2");
    h.textContent = titel;
    kopf.appendChild(h);
    var z = el("span", "zahl");
    z.textContent = zahl;
    kopf.appendChild(z);

    var box = el("div");
    box.appendChild(kopf);
    if (beschreibung) {
      var p = el("p", "ansicht-text");
      p.textContent = beschreibung;
      box.appendChild(p);
    }
    return box;
  }

  function leerHinweis(text) {
    var p = el("p", "leer");
    p.textContent = text;
    return p;
  }

  /* --------------------------------------------------------------- Ansichten --- */
  function zeigeStart(scroll) {
    setzeTitel("");
    unterzeile.textContent = spiele.length + " Spiele \u00b7 " + KATEGORIEN.length + " Kategorien";
    zurueckSchnell.hidden = true;

    var box = el("div");

    if (HIGHLIGHTS.length) {
      box.appendChild(abschnittKopf("Highlights", "Alle ansehen \u203a", "#/highlights"));
      var hl = el("div", "highlights");
      HIGHLIGHTS.forEach(function (h, i) {
        var k = highlightKarte(h, false);
        if (k) { k.style.setProperty("--i", String(i)); hl.appendChild(k); }
      });
      box.appendChild(hl);
    }

    box.appendChild(abschnittKopf("Kategorien", null, null));
    var kats = el("div", "kategorien");
    KATEGORIEN.forEach(function (k) {
      var anzahl = 0;
      spiele.forEach(function (s) { if (s.kat === k.id) anzahl++; });
      if (!anzahl) return;
      var a = el("a", "kat");
      a.style.setProperty("--i", String(Math.min(kats.childNodes.length, 8)));
      a.href = "#kat-" + encodeURIComponent(k.id);
      a.style.setProperty("--akzent", k.akzent);
      var ik = el("span", "kat-ikon");
      ik.innerHTML = IKONEN[k.id] || IKONEN.denk;
      a.appendChild(ik);
      var name = el("span", "kat-name");
      name.textContent = k.name;
      a.appendChild(name);
      var txt = el("span", "kat-text");
      txt.textContent = k.text;
      a.appendChild(txt);
      var zahl = el("span", "kat-zahl");
      zahl.textContent = anzahl + (anzahl === 1 ? " Spiel" : " Spiele");
      a.appendChild(zahl);
      a.setAttribute("aria-label", k.name + " \u2013 " + anzahl + " Spiele");
      kats.appendChild(a);
    });
    box.appendChild(kats);

    /* Jede Kategorie zusätzlich als eigener Abschnitt mit allen Spielen – wie in
       der früheren Übersicht. Die Karten oben sind die Sprungmarken dorthin. */
    KATEGORIEN.forEach(function (k) {
      var liste = spiele.filter(function (s) { return s.kat === k.id; }).sort(nachName);
      if (!liste.length) return;
      var abschnitt = el("section", "kat-abschnitt");
      abschnitt.id = "kat-" + k.id;
      abschnitt.style.setProperty("--akzent", k.akzent);
      abschnitt.appendChild(ansichtKopf(IKONEN[k.id] || IKONEN.denk, k.name, k.text,
        String(liste.length), k.akzent));
      abschnitt.appendChild(kartenRaster(liste, false));
      var mehr = el("a", "mehr-zeile");
      mehr.textContent = liste.length === 1 ? "Ansehen \u203a"
        : "Alle " + liste.length + " ansehen \u203a";
      mehr.href = "#/k/" + encodeURIComponent(k.id);
      abschnitt.appendChild(mehr);
      box.appendChild(abschnitt);
    });

    var werk = el("a", "kasten-link");
    werk.href = "#/werkzeuge";
    var werkInhalt = el("span", "kasten-inhalt");
    var werkTitel = el("strong");
    werkTitel.textContent = "Werkzeuge & Extras";
    werkInhalt.appendChild(werkTitel);
    var werkText = el("span", "kasten-text");
    werkText.textContent = "W\u00fcrfelbecher, Sanduhr, Rechner, Level-Editoren und Apps";
    werkInhalt.appendChild(werkText);
    werk.appendChild(werkInhalt);
    var pfeil = el("span", "pfeil");
    pfeil.textContent = "\u203a";
    werk.appendChild(pfeil);
    box.appendChild(werk);

    leeren(inhalt);
    inhalt.appendChild(box);
    if (scroll) window.scrollTo(0, 0);
  }

  function zeigeKategorie(id, scroll) {
    var k = katNach[id];
    if (!k) { zeigeStart(scroll); return; }

    var alle = spiele.filter(function (s) { return s.kat === id; }).sort(nachName);
    var sichtbar = alle.filter(function (s) {
      return aktiveModi.every(function (m) { return hatModus(s, m); });
    });

    setzeTitel(k.name);
    unterzeile.textContent = alle.length + (alle.length === 1 ? " Spiel" : " Spiele");
    zurueckSchnell.hidden = false;

    var box = el("div");
    box.appendChild(ansichtKopf(IKONEN[id] || IKONEN.denk, k.name, k.text,
      sichtbar.length === alle.length ? String(alle.length) : sichtbar.length + " / " + alle.length, k.akzent));

    var modi = el("div", "modi-filter");
    modi.setAttribute("role", "group");
    modi.setAttribute("aria-label", "Nach Spielmodus filtern");
    var vorhanden = [
      ["solo", "Einzelspieler"],
      ["multi", "Mehrspieler"],
      ["online", "Online spielbar"],
      ["computer", "Gegen Bots"]
    ].filter(function (m) {
      return alle.some(function (s) { return hatModus(s, m[0]); });
    });

    if (vorhanden.length > 1) {
      vorhanden.forEach(function (m) {
        var b = el("button");
        b.type = "button";
        b.textContent = m[1];
        b.setAttribute("aria-pressed", aktiveModi.indexOf(m[0]) >= 0 ? "true" : "false");
        b.addEventListener("click", function () {
          var i = aktiveModi.indexOf(m[0]);
          if (i >= 0) aktiveModi.splice(i, 1);
          else aktiveModi.push(m[0]);
          zeichne(false);
        });
        modi.appendChild(b);
      });
      box.appendChild(modi);
    }

    if (aktiveModi.length) {
      var zeile = el("p", "ergebnis-zeile");
      zeile.textContent = sichtbar.length + " von " + alle.length + " Spielen passen zum Filter.";
      box.appendChild(zeile);
    }

    if (!sichtbar.length) {
      box.appendChild(leerHinweis("Kein Spiel dieser Kategorie passt zum gewählten Modus. Tippe den Filter erneut an, um ihn zu lösen."));
    } else {
      box.appendChild(kartenRaster(sichtbar, false));
    }

    /* Direkt weiter zur nächsten Kategorie, ohne über den Start zurück. */
    var wechsel = el("nav", "kat-wechsel");
    wechsel.setAttribute("aria-label", "Andere Kategorien");
    KATEGORIEN.forEach(function (k) {
      if (k.id === id) return;
      var anzahl = spiele.filter(function (s) { return s.kat === k.id; }).length;
      if (!anzahl) return;
      var a = el("a", "kat-wechsel-link");
      a.href = "#/k/" + encodeURIComponent(k.id);
      a.style.setProperty("--akzent", k.akzent);
      var ik = el("span", "kat-wechsel-ikon");
      ik.innerHTML = IKONEN[k.id] || IKONEN.denk;
      a.appendChild(ik);
      var txt = el("span", "kat-wechsel-text");
      var stark = el("strong");
      stark.textContent = k.name;
      txt.appendChild(stark);
      var klein = el("span");
      klein.textContent = anzahl + (anzahl === 1 ? " Spiel" : " Spiele");
      txt.appendChild(klein);
      a.appendChild(txt);
      wechsel.appendChild(a);
    });
    box.appendChild(wechsel);

    leeren(inhalt);
    inhalt.appendChild(box);
    if (scroll) window.scrollTo(0, 0);
  }

  function zeigeHighlights(scroll) {
    setzeTitel("Highlights");
    unterzeile.textContent = HIGHLIGHTS.length + " Spiele";
    zurueckSchnell.hidden = false;

    var box = el("div");
    box.appendChild(ansichtKopf(IKONEN.highlights, "Highlights",
      "Besondere Eigenentwicklungen und ausgewählte Spiele – groß ins Bild gesetzt.", String(HIGHLIGHTS.length), "#e8cd8e"));

    var raster = el("div", "highlights gross");
    HIGHLIGHTS.forEach(function (h) {
      var k = highlightKarte(h, true);
      if (k) raster.appendChild(k);
    });
    box.appendChild(raster);

    leeren(inhalt);
    inhalt.appendChild(box);
    if (scroll) window.scrollTo(0, 0);
  }

  function zeigeWerkzeuge(scroll) {
    setzeTitel("Werkzeuge");
    unterzeile.textContent = WERKZEUGE.length + " Eintr\u00e4ge";
    zurueckSchnell.hidden = false;

    var box = el("div");
    box.appendChild(ansichtKopf(IKONEN.werkzeuge, "Werkzeuge & Extras",
      "Keine Spiele – Hilfsmittel, Apps und Editoren. Die Spiele bleiben in ihren Kategorien.",
      String(WERKZEUGE.length), "#9aa7a0"));

    var raster = el("div", "karten");
    WERKZEUGE.forEach(function (w) {
      var a = el("a", "karte");
      a.href = w[1];
      if (/^https?:/i.test(w[1])) {
        a.target = "_blank";
        a.rel = "noopener";
      }
      var sym = el("span", "symbol");
      sym.textContent = monogramm(w[0]);
      sym.setAttribute("aria-hidden", "true");
      a.appendChild(sym);
      var text = el("span", "karte-text");
      var name = el("span", "karte-name");
      name.textContent = w[0];
      text.appendChild(name);
      var desc = el("span", "karte-desc");
      desc.textContent = w[2] || "";
      text.appendChild(desc);
      a.appendChild(text);
      var start = el("span", "karte-start");
      start.textContent = "Öffnen \u203a";
      a.appendChild(start);
      raster.appendChild(a);
    });
    box.appendChild(raster);

    leeren(inhalt);
    inhalt.appendChild(box);
    if (scroll) window.scrollTo(0, 0);
  }

  function zeigeSuche(q, scroll) {
    var n = ohneUmlaute(q.toLowerCase());
    var treffer = spiele.filter(function (s) {
      return s.suchtext.indexOf(n) >= 0;
    }).sort(nachName);

    setzeTitel("Suche");
    unterzeile.textContent = treffer.length + " Treffer";
    zurueckSchnell.hidden = false;

    var box = el("div");
    box.appendChild(ansichtKopf(IKONEN.denk, "Suche",
      "\u201e" + q + "\u201c \u2013 in allen Kategorien.", String(treffer.length), "#e8cd8e"));

    if (!treffer.length) {
      box.appendChild(leerHinweis("Kein Spiel gefunden. Versuche einen Teil des Namens, zum Beispiel \u201eMau\u201c oder \u201eW\u00fcrfel\u201c."));
    } else {
      box.appendChild(kartenRaster(treffer, true));
    }

    leeren(inhalt);
    inhalt.appendChild(box);
    if (scroll) window.scrollTo(0, 0);
  }

  /* --------------------------------------------------------------- Steuerung --- */
  var zustand = { ansicht: "start", id: null };
  var sucheLaeuft = false;

  function zeichne(scroll) {
    var q = suchfeld.value.trim();
    if (q) { zeigeSuche(q, scroll); return; }
    if (zustand.ansicht === "kategorie") zeigeKategorie(zustand.id, scroll);
    else if (zustand.ansicht === "highlights") zeigeHighlights(scroll);
    else if (zustand.ansicht === "werkzeuge") zeigeWerkzeuge(scroll);
    else zeigeStart(scroll);
  }

  function route() {
    var h = (location.hash || "").replace(/^#\/?/, "");
    aktiveModi = [];
    sucheLaeuft = false;
    /* #kat-… springt auf der Startseite zum Kategorie-Abschnitt. */
    var anker = null;
    if (h.indexOf("kat-") === 0) {
      anker = "kat-" + decodeURIComponent(h.slice(4));
      h = "";
    }
    if (h.indexOf("k/") === 0) {
      zustand.ansicht = "kategorie";
      zustand.id = decodeURIComponent(h.slice(2));
      /* Alte Adresse aus der früheren Übersicht. */
      if (zustand.id === "action") zustand.id = "arcade";
    } else if (h === "highlights") {
      zustand.ansicht = "highlights";
      zustand.id = null;
    } else if (h === "werkzeuge") {
      zustand.ansicht = "werkzeuge";
      zustand.id = null;
    } else {
      zustand.ansicht = "start";
      zustand.id = null;
    }
    suchfeld.value = "";
    suchfeldBox.classList.remove("hat-text");
    zeichne(true);
    if (anker) {
      var ziel = document.getElementById(anker);
      if (ziel) ziel.scrollIntoView({ block: "start" });
    }
  }

  suchfeld.addEventListener("input", function () {
    var q = suchfeld.value.trim();
    suchfeldBox.classList.toggle("hat-text", suchfeld.value.length > 0);
    if (q) {
      var ersteSuche = !sucheLaeuft;
      sucheLaeuft = true;
      zeichne(ersteSuche);
    } else {
      sucheLaeuft = false;
      zeichne(false);
    }
  });

  suchfeld.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      suchfeld.value = "";
      suchfeldBox.classList.remove("hat-text");
      sucheLaeuft = false;
      zeichne(false);
    }
  });

  loeschen.addEventListener("click", function () {
    suchfeld.value = "";
    suchfeldBox.classList.remove("hat-text");
    sucheLaeuft = false;
    zeichne(false);
    suchfeld.focus();
  });

  window.addEventListener("hashchange", route);
  route();
})();
</script>

<script src="halle-online.js"></script>
</body>
