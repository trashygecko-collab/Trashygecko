
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a211b">
<title>NEON SANDUHR</title>
<style>
:root{
/* Token-Ebene. Klassisch sind genau die alten Farben. */
--bg:#0a211b;--panel:#0f2b23;--panel-2:#12332a;--leiste:#0b241d;
--text:#efe6d2;--muted:#aaa;
--gold:#d9bc7c;--gold-schwach:#d9bc7c66;--gold-glow:#d9bc7c88;
--sand:#e8cd8e;--line:#2c5a49;--line-2:#4d8a72;
--warn:#c2765c;--alarm:#7d2a20;
}

*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:15px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--text);
  font-family:var(--tg-schrift);
  transition:background .15s;
}
body.alarm{animation:alarm .45s ease-in-out 6}
@keyframes alarm{
  0%,100%{background:var(--bg)}
  50%{background:var(--alarm)}
}
.app{
  width:min(100%,440px);
  display:flex;flex-direction:column;align-items:center;gap:16px;
}
.glass{
  width:210px;height:310px;
  filter:drop-shadow(0 0 12px var(--gold-schwach));
}
.glass svg{width:100%;height:100%;overflow:visible}
.glass-frame{
  fill:none;stroke:var(--gold);stroke-width:5;
  stroke-linecap:round;stroke-linejoin:round;
}
.sand{
  fill:var(--sand);
  filter:drop-shadow(0 0 5px var(--gold));
}
.stream{
  fill:none;stroke:var(--sand);stroke-width:4;
  stroke-linecap:round;
  filter:drop-shadow(0 0 4px var(--sand));
}
#topSand{transform-origin:100px 25px}
#bottomSand{transform-origin:100px 275px}
#sandStream{opacity:0}
.glass.running #sandStream{opacity:1}
.glass.running #topSand{
  animation:topfall 2s linear infinite;
}
.glass.running #bottomSand{
  animation:bottomrise 2s linear infinite;
}
@keyframes topfall{
  0%{transform:scaleY(1)}
  100%{transform:scaleY(.08)}
}
@keyframes bottomrise{
  0%{transform:scaleY(.12)}
  100%{transform:scaleY(1)}
}
.timer{
  font-size:clamp(48px,13vw,68px);
  font-weight:bold;color:var(--sand);
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px var(--gold-glow);
  letter-spacing:4px;
}
.settings{
  width:100%;background:var(--panel);
  border:1px solid var(--line);border-radius:15px;
  padding:15px;display:flex;flex-direction:column;gap:12px;
}
.label{
  color:var(--muted);text-align:center;
  font-size:12px;letter-spacing:2px;
}
.adjust{
  display:flex;justify-content:center;
  align-items:center;gap:10px;
}
.adjust button{
  width:43px;height:43px;border-radius:9px;
  background:var(--leiste);color:var(--gold);
  border:1px solid var(--gold);font-size:23px;
  cursor:pointer;
}
.adjust input{
  width:100px;text-align:center;
  background:var(--bg);var(color:var(--text));
  border:1px solid var(--line-2);border-radius:8px;
  padding:10px;font-size:23px;
  font-variant-numeric:tabular-nums;
}
.buttons{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;width:100%;
}
.action{
  padding:14px 8px;border-radius:10px;
  border:1px solid var(--gold);
  background:var(--panel);color:var(--gold);
  font-size:16px;font-weight:bold;
  cursor:pointer;
}
.action.secondary{
  border-color:var(--warn);color:var(--warn);
  background:var(--panel-2);
}
.action:disabled{opacity:.35;cursor:not-allowed}
.status{
  color:var(--muted);text-align:center;
  font-size:12px;min-height:16px;
}
@media(max-height:650px) and (min-width:500px){
  body{align-items:flex-start}
  .app{gap:8px}
  .glass{height:210px;width:145px}
  .settings{padding:9px;gap:7px}
  .timer{font-size:42px}
  .action{padding:10px}
}
/* Schmale Handys mit wenig Höhe: Glas und Abstände kleiner, damit alles
   ohne Scrollen auf den Schirm passt. */
@media(max-height:720px) and (max-width:499px){
  .glass{height:240px;width:163px}
  .timer{font-size:44px}
  .settings{padding:11px;gap:9px}
  .action{padding:11px 8px}
/* Sehr kleine Handys (z. B. 568 px hoch): noch eine Stufe kompakter. */
@media(max-height:600px) and (max-width:400px){
  .glass{height:190px;width:129px}
  .timer{font-size:36px}
  .settings{padding:9px;gap:7px}
  .action{padding:9px 6px}
}
}
/* ---- Grafikstil (zentral): Klassisch bleibt unveraendert ---- */
html[data-stil="maedchen"]{
--bg:#f7a6d4;--panel:#fff6fa;--panel-2:#ffe3ef;--leiste:#ffeaf3;
--text:#3a0f24;--muted:#8f2450;
--gold:#ef7aa8;--gold-schwach:#ef7aa866;--gold-glow:#ef7aa888;
--sand:#b06bff;--line:#ef7aa8;--line-2:#ff9ec4;
--warn:#b0286a;--alarm:#ff8fb0;
}
html[data-stil="buben"]{
--bg:#0a0d10;--panel:#111316;--panel-2:#16181c;--leiste:#0a0d10;
--text:#e6e9ec;--muted:#adb4bc;
--gold:#e0242f;--gold-schwach:#e0242f66;--gold-glow:#e0242f88;
--sand:#c8ff3d;--line:#2b1a1f;--line-2:#e0242f;
--warn:#ff8a90;--alarm:#7a0f16;
}
/* Lesbarkeit: geprüft 21.11.2026 */
html[data-stil="maedchen"] #display{color:#7a2fbf}
html[data-stil="maedchen"] .adjust span{color:#8f2450}
html[data-stil="maedchen"] #minus,html[data-stil="maedchen"] #plus,html[data-stil="maedchen"] #start{color:#b0286a}
html[data-stil="klassisch"] input#minutes,html[data-stil="klassisch"] input#seconds{background:#fffaf0;color:#0b241b;border-color:#c8a86a;color-scheme:light}
html[data-stil="buben"] input#minutes,html[data-stil="buben"] input#seconds{background:#16181c;color:#e6e9ec;border-color:#2b3540;color-scheme:dark}

/* Lesbarkeit 3: geprüft 21.11.2026 */
html[data-stil="maedchen"] .adjust span{color:#8f2450 !important}

/* Lesbarkeit 4: geprüft 21.11.2026 */
html[data-stil="klassisch"] #pause,html[data-stil="klassisch"] #reset{color:#e89a80}
html[data-stil="maedchen"] #status{color:#5b0f2e}
html[data-stil="buben"] #start,html[data-stil="buben"] #minus,html[data-stil="buben"] #plus{color:#ff7b84}
</style>

<script src="/spiele/stil.js"></script>
<link rel="stylesheet" href="/spiele/schrift.css">
</head>
<body>
<main class="app">
  <div class="glass" id="glass">
    <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="topClip">
          <path d="M43 25 L157 25 C157 83 125 112 100 145 C75 112 43 83 43 25Z"/>
        </clipPath>
        <clipPath id="bottomClip">
          <path d="M100 155 C125 188 157 217 157 275 L43 275 C43 217 75 188 100 155Z"/>
        </clipPath>
      </defs>

      <path class="sand" id="topSand"
        d="M43 25 L157 25 C157 83 125 112 100 145 C75 112 43 83 43 25Z"
        clip-path="url(#topClip)"/>
      <path class="sand" id="bottomSand"
        d="M100 155 C125 188 157 217 157 275 L43 275 C43 217 75 188 100 155Z"
        clip-path="url(#bottomClip)"/>

      <path class="stream" id="sandStream" d="M100 140 L100 160"/>

      <path class="glass-frame"
        d="M35 15 L165 15 M43 25 C43 83 75 112 100 145 C125 112 157 83 157 25 M43 275 C43 217 75 188 100 155 C125 188 157 217 157 275 M35 285 L165 285"/>
    </svg>
  </div>

  <div class="timer" id="display">03:00</div>

  <section class="settings">
    <div class="label">LAUFZEIT EINSTELLEN</div>
    <div class="adjust">
      <button id="minus" aria-label="Zeit verringern">−</button>
      <input id="minutes" type="number" min="0" max="9" value="3">
      <span style="font-size:25px;color:#e8cd8e">:</span>
      <input id="seconds" type="number" min="0" max="59" value="0">
      <button id="plus" aria-label="Zeit erhöhen">+</button>
    </div>
    <div class="label">MAXIMAL 09:59 MINUTEN</div>
  </section>

  <div class="buttons">
    <button class="action" id="start">▶ START</button>
    <button class="action secondary" id="pause" disabled>Ⅱ PAUSE</button>
    <button class="action secondary" id="reset">↺ ZURÜCKSETZEN</button>
  </div>

  <div class="status" id="status">Bereit – Zeit einstellen und starten</div>
</main>

<script>
(() => {
  const display=document.getElementById("display");
  const minInput=document.getElementById("minutes");
  const secInput=document.getElementById("seconds");
  const startBtn=document.getElementById("start");
  const pauseBtn=document.getElementById("pause");
  const resetBtn=document.getElementById("reset");
  const glass=document.getElementById("glass");
  const status=document.getElementById("status");
  const topSand=document.getElementById("topSand");
  const bottomSand=document.getElementById("bottomSand");
  const stream=document.getElementById("sandStream");

  let remaining=180;
  let initial=180;
  let running=false;
  let finished=false;
  let endTime=0;
  let interval=null;

  function getInputTime(){
    let m=Math.max(0,Math.min(9,parseInt(minInput.value)||0));
    let s=Math.max(0,Math.min(59,parseInt(secInput.value)||0));
    minInput.value=m;
    secInput.value=String(s).padStart(2,"0");
    return Math.min(599,m*60+s);
  }

  function formatTime(t){
    const m=Math.floor(t/60);
    const s=t%60;
    return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  }

  function updateDisplay(){
    display.textContent=formatTime(remaining);
  }

  function updateSand(){
    const progress=initial>0?1-remaining/initial:0;
    const topScale=Math.max(0.02,1-progress);
    const bottomScale=Math.max(0.02,progress);

    topSand.style.transform=`scaleY(${topScale})`;
    bottomSand.style.transform=`scaleY(${bottomScale})`;
  }

  function stopInterval(){
    if(interval!==null){
      clearInterval(interval);
      interval=null;
    }
  }

  function alarm(){
    finished=true;
    running=false;
    stopInterval();
    glass.classList.remove("running");
    stream.style.opacity="0";
    document.body.classList.remove("alarm");
    void document.body.offsetWidth;
    document.body.classList.add("alarm");
    setTimeout(()=>document.body.classList.remove("alarm"),2800);
    startBtn.disabled=true;
    pauseBtn.disabled=true;
    status.textContent="⏰ ZEIT ABGELAUFEN!";
  }

  function tick(){
    remaining=Math.max(0,Math.ceil((endTime-Date.now())/1000));
    updateDisplay();
    updateSand();

    if(remaining<=0){
      alarm();
    }
  }

  function start(){
    if(running||finished)return;

    if(remaining<=0)remaining=getInputTime();
    if(remaining<=0){
      status.textContent="Bitte eine Zeit größer als 00:00 einstellen.";
      return;
    }

    initial=remaining;
    endTime=Date.now()+remaining*1000;
    running=true;
    glass.classList.add("running");
    startBtn.disabled=true;
    pauseBtn.disabled=false;
    status.textContent="Sand läuft …";
    interval=setInterval(tick,100);
  }

  function pause(){
    if(!running)return;
    tick();
    if(!running)return;
    running=false;
    stopInterval();
    glass.classList.remove("running");
    startBtn.disabled=false;
    pauseBtn.disabled=true;
    status.textContent="Pausiert";
  }

  function reset(){
    stopInterval();
    running=false;
    finished=false;
    document.body.classList.remove("alarm");
    glass.classList.remove("running");
    remaining=getInputTime();
    initial=remaining;
    updateDisplay();
    updateSand();
    startBtn.disabled=false;
    pauseBtn.disabled=true;
    status.textContent="Bereit – Zeit einstellen und starten";
  }

  function adjust(delta){
    if(running)return;
    let t=Math.max(0,Math.min(599,getInputTime()+delta));
    minInput.value=Math.floor(t/60);
    secInput.value=String(t%60);
    reset();
  }

  minInput.addEventListener("change",reset);
  secInput.addEventListener("change",reset);
  document.getElementById("minus").addEventListener("click",()=>adjust(-10));
  document.getElementById("plus").addEventListener("click",()=>adjust(10));
  startBtn.addEventListener("click",start);
  pauseBtn.addEventListener("click",pause);
  resetBtn.addEventListener("click",reset);

  updateDisplay();
  updateSand();
})();
</script>
<script>
/* Fensterfarbe des Browsers je Ansicht */
(function(){
 const setze=function(){
  const m=document.querySelector('meta[name="theme-color"]');
  if(!m||!window.TGStil||!TGStil.hole)return;
  m.content={klassisch:"#0a211b",maedchen:"#f7a6d4",buben:"#0a0d10"}[TGStil.hole()]||"#0a211b";
 };
 setze();
 if(window.TGStil&&TGStil.beiWechsel)TGStil.beiWechsel(setze);
})();
</script>
</body>
</html>
