
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON – Vier gewinnt</title>

<style>
:root {
  --bg:#080710;
  --panel:#151322;
  --red:#ff405c;
  --blue:#35d8ff;
  --purple:#a855f7;
  --white:#f5f0ff;
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  min-height:100svh;
  background:var(--bg);
  color:var(--white);
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  padding:15px 10px 25px;
}

.game {
  width:100%;
  max-width:460px;
  text-align:center;
}

.turn {
  background:var(--panel);
  border:1px solid #69418b;
  border-radius:12px;
  padding:13px 8px;
  margin-bottom:12px;
  font-size:21px;
  font-weight:bold;
  text-shadow:0 0 10px currentColor;
}

.scores {
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.score {
  flex:1;
  padding:10px 5px;
  background:var(--panel);
  border:1px solid #393047;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
}

.score.red { color:var(--red); }
.score.blue { color:var(--blue); }

.score span {
  display:block;
  font-size:24px;
  margin-top:4px;
}

.board-frame {
  padding:9px;
  border-radius:17px;
  background:linear-gradient(145deg,#43215d,#171326,#33204d);
  border:2px solid #a855f7;
  box-shadow:0 0 12px #a855f7,0 0 30px #7c3aad66;
}

.board {
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:clamp(4px,1.5vw,8px);
  background:#080710;
  padding:5px;
  border-radius:10px;
}

.cell {
  position:relative;
  width:100%;
  aspect-ratio:1;
  min-width:0;
  padding:0;
  border:2px solid #514366;
  border-radius:50%;
  background:#100e1b;
  box-shadow:inset 0 3px 9px #000,0 0 3px #a855f733;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.cell::before {
  content:"";
  position:absolute;
  inset:7%;
  border-radius:50%;
  background:transparent;
  transition:background .15s,box-shadow .15s;
}

/* Scheiben liegen flach im Loch: gleichmäßige Farbe, dunkler Rand und ein
   Schatten nach unten. Kein Glanz oben und keine Leuchtkugel – das wirkte
   wie ein hüpfender Ball. */
.cell.red::before {
  background:var(--red);
  box-shadow:inset 0 0 0 2px #00000055,inset 0 -3px 6px #00000070,0 1px 2px #000000aa;
}

.cell.blue::before {
  background:var(--blue);
  box-shadow:inset 0 0 0 2px #00000055,inset 0 -3px 6px #00000070,0 1px 2px #000000aa;
}

/* Nur eine gerade gefallene Scheibe bewegt sich. Das Brett wird bei jedem
   Abruf neu gezeichnet – ohne diese Bremse sprangen alle Scheiben mit. */
.cell.fresh::before {
  animation:drop .18s ease-out;
}

.cell.win {
  border-color:#fff;
  box-shadow:0 0 10px white,0 0 18px currentColor;
  animation:winning .65s infinite alternate;
}

.cell.red.win::before {
  box-shadow:0 0 12px white,0 0 25px var(--red);
}

.cell.blue.win::before {
  box-shadow:0 0 12px white,0 0 25px var(--blue);
}

.cell:disabled {
  cursor:default;
}

/* Kurz einsetzen statt aus großer Höhe herunterfallen: Die Scheibe gleitet
   nur ein paar Pixel ins Loch und bleibt liegen. */
@keyframes drop {
  from { transform:translateY(-6px) scale(.94); opacity:.45; }
  to { transform:translateY(0) scale(1); opacity:1; }
}

@keyframes winning {
  from { filter:brightness(1); }
  to { filter:brightness(1.8); }
}

.message {
  min-height:30px;
  font-size:16px;
  margin:14px 0;
  color:#d8c6ed;
  line-height:1.4;
}

.reset {
  width:100%;
  max-width:300px;
  border:1px solid #c77aff;
  border-radius:12px;
  background:#24132f;
  color:#fff;
  padding:15px 20px;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 0 12px #a855f755;
  cursor:pointer;
  touch-action:manipulation;
}

.reset:active {
  transform:scale(.97);
  background:#48205e;
}

.leave-btn {
  display:inline-block;
  margin-top:10px;
  background:transparent;
  border:1px solid #69418b;
  border-radius:8px;
  color:#e5a2ff;
  padding:8px 14px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}
.leave-btn:hover {
  background:#24132f;
  color:#fff;
  border-color:#a855f7;
}

.hint {
  color:#82758f;
  font-size:13px;
  margin-top:13px;
}
/* Leer = nichts anzeigen; im Online-Spiel steht hier der Raumname. */
.hint:empty {
  display: none;
}

@media (max-height:720px) {
  body { padding-top:5px; }
  .turn { padding:9px; margin-bottom:8px; }
  .scores { margin-bottom:9px; }
  .score { padding:6px 4px; }
  .board-frame { padding:6px; }
  .message { margin:8px 0; }
  .reset { padding:11px; }
}

@media (max-width:350px) {
  .board-frame { padding:5px; }
  .board { gap:3px; padding:3px; }
  .cell { border-width:1px; }
}
/* Hochkant auf dem Handy: schlanke Ränder, damit das Brett die Breite bekommt */
@media(max-width:560px){
  body{padding:2px}
  .game{max-width:none}
  .board-frame{padding:3px}
  .board{padding:3px;gap:3px}
}
</style>
</head>

<body>
<div class="game">

  <div class="turn" id="turn">Rot ist am Zug</div>

  <div class="scores">
    <div class="score red">
      ROT
      <span id="redWins">0</span>
      <small>Siege</small>
    </div>
    <div class="score blue">
      BLAU
      <span id="blueWins">0</span>
      <small>Siege</small>
    </div>
  </div>

  <div class="board-frame">
    <div class="board" id="board"></div>
  </div>

  <div class="message" id="message">
    Tippe auf eine Spalte. Dein Stein fällt nach unten!
  </div>

  <button class="reset" id="resetBtn" onclick="handleReset()">
    ↻ NEUES SPIEL
  </button>

  <div>
    <button class="leave-btn" id="leaveBtn" onclick="leaveGame()" style="display:none;">
      Spiel verlassen
    </button>
  </div>

  <div class="hint" id="gameHint"></div>

</div>

<script src="/spiele/netz.js"></script>
<script>
const params = new URLSearchParams(location.search);
const onlineRoom = (params.get("room") || "").trim().toUpperCase();
const onlineName = (params.get("name") || "").trim() || "Spieler";
// Der Connector schickt die Spieler-ID in der URL mit. Sonst gilt die des
// Tabs, sonst wird eine neue erzeugt – ohne ID gäbe es kein Presence und der
// Spieler würde nach 20 Sekunden aus dem Raum fallen.
let onlineID = (params.get("id") || "").trim();
if (!onlineID) {
  try {
    onlineID = sessionStorage.getItem("tg-player-id") || "";
    if (!onlineID) {
      onlineID = (crypto.randomUUID ? crypto.randomUUID() : "tg-" + Math.random().toString(36).slice(2) + Date.now());
      sessionStorage.setItem("tg-player-id", onlineID);
    }
  } catch(e) {
    onlineID = "tg-" + Math.random().toString(36).slice(2) + Date.now();
  }
}

const COLS = 7;
const ROWS = 6;

let grid;
// lastGrid merkt sich die zuletzt gezeichnete Belegung, damit nur neue
// Scheiben kurz einsetzen und nicht das ganze Brett bei jedem Neuzeichnen.
let lastGrid = null;
let current;
let gameOver = false;
let redWins = 0;
let blueWins = 0;
let onlineGame = null;
let onlineColor = "";
let onlineOpponent = "";

const board = document.getElementById("board");

function handleReset() {
  if (onlineRoom) {
    multiplayerReset();
  } else {
    newGame();
  }
}

function newGame() {
  grid = Array.from(
    {length:ROWS},
    () => Array(COLS).fill(null)
  );

  current = "red";
  gameOver = false;

  document.getElementById("message").textContent =
    "Tippe auf eine Spalte. Dein Stein fällt nach unten!";

  document.getElementById("resetBtn").textContent =
    "↻ NEUES SPIEL";

  drawBoard();
  updateDisplay();
}

function drawBoard() {
  board.innerHTML = "";

  for (let r=0; r<ROWS; r++) {
    for (let c=0; c<COLS; c++) {
      const cell = document.createElement("button");

      cell.className = "cell";
      cell.setAttribute("aria-label",
        "Spalte "+(c+1)+", Reihe "+(r+1)
      );

      if (grid[r][c]) {
        cell.classList.add(grid[r][c]);
        if (lastGrid && lastGrid[r] && lastGrid[r][c] !== grid[r][c]) {
          cell.classList.add("fresh");
        }
      }

      cell.onclick = () => playColumn(c);

      board.appendChild(cell);
    }
  }

  lastGrid = grid.map(row => row.slice());
}

async function playColumn(c) {
  if (onlineRoom) {
    if (gameOver || !onlineGame || onlineGame.status !== "active") return;
    if (current !== onlineColor) return;
    try {
      const resp = await fetch("/api/viergewinnt?room=" + encodeURIComponent(onlineRoom) + "&action=move", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: onlineID, column: c })
      });
      if (!resp.ok) {
        const txt = await resp.text();
        document.getElementById("message").textContent = txt || "Zug ungültig.";
        return;
      }
      const data = await resp.json();
      if (data.game) renderMultiplayer(data.game);
    } catch(e) {
      document.getElementById("message").textContent = "Verbindung zum Server verloren.";
    }
    return;
  }

  if (gameOver) return;

  // Freie Position von unten suchen
  let row = -1;

  for (let r=ROWS-1; r>=0; r--) {
    if (grid[r][c] === null) {
      row = r;
      break;
    }
  }

  if (row === -1) {
    document.getElementById("message").textContent =
      "Diese Spalte ist voll! Nimm eine andere.";
    return;
  }

  grid[row][c] = current;

  drawBoard();

  const winningCells = checkWin(row,c);

  if (winningCells.length === 4) {
    gameOver = true;

    winningCells.forEach(([r,col]) => {
      board.children[r*COLS+col].classList.add("win");
    });

    if (current === "red") {
      redWins++;
    } else {
      blueWins++;
    }

    document.getElementById("message").textContent =
      current === "red"
        ? "🎉 Rot hat gewonnen!"
        : "🎉 Blau hat gewonnen!";

    document.getElementById("resetBtn").textContent =
      "↻ NOCHMAL SPIELEN";

    updateDisplay();
    return;
  }

  // Prüfen, ob das Spielfeld voll ist
  const full = grid.every(row => row.every(cell => cell !== null));

  if (full) {
    gameOver = true;
    document.getElementById("message").textContent =
      "Unentschieden! Das war knapp.";

    document.getElementById("resetBtn").textContent =
      "↻ NOCHMAL SPIELEN";

    updateDisplay();
    return;
  }

  // Spieler wechseln
  current = current === "red" ? "blue" : "red";

  document.getElementById("message").textContent =
    "Weiter geht's!";

  updateDisplay();
}

function checkWin(r,c) {
  const directions = [
    [0,1],   // waagerecht
    [1,0],   // senkrecht
    [1,1],   // diagonal
    [1,-1]   // diagonal
  ];

  for (const [dr,dc] of directions) {
    let cells = [[r,c]];

    // In beide Richtungen prüfen
    for (const sign of [-1,1]) {
      let nr = r + dr*sign;
      let nc = c + dc*sign;

      while (
        nr >= 0 && nr < ROWS &&
        nc >= 0 && nc < COLS &&
        grid[nr][nc] === current
      ) {
        cells.push([nr,nc]);
        nr += dr*sign;
        nc += dc*sign;
      }
    }

    if (cells.length >= 4) {
      return cells.slice(0,4);
    }
  }

  return [];
}

function updateDisplay() {
  const turn = document.getElementById("turn");

  if (!gameOver) {
    if (onlineRoom) {
      const isMyTurn = (current === onlineColor);
      turn.textContent = isMyTurn ? "Du bist am Zug!" : (onlineOpponent ? onlineOpponent + " ist am Zug" : (current === "red" ? "Rot ist am Zug" : "Blau ist am Zug"));
    } else {
      turn.textContent =
        current === "red"
          ? "Rot ist am Zug"
          : "Blau ist am Zug";
    }

    turn.style.color =
      current === "red"
        ? "var(--red)"
        : "var(--blue)";
  } else {
    turn.style.color = "#ffffff";
    turn.textContent = "SPIEL BEENDET!";
  }

  document.getElementById("redWins").textContent = redWins;
  document.getElementById("blueWins").textContent = blueWins;
}

function renderMultiplayer(game) {
  onlineGame = game;
  onlineColor = (game.redId === onlineID) ? "red" : (game.blueId === onlineID) ? "blue" : "";
  onlineOpponent = (onlineColor === "red") ? game.blueName : game.redName;
  current = game.current || "red";
  gameOver = (game.status === "finished");

  document.querySelector(".score.red").childNodes[0].textContent = (game.redName || "Rot") + ": ";
  document.querySelector(".score.blue").childNodes[0].textContent = (game.blueName || "Blau") + ": ";

  // update local grid representation
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
  if (Array.isArray(game.grid)) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (game.grid[r] && game.grid[r][c]) {
          grid[r][c] = game.grid[r][c];
        }
      }
    }
  }

  drawBoard();

  if (game.status === "finished") {
    if (game.winning && Array.isArray(game.winning)) {
      game.winning.forEach(([r, c]) => {
        if (board.children[r * COLS + c]) {
          board.children[r * COLS + c].classList.add("win");
        }
      });
    }

    const resetBtn = document.getElementById("resetBtn");
    resetBtn.disabled = false;
    resetBtn.textContent = "↻ NOCHMAL SPIELEN";

    if (game.winner === "draw") {
      document.getElementById("message").textContent = "Unentschieden! Das war knapp.";
    } else {
      const winnerName = (game.winner === "red") ? game.redName : game.blueName;
      if (game.winner === onlineColor) {
        document.getElementById("message").textContent = "🎉 Du hast gewonnen! 🎉";
      } else {
        document.getElementById("message").textContent = "🎉 " + winnerName + " hat gewonnen! 🎉";
      }
    }
    updateDisplay();
    return;
  }

  const resetBtn = document.getElementById("resetBtn");
  resetBtn.disabled = true;
  resetBtn.textContent = "↻ RUNDE LÄUFT";

  if (game.status !== "active") {
    document.getElementById("message").textContent = "Warte auf Spielbeginn...";
    return;
  }

  document.getElementById("message").textContent = (current === onlineColor)
    ? "Du bist dran – tippe auf eine Spalte!"
    : "Warte auf den Zug deines Gegners...";

  updateDisplay();
}

async function multiplayerReset() {
  if (!onlineGame || onlineGame.status !== "finished") return;
  try {
    const resp = await fetch("/api/viergewinnt?room=" + encodeURIComponent(onlineRoom) + "&action=reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: onlineID })
    });
    if (resp.ok) {
      const data = await resp.json();
      if (data.game) renderMultiplayer(data.game);
    }
  } catch(e) {}
}

async function multiplayerHeartbeat() {
  if (!onlineRoom || !onlineID) return;
  try {
    await fetch("/api/presence", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ room: onlineRoom, id: onlineID, name: onlineName })
    });
  } catch(e) {}
}

async function refreshMultiplayer() {
  if (!onlineRoom || !onlineID) return;
  try {
    const resp = await fetch("/api/viergewinnt?room=" + encodeURIComponent(onlineRoom) + "&id=" + encodeURIComponent(onlineID), { cache: "no-store" });
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.game) renderMultiplayer(data.game);
  } catch(e) {}
}

function leaveGame(){ tgVerlassen(); }

if (onlineRoom) {
  document.getElementById("leaveBtn").style.display = "inline-block";
  document.getElementById("gameHint").textContent = "ONLINE-MULTIPLAYER · " + onlineRoom + " · " + (onlineID ? "Verbunden" : "Spielerkennung fehlt");
  newGame();
  setInterval(multiplayerHeartbeat, 5000);
  setInterval(refreshMultiplayer, 700);
  // Erst anmelden, dann Spielstand holen.
  (async () => {
    await multiplayerHeartbeat();
    await refreshMultiplayer();
  })();
} else {
  newGame();
}
</script>

</body>
</html>
