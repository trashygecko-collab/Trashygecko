<html lang="de">

<script src="/spiele/token.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="/spiele/stil.js"></script>
<link rel="stylesheet" href="/spiele/schrift.css">
<link rel="stylesheet" href="/spiele/brettspiele/wuerfel.css">
<style>
:root{
/* Token-Ebene. Klassisch sind genau die alten Farben; Flaechen, Leisten und
   Knoepfe kommen aus wuerfel.css (--wg-...), die Stilbloecke dort gelten auch hier. */
--filz-1:#1a4a3a;--filz-2:#123427;--tief:#0a211b;--filz-4:#06170f;--vignette:#0000007a;
--feld-text:#a9c6b8;--feld-rand:#2a6047;--feld-1:#1b4a38;--feld-2:#14382d;--feld-3:#0e2b22;
--misch:#0f2c22;--ton-basis:#7fb98a;
--ziel-1:#5b4a24;--ziel-2:#3b3221;--gold:#e8cd8e;--ziel-text:#f6edda;
--ziel-schein:#e8cd8e77;--ziel-schein-2:#e8cd8e33;--mitte-1:#2f7a5c;--mitte-2:#0b2a20;
--wir-schein:#e8cd8e88;--wir-schein-2:#e8cd8e22;
/* Farbton je Feldart (Rand, Symbol, Schein) */
--ton-gans:#8fd6a0;--ton-bruecke:#dcbc7c;--ton-gasthaus:#9ab6e2;--ton-brunnen:#7fc6da;
--ton-labyrinth:#c4a0e2;--ton-gefaengnis:#e2907c;--ton-tod:#cc7a70;--ton-ziel:#f0dca8;
/* Symbole im Feld (SVG-Attribute, per CSS ueberschrieben) */
--ik-holz:#c9a86a;--ik-1:#1d5c45;--ik-2:#2c7357;--ik-3:#63b58d;
/* Legendenpunkt je Feldart (Farbe steht als Inline-Stil im Text) */
--lg-gans:#7fb98a;--lg-bruecke:#c9a86a;--lg-gasthaus:#8aa9d6;--lg-brunnen:#6fb3c9;
--lg-labyrinth:#b48ad6;--lg-gefaengnis:#d98878;--lg-tod:#b0645c;
}

.brett{position:relative;width:min(100%,calc(100dvh - 262px));max-width:100%;margin:0 auto;aspect-ratio:1;
  flex:0 0 auto;align-self:center;min-height:0;border-radius:50%;
  box-shadow:0 12px 30px #00000055}
/* Das Brett ist eine runde Filzfläche mit Licht von oben. Vorher hingen die
   Felder ohne Untergrund im Nichts, und weil das Brett in der Spalte mitwuchs,
   wurden aus den Kreisen Ellipsen (gemessen 51 x 71 px). */
.brett::before{content:"";position:absolute;inset:1.5%;border-radius:50%;
  background:radial-gradient(circle at 50% 34%,var(--filz-1) 0%,var(--filz-2) 45%,var(--tief) 76%,var(--filz-4) 100%);
  box-shadow:inset 0 0 0 1px #ffffff10,inset 0 0 46px var(--vignette)}
@media(max-height:520px){.brett{width:min(100%,calc(100dvh - 112px))}}
.wg-flaeche{justify-content:center}
.wege{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.feld{position:absolute;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;
  justify-content:center;color:var(--feld-text);border:1px solid var(--feld-rand);
  background:radial-gradient(circle at 50% 28%,var(--feld-1) 0%,var(--feld-2) 62%,var(--feld-3) 100%);
  box-shadow:inset 0 1px 0 #ffffff12,inset 0 -2px 4px #00000035,0 2px 4px #00000040;
  font-size:clamp(9.5px,1.5vh,12px);line-height:1;z-index:1;--ton:var(--ton-basis)}
.feld svg{position:absolute;inset:12%;width:76%;height:76%;opacity:.95}
.feld .nr{position:relative;z-index:2;opacity:.82;font-weight:600;text-shadow:0 1px 2px #000000cc}
.feld.sonder .nr{position:absolute;right:6%;bottom:4%;font-size:1em;opacity:.95}
/* Jede Sonderart hat ihren eigenen Farbton für Rand, Symbol und Schein. */
.feld.typ-gans{--ton:var(--ton-gans)}
.feld.typ-bruecke{--ton:var(--ton-bruecke)}
.feld.typ-gasthaus{--ton:var(--ton-gasthaus)}
.feld.typ-brunnen{--ton:var(--ton-brunnen)}
.feld.typ-labyrinth{--ton:var(--ton-labyrinth)}
.feld.typ-gefaengnis{--ton:var(--ton-gefaengnis)}
.feld.typ-tod{--ton:var(--ton-tod)}
.feld.typ-ziel{--ton:var(--ton-ziel)}
.feld.sonder{color:var(--ton);border-color:color-mix(in srgb,var(--ton) 55%,var(--misch));
  box-shadow:inset 0 1px 0 #ffffff18,inset 0 0 10px color-mix(in srgb,var(--ton) 22%,transparent),0 2px 6px #00000055}
.feld.ziel{background:radial-gradient(circle at 50% 28%,var(--ziel-1),var(--ziel-2) 70%);border-color:var(--gold);
  color:var(--ziel-text);box-shadow:0 0 12px var(--ziel-schein),inset 0 0 10px var(--ziel-schein-2)}
.feld.wir{box-shadow:0 0 0 2px var(--gold),0 0 14px var(--wir-schein),inset 0 0 10px var(--wir-schein-2)}
.figuren{position:absolute;inset:0;pointer-events:none}
.figuren .figur{position:absolute;width:clamp(10px,1.8vh,16px);height:clamp(10px,1.8vh,16px);
  transform:translate(-50%,-50%);transition:left .12s linear,top .12s linear;z-index:3;
  box-shadow:0 0 0 2px var(--tief)}
.legende{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font-size:10px;color:var(--wg-muted)}
.legende span{display:flex;align-items:center;gap:3px}
.legende svg{width:12px;height:12px}
@media(max-height:520px){.legende{display:none}}
/* ---- Grafikstil (zentral): Klassisch bleibt unveraendert ---- */
html[data-stil="maedchen"]{
--filz-1:#ffd9ec;--filz-2:#ffc2da;--tief:#8f2450;--filz-4:#f7a6d4;--vignette:#8f245033;
--feld-text:#5b2340;--feld-rand:#f0a8c8;--feld-1:#ffffff;--feld-2:#fff6fa;--feld-3:#ffe3ef;
--misch:#ef7aa8;--ton-basis:#a2557a;
--ziel-1:#ffe3ef;--ziel-2:#ffd0e4;--gold:#8f2450;--ziel-text:#5b2340;

--wir-schein:#8f245088;--wir-schein-2:#8f245022;
--ton-gans:#c93f86;--ton-bruecke:#a8701f;--ton-gasthaus:#5a5cd6;--ton-brunnen:#1f7f8f;
--ton-labyrinth:#7a3fd0;--ton-gefaengnis:#c2405a;--ton-tod:#8f2450;--ton-ziel:#7a3f6b;
--ik-holz:#c0854e;--ik-1:#c2405a;--ik-2:#e0559a;--ik-3:#ff9ec4;
--fig-0:#8f2450;--fig-1:#2a8f6a;--fig-2:#ff8fb0;--fig-3:#7a5cff;
}
html[data-stil="buben"]{
--filz-1:#1b2a38;--filz-2:#0e1620;--tief:#000000;--filz-4:#070b0f;--vignette:#000000a0;
--feld-text:#7e8892;--feld-rand:#2b3540;--feld-1:#151a20;--feld-2:#101419;--feld-3:#0b0e12;
--misch:#000000;--ton-basis:#7e8892;
--ziel-1:#1b222b;--ziel-2:#0d1013;--gold:#c8ff3d;--ziel-text:#e6e9ec;
--ziel-schein:#c8ff3d77;--ziel-schein-2:#c8ff3d33;--mitte-1:#1b222b;--mitte-2:#0a0d10;
--wir-schein:#c8ff3d88;--wir-schein-2:#c8ff3d22;
--ton-gans:#6dff4a;--ton-bruecke:#ffb13d;--ton-gasthaus:#5aa8ff;--ton-brunnen:#38d7ff;
--ton-labyrinth:#b06bff;--ton-gefaengnis:#ff5560;--ton-tod:#e0242f;--ton-ziel:#c8ff3d;
--ik-holz:#8f6b3a;--ik-1:#5c7d15;--ik-2:#9ecb2a;--ik-3:#c8ff3d;
--fig-0:#c8ff3d;--fig-1:#6dff4a;--fig-2:#ff5560;--fig-3:#7fb0ff;
}
/* Legendenpunkte zeigen in den neuen Stilen auf die Feldtoene;
   Klassisch behaelt eigene Werte, weil sie dort abweichen. */
html[data-stil="maedchen"],html[data-stil="buben"]{
--lg-gans:var(--ton-gans);--lg-bruecke:var(--ton-bruecke);--lg-gasthaus:var(--ton-gasthaus);--lg-brunnen:var(--ton-brunnen);
--lg-labyrinth:var(--ton-labyrinth);--lg-gefaengnis:var(--ton-gefaengnis);--lg-tod:var(--ton-tod);
}
html[data-stil="maedchen"] svg [fill="#0a211b"],html[data-stil="buben"] svg [fill="#0a211b"]{fill:var(--tief)}
html[data-stil="maedchen"] svg [fill="#c9a86a"],html[data-stil="buben"] svg [fill="#c9a86a"]{fill:var(--ik-holz)}
html[data-stil="maedchen"] svg [fill="#f0dca8"],html[data-stil="buben"] svg [fill="#f0dca8"]{fill:var(--ton-ziel)}
html[data-stil="maedchen"] stop[stop-color="#2f7a5c"],html[data-stil="buben"] stop[stop-color="#2f7a5c"]{stop-color:var(--mitte-1)}
html[data-stil="maedchen"] stop[stop-color="#0b2a20"],html[data-stil="buben"] stop[stop-color="#0b2a20"]{stop-color:var(--mitte-2)}
html[data-stil="maedchen"] svg [stroke="#0a211b"],html[data-stil="buben"] svg [stroke="#0a211b"]{stroke:var(--tief)}
html[data-stil="maedchen"] svg [stroke="#1d5c45"],html[data-stil="buben"] svg [stroke="#1d5c45"]{stroke:var(--ik-1)}
html[data-stil="maedchen"] svg [stroke="#2c7357"],html[data-stil="buben"] svg [stroke="#2c7357"]{stroke:var(--ik-2)}
html[data-stil="maedchen"] svg [stroke="#63b58d"],html[data-stil="buben"] svg [stroke="#63b58d"]{stroke:var(--ik-3)}
html[data-stil="maedchen"] svg [stroke="#e8cd8e"],html[data-stil="buben"] svg [stroke="#e8cd8e"]{stroke:var(--gold)}
html[data-stil="maedchen"] .figur[data-sitz="0"],html[data-stil="buben"] .figur[data-sitz="0"]{--farbe:var(--fig-0) !important}
html[data-stil="maedchen"] .figur[data-sitz="1"],html[data-stil="buben"] .figur[data-sitz="1"]{--farbe:var(--fig-1) !important}
html[data-stil="maedchen"] .figur[data-sitz="2"],html[data-stil="buben"] .figur[data-sitz="2"]{--farbe:var(--fig-2) !important}
html[data-stil="maedchen"] .figur[data-sitz="3"],html[data-stil="buben"] .figur[data-sitz="3"]{--farbe:var(--fig-3) !important}
</style>

<script src="/spiele/brettspiele/wuerfel-common.js"></script>
<script>
(() => {
"use strict";
/* Gänsespiel: 63 Felder, zwei Würfel. Über das Ziel hinaus geht es rückwärts,
   Gänsefelder ziehen noch einmal, Sonderfelder schicken zurück oder lassen
   aussetzen. Wer Feld 63 erreicht, gewinnt. */
const P = new URLSearchParams(location.search);
const ROOM = (P.get("room") || "").trim().toUpperCase();
const ONLINE = /^TG-[A-F0-9]{4}$/.test(ROOM);
const MYID = (P.get("id") || "").trim();
const MYNAME = (P.get("name") || "").trim();

const FELDER = 63;
const BRUECKE = [6, 12], GASTHAUS = 19, BRUNNEN = 31, LABYRINTH = [42, 30],
      GEFAENGNIS = 52, GEFAENGNIS_RUNDEN = 3, TOD = [58, 1];
const $ = (id) => document.getElementById(id);
const elSpieler = $("spieler"), elNotiz = $("notiz"), elLog = $("log"),
      elLage = $("lage"), elZug = $("zugText"), elRunde = $("rundenTitel"),
      elEnde = $("ende"), elFehler = $("fehler"), elBrett = $("brett"),
      elWege = $("wege"), elFiguren = $("figuren"), btnWuerfeln = $("btnWuerfeln");

const w1 = WG.wuerfelEl(0), w2 = WG.wuerfelEl(0);
$("wurfHalte").append(w1, w2);

let lokal = null;
let onlineGame = null;
let anzeige = [0, 0, 0, 0];
let sperre = false;

const warte = WG.warte;
const fehler = (text) => { elFehler.textContent = text || ""; };
const notiz = (text) => { elNotiz.textContent = text || ""; };
const istGans = (feld) => feld > 0 && feld % 9 === 0 && feld <= 54;

/* ------------------------------- Regeln -------------------------------- */
function neuerStand(anzahl) {
  return {
    runde: 1, zug: 0, wuerfel: [0, 0], status: "spiel", sieger: "", verlauf: [],
    spieler: Array.from({ length: anzahl }, (_, i) => ({
      id: "s" + i, name: "Spieler " + (i + 1), farbe: i, pos: 0, aussetzen: 0, imBrunnen: false
    })),
    note: "Zwei Würfel. Wer Feld 63 erreicht, gewinnt."
  };
}

function ziehen(pos, schritte) {
  const ziel = pos + schritte;
  if (ziel <= FELDER) return { pos: ziel, text: "" };
  const zurueck = ziel - FELDER;
  return { pos: FELDER - zurueck, text: " Über das Ziel hinaus – " + zurueck + " Felder zurück." };
}

function naechster(sp) {
  for (let i = 0; i < sp.spieler.length * 8; i++) {
    sp.zug = (sp.zug + 1) % sp.spieler.length;
    const s = sp.spieler[sp.zug];
    if (s.imBrunnen) {
      sp.verlauf.push(s.name + " sitzt im Brunnen und setzt aus.");
      continue;
    }
    if (s.aussetzen > 0) {
      s.aussetzen--;
      sp.verlauf.push(s.name + (s.aussetzen > 0
        ? " setzt aus – noch " + s.aussetzen + " Runden."
        : " setzt diese Runde aus."));
      continue;
    }
    return;
  }
}

function zugMachen(sp, sitz, a, b) {
  const summe = a + b;
  sp.wuerfel = [a, b];
  const s = sp.spieler[sitz];
  const teile = [s.name + " würfelt " + a + " + " + b + " = " + summe + "."];
  const erste = ziehen(s.pos, summe);
  teile.push("Von Feld " + s.pos + " auf " + erste.pos + "." + erste.text);
  s.pos = erste.pos;
  for (let schritt = 0; schritt < 8; schritt++) {
    const feld = s.pos;
    if (feld === BRUECKE[0]) {
      s.pos = BRUECKE[1];
      teile.push("Die Brücke trägt " + s.name + " auf Feld " + BRUECKE[1] + ".");
    } else if (istGans(feld)) {
      const neu = ziehen(feld, summe);
      s.pos = neu.pos;
      teile.push("Gänsefeld " + feld + " – " + s.name + " zieht noch einmal " + summe +
        " Felder auf " + neu.pos + "." + neu.text);
    } else if (feld === GASTHAUS) {
      s.aussetzen = 1;
      teile.push("Im Gasthaus muss " + s.name + " eine Runde aussetzen.");
      break;
    } else if (feld === BRUNNEN) {
      sp.spieler.forEach((o, i) => {
        if (i !== sitz && o.imBrunnen) {
          o.imBrunnen = false;
          teile.push(o.name + " ist aus dem Brunnen frei.");
        }
      });
      s.imBrunnen = true;
      teile.push(s.name + " fällt in den Brunnen und wartet, bis jemand auf Feld 31 landet.");
      break;
    } else if (feld === LABYRINTH[0]) {
      s.pos = LABYRINTH[1];
      teile.push("Das Labyrinth schickt " + s.name + " zurück auf Feld " + LABYRINTH[1] + ".");
    } else if (feld === GEFAENGNIS) {
      s.aussetzen = GEFAENGNIS_RUNDEN;
      teile.push("Im Gefängnis setzt " + s.name + " " + GEFAENGNIS_RUNDEN + " Runden aus.");
      break;
    } else if (feld === TOD[0]) {
      s.pos = TOD[1];
      teile.push("Der Tod schickt " + s.name + " zurück zum Anfang.");
    } else {
      break;
    }
  }
  sp.verlauf.push(teile.join(" "));
  sp.verlauf = sp.verlauf.slice(-8);
  if (s.pos >= FELDER) {
    sp.status = "ende";
    sp.sieger = s.id;
    sp.note = s.name + " erreicht Feld 63 und gewinnt.";
    return;
  }
  naechster(sp);
}

/* ------------------------------- Spielfeld ------------------------------ */
// Drei Ringe: 1–26 außen, 27–48 in der Mitte, 49–63 innen. So bleibt jedes Feld
// groß genug zum Lesen, und der Weg nach innen ist deutlich.
const RINGE = [
  { von: 1, bis: 26, r: 44.5, start: -90 },
  { von: 27, bis: 48, r: 31, start: -81 },
  { von: 49, bis: 63, r: 17.5, start: -73 }
];
const POS = {};

function posRechnen() {
  for (const ring of RINGE) {
    const anzahl = ring.bis - ring.von + 1;
    const schritt = 360 / anzahl;
    for (let k = 0; k < anzahl; k++) {
      const nr = ring.von + k;
      const w = (ring.start + k * schritt) * Math.PI / 180;
      POS[nr] = { x: 50 + ring.r * Math.cos(w), y: 50 + ring.r * Math.sin(w) };
    }
  }
}

function feldGroesse(nr) {
  if (nr <= 26) return 8.6;
  if (nr <= 48) return 7.6;
  return 6.6;
}

// Jede Sonderart bekommt ihre eigene Klasse – daran hängen Farbton und Schein
// in der Gestaltung (typ-gans, typ-bruecke, typ-brunnen …).
function feldKlasse(nr) {
  if (nr >= FELDER) return " sonder ziel typ-ziel";
  if (istGans(nr)) return " gans sonder typ-gans";
  if (nr === BRUECKE[0]) return " sonder typ-bruecke";
  if (nr === GASTHAUS) return " sonder typ-gasthaus";
  if (nr === BRUNNEN) return " sonder typ-brunnen";
  if (nr === LABYRINTH[0]) return " sonder typ-labyrinth";
  if (nr === GEFAENGNIS) return " sonder typ-gefaengnis";
  if (nr === TOD[0]) return " sonder typ-tod";
  return "";
}

function symbolFuer(nr) {
  if (nr >= FELDER) return "i-ziel";
  if (nr === BRUECKE[0]) return "i-bruecke";
  if (istGans(nr)) return "i-gans";
  if (nr === GASTHAUS) return "i-gasthaus";
  if (nr === BRUNNEN) return "i-brunnen";
  if (nr === LABYRINTH[0]) return "i-labyrinth";
  if (nr === GEFAENGNIS) return "i-gefaengnis";
  if (nr === TOD[0]) return "i-tod";
  return "";
}

let felderGebaut = "";

function brettBauen() {
  if (felderGebaut === "ja") return;
  felderGebaut = "ja";
  posRechnen();
  for (let nr = 1; nr <= FELDER; nr++) {
    const p = POS[nr], groesse = feldGroesse(nr);
    const d = document.createElement("div");
    d.className = "feld" + feldKlasse(nr);
    d.dataset.feld = nr;
    d.style.left = p.x + "%";
    d.style.top = p.y + "%";
    d.style.width = groesse + "%";
    d.style.height = groesse + "%";
    const sym = symbolFuer(nr);
    if (sym) d.innerHTML = '<svg viewBox="0 0 24 24"><use href="#' + sym + '"/></svg>';
    const n = document.createElement("span");
    n.className = "nr";
    n.textContent = nr;
    d.appendChild(n);
    elBrett.appendChild(d);
  }
  // Drei Ringbahnen durch die Feldmitten, darüber eine gestrichelte
  // Laufrichtung – so ist der Weg auch zwischen den Feldern zu sehen.
  const teile = [];
  for (const ring of RINGE) {
    teile.push('<circle cx="50" cy="50" r="' + ring.r +
      '" fill="none" stroke="#1d5c45" stroke-width="3.4" opacity=".6"/>');
    teile.push('<circle cx="50" cy="50" r="' + ring.r +
      '" fill="none" stroke="#63b58d" stroke-width="1" stroke-dasharray="1.3 2.5" opacity=".5"/>');
  }
  for (let nr = 1; nr < FELDER; nr++) {
    const a = POS[nr], b = POS[nr + 1];
    teile.push('<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y +
      '" stroke="#2c7357" stroke-width=".65" opacity=".85"/>');
  }
  // Mitte: Kompassrose im Goldring – der Kern war vorher nur leere Fläche.
  teile.push('<defs><radialGradient id="mitteGlanz" cx="50%" cy="38%" r="62%">' +
    '<stop offset="0%" stop-color="#2f7a5c" stop-opacity=".95"/>' +
    '<stop offset="100%" stop-color="#0b2a20" stop-opacity=".25"/></radialGradient></defs>');
  teile.push('<circle cx="50" cy="50" r="8.8" fill="url(#mitteGlanz)" stroke="#e8cd8e"' +
    ' stroke-width=".45" opacity=".95"/>');
  teile.push('<circle cx="50" cy="50" r="6.6" fill="none" stroke="#e8cd8e" stroke-width=".22"' +
    ' stroke-dasharray=".8 1.3" opacity=".55"/>');
  teile.push('<path d="M50 43.2 L51.4 49.3 L50 56.8 L48.6 49.3 Z" fill="#f0dca8" opacity=".8"/>');
  teile.push('<path d="M43.2 50 L49.3 48.6 L56.8 50 L49.3 51.4 Z" fill="#c9a86a" opacity=".6"/>');
  elWege.innerHTML = teile.join("");
}

function figurenSichern(anzahl) {
  elFiguren.innerHTML = "";
  for (let i = 0; i < anzahl; i++) {
    const f = WG.figur(i, "Spieler " + (i + 1));
    f.dataset.sitz = i;
    elFiguren.appendChild(f);
  }
}

function figurSetzen(sitz, pos, weich) {
  const f = elFiguren.querySelector('.figur[data-sitz="' + sitz + '"]');
  if (!f) return;
  f.classList.toggle("weich", !!weich);
  if (!pos) {
    const seite = sitz % 2 ? 1 : -1;
    f.style.left = (50 + seite * 3.2) + "%";
    f.style.top = (50 + (sitz > 1 ? 3.2 : -3.2)) + "%";
    return;
  }
  const p = POS[pos] || POS[1];
  const versatz = (sitz % 2 ? 1.7 : -1.7);
  f.style.left = (p.x + versatz) + "%";
  f.style.top = (p.y + (sitz > 1 ? 1.7 : -1.7)) + "%";
}

function markiere(sp) {
  const dran = sp.status === "spiel" ? sp.spieler[sp.zug] : null;
  elBrett.querySelectorAll(".feld.wir").forEach((d) => d.classList.remove("wir"));
  if (!dran || !dran.pos) return;
  const d = elBrett.querySelector('.feld[data-feld="' + dran.pos + '"]');
  if (d) d.classList.add("wir");
}

/* ------------------------------- Anzeige ------------------------------- */
function spielerZeichnen(sp) {
  elSpieler.innerHTML = "";
  sp.spieler.forEach((s, i) => {
    const p = document.createElement("p");
    p.className = "wg-sp" + (sp.status === "spiel" && sp.zug === i ? " dran" : "");
    const f = WG.figur(s.farbe, s.name);
    const n = document.createElement("span");
    n.className = "name";
    n.textContent = s.name;
    const b = document.createElement("b");
    let text = s.pos ? "Feld " + s.pos : "Start";
    if (s.imBrunnen) text += " · Brunnen";
    else if (s.aussetzen > 0) text += " · " + s.aussetzen + "× aus";
    b.textContent = text;
    p.append(f, n, b);
    elSpieler.appendChild(p);
  });
}

function kopfZeichnen(sp) {
  elRunde.textContent = "Runde " + sp.runde;
  elLage.textContent = sp.status === "spiel" ? "Läuft" : "Runde vorbei";
  const dran = sp.status === "spiel" ? sp.spieler[sp.zug] : null;
  elZug.textContent = dran ? "· " + (ONLINE && dran.id === MYID ? "du bist dran" : dran.name + " ist dran") : "";
  notiz(sp.note);
  elLog.innerHTML = "";
  for (const z of (sp.verlauf || []).slice(-4)) {
    const d = document.createElement("div");
    d.textContent = z;
    elLog.appendChild(d);
  }
  elEnde.classList.toggle("wg-versteckt", sp.status !== "ende");
  const meinZug = ONLINE ? !!(dran && dran.id === MYID) : sp.status === "spiel";
  btnWuerfeln.disabled = sperre || !meinZug;
}

async function bewegen(sp, sitz, ziel, summe) {
  const von = anzeige[sitz];
  if (ziel === von) { figurSetzen(sitz, ziel); return; }
  const landung = ziehen(von, summe || 0).pos;
  if (summe && von + summe >= von) {
    // Feld für Feld bis zur Landung (bei Rücklauf über das Ziel bis 63).
    const ende = Math.min(FELDER, von + summe);
    for (let f = von + 1; f <= ende; f++) { figurSetzen(sitz, f); await warte(85); }
    if (landung !== ende) {
      for (let f = FELDER - 1; f >= landung; f--) { figurSetzen(sitz, f); await warte(85); }
    }
  }
  if (ziel !== landung) {
    await warte(80);
    figurSetzen(sitz, ziel, true);
    await warte(400);
  }
  anzeige[sitz] = ziel;
}

async function standZeigen(sp, wuerfeln) {
  sperre = true;
  brettBauen();
  if (wuerfeln && sp.wuerfel && sp.wuerfel[0]) {
    await Promise.all([WG.wuerfeln(w1, sp.wuerfel[0], 520), WG.wuerfeln(w2, sp.wuerfel[1], 640)]);
  } else {
    WG.setzeWuerfel(w1, (sp.wuerfel && sp.wuerfel[0]) || 0);
    WG.setzeWuerfel(w2, (sp.wuerfel && sp.wuerfel[1]) || 0);
  }
  spielerZeichnen(sp);
  kopfZeichnen(sp);
  for (let i = 0; i < sp.spieler.length; i++) {
    if (anzeige[i] !== sp.spieler[i].pos) {
      const summe = (sp.wuerfel && sp.wuerfel[0]) ? sp.wuerfel[0] + sp.wuerfel[1] : 0;
      await bewegen(sp, i, sp.spieler[i].pos, summe);
    }
  }
  markiere(sp);
  sperre = false;
  kopfZeichnen(sp);
}

/* -------------------------------- lokal -------------------------------- */
async function lokalWuerfeln() {
  if (sperre || !lokal || lokal.sp.status !== "spiel") return;
  const sp = lokal.sp;
  const sitz = sp.zug;
  const a = 1 + Math.floor(Math.random() * 6), b = 1 + Math.floor(Math.random() * 6);
  sperre = true;
  kopfZeichnen(sp);
  await Promise.all([WG.wuerfeln(w1, a, 520), WG.wuerfeln(w2, b, 640)]);
  zugMachen(sp, sitz, a, b);
  sperre = false;
  await standZeigen(sp, false);
}

function lokalStarten(weiter) {
  const anzahl = Number($("anzahl").value) || 2;
  const vorher = weiter && lokal ? lokal.sp.runde : 0;
  lokal = { sp: neuerStand(anzahl) };
  if (vorher) lokal.sp.runde = vorher + 1;
  anzeige = [0, 0, 0, 0];
  fehler("");
  figurenSichern(anzahl);
  for (let i = 0; i < anzahl; i++) figurSetzen(i, 0);
  WG.setzeWuerfel(w1, 0); WG.setzeWuerfel(w2, 0);
  standZeigen(lokal.sp, false);
}

/* -------------------------------- online ------------------------------- */
const netz = WG.netz({ pfad: "/api/gaensespiel", room: ROOM, id: MYID, melde: (t) => fehler(t) });

async function uebernehmen(g) {
  const alt = onlineGame;
  onlineGame = g;
  if (!g) {
    elSpieler.innerHTML = "";
    notiz("Eröffne eine Runde – Mitspieler treten im Raum bei.");
    leisteOnline(null);
    return;
  }
  if (!alt || alt.runde !== g.runde) {
    anzeige = [0, 0, 0, 0];
    figurenSichern(g.spieler.length);
    for (let i = 0; i < g.spieler.length; i++) figurSetzen(i, 0);
  }
  while (elFiguren.children.length < g.spieler.length) {
    const f = WG.figur(elFiguren.children.length, "");
    f.dataset.sitz = elFiguren.children.length;
    elFiguren.appendChild(f);
  }
  const neuerWurf = !alt || alt.zug !== g.zug || alt.runde !== g.runde ||
    !alt.wuerfel || alt.wuerfel[0] !== g.wuerfel[0] || alt.wuerfel[1] !== g.wuerfel[1];
  await standZeigen(g, neuerWurf);
  leisteOnline(g);
}

function leisteOnline(g) {
  $("startLeiste").classList.add("wg-versteckt");
  $("onlineLeiste").classList.remove("wg-versteckt");
  const ich = g ? g.spieler.find((s) => s.id === MYID) : null;
  $("btnErstellen").classList.toggle("wg-versteckt", !!g);
  $("btnBereit").classList.toggle("wg-versteckt", !g || g.status !== "invited");
  $("btnLos").classList.toggle("wg-versteckt", !g || g.status !== "invited");
  if (g && g.status === "invited") {
    $("btnBereit").textContent = ich && ich.ready ? "Nicht bereit" : "Bereit";
    $("btnLos").textContent = "Los (" + g.spieler.filter((s) => s.ready).length + "/" + g.spieler.length + " bereit)";
  }
}

/* ------------------------------ Bedienung ------------------------------ */
btnWuerfeln.addEventListener("click", async () => {
  if (!ONLINE) { lokalWuerfeln(); return; }
  const r = await netz.schicke("wuerfeln");
  if (r.ok && r.game) await uebernehmen(r.game);
});
$("btnLokal").addEventListener("click", lokalStarten);
$("btnNochmal").addEventListener("click", async () => {
  if (!ONLINE) { lokalStarten(true); return; }
  const r = await netz.schicke("naechste");
  if (r.ok && r.game) await uebernehmen(r.game);
});
$("btnErstellen").addEventListener("click", async () => {
  const r = await netz.schicke("create");
  if (r.ok && r.game) await uebernehmen(r.game);
});
$("btnBereit").addEventListener("click", async () => {
  const r = await netz.schicke("ready");
  if (r.ok && r.game) await uebernehmen(r.game);
});
$("btnLos").addEventListener("click", async () => {
  const r = await netz.schicke("start");
  if (r.ok && r.game) await uebernehmen(r.game);
});

brettBauen();

if (ONLINE) {
  $("startLeiste").classList.add("wg-versteckt");
  const hohle = async () => {
    const r = await netz.hole();
    if (r.ok) { fehler(""); await uebernehmen(r.game); }
  };
  // Gemeinsames Lebenszeichen (wuerfel-common.js): erst den Platz sichern,
  // dann fragen – sonst antwortet der erste Abruf mit „Bitte zuerst dem
  // Spielraum beitreten“ und die Seite startet mit Fehler.
  const bereit = WG.leben({ room: ROOM, id: MYID, name: MYNAME });
  (async () => { await bereit; hohle(); })();
  setInterval(hohle, 1200);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) hohle(); });
  window.addEventListener("focus", hohle);
} else {
  notiz("Wähle oben die Spielerzahl und starte am selben Gerät.");
  elZug.textContent = "";
}
})();
</script>
