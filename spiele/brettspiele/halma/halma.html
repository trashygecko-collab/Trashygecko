<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halma – TrashyGecko</title>
<meta name="description" content="Halma für 2 bis 6 Spieler: klassisch, Sternhalma, Sprunghalma, gegen den Computer und als Knobelaufgabe.">
<link rel="stylesheet" href="css/halma.css">
<script src="../../stil.js"></script>
</head>
<body data-stil="normal">

<div class="seite">

  <header class="kopf">
    <div>
      <p class="unter">Klassisch · Stern · Sprung · Solo gegen Computer · Knobeln</p>
    </div>
    <div class="rechts">
      <button type="button" class="knopf zweit" id="hilfeKnopf">Regeln</button>
    </div>
  </header>

  <main class="buehne">

    <!-- ------------------------------------------------------------ Menü -->
    <section class="bereich menue" id="menue" aria-label="Spielauswahl">
      <div>
        <h2>Spielvariante</h2>
        <div class="varianten" id="varianten"></div>
      </div>

      <div>
        <h2>Optionen</h2>
        <div class="optionen" id="optionen"></div>
      </div>

      <div class="aufgabenblock" id="aufgabenblock" hidden>
        <h2>Knobelaufgaben</h2>
        <div class="aufgaben" id="aufgaben"></div>
      </div>

      <p class="hinweiszeile" id="menueHinweis"></p>

      <div class="knopfreihe">
        <button type="button" class="knopf" id="startKnopf">Spiel starten</button>
        <button type="button" class="knopf zweit" id="onlineKnopf" hidden>Partie eröffnen</button>
      </div>
    </section>

    <!-- --------------------------------------------------------- Spiel -->
    <section class="bereich spiel" id="spielbereich" aria-label="Spielfeld" hidden>
      <div class="leiste">
        <span class="marke" id="varianteMarke">Klassisch</span>
        <span class="marke" id="zugMarke">Zug 1</span>
        <span class="marke dran" id="dranMarke">Du bist dran</span>
        <span class="rechts">
          <button type="button" class="knopf zweit" id="lupeKnopf" hidden aria-pressed="true">Lupe an</button>
          <button type="button" class="knopf zweit" id="neuKnopf">Neu</button>
          <button type="button" class="knopf zweit" id="menueKnopf">Menü</button>
        </span>
      </div>

      <div class="online-leiste" id="onlineLeiste" hidden>
        <span id="onlineText"></span>
        <button type="button" class="knopf zweit" id="bereitKnopf">Bereit</button>
        <button type="button" class="knopf" id="startOnlineKnopf">Start</button>
      </div>

      <div class="brettrahmen" id="brettrahmen">
        <div class="brett" id="brett" role="grid" aria-label="Spielbrett"></div>
        <!-- Feldlupe für die schmalen 16×16-Felder am Handy -->
        <div class="lupe" id="lupe" hidden>
          <div class="lupe-kopf">
            <span>Feld antippen</span>
            <button type="button" class="lupe-zu" id="lupeZu" aria-label="Lupe schließen">×</button>
          </div>
          <div class="lupe-gitter" id="lupeGitter" role="group" aria-label="Vergrößertes Feld"></div>
        </div>
      </div>

      <div class="fuss">
        <span class="letzter-zug" id="letzterZug"></span>
        <button type="button" class="knopf zweit" id="lernKnopf">Lernhilfe</button>
        <button type="button" class="knopf zweit" id="tippKnopf" hidden>Tipp</button>
        <button type="button" class="knopf zweit" id="loesungKnopf" hidden>Lösung</button>
      </div>
    </section>

    <!-- ------------------------------------------------------ Spieler -->
    <aside class="bereich spielerbereich" id="spielerbereich" aria-label="Spieler" hidden>
      <div>
        <h2 style="margin:0 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--akzent)">Spieler</h2>
        <ul class="spielerliste" id="spielerliste"></ul>
      </div>
      <div>
        <h2 style="margin:10px 0 4px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--akzent)">Verlauf</h2>
        <ul class="verlauf" id="verlauf"></ul>
      </div>
    </aside>

  </main>
</div>

<div class="lernkarte" id="lernkarte" aria-live="polite"></div>

<div class="schleier" id="dialogSchleier" hidden>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
</div>

<script src="../../token.js"></script>
<!-- Ergebnis-Sprüche aus den zentralen Connector-Listen -->
<script src="../../ergebnis.js"></script>
<script src="js/brett.js"></script>
<script src="js/regeln.js"></script>
<script src="js/ki.js"></script>
<script src="js/raetsel.js"></script>
<script src="js/lernen.js"></script>
<script src="js/design.js"></script>
<script src="js/main.js"></script>
</body>
</html>
