
<!DOCTYPE html>
<html lang="de">
<head>
<script src="../../token.js"></script>
<script src="../../stil.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>21 Streichhölzer – Neon Duel</title>
<style>
:root{
  --bg:#0a211b;
  --panel:#0a211b;
  --pink:#c2765c;
  --blue:#e8cd8e;
  --purple:#a9c3b6;
  --gold:#d9bc7c;
  --text:#f6edda;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  padding:18px;
  background:
    radial-gradient(ellipse at 15% 10%,#12332a 0%,transparent 40%),
    radial-gradient(ellipse at 85% 90%,#184536 0%,transparent 45%),
    var(--bg);
  color:var(--text);
  font-family:var(--tg-schrift);
  display:flex;
  justify-content:center;
  align-items:center;
}
.game{
  width:min(850px,100%);
  background:linear-gradient(145deg,#0a211b,#0a211b);
  border:2px solid #12332a;
  border-radius:22px;
  padding:clamp(16px,4vw,30px);
  box-shadow:0 0 25px #a52aff35,inset 0 0 25px #a52aff0c;
}
.players{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:22px;
}
.player{
  text-align:center;
  padding:15px 8px;
  border:2px solid #184536;
  border-radius:14px;
  background:#0a211b;
  color:#a9c3b6;
  transition:.2s;
}
.player strong{
  display:block;
  font-size:22px;
  letter-spacing:2px;
}
.player small{display:block;margin-top:5px}
.player.red.active{
  border-color:var(--pink);
  color:var(--pink);
  box-shadow:0 0 18px #ff315f55,inset 0 0 15px #ff315f18;
}
.player.blue.active{
  border-color:var(--blue);
  color:var(--blue);
  box-shadow:0 0 18px #36dfff55,inset 0 0 15px #36dfff18;
}
.status{
  text-align:center;
  font-size:clamp(19px,4vw,25px);
  font-weight:bold;
  margin:18px 0 8px;
  min-height:32px;
}
.status.red{color:var(--pink);text-shadow:none}
.status.blue{color:var(--blue);text-shadow:none}
.status.win{color:#d9bc7c;text-shadow:0 0 15px #d9bc7c}
.question{
  text-align:center;
  color:#efe6d2;
  margin-bottom:17px;
}
.buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  max-width:520px;
  margin:0 auto 25px;
}
.take{
  min-height:66px;
  border-radius:13px;
  border:2px solid var(--purple);
  background:#12332a;
  color:#f6edda;
  font-size:23px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 12px #a52aff35;
  transition:.15s;
}
.take span{display:block;font-size:12px;margin-top:4px;color:#a9c3b6}
.take:active:not(:disabled){
  transform:scale(.95);
  background:#12332a;
}
.take:disabled{
  opacity:.25;
  cursor:not-allowed;
  box-shadow:none;
}
.board{
  border:1px solid #184536;
  background:#0a211b;
  border-radius:15px;
  padding:18px 12px;
  box-shadow:inset 0 0 18px #0a211b;
}
.board-title{
  text-align:center;
  color:#a9c3b6;
  font-size:15px;
  margin-bottom:17px;
}
.matches{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:13px 7px;
  justify-items:center;
  max-width:620px;
  margin:auto;
}
.match{
  position:relative;
  width:23px;
  height:65px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
}
.stick{
  width:7px;
  height:52px;
  border-radius:3px;
  background:linear-gradient(90deg,#5b4a2c,#d9bc7c,#d9bc7c);
  box-shadow:0 0 8px #ffb13c77;
  position:relative;
}
.head{
  width:13px;
  height:14px;
  border-radius:50% 50% 40% 40%;
  background:radial-gradient(circle at 35% 30%,#f6edda,#e8cd8e 60%,#a8873f);
  box-shadow:0 0 9px #d9bc7c;
  margin-bottom:-2px;
  z-index:1;
}
.match.taken .stick{
  background:#184536;
  box-shadow:none;
  opacity:.55;
}
.match.taken .head{
  background:#184536;
  box-shadow:none;
  opacity:.55;
}
.cross{
  display:none;
  position:absolute;
  width:34px;
  height:5px;
  top:29px;
  left:-5px;
  transform:rotate(-43deg);
  border-radius:5px;
  z-index:3;
}
.match.taken .cross{display:block}
.match.taken.red .cross{
  background:var(--pink);
  box-shadow:0 0 9px var(--pink),0 0 17px var(--pink);
}
.match.taken.blue .cross{
  background:var(--blue);
  box-shadow:none;
}
.match-number{
  position:absolute;
  bottom:-19px;
  font-size:11px;
  color:#7fa091;
}
.count{
  text-align:center;
  margin-top:27px;
  color:#efe6d2;
  font-size:17px;
}
.count strong{
  color:var(--gold);
  font-size:24px;
  text-shadow:0 0 10px #d9bc7c;
}
.legend{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  margin-top:18px;
  font-size:13px;
  color:#efe6d2;
}
.legend span{display:flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%}
.dot.red{background:var(--pink);box-shadow:0 0 8px var(--pink)}
.dot.blue{background:var(--blue);box-shadow:none}
.bottom{
  display:flex;
  justify-content:center;
  margin-top:23px;
}
.reset{
  border:2px solid #a9c3b6;
  border-radius:12px;
  padding:13px 28px;
  background:#12332a;
  color:#f6edda;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 13px #a52aff44;
}
.reset:active{transform:scale(.96)}
@media(max-width:430px){
  body{padding:8px}
  .game{padding:15px 10px;border-radius:16px}
  .matches{gap:12px 3px}
  .match{transform:scale(.9)}
  .board{padding:16px 5px}
  .take{min-height:60px;font-size:20px}
}

<body>
<main class="game">

  <section class="players">
    <div class="player red active" id="redPlayer">
      <strong>KUPFER</strong>
      <small>Spieler 1</small>
    </div>
    <div class="player blue" id="bluePlayer">
      <strong>GOLD</strong>
      <small>Spieler 2</small>
    </div>
  </section>

  <div class="status red" id="status">KUPFER IST AM ZUG</div>
  <div class="question" id="question">Wie viele möchtest du nehmen?</div>

  <div class="buttons">
    <button class="take" data-take="1">1 <span>NEHMEN</span></button>
    <button class="take" data-take="2">2 <span>NEHMEN</span></button>
    <button class="take" data-take="3">3 <span>NEHMEN</span></button>
  </div>

  <section class="board">
    <div class="board-title">DIE STREICHHÖLZER</div>
    <div class="matches" id="matches"></div>
    <div class="count">
      Noch verfügbar: <strong id="remaining">21</strong>
    </div>
    <div class="legend">
      <span><i class="dot red"></i> Von Kupfer genommen</span>
      <span><i class="dot blue"></i> Von Gold genommen</span>
    </div>
  </section>

  <div class="bottom">
    <button class="reset" id="restart">↻ NEUES SPIEL</button>
  </div>
</main>

<script src="../../netz.js"></script>
<script>
const TOTAL = 21;
let remaining = TOTAL;
let current = "red";
let gameOver = false;
let takenBy = Array(TOTAL).fill(null);

const matches = document.getElementById("matches");
const remainingDisplay = document.getElementById("remaining");
const statusDisplay = document.getElementById("status");
const questionDisplay = document.getElementById("question");
const redPlayer = document.getElementById("redPlayer");
const bluePlayer = document.getElementById("bluePlayer");
const takeButtons = document.querySelectorAll(".take");

function drawMatches(){
  matches.innerHTML = "";

  for(let i = 0; i < TOTAL; i++){
    const match = document.createElement("div");
    match.className = "match";

    if(takenBy[i]){
      match.classList.add("taken", takenBy[i]);
    }

    match.innerHTML = `
      <div class="head"></div>
      <div class="stick"></div>
      <div class="cross"></div>
      <div class="match-number">${i+1}</div>
    `;

    matches.appendChild(match);
  }

  remainingDisplay.textContent = remaining;
}

function updateDisplay(){
  redPlayer.classList.toggle("active", current === "red" && !gameOver);
  bluePlayer.classList.toggle("active", current === "blue" && !gameOver);

  statusDisplay.className = "status " + (gameOver ? "win" : current);
  statusDisplay.textContent = gameOver
    ? (current === "red" ? "GOLD GEWINNT! 🎉" : "KUPFER GEWINNT! 🎉")
    : (current === "red" ? "KUPFER IST AM ZUG" : "GOLD IST AM ZUG");

  questionDisplay.textContent = gameOver
    ? (current === "red" ? "Kupfer hat das letzte Streichholz genommen." : "Gold hat das letzte Streichholz genommen.")
    : "Wie viele möchtest du nehmen?";

  takeButtons.forEach(button => {
    const amount = Number(button.dataset.take);
    button.disabled = gameOver || amount > remaining;
  });
}

function take(amount){
  if(ONLINE){ takeOnline(amount); return; }
  if(gameOver || amount > remaining) return;

  const firstIndex = remaining - amount;

  for(let i = firstIndex; i < remaining; i++){
    takenBy[i] = current;
  }

  remaining -= amount;
  drawMatches();

  if(remaining === 0){
    gameOver = true;
    if (window.TGErgebnis) TGErgebnis.gewonnen(); // zentrale Connector-Texte
    updateDisplay();
    return;
  }

  current = current === "red" ? "blue" : "red";
  updateDisplay();
}

takeButtons.forEach(button => {
  button.addEventListener("click", () => {
    take(Number(button.dataset.take));
  });
});

document.getElementById("restart").addEventListener("click", () => {
  if(ONLINE){ resetOnline(); return; }
  remaining = TOTAL;
  current = "red";
  gameOver = false;
  takenBy = Array(TOTAL).fill(null);
  drawMatches();
  updateDisplay();
});

drawMatches();
updateDisplay();

// ---- Online über den Connector ----
const params = new URLSearchParams(location.search);
const ONLINE = params.has("room") && params.has("id");
const ROOM = params.get("room") || "";
const PLAYER_ID = params.get("id") || "";
const ONLINE_API = "/api/streichholz";
let onlineBusy = false;
let onlineGame = null;

function showOnlineState(game){
  if(!game) return;
  onlineGame = game;
  // Namen aus dem Spielstand: bei einer Bot-Partie steht hier „🤖 Robi“.
  const rotName = document.querySelector("#redPlayer small");
  const blauName = document.querySelector("#bluePlayer small");
  if(rotName && game.redName) rotName.textContent = game.redName;
  if(blauName && game.blueName) blauName.textContent = game.blueName;

  remaining = game.remaining;
  takenBy = Array.isArray(game.taken) ? game.taken.slice() : Array(TOTAL).fill(null);
  current = game.current;
  gameOver = game.status === "finished";
  drawMatches();
  updateDisplay();

  if(game.status === "invited"){
    questionDisplay.textContent = "Warte auf die Antwort von " + game.blueName + " …";
  }else if(game.note && gameOver){
    questionDisplay.textContent = game.note;
  }
}

async function rejoinRoom(){
  let name = (typeof params !== "undefined" && params.get("name")) || "Spieler";
  if (typeof G !== "undefined" && G && G.you >= 0 && G.seats && G.seats[G.you]) {
    name = G.seats[G.you].name;
  }
  try{
    await fetch("/api/presence",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({room:ROOM,id:PLAYER_ID,name,active:true})
    });
  }catch(e){}
}

async function onlineFetch(url, options){
  let response = await fetch(url, options);
  if (response.status === 403) {
    const text = (await response.text()).trim();
    // "Bitte zuerst dem Spielraum beitreten" heißt: das Lebenszeichen ist
    // verloren gegangen (WLAN weg, Handy gesperrt). Einmal neu anmelden und
    // dieselbe Anfrage wiederholen, statt in einer Sackgasse zu enden.
    if (!/beitreten/i.test(text)) throw Error(text || "Die Aktion ist fehlgeschlagen.");
    await rejoinRoom();
    response = await fetch(url, options);
  }
  if (!response.ok) throw Error((await response.text()).trim() || "Die Aktion ist fehlgeschlagen.");
  return response.json();
}


async function refreshOnline(){
  if(onlineBusy) return;
  try{
    const data = await onlineFetch(ONLINE_API + "?room=" + encodeURIComponent(ROOM) + "&id=" + encodeURIComponent(PLAYER_ID));
    showOnlineState(data.game);
  }catch(e){}
}

async function takeOnline(amount){
  if(onlineBusy) return;
  onlineBusy = true;
  try{
    const data = await onlineFetch(ONLINE_API + "?room=" + encodeURIComponent(ROOM) + "&action=take", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id: PLAYER_ID, amount})
    });
    showOnlineState(data.game);
  }catch(e){
    questionDisplay.textContent = e.message;
  }finally{
    onlineBusy = false;
  }
}

async function resetOnline(){
  if(onlineBusy) return;
  onlineBusy = true;
  try{
    const data = await onlineFetch(ONLINE_API + "?room=" + encodeURIComponent(ROOM) + "&action=reset", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id: PLAYER_ID})
    });
    showOnlineState(data.game);
  }catch(e){
    questionDisplay.textContent = e.message;
  }finally{
    onlineBusy = false;
  }
}

if(ONLINE){
  const bottom = document.querySelector(".bottom");
  const back = document.createElement("button");
  back.type = "button";
  back.className = "reset";
  back.id = "leaveBtn";
  back.textContent="Spiel verlassen";
  back.onclick = () => tgVerlassen();
  bottom.appendChild(back);

  refreshOnline();
  setInterval(refreshOnline, 1500);
}
</script>
