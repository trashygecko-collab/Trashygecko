<!DOCTYPE html>
<html lang="de">
<head>
<script src="/spiele/token.js"></script>
<script src="/spiele/stil.js"></script>
<script src="/spiele/brettspiele/wuerfel-common.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Bingo</title>
<link rel="stylesheet" href="/spiele/schrift.css">
<style>
:root{
  --bg:#081d18; --panel:#0f2b23; --panel2:#0b241d; --line:#1d4a3a; --gold:#e8cd8e;
  --ink:#f6edda; --muted:#a9c3b6; --gruen:#4fbf72; --rot:#e04b3f; --blau:#6cb8e8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;padding:10px;background:radial-gradient(ellipse at 18% -10%,#16443a 0%,transparent 52%),var(--bg);
  color:var(--ink);font-family:var(--tg-schrift);display:flex;justify-content:center;
}
.app{width:min(1120px,100%);display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}

/* ---------- Kopf ---------- */
.kopf{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.marke{display:flex;align-items:baseline;gap:8px}
.marke b{font-size:clamp(18px,2.5vw,26px);color:var(--gold);letter-spacing:4px;font-weight:bold}
.marke small{color:var(--muted);font-size:12px;letter-spacing:1px}
.kopfRechts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lage{color:var(--muted);font-size:13px}
.lage.lauft{color:var(--gruen)}
.lage.ende{color:var(--gold)}

/* ---------- Fläche ---------- */
.mitte{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:10px;flex:1 1 auto;min-height:0}
/* Schmale Fenster: eine Spalte, aber die Höhe des Panels wird vorgegeben
   (nicht vom Inhalt bestimmt), damit die Karte daran Maß nehmen kann. */
@media(max-width:760px){
  .mitte{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,150px)}
}
@media(max-height:560px){
  body{padding:5px}
  .app{gap:6px}
  .mitte{gap:6px}
  .karte-flaeche{padding:8px;gap:6px}
  .kugel{width:64px;height:64px}
  .kugel .zahl{font-size:26px}
  .karte-flaeche{--abzug:172px}
}

.karte-flaeche{background:linear-gradient(165deg,#123328,#0a211b);
  border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;
  gap:10px;min-height:0;position:relative;overflow:hidden;
  /* Höhe des Panels als Bezug: Karte und Spaltenleiste richten sich danach,
     damit Karte und Bedienleiste ohne Scrollen hineinpassen. */
  container-type:size;--abzug:187px}

/* Ziehung: große Kugel und Fortschritt */
.ziehen{display:flex;align-items:center;gap:12px}
.kugel{width:86px;height:86px;border-radius:50%;flex:0 0 auto;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;
  background:radial-gradient(circle at 32% 26%,#fff6e2,#e8cd8e 46%,#a9853f 100%);
  color:#26200f;box-shadow:0 6px 16px #00000066,inset 0 -6px 12px #7a5f22;transition:transform .18s ease}
.kugel.leer{background:radial-gradient(circle at 32% 26%,#1b4a3a,#0f2b23);color:var(--muted);
  box-shadow:inset 0 0 0 1px #1d4a3a}
.kugel.plopp{transform:scale(1.08)}
.kugel .buchstabe{font-size:13px;letter-spacing:2px;opacity:.75;line-height:1}
.kugel .zahl{font-size:34px;font-weight:bold;line-height:1.05}

.zugInfo{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 auto}
.zugInfo .zeile{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.zugInfo b{color:var(--gold);font-weight:normal;letter-spacing:1px}
.zugInfo .notiz{font-size:13px;color:var(--muted)}
.balken{height:6px;border-radius:4px;background:#0a211b;border:1px solid var(--line);overflow:hidden}
.balken i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fbf72,#e8cd8e);transition:width .3s ease}

/* Karte */
.karte{
  width:min(100%, 520px, calc(100cqh - var(--abzug)));
  margin:0 auto;aspect-ratio:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  grid-template-rows:repeat(5,minmax(0,1fr));gap:clamp(3px,.7vh,7px);
}
.spalten{width:min(100%,520px,calc(100cqh - var(--abzug)));margin:0 auto;display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(3px,.7vh,7px);text-align:center;
  color:var(--gold);font-weight:bold;font-size:clamp(12px,2.1vh,17px);letter-spacing:3px}
.zelle{border:1px solid var(--line);border-radius:11px;background:#14382d;color:var(--ink);
  font-family:inherit;font-weight:bold;font-size:clamp(14px,4vh,24px);cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;padding:0;min-height:0;
  transition:background .15s,transform .08s,border-color .15s,box-shadow .2s}
.zelle:hover:not(:disabled){background:#1b4a3a}
.zelle:active:not(:disabled){transform:scale(.96)}
/* Zahl wurde gerade gezogen, steht aber noch nicht als Marke */
.zelle.gerufen{border-color:#e8cd8e88;box-shadow:inset 0 0 0 1px #e8cd8e55}
.zelle.markiert{background:linear-gradient(160deg,#4a3c22,#3b3221);border-color:var(--gold);
  color:#ffeec4;box-shadow:inset 0 0 0 1px #e8cd8e77}
.zelle.markiert::after{content:"✓";position:absolute;top:2px;right:5px;font-size:11px;color:#e8cd8e}
.zelle.frisch{animation:plopp .35s ease}
@keyframes plopp{
  0%{transform:scale(.88);box-shadow:0 0 0 0 #e8cd8ecc}
  60%{transform:scale(1.05);box-shadow:0 0 0 7px #e8cd8e00}
  100%{transform:scale(1)}
}
.zelle.frei{background:#0c2a22;border-style:dashed;color:var(--muted);font-size:clamp(9px,1.8vh,12px)}
.zelle.fertig{box-shadow:0 0 14px #e8cd8e88}
.zelle:disabled{cursor:default}
.karte.aus .zelle{opacity:.62}
@media(prefers-reduced-motion:reduce){.zelle.frisch{animation:none}.kugel{transition:none}}

/* Bedienleiste */
.leiste{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button.aktion{font-family:inherit;background:#14382d;color:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:9px 12px;cursor:pointer;font-size:14px}
button.aktion:disabled{opacity:.42;cursor:default}
button.aktion.haupt{background:var(--gold);color:#0a211b;border-color:#d9bc7c;font-weight:bold}
button.aktion.bingo{background:#7a2c25;border-color:#a8382e;font-weight:bold;letter-spacing:1px}
button.aktion.bingo:not(:disabled){color:#ffd9d2}
button.aktion.bingo.bereit{background:#a8382e;border-color:#e0a08a;
  box-shadow:0 0 0 0 #e04b3f88;animation:locken 1.4s ease-in-out infinite}
@keyframes locken{0%,100%{box-shadow:0 0 0 0 #e04b3f66}50%{box-shadow:0 0 0 8px #e04b3f00}}
.schalter{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;
  border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#0b241d}
.schalter input{accent-color:#e8cd8e;width:16px;height:16px;margin:0}

/* Seite */
.seite{background:linear-gradient(165deg,#123328,#0a211b);border:1px solid var(--line);border-radius:16px;
  padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.seite h3{margin:0;font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:normal}
.zahlen{display:flex;flex-wrap:wrap;gap:4px;overflow:auto;max-height:84px}
.chip{background:#14382d;border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:13px}
.chip.neu{border-color:var(--gold);color:var(--gold);font-weight:bold;background:#2a2413}
.spieler{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
.sp{margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:14px}
.sp.dran{border-color:var(--gold);box-shadow:0 0 12px #e8cd8e44}
.sp.raus{opacity:.55;text-decoration:line-through}
.sp b{color:var(--gold);font-weight:normal;font-size:13px}
.notiz{color:var(--muted);font-size:13px;min-height:18px}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-height:84px;overflow:auto}
.versteckt{display:none!important}

/* Jubel beim Bingo */
.jubel{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.jubel b{font-size:clamp(30px,7vw,58px);letter-spacing:6px;color:#ffe9b0;
  text-shadow:0 0 24px #e8cd8eaa;animation:jubeln 1.1s ease}
@keyframes jubeln{0%{transform:scale(.7);opacity:0}30%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:.9}}

/* ---- Grafikstil (zentral): Klassisch bleibt unverändert ---- */
html[data-stil="maedchen"]{--bg:#eb7bc0;--panel:#fff6fa;--panel2:#ffeaf3;--line:#ef7aa8;--gold:#8f2450;--ink:#3a0f24;--muted:#8f2450;--gruen:#2a8f6a;--rot:#e0242f;--blau:#b06bff}
html[data-stil="maedchen"] body{background:radial-gradient(circle 900px at 50% -6%,#ffe0ef 0%,#f7a6d4 42%,#eb7bc0 100%) fixed;color:#3a0f24}
html[data-stil="maedchen"] .karte-flaeche{background:linear-gradient(165deg,#fff6fa,#ffeaf3);border-color:#ef7aa8}
html[data-stil="maedchen"] .kugel{background:radial-gradient(circle at 32% 26%,#ffffff,#ffd0e4 46%,#ef7aa8 100%);color:#5b2340;box-shadow:0 6px 16px #b52a6340,inset 0 -6px 12px #ef7aa866}
html[data-stil="maedchen"] .kugel.leer{background:radial-gradient(circle at 32% 26%,#ffe3ef,#ffd0e4);color:#8f2450;box-shadow:inset 0 0 0 1px #ef7aa8}
html[data-stil="maedchen"] .balken{background:#ffe3ef;border-color:#ef7aa8}
html[data-stil="maedchen"] .balken i{background:linear-gradient(90deg,#ef7aa8,#b06bff)}
html[data-stil="maedchen"] .zelle{background:#ffffff;border-color:#ffb8d4;color:#3a0f24}
html[data-stil="maedchen"] .zelle:hover:not(:disabled){background:#ffeaf3}
html[data-stil="maedchen"] .zelle.gerufen{border-color:#b06bff88;box-shadow:inset 0 0 0 1px #b06bff55}
html[data-stil="maedchen"] .zelle.markiert{background:linear-gradient(160deg,#ffe3ef,#ffd0e4);border-color:#b06bff;color:#5b2340;box-shadow:inset 0 0 0 1px #b06bff77}
html[data-stil="maedchen"] .zelle.markiert::after{color:#b06bff}
html[data-stil="maedchen"] .zelle.frei{background:#fff0f7;color:#8f2450}
html[data-stil="maedchen"] .zelle.fertig{box-shadow:0 0 14px #ef7aa888}
html[data-stil="maedchen"] .seite{background:linear-gradient(165deg,#fff6fa,#ffeaf3);border-color:#ef7aa8}
html[data-stil="maedchen"] .seite h3{color:#8f2450}
html[data-stil="maedchen"] .chip{background:#ffffff;border-color:#ffb8d4;color:#3a0f24}
html[data-stil="maedchen"] .chip.neu{border-color:#b06bff;color:#7a2fbf;background:#ffe3ef}
html[data-stil="maedchen"] .sp{background:#fff6fa;border-color:#ef7aa8;color:#3a0f24}
html[data-stil="maedchen"] .sp.dran{border-color:#b06bff;box-shadow:0 0 12px #b06bff44}
html[data-stil="maedchen"] .schalter{background:#ffeaf3;border-color:#ef7aa8;color:#8f2450}
html[data-stil="maedchen"] .schalter input{accent-color:#b06bff}
html[data-stil="maedchen"] select,html[data-stil="maedchen"] button.aktion{background:#fff6fa;border-color:#ef7aa8;color:#5b2340}
html[data-stil="maedchen"] button.aktion.haupt{background:linear-gradient(100deg,#ff9ec4,#eb7bc0);border-color:#ef7aa8;color:#fff}
html[data-stil="maedchen"] button.aktion.bingo{background:#ffe3ef;border-color:#ef7aa8;color:#b0286a}
html[data-stil="maedchen"] button.aktion.bingo.bereit{background:#ff9ec4;border-color:#ef7aa8;color:#fff}
html[data-stil="maedchen"] .jubel b{color:#7a2fbf;text-shadow:none}
html[data-stil="buben"]{--bg:#04070b;--panel:#111316;--panel2:#16181c;--line:#2b3540;--gold:#c8ff3d;--ink:#e6e9ec;--muted:#adb4bc;--gruen:#6dff4a;--rot:#ff5560;--blau:#57f0ff}
html[data-stil="buben"] body{background:radial-gradient(circle 900px at 50% -6%,#1c2a3d 0%,#0c1219 46%,#04070b 100%) fixed;color:#e6e9ec}
html[data-stil="buben"] .karte-flaeche{background:linear-gradient(165deg,#141a21,#0a0d10);border-color:#23262c}
html[data-stil="buben"] .kugel{background:radial-gradient(circle at 32% 26%,#eef1f3,#c9d1d9 46%,#7e8892 100%);color:#0a0d10;box-shadow:0 6px 16px #000000aa,inset 0 -6px 12px #3a424b}
html[data-stil="buben"] .kugel.leer{background:radial-gradient(circle at 32% 26%,#1b1e23,#12161a);color:#7e8892;box-shadow:inset 0 0 0 1px #2b3540}
html[data-stil="buben"] .balken{background:#12161a;border-color:#2b3540}
html[data-stil="buben"] .balken i{background:linear-gradient(90deg,#6dff4a,#57f0ff)}
html[data-stil="buben"] .zelle{background:#12161a;border-color:#2b3540;color:#e6e9ec}
html[data-stil="buben"] .zelle:hover:not(:disabled){background:#1b2027}
html[data-stil="buben"] .zelle.gerufen{border-color:#6dff4a88;box-shadow:inset 0 0 0 1px #6dff4a55}
html[data-stil="buben"] .zelle.markiert{background:linear-gradient(160deg,#1d2a12,#16200f);border-color:#6dff4a;color:#d8ffb8;box-shadow:inset 0 0 0 1px #6dff4a77}
html[data-stil="buben"] .zelle.markiert::after{color:#6dff4a}
html[data-stil="buben"] .zelle.frei{background:#0b0e11;color:#7e8892}
html[data-stil="buben"] .zelle.fertig{box-shadow:0 0 14px #6dff4a88}
html[data-stil="buben"] .seite{background:linear-gradient(165deg,#141a21,#0a0d10);border-color:#23262c}
html[data-stil="buben"] .seite h3{color:#adb4bc}
html[data-stil="buben"] .chip{background:#12161a;border-color:#2b3540;color:#e6e9ec}
html[data-stil="buben"] .chip.neu{border-color:#6dff4a;color:#b6ff9e;background:#12200f}
html[data-stil="buben"] .sp{background:#16181c;border-color:#23262c;color:#e6e9ec}
html[data-stil="buben"] .sp.dran{border-color:#6dff4a;box-shadow:0 0 12px #6dff4a44}
html[data-stil="buben"] .schalter{background:#12161a;border-color:#23262c;color:#adb4bc}
html[data-stil="buben"] .schalter input{accent-color:#6dff4a}
html[data-stil="buben"] select,html[data-stil="buben"] button.aktion{background:#12161a;border-color:#2b3540;color:#e6e9ec}
html[data-stil="buben"] button.aktion.haupt{background:#c8ff3d;border-color:#6dff4a;color:#0b241d}
html[data-stil="buben"] button.aktion.bingo{background:#1b1e23;border-color:#e0242f;color:#ff8a90}
html[data-stil="buben"] button.aktion.bingo.bereit{background:#e0242f;border-color:#ff5560;color:#fff}
html[data-stil="buben"] .jubel b{color:#c8ff3d;text-shadow:none}
</style>
</head>
<body>
<main class="app">
  <header class="kopf">
    <div class="marke"><b>BINGO</b><small>75 Kugeln · 5×5</small></div>
    <div class="kopfRechts">
      <span class="lage" id="lage">Bereit</span>
      <div class="leiste" id="startLeiste">
        <button class="aktion haupt" id="btnStart">Runde starten</button>
      </div>
      <div class="leiste versteckt" id="onlineLeiste">
        <button class="aktion haupt" id="btnErstellen">Runde eröffnen</button>
        <button class="aktion" id="btnBereit">Bereit</button>
        <button class="aktion" id="btnLos">Los</button>
      </div>
    </div>
  </header>

  <section class="mitte">
    <div class="karte-flaeche">
      <div class="ziehen">
        <div class="kugel leer" id="kugel">
          <span class="buchstabe" id="kugelBuchstabe">?</span>
          <span class="zahl" id="kugelZahl">–</span>
        </div>
        <div class="zugInfo">
          <div class="zeile"><b id="rundenTitel">Runde 1</b><span class="notiz" id="zugText"></span></div>
          <div class="balken"><i id="balken"></i></div>
          <span class="notiz" id="beutel">Beutel voll</span>
        </div>
      </div>

      <div class="spalten"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
      <div class="karte aus" id="karte"></div>

      <div class="leiste">
        <button class="aktion haupt" id="btnZiehen" disabled>Ziehen</button>
        <button class="aktion bingo" id="btnBingo" disabled>Bingo!</button>
        <label class="schalter" id="autoFeld"><input type="checkbox" id="auto"> Auto markieren</label>
        <span class="notiz" id="notiz"></span>
      </div>
      <div class="jubel" id="jubel" hidden><b>BINGO!</b></div>
    </div>

    <aside class="seite">
      <div>
        <h3>GEZOGEN</h3>
        <div class="zahlen" id="zahlen"></div>
      </div>
      <div>
        <h3>SPIELER</h3>
        <div class="spieler" id="spieler"></div>
      </div>
      <div>
        <h3>VERLAUF</h3>
        <div class="log" id="log"></div>
      </div>
      <div class="leiste versteckt" id="ende">
        <button class="aktion haupt" id="btnNochmal">Nächste Runde</button>
        <button class="aktion" id="btnNeu">Neue Karte</button>
      </div>
    </aside>
  </section>
</main>

<script>
(() => {
"use strict";
/* Online oder lokal: gleiche Oberfläche, zwei Antriebe. Die lokale Runde
   führt dieselben Regeln wie der Server nach, damit sich nichts anders
   anfühlt – gezogen wird ohne Wiederholung, ein Bingo prüft die Marken. */
const P = new URLSearchParams(location.search);
const ROOM = (P.get("room") || "").trim().toUpperCase();
const ONLINE = /^TG-[A-F0-9]{4}$/.test(ROOM);
const MYID = (P.get("id") || "").trim();
const MYNAME = (P.get("name") || "").trim() || "Spieler";

const BUCHSTABEN = ["B", "I", "N", "G", "O"];
const SPALTEN = 15, FELDER = 25, FREI = 12, MAXZAHL = 75;

const $ = (id) => document.getElementById(id);
const elKarte = $("karte"), elZahlen = $("zahlen"), elSpieler = $("spieler"),
      elLog = $("log"), elNotiz = $("notiz"), elLage = $("lage"), elZug = $("zugText"),
      elRunde = $("rundenTitel"), elEnde = $("ende"), elKugel = $("kugel"),
      elKugelB = $("kugelBuchstabe"), elKugelZahl = $("kugelZahl"),
      elBalken = $("balken"), elBeutel = $("beutel"), elJubel = $("jubel");

const zahlText = (zahl) => zahl < 1 || zahl > MAXZAHL ? String(zahl)
  : BUCHSTABEN[Math.floor((zahl - 1) / SPALTEN)] + zahl;
const zahlBuchstabe = (zahl) => zahl < 1 || zahl > MAXZAHL ? "?" : BUCHSTABEN[Math.floor((zahl - 1) / SPALTEN)];

let autoMarkieren = false;
let frischeZahl = 0;        // zuletzt gezogene Zahl (für die Hervorhebung)
let frischeMarke = null;    // Feld, das gerade automatisch markiert wurde

/* ---------------------------- lokal ------------------------------- */
function karteBauen() {
  const karte = new Array(FELDER);
  for (let spalte = 0; spalte < 5; spalte++) {
    const zahlen = [];
    for (let i = 0; i < SPALTEN; i++) zahlen.push(spalte * SPALTEN + i + 1);
    for (let i = zahlen.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [zahlen[i], zahlen[j]] = [zahlen[j], zahlen[i]];
    }
    for (let zeile = 0; zeile < 5; zeile++) karte[zeile * 5 + spalte] = zahlen[zeile];
  }
  karte[FREI] = 0;
  return karte;
}
function linienZaehlen(marken) {
  let linien = 0;
  for (let zeile = 0; zeile < 5; zeile++) {
    let voll = true;
    for (let spalte = 0; spalte < 5; spalte++) if (!marken[zeile * 5 + spalte]) voll = false;
    if (voll) linien++;
  }
  for (let spalte = 0; spalte < 5; spalte++) {
    let voll = true;
    for (let zeile = 0; zeile < 5; zeile++) if (!marken[zeile * 5 + spalte]) voll = false;
    if (voll) linien++;
  }
  let abwaerts = true, aufwaerts = true;
  for (let i = 0; i < 5; i++) {
    if (!marken[i * 5 + i]) abwaerts = false;
    if (!marken[i * 5 + (4 - i)]) aufwaerts = false;
  }
  if (abwaerts) linien++;
  if (aufwaerts) linien++;
  return linien;
}

let lokal = null;

function lokalNeueRunde(weiter) {
  const marken = new Array(FELDER).fill(false);
  marken[FREI] = true;
  lokal = lokal && weiter ? lokal : { id: MYID || "ich", name: MYNAME, runde: 0 };
  lokal.runde++;
  lokal.karte = karteBauen();
  lokal.marken = marken;
  lokal.gezogen = [];
  lokal.letzte = [];
  lokal.fehlgriff = 0;
  lokal.verpasst = false;
  lokal.gewonnen = false;
  lokal.status = "spiel";
  lokal.note = "Neue Karte – zieh die erste Zahl.";
  lokal.sieger = "";
  frischeZahl = 0;
  frischeMarke = null;
  lokalAuffrischen();
}
function lokalAuffrischen() {
  if (!lokal) return;
  lokal.anzahl = lokal.marken.filter(Boolean).length;
  lokal.linien = linienZaehlen(lokal.marken);
  lokal.rest = MAXZAHL - lokal.gezogen.length;
}
function lokalMarkeSetzen(feld) {
  lokal.marken[feld] = true;
  frischeMarke = feld;
}
function lokalZiehen() {
  if (!lokal || lokal.status !== "spiel") return;
  const offen = [];
  for (let zahl = 1; zahl <= MAXZAHL; zahl++) if (!lokal.gezogen.includes(zahl)) offen.push(zahl);
  if (!offen.length) {
    lokal.status = "ende";
    lokal.note = "Alle 75 Zahlen sind gezogen – kein Bingo.";
    return;
  }
  const zahl = offen[Math.floor(Math.random() * offen.length)];
  lokal.gezogen.push(zahl);
  frischeZahl = zahl;
  lokal.letzte.push(zahlText(zahl));
  if (lokal.letzte.length > 8) lokal.letzte = lokal.letzte.slice(-8);

  // Auto-Markieren: die gezogene Zahl wird gleich auf der Karte abgehakt.
  const feld = lokal.karte.indexOf(zahl);
  if (autoMarkieren && feld >= 0 && feld !== FREI && !lokal.marken[feld]) {
    lokalMarkeSetzen(feld);
    lokal.note = zahlText(zahl) + " gezogen und markiert.";
  } else {
    lokal.note = "Gezogen: " + zahlText(zahl) + ".";
  }
  lokalAuffrischen();
}

function lokalMarkieren(zahl) {
  if (!lokal || lokal.status !== "spiel" || lokal.verpasst) return;
  const feld = lokal.karte.indexOf(zahl);
  if (feld < 0 || feld === FREI) return;
  lokal.marken[feld] = !lokal.marken[feld];
  frischeMarke = null;
  lokalAuffrischen();
  zeichne();
}
function lokalBingo() {
  if (!lokal || lokal.status !== "spiel" || lokal.verpasst) return;
  if (lokal.linien === 0) {
    lokal.verpasst = true;
    lokal.fehlgriff++;
    lokal.note = "Bingo – daneben: noch keine volle Reihe.";
    lokal.status = "ende";
    return;
  }
  const offen = lokal.karte.find((zahl, feld) => lokal.marken[feld] && feld !== FREI && !lokal.gezogen.includes(zahl));
  if (offen !== undefined) {
    lokal.verpasst = true;
    lokal.fehlgriff++;
    lokal.note = "Bingo – daneben: " + zahlText(offen) + " wurde noch nicht gezogen.";
    lokal.status = "ende";
    return;
  }
  lokal.status = "ende";
  lokal.gewonnen = true;
  lokal.sieger = lokal.id;
  lokal.note = "Bingo! Alle Marken waren gezogen – gewonnen.";
}

/* ---------------------------- gemeinsam --------------------------- */
let onlineGame = null, onlineBusy = false;

async function api(aktion, koerper) {
  const url = "/api/bingo?room=" + encodeURIComponent(ROOM) +
    (aktion ? "&action=" + encodeURIComponent(aktion) : "&id=" + encodeURIComponent(MYID));
  const r = await fetch(url, aktion ? {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ id: MYID }, koerper || {}))
  } : { cache: "no-store" });
  if (!r.ok) throw new Error((await r.text()).trim() || "Aktion fehlgeschlagen.");
  return r.json();
}

async function hole() {
  if (!ONLINE || onlineBusy) return;
  onlineBusy = true;
  try {
    const d = await api(null);
    onlineGame = d.game || null;
    zeichne();
  } catch (e) {
    elLage.textContent = e.message;
  } finally {
    onlineBusy = false;
  }
}

async function schicke(aktion, koerper) {
  if (onlineBusy) return false;
  onlineBusy = true;
  try {
    const d = await api(aktion, koerper);
    onlineGame = d.game || null;
    zeichne();
    return true;
  } catch (e) {
    elNotiz.textContent = e.message;
    return false;
  } finally {
    onlineBusy = false;
  }
}

/* ---------------------------- Zeichnen ---------------------------- */
function zelleKlickbar() {
  if (ONLINE) {
    const g = onlineGame;
    return !!(g && g.status === "spiel" && g.spieler.some((s) => s.id === MYID && !s.verpasst));
  }
  return !!(lokal && lokal.status === "spiel" && !lokal.verpasst);
}

function zeichneKarte(karte, marken) {
  elKarte.innerHTML = "";
  elKarte.classList.toggle("aus", !zelleKlickbar());
  (karte || []).forEach((zahl, feld) => {
    const z = document.createElement("button");
    z.type = "button";
    z.className = "zelle";
    z.dataset.feld = feld;
    if (feld === FREI || zahl === 0) {
      z.classList.add("frei");
      z.textContent = "FREI";
      z.disabled = true;
      elKarte.appendChild(z);
      return;
    }
    z.dataset.zahl = zahl;
    z.textContent = zahl;
    if (marken && marken[feld]) z.classList.add("markiert");
    if (zahl === frischeZahl) z.classList.add("gerufen");
    if (frischeMarke === feld) z.classList.add("frisch");
    z.disabled = !zelleKlickbar();
    elKarte.appendChild(z);
  });
}

function zeigeKugel(gezogen) {
  const zahl = (gezogen || []).slice(-1)[0];
  if (!zahl) {
    elKugel.className = "kugel leer";
    elKugelB.textContent = "?";
    elKugelZahl.textContent = "–";
    return;
  }
  if (elKugelZahl.textContent !== String(zahl)) {
    elKugel.className = "kugel plopp";
    setTimeout(() => { elKugel.className = "kugel"; }, 200);
  }
  elKugelB.textContent = zahlBuchstabe(zahl);
  elKugelZahl.textContent = String(zahl);
}

function zeichneAlles({ status, runde, gezogen, rest, spieler, note, letzte, zug, sieger }) {
  elRunde.textContent = "Runde " + runde;
  elLage.textContent = status === "invited" ? "Warte auf Mitspieler"
    : status === "ende" ? (sieger ? "Gewonnen" : "Runde vorbei") : "Läuft";
  elLage.className = "lage" + (status === "ende" ? " ende" : status === "spiel" ? " lauft" : "");
  elNotiz.textContent = note || "";

  zeigeKugel(gezogen);

  const anzahl = (gezogen || []).length;
  elBalken.style.width = Math.round((anzahl / MAXZAHL) * 100) + "%";
  elBeutel.textContent = anzahl + " von " + MAXZAHL + " gezogen" +
    (typeof rest === "number" ? " · " + rest + " im Beutel" : "");

  elZahlen.innerHTML = "";
  const neueste = (gezogen || []).slice(-1)[0];
  (gezogen || []).forEach((zahl) => {
    const c = document.createElement("span");
    c.className = "chip" + (zahl === neueste ? " neu" : "");
    c.textContent = zahlText(zahl);
    elZahlen.appendChild(c);
  });
  if (!anzahl) {
    const c = document.createElement("span");
    c.className = "notiz";
    c.textContent = "Noch keine Zahl gezogen.";
    elZahlen.appendChild(c);
  }

  elSpieler.innerHTML = "";
  (spieler || []).forEach((s, i) => {
    const p = document.createElement("p");
    p.className = "sp" + (status === "spiel" && i === zug ? " dran" : "") +
      (s.verpasst ? " raus" : "");
    const n = document.createElement("span");
    n.textContent = s.name + (s.id === MYID ? " (du)" : "") +
      (s.gewonnen ? " · Bingo!" : s.verpasst ? " · daneben" : "");
    const b = document.createElement("b");
    b.textContent = s.anzahl + " Marken · " + s.linien + " Linien";
    p.append(n, b);
    elSpieler.appendChild(p);
  });

  elLog.innerHTML = "";
  (letzte || []).forEach((z) => {
    const d = document.createElement("div");
    d.textContent = z;
    elLog.appendChild(d);
  });

  const ich = (spieler || []).find((s) => s.id === MYID || (!ONLINE && s.id === (lokal && lokal.id)));
  const dran = status === "spiel" && (ONLINE ? spieler[zug] && spieler[zug].id === MYID : true);
  $("btnZiehen").disabled = !(status === "spiel" && dran);
  $("btnBingo").disabled = !(status === "spiel" && ich && !ich.verpasst);
  // Volle Reihe da? Dann leuchtet der Bingo-Knopf.
  $("btnBingo").classList.toggle("bereit", !!(ich && ich.linien > 0 && status === "spiel"));
  elZug.textContent = status === "spiel"
    ? (ONLINE ? (dran ? "Du ziehst als Nächstes" : spieler[zug].name + " zieht als Nächstes")
              : (ich && ich.linien > 0 ? "Reihe voll – Bingo drücken!" : "Du bist dran"))
    : "";
  elEnde.classList.toggle("versteckt", status !== "ende");
  elJubel.hidden = !(ich && ich.gewonnen);
  // Auto-Markieren gibt es nur in der lokalen Runde – online entscheidet der Server.
  $("autoFeld").classList.toggle("versteckt", ONLINE);
  return ich;
}

function zeichneLokal() {
  const markiert = lokal.karte.map((_, feld) => lokal.marken[feld]);
  zeichneAlles({
    status: lokal.status, runde: lokal.runde, gezogen: lokal.gezogen, rest: lokal.rest,
    spieler: [{
      id: lokal.id, name: lokal.id === (MYID || "ich") ? MYNAME : lokal.name,
      anzahl: lokal.anzahl, linien: lokal.linien, verpasst: lokal.verpasst,
      gewonnen: lokal.gewonnen, fehlgriff: lokal.fehlgriff
    }],
    note: lokal.note, letzte: lokal.letzte, zug: 0, sieger: lokal.sieger
  });
  zeichneKarte(lokal.karte, markiert);
}

function zeichneOnline() {
  const g = onlineGame;
  $("startLeiste").classList.add("versteckt");
  $("onlineLeiste").classList.remove("versteckt");
  if (!g) {
    elLage.textContent = "Keine Runde";
    elRunde.textContent = "—";
    elKarte.innerHTML = "";
    elKarte.classList.add("aus");
    elZahlen.innerHTML = "";
    elSpieler.innerHTML = "";
    elLog.innerHTML = "";
    elNotiz.textContent = "Eröffne eine Runde – Mitspieler treten im Raum bei.";
    elEnde.classList.add("versteckt");
    elJubel.hidden = true;
    $("btnZiehen").disabled = true;
    $("btnBingo").disabled = true;
    $("btnErstellen").classList.remove("versteckt");
    $("btnBereit").classList.add("versteckt");
    $("btnLos").classList.add("versteckt");
    zeigeKugel([]);
    elBalken.style.width = "0";
    elBeutel.textContent = "Beutel voll";
    return;
  }
  const ich = zeichneAlles(g);
  zeichneKarte(ich ? ich.karte : [], ich ? ich.karte.map((zahl) => (ich.markiert || []).includes(zahl)) : []);
  $("btnErstellen").classList.toggle("versteckt", true);
  $("btnBereit").classList.toggle("versteckt", g.status !== "invited");
  $("btnLos").classList.toggle("versteckt", g.status !== "invited");
  if (g.status === "invited") {
    $("btnBereit").textContent = ich && ich.ready ? "Nicht bereit" : "Bereit";
    $("btnLos").textContent = "Los (" + g.spieler.filter((s) => s.ready).length + "/" + g.spieler.length + " bereit)";
  }
}

function zeichne() {
  if (ONLINE) zeichneOnline();
  else if (lokal) zeichneLokal();
}

/* ---------------------------- Bedienung --------------------------- */
elKarte.addEventListener("click", (e) => {
  const z = e.target.closest(".zelle");
  if (!z || z.disabled) return;
  const zahl = Number(z.dataset.zahl);
  if (!zahl) return;
  if (ONLINE) schicke("markieren", { zahl });
  else lokalMarkieren(zahl);
});

$("btnZiehen").addEventListener("click", () => {
  if (ONLINE) schicke("ziehen");
  else { lokalZiehen(); zeichne(); }
});
$("btnBingo").addEventListener("click", () => {
  if (ONLINE) schicke("bingo");
  else { lokalBingo(); zeichne(); }
});
$("btnStart").addEventListener("click", () => { lokalNeueRunde(false); zeichne(); });
$("btnNochmal").addEventListener("click", () => {
  if (ONLINE) schicke("naechste");
  else { lokalNeueRunde(true); zeichne(); }
});
$("btnNeu").addEventListener("click", () => {
  if (ONLINE) schicke("reset");
  else { lokal = null; frischeZahl = 0; zeichne(); $("startLeiste").classList.remove("versteckt"); }
});
$("btnErstellen").addEventListener("click", () => schicke("create"));
$("btnBereit").addEventListener("click", () => schicke("ready"));
$("btnLos").addEventListener("click", () => schicke("start"));
$("auto").addEventListener("change", (e) => {
  autoMarkieren = e.target.checked;
  // Schon gezogene Zahlen gleich mit abhaken, damit es sofort wirkt.
  if (autoMarkieren && lokal && lokal.status === "spiel") {
    lokal.karte.forEach((zahl, feld) => {
      if (feld !== FREI && zahl && lokal.gezogen.includes(zahl)) lokal.marken[feld] = true;
    });
    frischeMarke = null;
    lokalAuffrischen();
    zeichne();
  }
});

if (ONLINE) {
  // Lebenszeichen: Der Raum beendet eine Partie nach 90 s ohne Meldung. Die
  // Connector-Seite allein reicht am Handy nicht – dort liegt sie im
  // Hintergrund und meldet sich nur als "nicht aktiv".
  WG.leben({ room: ROOM, id: MYID, name: MYNAME }).then(hole);
  setInterval(hole, 1500);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) hole(); });
} else {
  zeichneKarte([], []);
  elNotiz.textContent = "Starte eine Runde – die Karte wird gemischt.";
}
})();
</script>
</body>
</html>
