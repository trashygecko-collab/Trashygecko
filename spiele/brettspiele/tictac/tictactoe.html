<!DOCTYPE html>
<html lang="de" data-stil="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b241d">
<title>Tic Tac Toe</title>
<link rel="stylesheet" href="../../schrift.css">
<style>
/* ===========================================================================
   TIC TAC TOE – Neon-Brett, drei Spielwelten
   ---------------------------------------------------------------------------
   Schnittstelle 2.0.0 (siehe SPIELE-SCHNITTSTELLE.md). Das Spiel kennt keine
   Räume, keine Kennungen und kein /api/: Der Connector schiebt den Spielstand
   hinein (aktion("stand")) und hört auf die Absichten des Spiels
   (tictactoe:zug, tictactoe:neu). Die Stilwahl kommt als start({stil}) und
   wird nur hier dargestellt – jeder Spieler sieht seinen eigenen Stil.
   =========================================================================== */

/* ---------------------------------------------------------------- Farben */
:root,html[data-stil="normal"]{
  --bg-1:#1d4b3e; --bg-2:#0d2a22; --bg-3:#06170f;
  --panel:#0f2b23; --leiste:#081d17;
  --gold:#e8cd8e; --gold-hell:#f1dca8; --gold-2:#c9a95f;
  --text:#efe6d2; --hell:#f4e6c2; --muted:#a9c3b6;
  --rand:#d9bc7c; --rand-1:#d9bc7c66; --rand-3:#d9bc7c33;
  --buehne:#08120f; --hover:#184536; --knopf-text:#0b241d;
  --zelle-1:#16453a; --zelle-2:#0e2a21; --linie:#3a7561;
  --x:#d98a63; --o:#e8cd8e;
  --gewinn-zelle:#1d4a3a; --gewinn-linie:#e8cd8e;
  --schleier:#03100cd9;
  --rahmen-radius:14px; --zelle-radius:0px; --brett-luecke:0px;
}
html[data-stil="maedchen"]{
  --bg-1:#fff3f9; --bg-2:#ffd0e4; --bg-3:#f2a3ce;
  --panel:#fff6fa; --leiste:#ffe3ef;
  --gold:#b0286a; --gold-hell:#8f2450; --gold-2:#7a1c46;
  --text:#3a0f24; --hell:#4a1330; --muted:#8f2450;
  --rand:#ef7aa8; --rand-1:#ef7aa8aa; --rand-3:#ef7aa855;
  --buehne:#fff0f7; --hover:#ffe9f3; --knopf-text:#3a0f24;
  --zelle-1:#ffffff; --zelle-2:#fff2f8; --linie:#f3a7c6;
  --x:#c33a72; --o:#6f2bb5;
  --gewinn-zelle:#ffdfee; --gewinn-linie:#d1467f;
  --schleier:#7a1843aa;
  --rahmen-radius:22px; --zelle-radius:14px; --brett-luecke:7px;
}
html[data-stil="buben"]{
  --bg-1:#1b0a0e; --bg-2:#0a0d11; --bg-3:#03060a;
  --panel:#0d1014; --leiste:#080b0e;
  --gold:#e0242f; --gold-hell:#ff8a90; --gold-2:#8d1018;
  --text:#d8dde3; --hell:#eef1f4; --muted:#8f9aa5;
  --rand:#7d1017; --rand-1:#7d1017aa; --rand-3:#7d101755;
  --buehne:#05080b; --hover:#22272e; --knopf-text:#0a0d10;
  --zelle-1:#191d23; --zelle-2:#12161a; --linie:#2b3540;
  --x:#ff3b45; --o:#e6ddcc;
  --gewinn-zelle:#2b1013; --gewinn-linie:#e0242f;
  --schleier:#000000cc;
  --rahmen-radius:4px; --zelle-radius:2px; --brett-luecke:4px;
}

*{box-sizing:border-box}

html,body{margin:0;height:100%}

body{
  position:relative;
  height:100dvh;
  overflow:hidden;
  color:var(--text);
  font-family:var(--tg-schrift);
  background:radial-gradient(circle 900px at 50% -10%,var(--bg-1) 0%,var(--bg-2) 52%,var(--bg-3) 100%) fixed,var(--bg-3);
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .2s ease,color .2s ease;
}

/* Das Papier unter dem Brett: Filz, Herzen oder Kratzer. */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(45deg,#ffffff05 0 2px,#00000000 2px 6px);
}
html[data-stil="maedchen"] body::before{
  background-image:radial-gradient(#ffffff9c 2px,#00000000 2.4px);
  background-size:26px 26px;
  opacity:.55;
}
html[data-stil="maedchen"] body::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  box-shadow:inset 0 0 120px #ffb6d8aa;
}
html[data-stil="buben"] body::before{
  background:
    repeating-linear-gradient(112deg,#ffffff09 0 1px,#00000000 1px 11px),
    repeating-linear-gradient(-18deg,#00000060 0 2px,#00000000 2px 9px);
}
html[data-stil="buben"] body::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  box-shadow:inset 0 0 160px #000000,inset 0 0 60px #3d060b55;
}

.seite{
  position:relative;z-index:1;
  height:100dvh;
  display:grid;
  /* Eine Spalte, die nicht über die Seite hinauswachsen kann: Ohne diese Zeile
     bestimmte das größte Kind (Brett samt Rahmen) die Breite und schob bei
     320 px die rechte Spalte aus dem Bild. */
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:4px;
  padding:7px 10px 8px;
}

/* ---------------------------------------------------------------- Kopfzeile */
.kopf{display:flex;align-items:center;gap:10px;min-height:30px}
.kopf-titel{display:flex;flex-direction:column;gap:1px;min-width:0}
.kopf .marke{
  font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kopf h1{
  margin:0;font-size:clamp(14px,2.2vh,19px);line-height:1.1;font-weight:700;
  letter-spacing:.2em;color:var(--gold-hell);white-space:nowrap;
}
html[data-stil="maedchen"] .kopf h1{letter-spacing:.14em}
html[data-stil="maedchen"] .kopf h1::after{content:" ♥";color:var(--rand);font-size:.8em}
html[data-stil="buben"] .kopf h1{letter-spacing:.24em;text-shadow:0 0 14px #e0242f66}
.kopf-ende{margin-left:auto;display:flex;align-items:center;gap:6px}

.mini{
  font:inherit;font-size:11px;line-height:1.35;padding:5px 9px;cursor:pointer;
  color:var(--gold);background:var(--leiste);
  border:1px solid var(--rand-1);border-radius:6px;
  min-height:28px;display:inline-flex;align-items:center;gap:6px;
}
.mini:hover{background:var(--hover);color:var(--hell);border-color:var(--rand)}
.mini:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mini[aria-pressed="true"]{background:var(--gold);color:var(--knopf-text);border-color:var(--gold)}
.vb-symbol{font-size:12px;line-height:1}

/* ---------------------------------------------------------------- Bühne */
.buehne{
  position:relative;min-height:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

/* ---------------------------------------------------------------- Spielbild */
.spiel{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;width:100%;height:100%;min-height:0;
}

.status{
  margin:0;
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:24px;max-width:100%;padding:0 4px;
  font-size:clamp(12.5px,2vh,17px);letter-spacing:.04em;
  color:var(--text);text-align:center;
}
.status .marke-zeichen{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:1.5em;font-size:1.15em;font-weight:700;line-height:1;
}
.status .marke-zeichen svg{display:block;width:1.15em;height:1.15em}
.status.ist-x .marke-zeichen{color:var(--x);text-shadow:0 0 12px var(--x)}
.status.ist-o .marke-zeichen{color:var(--o);text-shadow:0 0 12px var(--o)}
.status.gewonnen{color:var(--gold-hell);font-weight:700;letter-spacing:.1em}
html[data-stil="maedchen"] .status.gewonnen{color:var(--gold)}
html[data-stil="buben"] .status.gewonnen{color:var(--x);text-shadow:0 0 16px #e0242f88}

.brettrahmen{
  position:relative;flex:0 0 auto;
  padding:8px;border-radius:var(--rahmen-radius);
  background:linear-gradient(160deg,var(--zelle-1),var(--zelle-2));
  border:1px solid var(--rand-1);
  box-shadow:0 10px 26px #00000066,inset 0 0 0 1px #ffffff0d;
}
html[data-stil="maedchen"] .brettrahmen{
  padding:10px;border:2px solid var(--rand);background:linear-gradient(160deg,#fff8fc,#ffe6f2);
  box-shadow:0 10px 24px #b52a6333,inset 0 0 0 4px #ffffff;
}
html[data-stil="buben"] .brettrahmen{
  padding:7px;border:2px solid var(--rand);background:#0a0d10;
  box-shadow:0 0 0 1px #000000,0 12px 30px #000000cc,0 0 26px #e0242f22;
}
/* Eckzeichen: Kasino-Ecken, Herzen, Blutspritzer. */
.brettrahmen::before,.brettrahmen::after{
  position:absolute;font-size:12px;line-height:1;pointer-events:none;
}
html[data-stil="normal"] .brettrahmen::before{
  content:"";left:8px;top:8px;width:10px;height:10px;
  border-left:2px solid var(--gold);border-top:2px solid var(--gold);
  border-radius:3px 0 0 0;opacity:.8;
}
html[data-stil="normal"] .brettrahmen::after{
  content:"";right:8px;bottom:8px;width:10px;height:10px;
  border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);
  border-radius:0 0 3px 0;opacity:.8;
}
html[data-stil="maedchen"] .brettrahmen::before{content:"♥";left:-9px;top:-11px;color:var(--rand);font-size:22px;text-shadow:0 2px 0 #ffffff}
html[data-stil="maedchen"] .brettrahmen::after{content:"♥";right:-9px;bottom:-11px;color:#b06bff;font-size:22px;text-shadow:0 2px 0 #ffffff}
html[data-stil="buben"] .brettrahmen::before{
  content:"";left:6px;right:6px;top:2px;height:2px;background:var(--rand);opacity:.7;
}
html[data-stil="buben"] .brettrahmen::after{
  content:"";left:14px;bottom:-9px;width:7px;height:9px;border-radius:0 0 60% 60%;
  background:#8d1018;box-shadow:44px -2px 0 -1px #6d0c13,96px 2px 0 -2px #5a0a10,180px -1px 0 -2px #4a080d;
}

.brett{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:repeat(3,minmax(0,1fr));
  gap:var(--brett-luecke);
  /* Keine eigene Fläche: Die Fugen sind Zellränder. contain:paint schneidet
     alles am Brettrand ab – ohne diese Zeile malte Chromium die Fugen ein
     paar Pixel in das Polster des Rahmens hinein. */
  background:transparent;
  contain:paint;
}

.zelle{
  position:relative;display:flex;align-items:center;justify-content:center;
  min-width:0;min-height:0;padding:0;margin:0;
  border:0;border-radius:var(--zelle-radius);
  background:linear-gradient(150deg,var(--zelle-1),var(--zelle-2));
  color:var(--text);cursor:pointer;touch-action:manipulation;
  transition:background .12s ease,box-shadow .12s ease;
}
html[data-stil="normal"] .zelle{
  border-right:1px solid var(--linie);border-bottom:1px solid var(--linie);
}
html[data-stil="normal"] .zelle:nth-child(3n){border-right:0}
html[data-stil="normal"] .zelle:nth-last-child(-n+3){border-bottom:0}
html[data-stil="maedchen"] .zelle{border:2px solid var(--linie);box-shadow:inset 0 0 0 2px #ffffff}
.zelle:hover:not(:disabled){background:var(--hover)}
.zelle:active:not(:disabled){filter:brightness(1.12)}
.zelle:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}
.zelle:disabled{cursor:default}

/* Spielsteine: je Stil ein eigenes, gezeichnetes Paar (SVG, kein Schriftzeichen).
   Immer 62 % der Zelle – gleiche Größe und Mitte in allen drei Stilen. */
.zeichen{display:block;width:62%;height:62%}
.zeichen svg{display:block;width:100%;height:100%}
.zelle.x .zeichen{color:var(--x)}
.zelle.o .zeichen{color:var(--o)}
.zelle.x .zeichen svg{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--x) 62%,transparent)) drop-shadow(0 2px 1px #00000055)}
.zelle.o .zeichen svg{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--o) 62%,transparent)) drop-shadow(0 2px 1px #00000055)}
html[data-stil="maedchen"] .zelle.x .zeichen svg,html[data-stil="maedchen"] .zelle.o .zeichen svg{
  filter:drop-shadow(0 2px 2px #b52a6333);
}
html[data-stil="buben"] .zelle.x .zeichen svg{filter:drop-shadow(0 0 9px #e0242f99) drop-shadow(0 2px 0 #4a080d)}
html[data-stil="buben"] .zelle.o .zeichen svg{filter:drop-shadow(0 0 7px #cfd6c966) drop-shadow(0 2px 0 #000000)}

.zelle.gewinn{background:var(--gewinn-zelle);box-shadow:inset 0 0 22px color-mix(in srgb,var(--gewinn-linie) 40%,transparent)}
html[data-stil="buben"] .zelle.gewinn{box-shadow:inset 0 0 22px #e0242f55,inset 0 -8px 0 #4a080d}

/* Ein Zug ist unterwegs: Das Feld atmet, bis der Server bestätigt. */
.zelle.wartet{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--x) 60%,transparent);animation:warten 1s ease-in-out infinite}
@keyframes warten{0%,100%{opacity:1}50%{opacity:.55}}

.linie{
  position:absolute;display:none;height:6px;border-radius:6px;z-index:3;
  transform-origin:left center;pointer-events:none;
  background:var(--gewinn-linie);
  box-shadow:0 0 10px var(--gewinn-linie),0 0 26px color-mix(in srgb,var(--gewinn-linie) 60%,transparent);
}
.linie.an{display:block}
html[data-stil="maedchen"] .linie{height:7px;background:linear-gradient(90deg,#ef7aa8,#b06bff)}
html[data-stil="buben"] .linie{height:5px;border-radius:2px;background:#e0242f;box-shadow:0 0 12px #e0242fcc,0 6px 10px #4a080d}

.hinweis{
  margin:0;min-height:1.2em;max-width:100%;padding:0 6px;
  font-size:clamp(10.5px,1.6vh,12.5px);color:var(--muted);text-align:center;
}

/* ---------------------------------------------------------------- Fußleiste */
.leiste{display:flex;align-items:center;justify-content:center;gap:8px;min-height:36px}
.leiste .arcade-knopf{font-size:11.5px;letter-spacing:.06em;padding:7px 13px;min-height:34px}
.leiste .arcade-knopf[disabled]{opacity:.45;cursor:default}

/* ---------------------------------------------------------------- Karten */
.blatt-wrap{
  position:absolute;inset:0;z-index:6;display:grid;place-items:center;padding:10px;
  background:var(--schleier);backdrop-filter:blur(2px);
}
html[data-stil="maedchen"] .blatt-wrap{background:#7a1843a8;backdrop-filter:blur(1.5px)}
.blatt-wrap .arcade-blatt{max-width:min(400px,96%)}
.blatt-wrap .arcade-blatt__titel{letter-spacing:.16em}
.blatt-wrap .arcade-blatt__knoepfe{margin-top:4px}
.blatt-wrap .arcade-knopf{font-size:12.5px;padding:9px 16px}

/* ---------------------------------------------------------------- Startbildschirm */
.buehne .arcade-start{justify-content:center}
.arcade-start__kopf .arcade-start__titel{
  letter-spacing:.14em;
  text-shadow:0 2px 0 #00000066,0 0 26px color-mix(in srgb,var(--gold) 40%,transparent);
}
html[data-stil="maedchen"] .arcade-start{
  background:radial-gradient(120% 90% at 50% -20%,#fff8fc 0%,#ffdcec 55%,#f9b6d6 100%);
}
html[data-stil="maedchen"] .arcade-start__titel{color:var(--gold);text-shadow:0 2px 0 #ffffff,0 0 22px #ff9ec466}
html[data-stil="maedchen"] .arcade-start__marke{color:#a83a65}
html[data-stil="maedchen"] .arcade-start__unterzeile{color:#8f2450}
html[data-stil="buben"] .arcade-start{
  background:radial-gradient(120% 90% at 50% -20%,#1b0a0e 0%,#0a0d11 55%,#03060a 100%);
}
html[data-stil="buben"] .arcade-start__titel{color:#ff8a90;text-shadow:0 2px 0 #000000,0 0 26px #e0242f66}
html[data-stil="buben"] .arcade-start::before{
  background:repeating-linear-gradient(112deg,#ffffff0a 0 1px,#00000000 1px 13px);opacity:.8;
}

.start-warten{
  margin:0;padding:10px 12px;border-radius:9px;text-align:center;
  border:1px dashed var(--rand-1);background:var(--panel);color:var(--text);
  font-size:clamp(12px,1.8vh,14px);line-height:1.45;
}
html[data-stil="maedchen"] .start-warten{background:#fff6fa;border-color:var(--rand)}
.start-warten b{color:var(--gold-hell)}

/* ---------------------------------------------------------------- Schmale Geräte */
@media (max-width:560px){
  .seite{padding:6px 8px 6px;gap:3px}
  .kopf .marke{display:none}
  .kopf h1{font-size:15px;letter-spacing:.16em}
  .mini{font-size:10.5px;padding:4px 8px}
  .status{font-size:14px;min-height:22px}
  .leiste .arcade-knopf{font-size:11px;padding:6px 11px}
}
/* Querformat mit wenig Höhe: Kopf und Fuß flach, Platz für das Brett. */
@media (orientation:landscape) and (max-height:520px){
  .seite{padding:3px 8px 4px;gap:1px}
  .kopf{min-height:24px}
  .kopf .marke{display:none}
  .kopf h1{font-size:13px}
  .mini{min-height:24px;padding:3px 7px;font-size:10px}
  .status{min-height:18px;font-size:12px}
  .hinweis{display:none}
  .leiste{min-height:28px}
  .leiste .arcade-knopf{min-height:26px;padding:4px 10px;font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
<link rel="stylesheet" href="../../spiel-start.css">
<style>
/* Feinschliff am gemeinsamen Gerüst: nur Farben und Maße dieses Spiels.
   Steht absichtlich nach spiel-start.css, damit die Regeln hier gewinnen. */

/* Mädchen: heller Knopf mit dunkler Schrift, Hauptknopf kräftig mit weißer
   Schrift (vorher dunkle Schrift auf dunklem Pflaumenverlauf: 1,9 : 1). */
html[data-stil="maedchen"] .arcade-knopf{
  background:#fff6fa;color:#8f2450;border-color:#ef7aa8;
  box-shadow:0 3px 0 #d895b4aa,inset 0 1px 0 #ffffff;
}
html[data-stil="maedchen"] .arcade-knopf:hover{background:#ffe9f3}
html[data-stil="maedchen"] .arcade-knopf--haupt{
  background:linear-gradient(180deg,#d94d8c,#b0286a 55%,#8f2450);
  color:#fff7fb;border-color:#e0568f;
  box-shadow:0 4px 0 #7a1843aa,0 0 18px #ef7aa855,inset 0 1px 0 #ffffff66;
}
html[data-stil="maedchen"] .arcade-knopf--haupt:hover{filter:brightness(1.06)}
html[data-stil="maedchen"] .start-warten{background:#fff6fa;border-color:#ef7aa8}

.start-warten{grid-column:1/-1}

/* Querformat mit wenig Höhe: eigener, enger Aufbau. Das gemeinsame Gerüst
   verteilt dort drei Spalten; hier steht alles untereinander, damit nichts
   überlappt. */
@media (orientation:landscape) and (max-height:560px){
  .buehne .arcade-start{
    display:grid;grid-template-columns:minmax(0,1fr);
    grid-template-areas:"kopf" "text" "inhalt" "knoepfe";
    align-content:center;gap:3px;padding:6px 14px;
  }
  .buehne .arcade-start__kopf{grid-area:kopf;text-align:center}
  .buehne .arcade-start__marke{margin:0 0 2px}
  .buehne .arcade-start__titel{font-size:clamp(24px,7.4vh,34px)}
  .buehne .arcade-start__unterzeile{margin-top:1px;font-size:11px}
  /* Der gemeinsame Querformat-Block setzt grid-area:text – hier steht der Text
     aber im Inhalts-Raster, nicht im Start-Raster. Ohne diese Zeile landet er
     in einer eigenen Spalte und quetscht Steuerung und Infos zusammen. */
  .buehne .arcade-start__inhalt .arcade-start__text{
    grid-area:auto;grid-column:1/-1;margin:0;font-size:11px;line-height:1.35;text-align:center;
  }
  .buehne .arcade-start__inhalt{grid-area:inhalt;grid-template-columns:minmax(0,1fr);gap:4px}
  .buehne .arcade-start__abschnitt{margin:0 0 2px}
  .buehne .arcade-start__steuerung li{font-size:10.5px;padding:0;gap:5px}
  .buehne .arcade-start__steuerung .taste{min-width:22px;height:19px;font-size:9.5px}
  .buehne .arcade-start__knoepfe{grid-area:knoepfe;margin-top:1px}
  .buehne .arcade-knopf--haupt{padding:8px 20px;font-size:13px}
}

/* ---------------------------------------------------------------- Startwahl */
/* Eine Spalte: Modus, dann (nur beim Bot) die Stufe, dann der Stil, dann die
   Zusammenfassung. Die Reihen sind gleich breit, damit die Wahl ruhig wirkt. */
.start-wahl{
  display:grid;grid-template-columns:minmax(0,1fr);gap:7px;
  width:100%;max-width:560px;margin:0 auto;align-items:start;
}
.wahl-block{min-width:0}
.wahl-reihe{display:flex;flex-wrap:wrap;gap:6px}
.wahl{
  flex:1 1 0;min-width:0;min-height:42px;padding:6px 8px;cursor:pointer;font:inherit;
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;
  color:var(--text);background:var(--panel);
  border:1px solid var(--rand-1);border-radius:9px;
  box-shadow:0 2px 0 #00000055,inset 0 1px 0 #ffffff0f;
  transition:background .12s ease,border-color .12s ease,transform .08s ease;
}
.wahl:hover{background:var(--hover);border-color:var(--rand)}

              <span class="wahl-text">abwechselnd, ein Bildschirm</span>
            </button>
            <button type="button" class="wahl" data-modus="bot" aria-pressed="false">
              <span class="wahl-titel">Gegen den Bot</span>

</div>

<script>
/* ===========================================================================
   TIC TAC TOE – Spielmechanik und Schnittstelle 2.0.0
   ---------------------------------------------------------------------------
   Ein globaler Namensraum: window.TicTacToe.

   START
     start()                      neue Partie im zuletzt gewählten Modus
     start({stil})                nur die Welt einstellen (Connector beim Öffnen)
     start({stil, online:{…}})    Partie im Raum (Connector); mark/gegner/marke
                                  dürfen fehlen – dann „Warte auf Mitspieler“

   MODI (Startbildschirm)
     lokal   zwei Spieler abwechselnd an diesem Gerät
     bot     Mensch (Kreuz) gegen den Bot (Kreis), drei Stufen
   Online beginnt nur der Connector mit start({online:{…}}); auf dem
   Startbildschirm gibt es dafür keine Wahl.
   Bot und Schwierigkeit liegen hier im Spiel – der Connector weiß nichts davon.

   AKTIONEN (aktion(name, daten))
     setzen {feld:0…8}   eigenes Zeichen setzen; im Online-Spiel geht nur die
                         Absicht an den Connector (kein lokales Setzen); gegen
                         den Bot zieht er danach von selbst
     neu                 neue Runde (online: fragt beim Connector an)
     start, pause, weiter
     stand {brett, amZug, status, sieger, mark?, gegner?, marke?, hinweis?}
                         Spielstand vom Connector übernehmen (nur online)

   EREIGNISSE (CustomEvent auf window)
     tictactoe:bereit {version}
     tictactoe:ende {grund, sieger, zuege, punkte, level, levelAnzahl, tick}
     tictactoe:pausiert {tick} · tictactoe:weiter {tick}
     tictactoe:zug {feld}        Absicht eines Spielers (nur online)
     tictactoe:neu               Wunsch nach einer neuen Runde (nur online)

   SPEICHER
     ticTacToeBilanz  {x,o,remis} – nur Partien am Gerät
     ticTacToeStil    Stilwahl beim direkten Start (normal|maedchen|buben)

   Das Spiel ruft selbst kein /api/ auf, öffnet keine WebSockets und liest
   weder Raum noch Kennung aus der Adresse. Räume, Einladungen und die
   Synchronisierung gehören dem Connector.
   =========================================================================== */
(function () {

    for (var i = 0; i < 9; i++) {

        z.className = "zelle";

      }
    },
    buben: {
      X: {

        bild: '<path d="M50 13 72.3 82.8 13.9 40.3 86.1 40.3 27.7 82.8Z" fill="none" stroke="#ff2f3b" stroke-width="6.4" stroke-linejoin="round" stroke-linecap="round"/>'

          '<path d="M50 10C30.7 10 18 23.4 18 40c0 10.4 5 19 13 24h38c8-5 13-13.6 13-24 0-16.6-12.7-30-32-30z" fill="#e6ddcc" stroke="#7d1017" stroke-width="3"/>' +

  };

  function symbolPaar() { return SYMBOLE[S.stil] || SYMBOLE.normal; }

  function symbolName(marke) {
    var s = symbolPaar()[marke === "O" ? "O" : "X"];
    return s.name;
  }

  function symbolBild(marke) {
    var s = symbolPaar()[marke === "O" ? "O" : "X"];
    return '<svg class="sym ' + s.klasse + '" viewBox="0 0 100 100" aria-hidden="true" focusable="false">' +
      s.bild + "</svg>";
  }

  function zeichne() {
    if (!zellen.length) return;
    var reihe = siegerReihe();
    var offen = S.laeuft && !S.pausiert && S.status === "active" &&
      (!S.online || S.amZug === S.mark);
    for (var i = 0; i < 9; i++) {
      var marke = S.brett[i];
      var z = zellen[i];
      z.className = "zelle" + (marke ? " " + marke.toLowerCase() : "");
      if (reihe && reihe.indexOf(i) >= 0) z.classList.add("gewinn");
      if (S.gesendet === i) z.classList.add("wartet");
      z.innerHTML = marke
        ? '<span class="zeichen" aria-hidden="true">' + symbolBild(marke) + "</span>"
        : "";
      z.setAttribute("aria-label", marke
        ? "Feld " + (i + 1) + ": " + symbolName(marke)
        : "Feld " + (i + 1) + ", frei");
      z.disabled = Boolean(marke) || !offen;
    }
    zeichneStatus();
    zeichneLinie();
    passeBrett();
    aktualisiereKnoepfe();
  }

  function zeichneStatus() {
    var zeichen = symbolBild("X");
    var text = "";
    var klasse = "status ist-x";
    var wer = symbolName;

    if (S.online) {
      if (S.status === "warte") {
        zeichen = "…"; klasse = "status"; text = "Warte auf Mitspieler …";
      } else if (S.status === "invited") {
        zeichen = ""; klasse = "status"; text = "Einladung an " + (S.gegner || "deinen Mitspieler") + " läuft …";
      } else if (S.status === "declined") {
        zeichen = ""; klasse = "status"; text = "Einladung abgelehnt.";
      } else if (S.status === "finished") {
        zeichen = "";
        if (S.sieger === "draw") { klasse = "status"; text = "Unentschieden – keiner gewinnt."; }
        else if (S.mark && S.sieger === S.mark) { klasse = "status gewonnen"; text = "Du gewinnst!"; }
        else { klasse = "status"; text = (S.gegner || "Der Gegner") + " gewinnt."; }
      } else if (!S.mark) {
        zeichen = "…"; klasse = "status"; text = "Warte auf Mitspieler …";
      } else if (S.amZug === S.mark) {
        zeichen = symbolBild(S.mark);
        klasse = "status " + (S.mark === "X" ? "ist-x" : "ist-o");
        text = "Du bist dran.";
      } else {
        zeichen = symbolBild(S.amZug);
        klasse = "status " + (S.amZug === "X" ? "ist-x" : "ist-o");
        text = (S.gegner || "Der Gegner") + " ist dran.";
      }
    } else if (S.status === "finished") {
      zeichen = "";
      klasse = "status gewonnen";
      if (S.sieger === "draw") text = "Unentschieden – keiner gewinnt.";
      else if (S.modus === "bot") text = S.sieger === "X" ? "Du gewinnst!" : "Der Bot gewinnt.";
      else text = wer(S.sieger) + " gewinnt!";
    } else if (S.modus === "bot") {
      if (S.amZug === "X") {
        zeichen = symbolBild("X"); klasse = "status ist-x"; text = "Du bist dran.";
      } else {
        zeichen = symbolBild("O"); klasse = "status ist-o"; text = "Der Bot denkt …";
      }
    } else {
      zeichen = symbolBild(S.amZug);
      klasse = "status " + (S.amZug === "X" ? "ist-x" : "ist-o");
      text = wer(S.amZug) + " ist dran.";
    }

    el.status.className = klasse;
    el.statusZeichen.innerHTML = zeichen;
    el.statusZeichen.style.display = zeichen ? "" : "none";
    el.statusText.textContent = text;
    el.hinweis.textContent = S.hinweis || "";
  }

  function aktualisiereKnoepfe() {
    var imSpiel = !S.startbildschirm;
    el.knopfPause.textContent = S.pausiert ? "Weiter" : "Pause";
    el.knopfPause.disabled = !S.laeuft;
    el.knopfNeu.disabled = !imSpiel && !S.laeuft;
    el.knopfStart.disabled = S.startbildschirm;
  }

  function zeigeBildschirm(art) {
    var start = art === "start";
    zeige(el.start, start);
    zeige(el.spiel, !start);
    zeige(el.leiste, !start);
    if (!start) {
      fertig.breit = 0;
      requestAnimationFrame(passeBrett);
    }
    aktualisiereKnoepfe();
  }

  function zeigeStart(warten) {
    S.startbildschirm = true;
    botStoppen();
    zeigeBildschirm("start");
    var wahl = !warten;
    zeige(el.startWarten, Boolean(warten));
    zeige(el.modusBlock, wahl);
    zeige(el.stufeBlock, wahl && S.modus === "bot");
    zeige(el.stilBlock, wahl && !S.stilVorgabe);
    zeige(el.knopfStarten, wahl);
    wahlZeichnen();
  }

  /* -------------------------------------------------------------- Bilanz */
  function bilanzLesen() {
    var roh = null;
    try { roh = JSON.parse(localStorage.getItem(BILANZ_SCHLUESSEL) || "{}"); } catch (e) { roh = {}; }
    if (!istObjekt(roh)) roh = {};
    return {
      x: Number(roh.x) || 0,
      o: Number(roh.o) || 0,
      remis: Number(roh.remis) || 0
    };
  }

  function bilanzSchreiben(b) {
    try { localStorage.setItem(BILANZ_SCHLUESSEL, JSON.stringify(b)); } catch (e) { /* egal */ }
  }

  function bilanzBuchen() {
    if (S.online) return;
    var b = bilanzLesen();
    if (S.sieger === "X") b.x++;
    else if (S.sieger === "O") b.o++;
    else if (S.sieger === "draw") b.remis++;
    bilanzSchreiben(b);
  }

  /* -------------------------------------------------------------- Bot
     Der Bot spielt Kreis (BOT_MARK) und sieht nur das Brett. Drei Stufen:
     leicht rät meist, mittel nimmt Sieg und Block und mag die Mitte, schwer
     rechnet Minimax und verliert nie. Er zieht durch dieselbe Prüfung wie ein
     Mensch (zugMachen) und darf nichts, was ein Mensch nicht darf. */
  function reiheImBrett(brett, marke) {
    for (var i = 0; i < GEWINNREIHEN.length; i++) {
      var r = GEWINNREIHEN[i];
      if (brett[r[0]] === marke && brett[r[1]] === marke && brett[r[2]] === marke) return r;
    }
    return null;
  }

  function botFreieFelder(brett) {
    var frei = [];
    for (var i = 0; i < 9; i++) if (!brett[i]) frei.push(i);
    return frei;
  }

  function botZufall(liste) {
    return liste[Math.floor(Math.random() * liste.length)];
  }

  function botGewinnfeld(brett, marke) {
    for (var i = 0; i < 9; i++) {
      if (brett[i]) continue;
      brett[i] = marke;
      var trifft = !!reiheImBrett(brett, marke);
      brett[i] = "";
      if (trifft) return i;
    }
    return -1;
  }

  function botWert(brett, marke, gegner, tiefe, amZug) {
    if (reiheImBrett(brett, marke)) return 10 - tiefe;
    if (reiheImBrett(brett, gegner)) return tiefe - 10;
    if (botFreieFelder(brett).length === 0) return 0;
    var wer = amZug ? marke : gegner;
    var best = amZug ? -99 : 99;
    for (var i = 0; i < 9; i++) {
      if (brett[i]) continue;
      brett[i] = wer;
      var w = botWert(brett, marke, gegner, tiefe + 1, !amZug);
      brett[i] = "";
      if (amZug ? w > best : w < best) best = w;
    }
    return best;
  }

  function botFeld(stufe, brett, marke) {
    var frei = botFreieFelder(brett);
    if (!frei.length) return -1;
    var gegner = marke === "X" ? "O" : "X";
    var stufeWert = STUFEN.indexOf(stufe) >= 0 ? stufe : "mittel";

    if (stufeWert === "leicht") {
      /* Meist irgendwohin; liegt ein Sieg direkt vor der Nase, greift er in
         drei von vier Fällen zu. Blocken kennt diese Stufe nicht. */
      var sofort = botGewinnfeld(brett, marke);
      if (sofort >= 0 && Math.random() < 0.75) return sofort;
      return botZufall(frei);
    }

    var sieg = botGewinnfeld(brett, marke);
    if (sieg >= 0) return sieg;
    var block = botGewinnfeld(brett, gegner);
    if (block >= 0) return block;

    if (stufeWert === "mittel") {
      if (!brett[4]) return 4;
      var ecken = [];
      [0, 2, 6, 8].forEach(function (i) { if (!brett[i]) ecken.push(i); });
      if (ecken.length) return botZufall(ecken);
      return botZufall(frei);
    }

    /* Schwer: vollständiges Minimax; gleich gute Züge werden gemischt, damit
       nicht jede Partie gleich aussieht. Schlechter wird dadurch keiner. */
    var beste = [], besterWert = -99;
    for (var k = 0; k < frei.length; k++) {
      var f = frei[k];
      brett[f] = marke;
      var wert = botWert(brett, marke, gegner, 1, false);
      brett[f] = "";
      if (wert > besterWert) { besterWert = wert; beste = [f]; }
      else if (wert === besterWert) beste.push(f);
    }
    return beste.length ? botZufall(beste) : frei[0];
  }

  function botStoppen() {
    if (botTimer) {
      clearTimeout(botTimer);
      botTimer = null;
    }
  }

  function botDran() {
    return S.modus === "bot" && !S.online && S.status === "active" &&
      S.laeuft && !S.pausiert && !S.startbildschirm && S.amZug === BOT_MARK;
  }

  function botZugPlanen() {
    botStoppen();
    if (!botDran()) return;
    S.hinweis = "Der Bot denkt …";
    zeichneStatus();
    botTimer = setTimeout(botZugAusfuehren, BOT_DENKZEIT);
  }

  function botZugAusfuehren() {
    botTimer = null;
    if (!botDran()) return;
    var feld = botFeld(S.stufe, S.brett.slice(), BOT_MARK);
    if (feld < 0) return;
    S.hinweis = "";
    zugMachen(feld);
  }

  /* -------------------------------------------------------------- Karten */
  function blattZeigen(art) {
    var pause = art === "pause";
    var bot = !S.online && S.modus === "bot";
    var sieg = !pause && S.sieger !== "draw" && (bot ? S.sieger === "X" : (!S.online || S.sieger === S.mark));
    if (pause) {
      el.blattTitel.textContent = "Pause";
      el.blattText.textContent = S.online
        ? "Das Brett steht still. Dein Mitspieler kann inzwischen ziehen – beim Weiter geht es mit dem neuesten Stand."
        : "Das Brett steht still. Weiter mit dem Knopf oder mit P.";
      el.blattHaupt.textContent = "Weiterspielen";
      el.blattZweit.textContent = "Zum Start";
    } else {
      el.blattTitel.textContent = S.sieger === "draw" ? "Unentschieden" : sieg ? "Sieg" : "Niederlage";
      el.blattText.textContent = S.sieger === "draw"
        ? "Alle neun Felder sind voll – diese Runde gehört niemandem."
        : S.online
          ? (sieg ? "Drei in einer Reihe – die Runde ist dein." : (S.gegner || "Der Gegner") + " hat drei in einer Reihe.")
          : bot
            ? (sieg ? "Drei in einer Reihe – die Runde ist dein." : "Der Bot hat drei in einer Reihe.")
            : symbolName(S.sieger) + " hat drei in einer Reihe.";
      el.blattHaupt.textContent = "Neue Runde";
      el.blattZweit.textContent = "Zum Start";
    }
    var werte = [];
    if (!pause) {
      werte.push({ wert: S.sieger === "draw" ? "–" : (S.sieger === "X" ? (bot ? "Du" : "Kreuz") : (bot ? "Bot" : "Kreis")), was: "Sieger" });
      werte.push({ wert: String(S.zuege), was: "Züge" });
    }
    el.blattWerte.innerHTML = "";
    werte.forEach(function (w) {
      var li = document.createElement("li");
      var a = document.createElement("span");
      a.className = "wert";
      a.textContent = w.wert;
      var b = document.createElement("span");
      b.className = "was";
      b.textContent = w.was;
      li.append(a, b);
      el.blattWerte.appendChild(li);
    });
    el.blattWerte.style.display = werte.length ? "" : "none";
    S.blatt = pause ? "pause" : "ende";
    zeige(el.blattWrap, true);
    try { el.blattHaupt.focus({ preventScroll: true }); } catch (e) { }
  }

  function blattSchliessen() {
    S.blatt = "";
    zeige(el.blattWrap, false);
  }

  /* -------------------------------------------------------------- Partie */
  function leeresBrett() {
    return ["", "", "", "", "", "", "", "", ""];
  }

  function starteLokal() {
    botStoppen();
    S.online = false;
    S.mark = "";
    S.gegner = "";
    S.marke = "";
    S.brett = leeresBrett();
    S.amZug = "X";
    S.status = "active";
    S.sieger = "";
    S.zuege = 0;
    S.tick = 0;
    S.gesendet = -1;
    S.endeGemeldet = false;
    S.pausiert = false;
    S.laeuft = true;
    S.startbildschirm = false;
    S.hinweis = S.modus === "bot" ? "Du bist Kreuz und beginnst." : "Kreuz beginnt.";
    blattSchliessen();
    zeigeBildschirm("spiel");
    zeichne();
  }

  function starteOnline(mark, gegner, marke) {
    botStoppen();
    S.online = true;
    S.mark = mark === "X" || mark === "O" ? mark : "";
    S.gegner = typeof gegner === "string" ? gegner.slice(0, 24) : "";
    S.marke = typeof marke === "string" ? marke : "";
    S.brett = leeresBrett();
    S.amZug = "X";
    S.sieger = "";
    S.zuege = 0;
    S.tick = 0;
    S.gesendet = -1;
    S.endeGemeldet = false;
    S.pausiert = false;
    S.laeuft = false;
    S.hinweis = "";
    blattSchliessen();
    if (S.mark) {
      S.status = "active";
      S.laeuft = true;
      S.startbildschirm = false;
      zeigeBildschirm("spiel");
      zeichne();
    } else {
      S.status = "warte";
      zeigeStart(true);
    }
  }

  function bedienbar(feld) {
    if (!S.laeuft || S.pausiert || S.status !== "active") return false;
    if (feld < 0 || feld > 8 || S.brett[feld]) return false;
    if (S.online) {
      if (!S.mark) return false;
      if (S.amZug !== S.mark) return false;
      if (S.gesendet >= 0) return false;
    }
    return true;
  }

  function zugMachen(feld) {
    if (!S.laeuft || S.startbildschirm) {
      return { ok: false, fehler: "aktion-nicht-erlaubt" };
    }
    if (S.pausiert || S.status !== "active") {
      return { ok: false, fehler: "aktion-nicht-erlaubt" };
    }
    if (typeof feld !== "number" || !Number.isInteger(feld) || feld < 0 || feld > 8) {
      return { ok: false, fehler: "aktion-nicht-erlaubt" };
    }
    if (S.brett[feld]) {
      S.hinweis = "Dieses Feld ist schon belegt.";
      zeichneStatus();
      return { ok: false, fehler: "aktion-nicht-erlaubt" };
    }
    if (S.online) {
      if (!S.mark) return { ok: false, fehler: "aktion-nicht-erlaubt" };
      if (S.amZug !== S.mark) {
        S.hinweis = (S.gegner || "Der Gegner") + " ist dran.";
        zeichneStatus();
        return { ok: false, fehler: "aktion-nicht-erlaubt" };
      }
      if (S.gesendet >= 0) return { ok: false, fehler: "aktion-nicht-erlaubt" };
      /* Kein lokales Setzen: Der Connector fragt den Server; erst dessen
         Antwort ändert das Brett. So kann ein Abbruch keinen falschen
         Spielstand erzeugen. */
      S.gesendet = feld;
      S.hinweis = "Zug wird gesendet …";
      zeichne();
      ereignis("tictactoe:zug", { feld: feld });
      return { ok: true, feld: feld, gesendet: true };
    }

    S.brett[feld] = S.amZug;
    S.zuege++;
    S.tick++;
    S.hinweis = "";
    var reihe = findeReihe(S.amZug);
    if (reihe) {
      beende(S.amZug);
      return { ok: true, feld: feld };
    }
    if (zaehleSteine() === 9) {
      beende("draw");
      return { ok: true, feld: feld };
    }
    S.amZug = S.amZug === "X" ? "O" : "X";
    zeichne();
    if (S.amZug === BOT_MARK) botZugPlanen();
    return { ok: true, feld: feld };
  }

  function beende(sieger) {
    S.status = "finished";
    S.sieger = sieger;
    S.laeuft = false;
    S.pausiert = false;
    S.gesendet = -1;
    S.zuege = zaehleSteine();
    S.tick = S.zuege;
    zeichne();
    bilanzBuchen();
    meldeEnde();
    blattZeigen("ende");
  }

  function meldeEnde() {
    if (S.endeGemeldet) return;
    S.endeGemeldet = true;
    var grund = "unentschieden";
    if (S.sieger === "X" || S.sieger === "O") {
      if (S.online) grund = S.sieger === S.mark ? "gewonnen" : "verloren";
      else if (S.modus === "bot") grund = S.sieger === "X" ? "gewonnen" : "verloren";
      else grund = "gewonnen";
    }
    ereignis("tictactoe:ende", {
      grund: grund,
      sieger: S.sieger,
      zuege: S.zuege,
      punkte: 0,
      level: 1,
      levelAnzahl: 1,
      tick: S.tick
    });
  }

  function rundeNeu() {
    if (S.startbildschirm) return { ok: false, fehler: "aktion-nicht-erlaubt" };
    if (S.online) {
      if (S.status !== "finished" && S.status !== "declined") {
        return { ok: false, fehler: "aktion-nicht-erlaubt" };
      }
      S.hinweis = "Neue Runde wird angefragt …";
      zeichneStatus();
      ereignis("tictactoe:neu", {});
      return { ok: true, angefragt: true };
    }
    S.brett = leeresBrett();
    S.amZug = "X";
    S.status = "active";
    S.sieger = "";
    S.zuege = 0;
    S.tick = 0;
    S.gesendet = -1;
    S.endeGemeldet = false;
    S.pausiert = false;
    S.laeuft = true;
    S.hinweis = S.modus === "bot" ? "Du bist Kreuz und beginnst." : "Kreuz beginnt.";
    botStoppen();
    blattSchliessen();
    zeigeBildschirm("spiel");
    zeichne();
    return { ok: true };
  }

  function pause() {
    if (!S.laeuft) return { ok: false, fehler: "spiel-laeuft-nicht" };
    if (S.pausiert) return { ok: true, pausiert: true };
    S.pausiert = true;
    botStoppen();
    zeichne();
    blattZeigen("pause");
    ereignis("tictactoe:pausiert", { tick: S.tick });
    return { ok: true, pausiert: true };
  }

  function weiter() {
    if (!S.laeuft) return { ok: false, fehler: "spiel-laeuft-nicht" };
    if (!S.pausiert) return { ok: true, pausiert: false };
    S.pausiert = false;
    blattSchliessen();
    zeichne();
    if (S.amZug === BOT_MARK) botZugPlanen();
    ereignis("tictactoe:weiter", { tick: S.tick });
    return { ok: true, pausiert: false };
  }

  function zumStart() {
    botStoppen();
    S.laeuft = false;
    S.pausiert = false;
    S.startbildschirm = true;
    S.online = false;
    S.mark = "";
    S.gegner = "";
    S.marke = "";
    S.brett = leeresBrett();
    S.amZug = "X";
    S.status = "idle";
    S.sieger = "";
    S.zuege = 0;
    S.tick = 0;
    S.gesendet = -1;
    S.hinweis = "";
    blattSchliessen();
    zeigeStart(false);
    zeichne();
    return { ok: true };
  }

  /* -------------------------------------------------------------- Online-Stand */
  function standUebernehmen(daten) {
    if (!S.online) return { ok: false, fehler: "aktion-nicht-erlaubt" };
    var brett = daten.brett;
    if (!Array.isArray(brett) || brett.length !== 9) {
      return { ok: false, fehler: "aktion-nicht-erlaubt" };
    }
    var geprueft = [];
    for (var i = 0; i < 9; i++) {
      var f = brett[i];
      if (f !== "" && f !== "X" && f !== "O") return { ok: false, fehler: "aktion-nicht-erlaubt" };
      geprueft.push(f);
    }
    var status = typeof daten.status === "string" ? daten.status : "active";
    if (ZUSTAENDE.indexOf(status) < 0) return { ok: false, fehler: "aktion-nicht-erlaubt" };
    var sieger = daten.sieger === "X" || daten.sieger === "O" ? daten.sieger
      : daten.sieger === "draw" ? "draw" : "";
    if (status === "finished" && !sieger) return { ok: false, fehler: "aktion-nicht-erlaubt" };
    var marke = typeof daten.marke === "string" ? daten.marke : S.marke;
    var neuerStand = marke !== S.marke;

    if (daten.mark === "X" || daten.mark === "O") S.mark = daten.mark;
    if (typeof daten.gegner === "string") S.gegner = daten.gegner.slice(0, 24);
    S.marke = marke;
    S.brett = geprueft;
    S.amZug = daten.amZug === "O" ? "O" : "X";
    S.status = status;
    S.sieger = sieger;
    S.zuege = zaehleSteine();
    S.tick = S.zuege;
    S.gesendet = -1;
    S.hinweis = typeof daten.hinweis === "string" ? daten.hinweis.slice(0, 160) : "";
    if (status === "active") {
      S.laeuft = true;
      S.pausiert = false;
      S.endeGemeldet = neuerStand ? false : S.endeGemeldet;
      S.startbildschirm = false;
      if (S.blatt === "ende") blattSchliessen();
      zeigeBildschirm("spiel");
    } else if (status === "finished") {
      S.laeuft = false;
      S.pausiert = false;
      S.startbildschirm = false;
      zeigeBildschirm("spiel");
    } else if (status === "invited") {
      S.laeuft = false;
      S.startbildschirm = false;
      zeigeBildschirm("spiel");
    } else if (status === "declined") {
      S.laeuft = false;
      zeigeStart(true);
    }
    zeichne();
    if (status === "finished") {
      meldeEnde();
      if (!S.blatt) blattZeigen("ende");
    }
    return { ok: true };
  }

  /* -------------------------------------------------------------- Schnittstelle */
  function start(konfiguration) {
    var k = konfiguration;
    if (k === undefined || k === null) k = {};
    if (!istObjekt(k)) return { ok: false, fehler: "konfiguration-muss-objekt-sein" };

    var schluessel = Object.keys(k);
    for (var i = 0; i < schluessel.length; i++) {
      if (FELDER_ERLAUBT.indexOf(schluessel[i]) < 0) {
        return { ok: false, fehler: "unbekanntes-feld", feld: schluessel[i] };
      }
    }

    var stil = S.stil;
    if (Object.prototype.hasOwnProperty.call(k, "stil")) {
      if (typeof k.stil !== "string") return { ok: false, fehler: "unbekanntes-feld", feld: "stil" };
      stil = STILE.indexOf(k.stil) >= 0 ? k.stil : "normal";
    }
    if (Object.prototype.hasOwnProperty.call(k, "level")) {
      if (k.level !== 1) return { ok: false, fehler: "level-muss-1-bis-1-sein" };
    }

    var online = null;
    if (Object.prototype.hasOwnProperty.call(k, "online")) {
      if (!istObjekt(k.online)) return { ok: false, fehler: "unbekanntes-feld", feld: "online" };
      var o = k.online;
      var oSchluessel = Object.keys(o);
      for (var j = 0; j < oSchluessel.length; j++) {
        if (ONLINE_ERLAUBT.indexOf(oSchluessel[j]) < 0) {
          return { ok: false, fehler: "unbekanntes-feld", feld: "online." + oSchluessel[j] };
        }
      }
      if (o.mark !== undefined && o.mark !== "" && o.mark !== "X" && o.mark !== "O") {
        return { ok: false, fehler: "unbekanntes-feld", feld: "online.mark" };
      }
      if (o.gegner !== undefined && typeof o.gegner !== "string") {
        return { ok: false, fehler: "unbekanntes-feld", feld: "online.gegner" };
      }
      if (o.marke !== undefined && typeof o.marke !== "string") {
        return { ok: false, fehler: "unbekanntes-feld", feld: "online.marke" };
      }
      online = o;
    }

    /* Eine Konfiguration mit ausschließlich "stil" stellt nur die Welt ein –
       so übergibt der Connector die Wahl beim Öffnen, ohne eine Partie zu
       beginnen. Alles andere startet. */
    if (schluessel.length === 1 && schluessel[0] === "stil") {
      S.stilVorgabe = true;
      stilSetzen(stil);
      return {
        ok: true, gestartet: false, stil: S.stil, level: 1, levelAnzahl: 1,
        online: S.online, mark: S.mark
      };
    }

    if (S.laeuft) return { ok: false, fehler: "spiel-laeuft" };

    /* Ein Aufruf mit Stil kommt vom Connector: Dann keine Stilwahl im Spiel. */
    if (Object.prototype.hasOwnProperty.call(k, "stil")) S.stilVorgabe = true;
    stilSetzen(stil);
    if (online) {
      starteOnline(online.mark, online.gegner, online.marke);
    } else {
      starteLokal();
    }

    return {
      ok: true, gestartet: S.laeuft, stil: S.stil, level: 1, levelAnzahl: 1,
      online: S.online, mark: S.mark, modus: S.modus, stufe: S.stufe
    };
  }

  function einstellungen() {
    return {
      stil: S.stil,
      stile: STILE.slice(),
      stilWahl: S.stilVorgabe === false,
      level: 1,
      levelAnzahl: 1,
      stufen: [],
      modi: MODI.slice(),
      modus: S.modus,
      botStufen: STUFEN.slice(),
      stufe: S.stufe,
      online: S.online,
      mark: S.mark
    };
  }

  function zustand() {
    return {
      laeuft: S.laeuft,
      pausiert: S.pausiert,
      tick: S.tick,
      richtung: { x: 0, y: 0 },
      level: 1,
      punkte: 0,
      extras: [],
      startbildschirm: S.startbildschirm,
      stil: S.stil,
      stilWahl: S.stilVorgabe === false,
      modus: S.modus,
      stufe: S.stufe,
      botMark: BOT_MARK,
      botDenkt: !!botTimer,
      brett: S.brett.slice(),
      amZug: S.amZug,
      status: S.status,
      sieger: S.sieger,
      zuege: S.zuege,
      online: S.online,
      mark: S.mark,
      gegner: S.gegner,
      marke: S.marke,
      hinweis: S.hinweis,
      gesendet: S.gesendet
    };
  }

  function aktion(name, daten) {
    if (typeof name !== "string") return { ok: false, fehler: "unbekannte-aktion" };
    if (daten !== undefined && daten !== null && !istObjekt(daten)) {
      return { ok: false, fehler: "daten-muessen-objekt-sein" };
    }
    var d = daten || {};
    switch (name) {
      case "setzen":
        if (!Object.prototype.hasOwnProperty.call(d, "feld")) {
          return { ok: false, fehler: "aktion-nicht-erlaubt" };
        }
        return zugMachen(d.feld);
      case "neu":
        return rundeNeu();
      case "start":
        return start({});
      case "pause":
        return pause();
      case "weiter":
        return weiter();
      case "stand":
        return standUebernehmen(d);
      default:
        return { ok: false, fehler: "unbekannte-aktion" };
    }
  }

  /* -------------------------------------------------------------- Bedienung */
  /* Modus, Stufe und Stil: Klick oder Tastatur, sofort sichtbar. */
  [].forEach.call(el.modusKnoepfe.children, function (b) {
    b.addEventListener("click", function () {
      var m = b.dataset.modus;
      if (MODI.indexOf(m) < 0) return;
      S.modus = m;
      wahlZeichnen();
      if (b.focus) { try { b.focus({ preventScroll: true }); } catch (e) { } }
    });
  });
  [].forEach.call(el.stufeKnoepfe.children, function (b) {
    b.addEventListener("click", function () {
      var s = b.dataset.stufe;
      if (STUFEN.indexOf(s) < 0) return;
      S.stufe = s;
      wahlZeichnen();
    });
  });
  [].forEach.call(el.stilKnoepfe.children, function (b) {
    b.addEventListener("click", function () {
      var w = b.dataset.stil;
      if (STILE.indexOf(w) < 0) return;
      stilMerken(w);
      stilSetzen(w);
    });
  });

  el.knopfStarten.addEventListener("click", function () {
    if (S.online && !S.mark) return;
    start({});
  });
  el.knopfNeu.addEventListener("click", function () { rundeNeu(); });
  el.knopfPause.addEventListener("click", function () {
    if (S.pausiert) weiter(); else pause();
  });
  el.knopfStart.addEventListener("click", function () { zumStart(); });
  el.blattHaupt.addEventListener("click", function () {
    if (S.pausiert) weiter();
    else rundeNeu();
  });
  el.blattZweit.addEventListener("click", function () { zumStart(); });

  if (window.TGSpiel && TGSpiel.vollbild) {
    TGSpiel.vollbild.knopf(el.knopfVollbild, { textAn: "Vollbild aus", textAus: "Vollbild" });
    TGSpiel.vollbild.beiWechsel(function () {
      fertig.breit = 0;
      requestAnimationFrame(passeBrett);
    });
  }

  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var ziel = e.target;
    if (ziel && /^(INPUT|TEXTAREA|SELECT)$/.test(ziel.tagName)) return;

    if (/^[1-9]$/.test(e.key) && !S.startbildschirm) {
      e.preventDefault();
      zugMachen(Number(e.key) - 1);
      return;
    }
    if (e.key === "p" || e.key === "P") {
      if (S.startbildschirm) return;
      e.preventDefault();
      if (S.pausiert) weiter();
      else if (S.laeuft) pause();
      return;
    }
    if (e.key === "Escape") {
      if (window.TGSpiel && TGSpiel.vollbild.ist()) return;  /* Vollbild zuerst */
      if (S.pausiert) {
        e.preventDefault();
        weiter();
      }
    }
  });

  var messung = window.requestAnimationFrame || function (fn) { return setTimeout(fn, 16); };
  var messungLaeuft = false;
  function messenAnstossen() {
    if (messungLaeuft) return;
    messungLaeuft = true;
    messung(function () {
      messungLaeuft = false;
      passeBrett();
    });
  }
  window.addEventListener("resize", messenAnstossen);
  window.addEventListener("orientationchange", messenAnstossen);
  document.addEventListener("fullscreenchange", messenAnstossen);
  if (window.ResizeObserver) {
    new ResizeObserver(messenAnstossen).observe(el.buehne);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(messenAnstossen);

  /* -------------------------------------------------------------- Anlauf */
  baueZellen();
  /* Stil: Connector zuerst, sonst die eigene Wahl dieses Browsers. */
  var aussen = stilAusUmgebung();
  if (aussen) {
    S.stilVorgabe = true;
    S.stil = aussen;
  } else {
    S.stil = stilLesen() || "normal";
  }
  stilSetzen(S.stil);
  zeigeStart(false);
  zeichne();

  var schnittstelle = {
    version: VERSION,
    bereit: true,
    whenReady: function () { return Promise.resolve({ ok: true, version: VERSION }); },
    start: start,
    einstellungen: einstellungen,
    zustand: zustand,
    startbildschirm: zumStart,
    stop: zumStart,
    pause: pause,
    resume: weiter,
    aktion: aktion
  };
  if (Object.freeze) Object.freeze(schnittstelle);
  window.TicTacToe = schnittstelle;

  setTimeout(function () { ereignis("tictactoe:bereit", { version: VERSION }); }, 0);
})();
</script>
