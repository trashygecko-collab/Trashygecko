<!DOCTYPE html>
<html lang="de">
<head>
<script src="../../token.js"></script>
<script src="../../brettspiele/wuerfel-common.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Galgenmännchen</title>
<link rel="stylesheet" href="../../schrift.css">
<style>
:root{
  --bg:#0a211b; --panel:#0f2b23; --line:#1d4a3a; --gold:#e8cd8e; --ink:#f6edda;
  --muted:#a9c3b6; --rot:#e04b3f; --gruen:#4fbf72;
  --glanz:radial-gradient(ellipse at 20% 0%,#12332a 0%,transparent 45%);
  --karte:linear-gradient(160deg,#0f2b23,#0a211b);
  --buehne:#081914; --taste:#14382d; --taste-hover:#1b4a3a;
  --treffer:#1f5d43; --daneben:#3a1a17; --daneben-rand:#7a2c25;
  --leer:#2f5a49; --sp:#0b241d; --schein:#e8cd8e44; --herz:#e8cd8e;
  --holz-hell:#a2855a; --holz:#7a6242; --holz-dunkel:#55432c;
  --holz-maser:#3f301c; --holz-knoten:#3a2b1a; --nagel:#cbb487;
  --seil:#c0a877; --figur:#e8cd8e;
  --boden-hell:#1d4a31; --boden:#0f2b1d; --gras:#3f8f5a;
}

/* Ansicht Mädchen: helles Holz, Rosa */
body[data-stil="maedchen"]{
  --bg:#eb7bc0; --panel:#fffafd; --line:#ffd0e6; --gold:#6b0d3b; --ink:#3a0f24;
  --muted:#5b2340; --rot:#8f1220; --gruen:#1f6b45;
  --glanz:radial-gradient(ellipse at 20% 0%,#f7a6d4 0%,transparent 55%);
  --karte:linear-gradient(160deg,#fffafd,#ffeef5);
  --buehne:#fff7fb; --taste:#ffe9f2; --taste-hover:#ffdae8;
  --treffer:#d9f6e9; --daneben:#ffe1e3; --daneben-rand:#f0a4a4;
  --leer:#e3b7cb; --sp:#fff5f9; --schein:#d84a8633; --herz:#e0568a;
  --holz-hell:#e0b183; --holz:#c48a57; --holz-dunkel:#99613a;
  --holz-maser:#8a5630; --holz-knoten:#7d4c2a; --nagel:#f4e6c8;
  --seil:#e5799f; --figur:#c2386c;
  --boden-hell:#dff0d8; --boden:#bfdcc0; --gras:#5faa6b;
  color-scheme:light;
}

/* Ansicht Buben: dunkles Holz, Acid */
body[data-stil="buben"]{
  --bg:#100f0f; --panel:#121417; --line:#33302e; --gold:#e0242f; --ink:#e4e7ea;
  --muted:#7f868f; --rot:#ff5f5f; --gruen:#d3d0cf;
  --glanz:radial-gradient(ellipse at 20% 0%,#201e1d 0%,transparent 50%);
  --karte:linear-gradient(160deg,#181615,#0b0a0a);
  --buehne:#0a0909; --taste:#16181c; --taste-hover:#1a1c20;
  --treffer:#1c0c0e; --daneben:#2a1113; --daneben-rand:#5a1d22;
  --leer:#3a4048; --sp:#14161a; --schein:#e0242f33; --herz:#e0242f;
  --holz-hell:#7d5c3e; --holz:#5c4128; --holz-dunkel:#3c2a1a;
  --holz-maser:#2b1d11; --holz-knoten:#241708; --nagel:#d3d0cf;
  --seil:#b8c0c8; --figur:#e0242f;
  --boden-hell:#1a1d21; --boden:#100f0f; --gras:#7a1620;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;padding:10px;background:var(--glanz),var(--bg);
  color:var(--ink);font-family:var(--tg-schrift);display:flex;justify-content:center;
  overflow-y:auto;
}
.app{width:min(1120px,100%);display:flex;flex-direction:column;gap:10px;min-height:100%}
.kopf{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.titel{font-size:clamp(17px,2.4vw,24px);color:var(--gold);letter-spacing:1px}
.kopf small{color:var(--muted)}
/* min-height:auto = lieber scrollen als Tastatur und Spielerkarte übereinanderlegen */
.mitte{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:10px;flex:1 1 auto;min-height:auto}
@media(max-width:820px){.mitte{grid-template-columns:1fr}}
.karte{background:var(--karte);border:1px solid var(--line);border-radius:14px;padding:10px}
.buehne{display:flex;flex-direction:column;gap:8px;min-height:0}
.zeichnung{position:relative;flex:1 1 auto;min-height:190px;border-radius:12px;background:var(--buehne);overflow:hidden}
.zeichnung svg{width:100%;height:100%;display:block}
.wort{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.buch{width:clamp(24px,4.2vw,38px);height:clamp(32px,5.2vw,46px);display:flex;align-items:center;justify-content:center;
  font-size:clamp(16px,3vw,24px);font-weight:bold;border-bottom:3px solid var(--line);color:var(--ink);transition:color .2s,border-color .2s}
.buch.offen{color:var(--gold);border-color:var(--gold)}
.buch.leer{color:var(--leer)}
.tastatur{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
@media(max-width:520px){.tastatur{grid-template-columns:repeat(7,minmax(0,1fr))}}
.taste{padding:9px 0;font-size:clamp(13px,2vw,17px);font-weight:bold;background:var(--taste);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;cursor:pointer;font-family:inherit;transition:transform .08s,background .15s}
.taste:hover:not(:disabled){background:var(--taste-hover)}
.taste:active:not(:disabled){transform:scale(.95)}
.taste.treffer{background:var(--treffer);color:var(--gruen);border-color:var(--gruen)}
.taste.daneben{background:var(--daneben);color:var(--rot);border-color:var(--daneben-rand);text-decoration:line-through}
.taste:disabled{opacity:.55;cursor:default}
.seite{display:flex;flex-direction:column;gap:8px;min-height:0}
.leiste{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.leiste label{color:var(--muted);font-size:13px}
select,button.aktion{font-family:inherit;background:var(--taste);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;cursor:pointer}
button.aktion.haupt{background:var(--gold);color:#0a211b;border-color:#d9bc7c;font-weight:bold}
.herzen{display:flex;gap:4px;font-size:20px;letter-spacing:2px;color:var(--herz)}
.spieler{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
.sp{margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 9px;
  border:1px solid var(--line);border-radius:9px;background:var(--sp);font-size:14px}
.sp.dran{border-color:var(--gold);box-shadow:0 0 12px var(--schein)}
.sp b{color:var(--gold)}
.notiz{color:var(--muted);font-size:13px;min-height:18px}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-height:96px;overflow:auto}
.log .ok{color:var(--gruen)}
.log .nein{color:var(--rot)}
.ende{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.versteckt{display:none!important}

/* ---- Red Reactor: Titel in Silber, Rot bleibt der LED-Akzent ------------- */
body[data-stil="buben"] .titel,
body[data-stil="buben"] .titelleiste .titel,
body[data-stil="buben"] .fenster .titel,
body[data-stil="buben"] h2,
body[data-stil="buben"] .meldung h2,
body[data-stil="buben"] #regeln summary {
  color: #e6e9ec;
}
body[data-stil="buben"] .titel,
body[data-stil="buben"] .titelleiste .titel {
  text-shadow: none;
}

/* Red Reactor: Knopfaufschrift in Silber, Rot nur an Kante und Aktiv-Zustand */
body[data-stil="buben"] button,
body[data-stil="buben"] .menueleiste button,
body[data-stil="buben"] .knopf,
body[data-stil="buben"] select {
  color: #e6e9ec;
}
body[data-stil="buben"] button:hover:not(:disabled),
body[data-stil="buben"] .menueleiste button:hover,
body[data-stil="buben"] .knopf:hover:not(:disabled) {
  color: #ffffff;
}
body[data-stil="buben"] button.aktiv,
body[data-stil="buben"] .menueleiste button.aktiv,
body[data-stil="buben"] .knopf.aktiv,
body[data-stil="buben"] button.haupt,
body[data-stil="buben"] .aktion.haupt,
body[data-stil="buben"] .meldung button {
  color: #ffffff;
  text-shadow: none;
}
/* Lesbarkeit: geprüft 21.11.2026 */
html[data-stil="maedchen"] #btnStart{color:#fff6fa}
/* Querformat am Handy: die Zeichnung darf schrumpfen, damit die Tastatur
   ohne Scrollbalken erreichbar bleibt. */
@media(max-height:460px) and (orientation:landscape){
  body{padding:4px}
  .app{gap:4px}
  .mitte{gap:4px}
  .karte{padding:7px}
  .zeichnung{flex:0 0 clamp(40px,15vh,80px);min-height:0}
  .taste{padding:5px 0}
  .wort{gap:4px}
  .buch{height:clamp(24px,4.2vh,36px)}
}
/* Ganz flache Geräte: die Zeichnung weicht, Wort und Tastatur bleiben. */
@media(max-height:420px) and (orientation:landscape){
  .zeichnung{display:none}
}
/* Hochformat mit wenig Höhe (z. B. im Spielrahmen der Halle am Handy):
   die Zeichnung schrumpft, statt Tastatur und Spielerkarte zu überlappen. */
@media(max-height:700px) and (orientation:portrait){
  .zeichnung{flex:0 0 clamp(90px,22vh,170px);min-height:0}
}
</style>

</head>

<script>
(() => {
"use strict";
/* ------------------------------------------------------------------ */
/* Online oder lokal: gleiche Oberfläche, zwei Antriebe.               */
/* ------------------------------------------------------------------ */
const P = new URLSearchParams(location.search);
const ROOM = (P.get("room") || "").trim().toUpperCase();
const ONLINE = /^TG-[A-F0-9]{4}$/.test(ROOM);
const MYID = (P.get("id") || "").trim();
const MYNAME = (P.get("name") || "").trim() || "Spieler";
/* Lokales Netz: Die App startet die Seite mit ?lokal=1 und reicht die Züge
   über ihre eigene Raum-Brücke weiter (window.TGLokal). Der Bildschirm ist
   derselbe wie online, nur ohne Server und ohne /api. */
const LOKAL = !!window.TGLokal && P.get("lokal") === "1";
const GEMEINSAM = ONLINE || LOKAL;

const ALPHABET = "abcdefghijklmnopqrstuvwxyzäöüß".split("");
const VARIANTEN = {
  klassisch: { fehler: 8, hinweis: true, stufe: 3 },
  streng: { fehler: 6, hinweis: true, stufe: 3 },
  ohnehilfe: { fehler: 8, hinweis: false, stufe: 3 },
  leicht: { fehler: 10, hinweis: true, stufe: 1 }
};
const WORTE = [
  ["sonne","Natur",1],["wolke","Natur",1],["blume","Natur",1],["fluss","Natur",1],["wiese","Natur",1],
  ["apfel","Essen",1],["brot","Essen",1],["kaese","Essen",1],["milch","Essen",1],["salat","Essen",1],
  ["tisch","Haus",1],["stuhl","Haus",1],["fenster","Haus",2],["garten","Haus",1],["teppich","Haus",2],
  ["fahrrad","Technik",2],["schraube","Technik",2],["batterie","Technik",2],["lautsprecher","Technik",3],
  ["gitarre","Musik",2],["trommel","Musik",2],["klavier","Musik",2],["konzert","Musik",2],
  ["planet","Weltraum",2],["rakete","Weltraum",2],["galaxie","Weltraum",3],["teleskop","Weltraum",3],
  ["schwimmen","Sport",2],["springen","Sport",2],["torwart","Sport",2],["stadion","Sport",2],
  ["lehrer","Beruf",1],["baecker","Beruf",2],["gaertner","Beruf",2],["pilot","Beruf",1],
  ["himmel","Wetter",2],["gewitter","Wetter",3],["sonnenschein","Wetter",3],["nebel","Wetter",1],
  ["insel","Reisen",1],["strand","Reisen",2],["koffer","Reisen",2],["urlaub","Reisen",2],
  ["bibliothek","Orte",3],["brunnen","Orte",2],["bahnhof","Orte",2],["museum","Orte",2],
  ["elefant","Tiere",2],["pinguin","Tiere",2],["schmetterling","Tiere",3],["eichhoernchen","Tiere",3],
  ["zitrone","Obst",2],["banane","Obst",2],["kirsche","Obst",2],["erdbeere","Obst",2],
  ["schokolade","Suess",3],["marmelade","Suess",3],["kuchen","Suess",1],["keks","Suess",1],
  ["fernseher","Wohnen",3],["vorhang","Wohnen",2],["kissen","Wohnen",2],["schrank","Wohnen",2],
  ["zeitung","Alltag",2],["schluessel","Alltag",3],["brille","Alltag",2],["tasche","Alltag",2]
];

const $ = (id) => document.getElementById(id);
const elWort = $("wort"), elTastatur = $("tastatur"), elSpieler = $("spieler"),
      elLog = $("log"), elNotiz = $("notiz"), elHerzen = $("herzen"),
      elHinweis = $("hinweis"), elLage = $("lage"), elZug = $("zugText"),
      elRunde = $("rundenTitel"), elEnde = $("ende");

/* ---------------------------- lokal ------------------------------- */
let lokal = null;

function localNeueRunde(variante) {
  const v = VARIANTEN[variante] || VARIANTEN.klassisch;
  const passend = WORTE.filter((w) => w[2] <= v.stufe);
  const [wort, kategorie] = passend[Math.floor(Math.random() * passend.length)];
  lokal = {
    wort, kategorie, variante, maxFehler: v.fehler, hinweis: v.hinweis,
    anzeige: Array.from(wort, () => ""), buchstaben: [], fehler: 0,
    geloest: false, verloren: false, runde: 1, punkte: 0, treffer: 0, letzte: []
  };
}
function localRaten(b) {
  if (!lokal || lokal.geloest || lokal.verloren) return;
  if (lokal.buchstaben.includes(b)) return;
  lokal.buchstaben.push(b);
  let n = 0;
  for (let i = 0; i < lokal.wort.length; i++) {
    if (lokal.wort[i] === b) { lokal.anzeige[i] = b; n++; }
  }
  if (n > 0) {
    lokal.punkte += n; lokal.treffer++;
    lokal.letzte.push("✔ " + b.toUpperCase() + " – " + n + " Buchstabe(n)");
    if (lokal.anzeige.every((x) => x !== "")) lokal.geloest = true;
  } else {
    lokal.fehler++;
    lokal.letzte.push("✖ " + b.toUpperCase() + " – daneben");
    if (lokal.fehler >= lokal.maxFehler) lokal.verloren = true;
  }
  if (lokal.letzte.length > 8) lokal.letzte = lokal.letzte.slice(-8);
  zeichne();
}

function zeichneLokal() {
  const w = lokal;
  elRunde.textContent = "Runde " + w.runde;
  elLage.textContent = w.geloest ? "Gelöst!" : w.verloren ? "Verloren" : "Läuft";
  elHerzen.textContent = "♥".repeat(Math.max(0, w.maxFehler - w.fehler)) +
    "♡".repeat(Math.min(w.maxFehler, w.fehler));
  elHinweis.textContent = w.hinweis ? "Kategorie: " + w.kategorie : "Ohne Hinweis";
  elZug.textContent = w.geloest ? "Wort: " + w.wort.toUpperCase()
    : w.verloren ? "Wort war: " + w.wort.toUpperCase() : "Du bist dran";
  elSpieler.innerHTML = "";
  const zeile = document.createElement("p");
  zeile.className = "sp dran";
  const n = document.createElement("span"); n.textContent = MYNAME;
  const p = document.createElement("b"); p.textContent = w.punkte + " Punkte · " + w.treffer + " Treffer";
  zeile.append(n, p);
  elSpieler.appendChild(zeile);
  elLog.innerHTML = "";
  w.letzte.forEach((z) => {
    const d = document.createElement("div");
    d.className = z.startsWith("✔") ? "ok" : "nein";
    d.textContent = z;
    elLog.appendChild(d);
  });
  elNotiz.textContent = w.geloest ? "Geschafft – " + w.punkte + " Punkte." : "";
  elEnde.classList.toggle("versteckt", !(w.geloest || w.verloren));
  $("btnNochmal").textContent = "Nächste Runde";
  zeichneWort(w.anzeige);
  zeichneTastatur(w.buchstaben, w.anzeige, w.geloest || w.verloren);
  zeichneGalgen(w.fehler, w.maxFehler);
}

/* ---------------------------- gemeinsam --------------------------- */
function zeichneWort(anzeige) {
  elWort.innerHTML = "";
  anzeige.forEach((b) => {
    const d = document.createElement("div");
    d.className = "buch " + (b ? "offen" : "leer");
    d.textContent = b ? b.toUpperCase() : "_";
    elWort.appendChild(d);
  });
}
/* aufgedeckt: Buchstaben, die im Wort stehen; geraten: schon versucht.
   Treffer und Fehlgriff lassen sich damit allein aus der Anzeige ableiten. */
function zeichneTastatur(geraten, aufgedeckt, fertig) {
  elTastatur.innerHTML = "";
  const treffer = new Set((aufgedeckt || []).filter(Boolean));
  ALPHABET.forEach((b) => {
    const t = document.createElement("button");
    t.type = "button";
    t.className = "taste";
    t.textContent = b.toUpperCase();
    t.dataset.b = b;
    if (geraten.includes(b)) {
      t.classList.add(treffer.has(b) ? "treffer" : "daneben");
      t.disabled = true;
    } else if (fertig) {
      t.disabled = true;
    }
    elTastatur.appendChild(t);
  });
}
function zeichneGalgen(fehler, max) {
  const teile = ["tKopf", "tKoerper", "tArmL", "tArmR", "tBeinL", "tBeinR"];
  const sichtbar = Math.min(6, Math.round((fehler / Math.max(1, max)) * 6));
  teile.forEach((id, i) => {
    const el = $(id);
    if (!el) return;
    el.style.opacity = i < sichtbar ? "1" : "0";
    el.style.transition = "opacity .25s";
  });
}

/* ---------------------------- online ------------------------------ */
let onlineGame = null, onlineBusy = false;

/* Lokaler Raum: Anfrage an die App, Antwort kommt asynchron als
   window.TGLokalAntwort({game}) bzw. ({fehler}). */
let lanNr = 0;
const lanOffen = new Map();

window.TGLokalAntwort = (antwort) => {
  const wartet = lanOffen.get(antwort.anfrage);
  if (!wartet) return;
  lanOffen.delete(antwort.anfrage);
  clearTimeout(wartet.uhr);
  if (antwort.fehler) { wartet.fehler(new Error(antwort.fehler)); return; }
  if ("game" in antwort) { onlineGame = antwort.game; zeichneOnline(); }
  wartet.fertig(antwort);
};

function lanZug(aktion, koerper) {
  return new Promise((fertig, fehler) => {
    const anfrage = "a" + (++lanNr);
    const uhr = setTimeout(() => {
      if (!lanOffen.delete(anfrage)) return;
      fehler(new Error("Keine Antwort aus dem Raum."));
    }, 5000);
    lanOffen.set(anfrage, { fertig, fehler, uhr });
    window.TGLokal.schicke(JSON.stringify({ anfrage, aktion, koerper: koerper || {} }));
  });
}

async function api(aktion, koerper) {
  if (LOKAL) {
    if (!aktion) return JSON.parse(window.TGLokal.hole() || "{\"game\":null}");
    return lanZug(aktion, koerper);
  }
  /* Beim Lesen steht die Kennung in der Adresse, beim Schreiben im Rumpf –
     genau da, wo der Server sie erwartet. */
  const url = "/api/galgen?room=" + encodeURIComponent(ROOM) +
    (aktion ? "&action=" + encodeURIComponent(aktion) : "&id=" + encodeURIComponent(MYID));
  const r = await fetch(url, aktion ? {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ id: MYID }, koerper || {}))
  } : { cache: "no-store" });
  if (!r.ok) throw new Error((await r.text()).trim() || "Aktion fehlgeschlagen.");
  return r.json();
}

async function hole() {
  if (!GEMEINSAM || onlineBusy) return;
  onlineBusy = true;
  try {
    const d = await api(null);
    onlineGame = d.game || null;
    zeichneOnline();
  } catch (e) {
    elLage.textContent = e.message;
  } finally {
    onlineBusy = false;
  }
}

async function schicke(aktion, koerper) {
  if (onlineBusy) return false;
  onlineBusy = true;
  try {
    const d = await api(aktion, koerper);
    onlineGame = d.game || null;
    zeichneOnline();
    return true;
  } catch (e) {
    elNotiz.textContent = e.message;
    return false;
  } finally {
    onlineBusy = false;
  }
}

function zeichneOnline() {
  const g = onlineGame;
  $("startLeiste").classList.add("versteckt");
  $("onlineLeiste").classList.remove("versteckt");
  if (!g) {
    elLage.textContent = "Keine Runde";
    elRunde.textContent = "—";
    elWort.innerHTML = "";
    elTastatur.innerHTML = "";
    elSpieler.innerHTML = "";
    elLog.innerHTML = "";
    elNotiz.textContent = "Eröffne eine Runde – Mitspieler treten im Raum bei.";
    elEnde.classList.add("versteckt");
    $("btnErstellen").classList.remove("versteckt");
    $("btnBereit").classList.add("versteckt");
    $("btnLos").classList.add("versteckt");
    zeichneGalgen(0, 1);
    return;
  }
  const anzeige = g.anzeige || [];
  const ich = g.spieler.find((s) => s.id === MYID);
  const dran = g.status === "spiel" && ich && g.spieler[g.zug] && g.spieler[g.zug].id === MYID;
  elRunde.textContent = "Runde " + g.runde + " · " + g.varianteName;
  elLage.textContent = g.status === "invited" ? "Warte auf Mitspieler"
    : g.status === "ende" ? (g.geloest ? "Gelöst" : "Verloren") : "Läuft";
  elHerzen.textContent = "♥".repeat(Math.max(0, g.maxFehler - g.fehler)) +
    "♡".repeat(Math.min(g.maxFehler, g.fehler));
  elHinweis.textContent = g.hinweisZeigen && g.kategorie ? "Kategorie: " + g.kategorie : "Ohne Hinweis";
  elZug.textContent = g.status === "spiel"
    ? (dran ? "Du bist dran" : g.spieler[g.zug].name + " ist dran")
    : "";
  elNotiz.textContent = g.note || "";

  elSpieler.innerHTML = "";
  g.spieler.forEach((s, i) => {
    const p = document.createElement("p");
    p.className = "sp" + (g.status === "spiel" && i === g.zug ? " dran" : "");
    const n = document.createElement("span");
    n.textContent = s.name + (s.id === MYID ? " (du)" : "") + (s.ready ? "" : " · nicht bereit");
    const b = document.createElement("b");
    b.textContent = s.punkte + " Punkte";
    p.append(n, b);
    elSpieler.appendChild(p);
  });

  elLog.innerHTML = "";
  (g.letzte || []).forEach((z) => {
    const d = document.createElement("div");
    d.className = z.startsWith("✔") ? "ok" : "nein";
    d.textContent = z;
    elLog.appendChild(d);
  });

  $("btnErstellen").classList.toggle("versteckt", !!g);
  $("varianteLokal").classList.toggle("versteckt", !(LOKAL && !g));
  $("btnBeitreten").classList.toggle("versteckt", !(LOKAL && g && g.status === "invited" && !ich));
  $("btnBereit").classList.toggle("versteckt", !g || g.status !== "invited");
  $("btnLos").classList.toggle("versteckt", !g || g.status !== "invited");
  if (g.status === "invited") {
    $("btnBereit").textContent = ich && ich.ready ? "Nicht bereit" : "Bereit";
    $("btnLos").textContent = "Los (" + g.spieler.filter((s) => s.ready).length + "/" + g.spieler.length + " bereit)";
  }
  elEnde.classList.toggle("versteckt", g.status !== "ende");

  zeichneWort(anzeige);
  /* Gesperrt ist die Tastatur, sobald die Runde nicht läuft oder ein anderer
     dran ist; vorbei ist sie ohnehin gesperrt. */
  const gesperrt = g.status !== "spiel" || !dran;
  zeichneTastatur(g.buchstaben || [], anzeige, gesperrt);
  zeichneGalgen(g.fehler, g.maxFehler);
}

/* ---------------------------- Bedienung --------------------------- */
elTastatur.addEventListener("click", (e) => {
  const t = e.target.closest(".taste");
  if (!t || t.disabled) return;
  const b = t.dataset.b;
  if (GEMEINSAM) { schicke("raten", { buchstabe: b }); }
  else { localRaten(b); }
});

$("btnStart").addEventListener("click", () => {
  localNeueRunde($("variante").value);
  zeichne();
});
$("btnNochmal").addEventListener("click", () => {
  if (GEMEINSAM) schicke("naechste");
  else { const v = lokal.variante; localNeueRunde(v); lokal.runde++; zeichne(); }
});
$("btnNeu").addEventListener("click", () => {
  if (GEMEINSAM) schicke("reset");
  else { const v = $("variante").value; localNeueRunde(v); zeichne(); }
});
$("btnErstellen").addEventListener("click", () => schicke("create", { variante: LOKAL ? $("varianteLokal").value : $("variante").value }));
$("btnBeitreten").addEventListener("click", () => schicke("join"));
$("btnBereit").addEventListener("click", () => schicke("ready"));
$("btnLos").addEventListener("click", () => schicke("start"));

function zeichne() {
  if (GEMEINSAM) zeichneOnline();
  else if (lokal) zeichneLokal();
  else {
    /* Vor dem ersten Start: leeres Gerüst mit Hinweis. */
    elWort.innerHTML = "";
    zeichneTastatur([], [], true);
    elHerzen.textContent = "";
    elHinweis.textContent = "Wähle eine Variante und starte.";
    elNotiz.textContent = "";
    elSpieler.innerHTML = "";
    elLog.innerHTML = "";
    elEnde.classList.add("versteckt");
    elLage.textContent = GEMEINSAM ? "Verbinde …" : "Bereit";
    zeichneGalgen(0, 1);
  }
}

/* ---------------------------- Ansicht ----------------------------- */
function stilSetzen(name, merken) {
  if (!["klassisch", "maedchen", "buben"].includes(name)) name = "klassisch";
  document.body.dataset.stil = name;
}
let startStil = TGStil.lokal();
stilSetzen(startStil);
TGStil.beiWechsel(() => stilSetzen(TGStil.lokal()));

if (GEMEINSAM) {
  if (ONLINE) {
    // Lebenszeichen: Der Raum beendet eine Partie nach 90 s ohne Meldung. Die
    // Connector-Seite allein reicht am Handy nicht – dort liegt sie im
    // Hintergrund und meldet sich nur als "nicht aktiv".
    WG.leben({ room: ROOM, id: MYID, name: MYNAME }).then(hole);
  } else {
    // Lokal: kein Server, kein Lebenszeichen – der Stand liegt in der App.
    hole();
  }
  setInterval(hole, 1500);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) hole(); });
} else {
  zeichne();
}
})();
</script>
