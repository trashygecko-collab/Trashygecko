
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#184536">

<title>Paare finden – TrashyGecko</title>
<style>
:root {
  --bg:#184536;
  --panel:#12332a;
  --panel2:#12332a;
  --tile:#184536;
  --tile-hover:#2c5a49;
  --text:#f6edda;
  --muted:#a9c3b6;
  --accent:#e8cd8e;
  --good:#b9e3c6;
  --bad:#e8b3a6;
  --border:#2c5a49;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;padding:16px;
  background:linear-gradient(145deg,#12332a,#184536);
  color:var(--text);font-family:var(--tg-schrift);
}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:3px solid var(--accent);outline-offset:3px
}
.app{
  width:min(100%,760px);margin:0 auto;padding:22px;
  background:var(--panel);border:1px solid var(--border);
  border-radius:18px;box-shadow:0 12px 35px #0003;
}
h2{font-size:20px;text-align:center;margin:10px 0 18px}
h3{font-size:16px;margin:0 0 12px}
.screen{display:none}
.screen.active{display:block}
.intro{text-align:center;color:var(--muted);line-height:1.55;margin-bottom:20px}
.section{margin:18px 0}
.section-label{display:block;font-size:13px;color:var(--muted);margin-bottom:9px}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.choice-grid.two{grid-template-columns:repeat(2,1fr)}
.choice{
  min-height:58px;padding:12px 8px;border-radius:11px;
  border:1px solid var(--border);background:var(--panel2);
  color:var(--text);font-weight:bold;
}
.choice small{display:block;font-size:11px;font-weight:normal;color:var(--muted);margin-top:4px}
.choice.active{border:2px solid var(--accent);background:#184536;color:#f6edda}
.pair-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pair-grid .choice{min-height:47px;font-size:18px}
.primary,.secondary,.danger{
  width:100%;padding:15px;border-radius:11px;font-weight:bold;
  border:1px solid var(--border);margin-top:10px;
}
.primary{background:#2c5a49;color:white;border-color:#6f8f80}
.secondary{background:#184536;color:var(--text)}
.danger{background:#184536;color:#e8b3a6}
.primary:active,.secondary:active,.danger:active,.choice:active{transform:scale(.985)}
input{
  width:100%;padding:14px;border-radius:10px;
  border:1px solid var(--border);background:#184536;color:white;
  margin:6px 0 10px;
}
input::placeholder{color:#6f8f80}
.room-code{font-size:26px;letter-spacing:4px;text-align:center;font-weight:bold;color:var(--accent)}
.note{font-size:12px;color:var(--muted);line-height:1.5;text-align:center}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.player-box{padding:12px;border:1px solid var(--border);border-radius:10px;background:#184536;text-align:center}
.player-box strong{display:block;margin-bottom:5px}
.player-box span{font-size:12px;color:var(--muted)}
.status{padding:12px;border-radius:10px;background:#184536;color:var(--muted);text-align:center;font-size:13px;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{padding:10px 4px;text-align:center;background:#184536;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:11px}
.stat strong{display:block;font-size:20px;color:var(--text);margin-top:5px;font-variant-numeric:tabular-nums}
.board{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:9px;width:100%;max-width:680px;margin:0 auto;
}
.tile{
  min-width:0;aspect-ratio:1/1;padding:2px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid #2c5a49;border-radius:10px;
  background:var(--tile);color:#f6edda;
  font-size:clamp(18px,5vw,32px);font-weight:bold;
  box-shadow:0 3px 0 #184536;
  transition:background .12s,border-color .12s;
  overflow:hidden;
}
.tile:active:not(:disabled){background:var(--tile-hover)}
.tile.selected{background:#2c5a49;border:2px solid #e8cd8e}
/* Gefundene Paare müssen sich deutlich abheben: vorher war der Hintergrund
   genauso dunkelgrün wie bei den verdeckten Feldern (#184536), dadurch war
   nicht zu sehen, was schon gefunden wurde. Jetzt dunkler Grund, grüner Rand
   und grüne Schrift. */
.tile.found{background:#0b241d;border:2px solid #b9e3c6;color:#b9e3c6;box-shadow:none}
/* Zusätzlich zur Farbe ein kleines Häkchen: ein Treffer ist damit auch bei
   Farbsehschwäche oder schlechtem Licht erkennbar. */
.tile{position:relative}
.tile.found::after{content:"✓";position:absolute;top:1px;right:5px;
 font-size:12px;line-height:1;font-weight:normal;color:#b9e3c6}
.tile.wrong{background:#2c5a49;border:2px solid #e8b3a6;color:#f6edda}
.tile:disabled{opacity:1;cursor:default}
.feedback{
  min-height:44px;display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--muted);font-size:16px;margin:10px 0;
}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}
.game-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.game-actions button{margin:0}
.result{
  text-align:center;padding:20px 5px;
}
.result-time{font-size:clamp(38px,10vw,60px);font-weight:bold;margin:15px 0;color:var(--good);font-variant-numeric:tabular-nums}
.result-text{line-height:1.7;color:var(--muted);white-space:pre-line}
.hidden{display:none!important}
@media(max-width:420px){
  body{padding:4px}
  .app{padding:9px;border-radius:13px}
  .board{gap:5px}
  .tile{border-radius:7px;font-size:clamp(17px,5.7vw,25px)}
  .choice{min-height:52px}
}
@media(orientation:landscape) and (max-height:600px){
  body{padding:7px}
  .app{padding:12px}
  .board{max-width:430px;gap:5px}
  .tile{font-size:22px}
}

<body>
<div class="app">
<!-- START -->
<section id="setupScreen" class="screen active">
  <h2>Dein Spiel</h2>
  <div class="intro">Finde die gleichen Zeichen auf dem Spielfeld.<br>Du hast 25 Felder und kannst bis zu 12 Paare suchen.</div>

  <div class="section" id="kindSection">
    <span class="section-label">SPIELART</span>
    <div class="choice-grid">
      <button class="choice active" data-kind="numbers" onclick="chooseKind('numbers')">123<small>Zahlen</small></button>
      <button class="choice" data-kind="letters" onclick="chooseKind('letters')">ABC<small>Buchstaben</small></button>
      <button class="choice" data-kind="symbols" onclick="chooseKind('symbols')">★ ♣<small>Sonderzeichen</small></button>
    </div>
  </div>

  <div class="section" id="pairSection">
    <span class="section-label">ANZAHL DER PAARE</span>
    <div class="pair-grid" id="pairChoices"></div>
  </div>

  <button class="primary" id="soloStartButton" onclick="startSolo()">SPIEL STARTEN</button>

  <div id="onlineWaiting" class="hidden">
    <div class="status" id="onlineStatus">Verbinde mit dem Connector …</div>
    <button class="secondary" onclick="backToMenu()">SPIEL VERLASSEN</button>
  </div>
</section>

<!-- SPIEL -->
<section id="gameScreen" class="screen">
  <div class="stats">
    <div class="stat">ZEIT<strong id="timerDisplay">00:00</strong></div>
    <div class="stat">GEFUNDEN<strong id="foundDisplay">0 / 1</strong></div>
    <div class="stat">FEHLER<strong id="mistakeDisplay">0</strong></div>
  </div>
  <div id="opponentStatus" class="status hidden"></div>
  <div class="board" id="board"></div>
  <div class="feedback" id="feedback">Tippe zwei Felder an.</div>
  <div class="game-actions">
    <button class="secondary" onclick="restartGame()">NEUSTART</button>
    <button class="danger" onclick="backToMenu()">MENÜ</button>
  </div>
</section>

<!-- ERGEBNIS -->
<section id="resultScreen" class="screen">
  <div class="result">
    <h2 id="resultTitle">GESCHAFFT!</h2>
    <div class="result-time" id="resultTime">00:00</div>
    <div class="result-text" id="resultText"></div>
  </div>
  <button class="primary" onclick="restartGame()">NOCH EINE RUNDE</button>

<script>
"use strict";

const API = "/api";
const TOTAL_CELLS = 25;

// Über den Connector geöffnet (?room=TG-XXXX&name=...&id=...) läuft das Spiel
// immer zu zweit. Ohne diese Parameter bleibt es reines Einzelspieler-Spiel.
const urlParams = new URLSearchParams(location.search);
const onlineRoom = (urlParams.get("room")||"").trim().toUpperCase();
const ONLINE = /^TG-[A-F0-9]{4}$/.test(onlineRoom);
const onlinePlayerName = (urlParams.get("name")||"").trim().slice(0,24) || "Spieler";
const SYMBOLS = ["★","☆","♣","♠","♥","♦","●","■","▲","◆","✚","✿","☀","☂","♫","☯","☘","✦","✧","⬟","⬢","☕","⚙","✈","♬","❖"];
let kind = "numbers";
let pairCount = 8;
let mode = "solo";
let boardValues = [];
let matched = [];
let selected = [];
let mistakes = 0;
let found = 0;
let locked = false;
let playing = false;
let startedAt = 0;
let timerInterval = null;
let mismatchTimeout = null;
let matchId = "";
let roomCode = "";
let playerId = "";
let playerName = "Spieler";
let opponentId = "";
let opponentName = "";
let heartbeatInterval = null;
let pollInterval = null;
let myDone = null;
let onlineGame = null;
let seenGameId = "";
let resultShown = false;
let gameSettings = {kind:"numbers",pairs:1};
let pendingStartAt = 0;
// Lob für die geschaffte Runde – steht nach dem Abschluss auch im Ergebnis.
let lobText = "";

const $ = id => document.getElementById(id);

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}
function formatTime(ms) {
  const seconds = Math.max(0,Math.floor(ms/1000));
  return String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
}
function elapsed() {
  return startedAt ? Date.now()-startedAt : 0;
}
function randomInt(max) {
  return Math.floor(Math.random()*max);
}
function shuffle(array) {
  const a=[...array];
  for(let i=a.length-1;i>0;i--){
    const j=randomInt(i+1);
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function seededRandom(seedText) {
  let h=2166136261;
  for(let i=0;i<seedText.length;i++){
    h^=seedText.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return function(){
    h+=0x6D2B79F5;
    let t=h;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function seededShuffle(array,seedText){
  const rand=seededRandom(seedText);
  const a=[...array];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(rand()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function chooseKind(value){
  kind=value;
  document.querySelectorAll("[data-kind]").forEach(b=>b.classList.toggle("active",b.dataset.kind===value));
}
function buildPairChoices(){
  const box=$("pairChoices");
  box.innerHTML="";
  for(let i=1;i<=12;i++){
    const b=document.createElement("button");
    b.className="choice"+(i===pairCount?" active":"");
    b.textContent=i;
    b.onclick=()=>{
      pairCount=i;
      box.querySelectorAll("button").forEach((x,n)=>x.classList.toggle("active",n+1===i));
    };
    box.appendChild(b);
  }
}
function getPlayerId(){
  let id=sessionStorage.getItem("tg-player-id");
  if(!id){
    id=crypto.randomUUID?crypto.randomUUID():"tg-"+Math.random().toString(36).slice(2)+Date.now();
    sessionStorage.setItem("tg-player-id",id);
  }
  return id;
}
function apiFetch(path,options={}){
  return fetch(API+path,{...options,cache:"no-store",headers:{"Content-Type":"application/json",...(options.headers||{})}});
}
async function postPresence(){
  if(!roomCode||!playerId)return;
  const r=await apiFetch("/presence",{method:"POST",body:JSON.stringify({room:roomCode,id:playerId,name:playerName})});
  if(!r.ok)throw new Error("Spielerstatus konnte nicht gesendet werden ("+r.status+").");
}
// Der Spielstand kommt vom Connector, die Partie wird dort eingeladen.
async function fetchOnlineGame(){
  const r=await apiFetch("/paare?room="+encodeURIComponent(roomCode)+"&id="+encodeURIComponent(playerId));
  if(!r.ok)throw new Error("Spielstand nicht erreichbar ("+r.status+").");
  return (await r.json()).game;
}
async function onlineAction(action,payload={}){
  const r=await apiFetch("/paare?room="+encodeURIComponent(roomCode)+"&action="+encodeURIComponent(action),{
    method:"POST",
    body:JSON.stringify({id:playerId,...payload})
  });
  if(!r.ok)throw new Error((await r.text()).trim()||"Aktion fehlgeschlagen.");
  return (await r.json()).game;
}
async function pollOnline(){
  if(!roomCode||!playerId)return;
  try{
    const game=await fetchOnlineGame();
    if(!game)return;
    onlineGame=game;
    const iAmRed=game.redId===playerId;
    opponentId=iAmRed?game.blueId:game.redId;
    opponentName=iAmRed?game.blueName:game.redName;
    if($("onlineStatus")){
      // Der Einladende hat Paare und Zeichenart vorgegeben.
      const kinds={numbers:"Zahlen",letters:"Buchstaben",symbols:"Sonderzeichen"};
      const settings=" · "+game.pairs+" Paare · "+(kinds[game.kind]||game.kind);
      $("onlineStatus").textContent=(game.status==="invited"
        ? "Warte auf die Annahme der Einladung …"
        : "Spiel startet gleich …")+settings;
    }
    if(game.status==="active"&&game.id!==seenGameId){
      seenGameId=game.id;
      launchMatch(game.id,{kind:game.kind,pairs:game.pairs},Date.now()+1500);
    }
    if(game.status==="finished"){
      if(myDone)showOnlineResult();
      else if(game.redDone||game.blueDone){
        $("opponentStatus").classList.remove("hidden");
        $("opponentStatus").textContent=(opponentName||"Dein Mitspieler")+" ist fertig. Spiel deine Runde zu Ende.";
      }
    }
  }catch(e){
    if($("onlineStatus"))$("onlineStatus").textContent="Verbindung wird wiederhergestellt …";
  }
}
function startOnline(){
  mode="multi";
  roomCode=onlineRoom;
  playerName=onlinePlayerName;
  playerId=urlParams.get("id")||getPlayerId();
  if($("kindSection"))$("kindSection").classList.add("hidden");
  if($("pairSection"))$("pairSection").classList.add("hidden");
  if($("soloStartButton"))$("soloStartButton").classList.add("hidden");
  $("onlineWaiting").classList.remove("hidden");
  // Ohne Presence fliegt man nach 20 Sekunden aus dem Spielraum des Connectors.
  heartbeatInterval=setInterval(()=>postPresence().catch(()=>{}),5000);
  postPresence().catch(()=>{});
  pollInterval=setInterval(pollOnline,700);
  pollOnline();
}
function startSolo() {
  mode = "solo";
  gameSettings = { kind: kind, pairs: pairCount };
  launchMatch(
    "solo-" + Date.now(),
    gameSettings,
    Date.now() + 300
  );
}
function launchMatch(id,settings,startAt){
  stopRoundTimers();
  matchId=id;
  gameSettings=settings;
  kind=settings.kind;
  pairCount=settings.pairs;
  mistakes=0;found=0;selected=[];matched=[];
  myDone=null;
  locked=true;playing=true;
  resultShown=false;
  createBoard();
  renderBoard();
  updateStats();
  $("feedback").textContent="Bereit machen ...";
  $("opponentStatus").classList.toggle("hidden",mode!=="multi");
  $("opponentStatus").textContent="Gegen "+(opponentName||"deinen Mitspieler")+": gleiche Zeichen, andere Anordnung.";
  showScreen("gameScreen");
  pendingStartAt=startAt;
  const wait=Math.max(0,startAt-Date.now());
  setTimeout(()=>{
    if(matchId!==id||!playing)return;
    startedAt=startAt;
    locked=false;
    renderBoard(); // Karten jetzt freigeben!
    $("feedback").textContent="Los! Finde alle Paare.";
    timerInterval=setInterval(()=>{
      $("timerDisplay").textContent=formatTime(elapsed())
    },200);
  },wait);
}
function createBoard(){
  const count=25-pairCount;
  let pool;
  if(kind==="numbers"){
    pool=Array.from({length:99},(_,i)=>String(i+1));
  }else if(kind==="letters"){
    pool="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  }else{
    pool=[...SYMBOLS];
  }
  let unique,duplicates;
  if(mode==="multi"){
    // Beide Spieler bekommen exakt dieselben Zeichen, nur anders angeordnet.
    // Ohne diesen festen Seed hätte jeder Spieler eine andere Zeichenauswahl.
    unique=seededShuffle(pool,matchId+"|pool").slice(0,count);
    duplicates=seededShuffle(unique,matchId+"|pairs").slice(0,pairCount);
  }else{
    unique=shuffle(pool).slice(0,count);
    duplicates=shuffle(unique).slice(0,pairCount);
  }
  let values=[...unique,...duplicates];
  values=mode==="multi"?seededShuffle(values,matchId+"|"+playerId):shuffle(values);
  boardValues=values;
  matched=new Array(TOTAL_CELLS).fill(false);
}
function renderBoard(wrong=[]){
  const board=$("board");
  board.innerHTML="";
  boardValues.forEach((value,index)=>{
    const b=document.createElement("button");
    b.className="tile";
    b.textContent=value;
    b.setAttribute("aria-label","Feld "+(index+1)+": "+value);
    if(selected.includes(index))b.classList.add("selected");
    if(matched[index])b.classList.add("found");
    if(wrong.includes(index))b.classList.add("wrong");
    b.disabled=matched[index]||locked||wrong.includes(index)||myDone!==null;
    b.onclick=()=>chooseTile(index);
    board.appendChild(b);
  });
}
function chooseTile(index){
  if(!playing||locked||myDone!==null||matched[index]||selected.includes(index))return;
  selected.push(index);
  renderBoard();
  if(selected.length===2)checkPair();
}
function checkPair(){
  const [a,b]=selected;
  if(boardValues[a]===boardValues[b]){
    matched[a]=matched[b]=true;
    found++;
    selected=[];
    // Gemeinsame Lob-Sprüche (ohne Mahjong-Anspielungen).
    $("feedback").textContent = typeof lobSpruch==="function"
      ? lobSpruch()
      : "Richtig! Paar gefunden.";
    $("feedback").className="feedback good";
    renderBoard();
    updateStats();
    if(found===pairCount)finishRound();
  }else{
    mistakes++;
    locked=true;
    $("feedback").textContent="Das sind zwei verschiedene Zeichen.";
    $("feedback").className="feedback bad";
    renderBoard([a,b]);
    updateStats();
    mismatchTimeout=setTimeout(()=>{
      selected=[];
      locked=false;
      mismatchTimeout=null;
      renderBoard();
      $("feedback").textContent="Versuche es weiter.";
      $("feedback").className="feedback";
    },800);
  }
}
function updateStats(){
  $("foundDisplay").textContent=found+" / "+pairCount;
  $("mistakeDisplay").textContent=mistakes;
  $("timerDisplay").textContent=formatTime(elapsed());
}
async function finishRound(){
  playing=false;
  locked=true;
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  myDone={time:elapsed(),mistakes};
  // Auch für die geschaffte Runde gibt es ein Lob, nicht nur für einzelne Paare.
  lobText = typeof lobSpruch==="function" ? lobSpruch() : "Geschafft!";
  $("feedback").textContent="Alle Paare gefunden – "+lobText;
  $("feedback").className="feedback good";
  renderBoard();
  if(mode==="multi"){
    try{
      await onlineAction("done",{time:myDone.time,mistakes:myDone.mistakes});
    }catch(e){
      $("feedback").textContent="Fertig – Ergebnis konnte nicht gesendet werden.";
    }
    $("opponentStatus").classList.remove("hidden");
    $("opponentStatus").textContent="Du bist fertig. Warte auf "+(opponentName||"deinen Mitspieler")+" ...";
    await pollOnline();
  }else{
    showSoloResult();
  }
}
// Ergebnis aus dem Spielstand des Connectors: der Server kennt beide Zeiten.
function showOnlineResult(){
  if(!onlineGame||!myDone||onlineGame.status!=="finished"||resultShown)return;
  const iAmRed=onlineGame.redId===playerId;
  const mine=(iAmRed?onlineGame.redDone:onlineGame.blueDone)||myDone;
  const theirs=iAmRed?onlineGame.blueDone:onlineGame.redDone;
  const theirName=opponentName||"Mitspieler";
  let title,text;
  if(!theirs){
    title="GESCHAFFT!";
    text="Du warst zuerst fertig.\nDeine Zeit: "+formatTime(mine.time);
  }else if(onlineGame.winner==="draw"){
    title="UNENTSCHIEDEN!";
    text="Beide Spieler waren gleich schnell: "+formatTime(mine.time);
  }else if((onlineGame.winner==="red")===iAmRed){
    title="DU HAST GEWONNEN!";
    text="Deine Zeit: "+formatTime(mine.time)+"\n"+theirName+": "+formatTime(theirs.time);
  }else{
    title=theirName.toUpperCase()+" GEWINNT!";
    text="Deine Zeit: "+formatTime(mine.time)+"\n"+theirName+": "+formatTime(theirs.time);
  }
  resultShown=true;
  $("resultTitle").textContent=title;
  $("resultTime").textContent=formatTime(mine.time);
  $("resultText").textContent=(lobText?lobText+"\n\n":"")+text+"\n\nDeine Fehler: "+mine.mistakes;
  showScreen("resultScreen");
}
// Bestenliste: die schnellste Zeit je Einstellung (Spielart + Anzahl Paare).
// Bewusst nur im Browser gespeichert – keine Anmeldung, kein Server.
function bestKey(settings){
  return "paare:best:"+settings.kind+":"+settings.pairs;
}
function liesBestzeit(settings){
  try{
    const wert=Number(localStorage.getItem(bestKey(settings)));
    return Number.isFinite(wert)&&wert>0?wert:null;
  }catch(e){
    return null;
  }
}
function merkeBestzeit(settings,zeit){
  const alt=liesBestzeit(settings);
  if(alt!==null&&alt<=zeit)return false;
  try{ localStorage.setItem(bestKey(settings),String(Math.round(zeit))); }catch(e){}
  return true;
}
function artName(wert){
  return ({numbers:"Zahlen",letters:"Buchstaben",symbols:"Sonderzeichen"})[wert]||wert;
}
function showSoloResult(){
  const zeit=myDone.time;
  const vorher=liesBestzeit(gameSettings);
  const neueBestzeit=merkeBestzeit(gameSettings,zeit);
  $("resultTitle").textContent="GESCHAFFT!";
  $("resultTime").textContent=formatTime(zeit);
  const zeilen=[];
  if(lobText)zeilen.push(lobText,"");
  zeilen.push("Du hast alle "+gameSettings.pairs+" Paare gefunden.");
  zeilen.push("Fehlversuche: "+mistakes,"");
  zeilen.push("Deine Zeit: "+formatTime(zeit));
  if(neueBestzeit){
    zeilen.push(vorher===null
      ? "Das ist die erste Bestzeit für diese Einstellung!"
      : "Neue Bestzeit! Vorher: "+formatTime(vorher));
  }else{
    zeilen.push("Bestzeit war "+formatTime(vorher)+" ("+gameSettings.pairs+" Paare · "+artName(gameSettings.kind)+").");
  }
  $("resultText").textContent=zeilen.join("\n");
  showScreen("resultScreen");
}
function stopRoundTimers(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  if(mismatchTimeout){clearTimeout(mismatchTimeout);mismatchTimeout=null}
}
function restartGame(){
  if(mode==="multi"){
    if(!roomCode)return;
    onlineAction("reset").then(game=>{
      if(!game)return;
      seenGameId=game.id;
      launchMatch(game.id,{kind:game.kind,pairs:game.pairs},Date.now()+1200);
    }).catch(e=>{
      // Eine neue Runde gibt es erst, wenn beide fertig sind.
      alert(e.message);
    });
  }else{
    launchMatch("solo-"+Date.now(),{kind,pairs:pairCount},Date.now()+300);
  }
}
function stopConnectorLoops(){
  if(heartbeatInterval){clearInterval(heartbeatInterval);heartbeatInterval=null}
  if(pollInterval){clearInterval(pollInterval);pollInterval=null}
}
function backToMenu(){
  stopRoundTimers();
  stopConnectorLoops();
  if(mode==="multi"){
    tgVerlassen();
    return;
  }
  playing=false;
  showScreen("setupScreen");
}
window.addEventListener("beforeunload",()=>{
  stopConnectorLoops();
  stopRoundTimers();
});
buildPairChoices();

if(ONLINE){
  startOnline();
}
</script>
<script src="../../zurueck.js" data-ziel="div.app" data-anfang="1" data-auf="karte" data-nur="ohne-room"></script>
