<!DOCTYPE html>
<html lang="de">
<head>
<script src="/spiele/token.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Wortsuche</title>
<link rel="stylesheet" href="/spiele/schrift.css">
<style>
:root{
  --bg:#0a211b; --panel:#0f2b23; --line:#1d4a3a; --gold:#e8cd8e; --ink:#f6edda;
  --muted:#a9c3b6; --gruen:#4fbf72; --rot:#e04b3f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;padding:10px;background:radial-gradient(ellipse at 20% 0%,#12332a 0%,transparent 45%),var(--bg);
  color:var(--ink);font-family:var(--tg-schrift);display:flex;justify-content:center;
}
.app{width:min(1120px,100%);display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}
.kopf{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.titel{font-size:clamp(17px,2.4vw,24px);color:var(--gold);letter-spacing:2px}
.kopf small{color:var(--muted)}
.mitte{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.62fr);gap:10px;flex:1 1 auto;min-height:0}
@media(max-width:820px){.mitte{grid-template-columns:minmax(0,1fr)}}
/* Eine Regel für das Gitter: die Kante folgt dem kleineren Maß aus Breite und
   Höhe, damit Gitter und Bedienleisten ohne Scrollbalken zusammenpassen. */
.gitter{
  --rand:min(230px, 32vh);
  min-width:0;
  width:min(100%, calc(100dvh - var(--rand)));
  margin:0 auto;aspect-ratio:1;display:grid;
  grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));
  gap:clamp(2px,.5vh,4px);
}
@media(max-width:820px){
  .gitter{--rand:min(320px, 40vh)}
}
.zelle{border:1px solid var(--line);border-radius:6px;background:#14382d;color:var(--ink);
  font-family:inherit;font-weight:bold;font-size:clamp(9px,min(2.6vh,2.6vw),20px);
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;min-height:0;
  transition:background .12s,transform .08s}
.zelle:hover:not(:disabled){background:#1b4a3a}
.zelle:active{transform:scale(.95)}
.zelle.wahl{background:#3b3221;border-color:var(--gold);color:var(--gold)}
.zelle.gef{background:#1f5d43;border-color:var(--gruen);color:#dff7e6}
.zelle:disabled{cursor:default}
.karte{background:linear-gradient(160deg,#0f2b23,#0a211b);border:1px solid var(--line);border-radius:14px;
  padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.seite{overflow:hidden}
.leiste{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
select,button.aktion{font-family:inherit;background:#14382d;color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;cursor:pointer}
button.aktion:disabled{opacity:.45;cursor:default}
button.aktion.haupt{background:var(--gold);color:#0a211b;border-color:#d9bc7c;font-weight:bold}
.worte{display:flex;flex-wrap:wrap;gap:5px;overflow:auto;min-height:0;align-content:flex-start}
.wort{border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:clamp(11px,1.7vh,14px);
  letter-spacing:1px;background:#0b241d}
.wort.gef{color:var(--gruen);border-color:var(--gruen);text-decoration:line-through}
.wort b{color:var(--muted);font-weight:normal;font-size:.85em;margin-left:6px}
.spieler{display:flex;flex-direction:column;gap:5px;overflow:auto;min-height:0}
.sp{margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;
  border:1px solid var(--line);border-radius:8px;background:#0b241d;font-size:13px}
.sp b{color:var(--gold)}
.notiz{color:var(--muted);font-size:13px;min-height:18px}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-height:70px;overflow:auto}
.versteckt{display:none!important}
</style>
</head>
<body>
<main class="app">
  <header class="kopf">
    <div class="titel">WORTSUCHE</div>
    <small id="lage">Bereit</small>
    <div class="leiste" id="startLeiste">
      <button class="aktion haupt" id="btnStart">Spiel starten</button>
      <button class="aktion" id="btnNeu">Neue Runde</button>
    </div>
    <div class="leiste versteckt" id="onlineLeiste">
      <button class="aktion haupt" id="btnErstellen">Runde eröffnen</button>
      <button class="aktion" id="btnBereit">Bereit</button>
      <button class="aktion" id="btnLos">Los</button>
    </div>
  </header>

  <section class="mitte">
    <div class="gitter" id="gitter"></div>

    <aside class="karte seite">
      <div class="leiste"><b id="rundenTitel">Runde 1</b><span class="notiz" id="zeitText"></span></div>
      <div class="worte" id="worte"></div>
      <div class="spieler" id="spieler"></div>
      <div class="log" id="log"></div>
      <div class="notiz" id="hinweis"></div>
      <div class="notiz" id="notiz"></div>
      <div class="leiste versteckt" id="ende">
        <button class="aktion haupt" id="btnNochmal">Nächste Runde</button>
      </div>
    </aside>
  </section>
</main>

<script>
(() => {
"use strict";
/* Online oder lokal: gleiche Oberfläche, zwei Antriebe. Die lokale Runde
   erzeugt Gitter und Wörter selbst und prüft die Auswahl nach denselben
   Regeln wie der Server (gerade Linie, Wort von der Liste, noch offen). */
const P = new URLSearchParams(location.search);
const ROOM = (P.get("room") || "").trim().toUpperCase();
const ONLINE = /^TG-[A-F0-9]{4}$/.test(ROOM);
const MYID = (P.get("id") || "").trim();
const MYNAME = (P.get("name") || "").trim() || "Spieler";

const KANTE = 10, ANZAHL = 8, DAUER = 180, FAKTOR = 10;
const WORTLISTE = [
  "garten","fenster","brunnen","schule","hafen","insel","wolke","regen",
  "schnee","sonne","mond","stern","rakete","planet","galaxie","komet",
  "apfel","banane","kirsche","zitrone","salat","brot","kaese","milch",
  "tisch","stuhl","schrank","teppich","spiegel","lampe","vorhang","kissen",
  "fahrrad","motor","kabel","batterie","schraube","gitarre","trommel","klavier",
  "geige","floete","konzert","lehrer","arzt","pilot","maler","gaertner",
  "elefant","katze","hund","pinguin","fuchs","igel","wal","adler",
  "strand","hotel","koffer","urlaub","berg","tal","fluss","wiese",
  "blume","stein","sand","meer","bucht","wald","baum","zeitung",
  "brief","brille","tasche","uhr","schluessel","kuchen","keks","honig",
  "eimer","schaufel","leiter","haken","seil","laterne","kerze","teller",
  "messer","gabel","loffel","topf","pfanne","ofen","herd","fensterbank"
];
const RICHTUNGEN = [[0,1],[1,0],[1,1],[1,-1]];

const $ = (id) => document.getElementById(id);
const melde = (text) => { $("hinweis").textContent = text || ""; };
const elGitter = $("gitter"), elWorte = $("worte"), elSpieler = $("spieler"),
      elLog = $("log"), elNotiz = $("notiz"), elLage = $("lage"), elZeit = $("zeitText"),
      elRunde = $("rundenTitel"), elEnde = $("ende");

const mische = (liste) => {
  const a = liste.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* ---------------------------- lokal ------------------------------- */
let lokal = null;
let wahl = null;   // erste gewählte Zelle {z,s}

function gitterBauen() {
  const gitter = Array.from({ length: KANTE }, () => new Array(KANTE).fill(""));
  const worte = [];
  for (const kandidat of mische(WORTLISTE)) {
    if (worte.length >= ANZAHL) break;
    const wort = kandidat.toUpperCase();
    if (wort.length > KANTE) continue;
    for (let versuch = 0; versuch < 60; versuch++) {
      const [dz, ds] = RICHTUNGEN[Math.floor(Math.random() * RICHTUNGEN.length)];
      const z = Math.floor(Math.random() * KANTE);
      const s = Math.floor(Math.random() * KANTE);
      const ez = z + (wort.length - 1) * dz, es = s + (wort.length - 1) * ds;
      if (ez < 0 || es < 0 || ez >= KANTE || es >= KANTE) continue;
      let passt = true;
      for (let k = 0; k < wort.length; k++) {
        const feld = gitter[z + k * dz][s + k * ds];
        if (feld && feld !== wort[k]) { passt = false; break; }
      }
      if (!passt) continue;
      for (let k = 0; k < wort.length; k++) gitter[z + k * dz][s + k * ds] = wort[k];
      worte.push(wort);
      break;
    }
  }
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for (let z = 0; z < KANTE; z++) {
    for (let s = 0; s < KANTE; s++) {
      if (!gitter[z][s]) gitter[z][s] = alphabet[Math.floor(Math.random() * alphabet.length)];
    }
  }
  return { gitter, worte: worte.sort() };
}

function lokaleRunde(weiter) {
  const neu = gitterBauen();
  lokal = {
    id: MYID || "ich", name: MYNAME,
    runde: (weiter && lokal ? lokal.runde : 0) + 1,
    gitter: neu.gitter, worte: neu.worte,
    funde: [], punkte: 0, treffer: 0, fehlversuch: 0,
    status: "spiel", rest: DAUER, start: Date.now(),
    sieger: "", note: "Finde die " + neu.worte.length + " Wörter – waagerecht, senkrecht oder schräg."
  };
  wahl = null;
  melde("");
}

function lokalRest() {
  if (!lokal || lokal.status !== "spiel") return lokal ? lokal.rest : 0;
  const rest = DAUER - Math.floor((Date.now() - lokal.start) / 1000);
  if (rest <= 0) {
    lokal.status = "ende";
    lokal.rest = 0;
    lokal.note = "Die Zeit ist um – " + lokal.funde.length + " von " + lokal.worte.length + " Wörtern gefunden.";
    return 0;
  }
  lokal.rest = rest;
  return rest;
}

// Buchstaben vom Start zum Ziel lesen; liefert Wort und Zellen in Wortrichtung.
function leseLinie(von, bis) {
  const dz = bis.z - von.z, ds = bis.s - von.s;
  if (dz === 0 && ds === 0) return null;
  if (!(dz === 0 || ds === 0 || dz === ds || dz === -ds)) return null;
  const sz = Math.sign(dz), ss = Math.sign(ds);
  const laenge = Math.max(Math.abs(dz), Math.abs(ds)) + 1;
  const zellen = [], zeichen = [];
  for (let k = 0; k < laenge; k++) {
    const z = von.z + k * sz, s = von.s + k * ss;
    if (z < 0 || s < 0 || z >= KANTE || s >= KANTE) return null;
    zellen.push({ z, s });
    zeichen.push(gitterVon().zellen[z][s]);
  }
  return { zellen, text: zeichen.join(""), textUm: zeichen.slice().reverse().join("") };
}

function gitterVon() {
  if (ONLINE) return { zellen: onlineGitter, worte: onlineWorte };
  return { zellen: lokal.gitter, worte: lokal.worte };
}

function lokalFinden(von, bis) {
  if (!lokal || lokal.status !== "spiel") return;
  const linie = leseLinie(von, bis);
  if (!linie) { melde("Wörter liegen nur waagerecht, senkrecht oder schräg."); return; }
  const wort = lokal.worte.includes(linie.text) ? linie.text
    : lokal.worte.includes(linie.textUm) ? linie.textUm : "";
  if (!wort) { melde("Diese Buchstabenfolge steht nicht auf der Liste."); return; }
  if (lokal.funde.some((f) => f.wort === wort)) { melde("Das Wort wurde schon gefunden."); return; }
  const punkte = wort.length * FAKTOR;
  lokal.punkte += punkte;
  lokal.treffer++;
  const zellen = (linie.text === wort ? linie.zellen : linie.zellen.slice().reverse())
    .map((c) => [c.z, c.s]);
  lokal.funde.push({ wort, vonId: lokal.id, vonName: lokal.name, punkte, zellen });
  melde("");
  lokal.note = lokal.name + " findet „" + wort + "“ (+" + punkte + ").";
  if (lokal.funde.length === lokal.worte.length) {
    lokal.status = "ende";
    lokal.sieger = lokal.id;
    lokal.note = "Alle Wörter gefunden – " + lokal.punkte + " Punkte.";
  }
  zeichne();
}

/* ---------------------------- gemeinsam --------------------------- */
let onlineGame = null, onlineBusy = false;
let onlineGitter = [], onlineWorte = [];

async function api(aktion, koerper) {
  const url = "/api/wortsuche?room=" + encodeURIComponent(ROOM) +
    (aktion ? "&action=" + encodeURIComponent(aktion) : "&id=" + encodeURIComponent(MYID));
  const r = await fetch(url, aktion ? {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ id: MYID }, koerper || {}))
  } : { cache: "no-store" });
  if (!r.ok) throw new Error((await r.text()).trim() || "Aktion fehlgeschlagen.");
  return r.json();
}

async function hole() {
  if (!ONLINE || onlineBusy) return;
  onlineBusy = true;
  try {
    const d = await api(null);
    onlineGame = d.game || null;
    zeichne();
  } catch (e) {
    elLage.textContent = e.message;
  } finally {
    onlineBusy = false;
  }
}

async function schicke(aktion, koerper) {
  if (onlineBusy) return false;
  onlineBusy = true;
  try {
    const d = await api(aktion, koerper);
    onlineGame = d.game || null;
    zeichne();
    return true;
  } catch (e) {
    melde(e.message);
    return false;
  } finally {
    onlineBusy = false;
  }
}

function onlineFinden(von, bis) {
  const linie = leseLinie(von, bis);
  if (!linie) { melde("Wörter liegen nur waagerecht, senkrecht oder schräg."); return; }
  const wort = onlineWorte.includes(linie.text) ? linie.text
    : onlineWorte.includes(linie.textUm) ? linie.textUm : "";
  if (!wort) { melde("Diese Buchstabenfolge steht nicht auf der Liste."); return; }
  melde("");
  const weg = linie.text === wort ? linie.zellen : linie.zellen.slice().reverse();
  schicke("finden", {
    wort, von: [weg[0].z, weg[0].s], bis: [weg[weg.length - 1].z, weg[weg.length - 1].s]
  });
}

/* ---------------------------- Zeichnen ---------------------------- */
function zeichne() {
  if (ONLINE) zeichneOnline();
  else if (lokal) zeichneLokal();
}

function zeichneGitter(zellen, funde) {
  const gefunden = new Map();
  for (const f of funde || []) {
    for (const c of (f.zellen || [])) {
      const z = Array.isArray(c) ? c[0] : c.z;
      const s = Array.isArray(c) ? c[1] : c.s;
      gefunden.set(z + ":" + s, f.wort);
    }
  }
  elGitter.innerHTML = "";
  const aktiv = (ONLINE ? onlineGame && onlineGame.status === "spiel" : lokal && lokal.status === "spiel");
  for (let z = 0; z < KANTE; z++) {
    for (let s = 0; s < KANTE; s++) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "zelle";
      b.dataset.z = z;
      b.dataset.s = s;
      b.textContent = (zellen[z] && zellen[z][s]) || "";
      if (gefunden.has(z + ":" + s)) {
        b.classList.add("gef");
        b.title = gefunden.get(z + ":" + s);
      }
      if (wahl && wahl.z === z && wahl.s === s) b.classList.add("wahl");
      b.disabled = !aktiv;
      elGitter.appendChild(b);
    }
  }
}

function zeichneWorte(worte, funde) {
  elWorte.innerHTML = "";
  const wer = new Map();
  for (const f of funde || []) wer.set(f.wort, f.vonName);
  for (const w of worte || []) {
    const d = document.createElement("span");
    d.className = "wort" + (wer.has(w) ? " gef" : "");
    d.textContent = w;
    if (wer.has(w)) {
      const b = document.createElement("b");
      b.textContent = wer.get(w);
      d.appendChild(b);
    }
    elWorte.appendChild(d);
  }
}

function zeichneAlles({ status, runde, rest, spieler, funde, note, sieger, worte }) {
  elRunde.textContent = "Runde " + runde;
  elLage.textContent = status === "invited" ? "Warte auf Mitspieler"
    : status === "ende" ? (sieger ? "Gewonnen" : "Runde vorbei") : "Läuft";
  elZeit.textContent = status === "spiel" ? "· " + rest + " s" : "";
  elNotiz.textContent = note || "";

  elSpieler.innerHTML = "";
  for (const s of spieler || []) {
    const p = document.createElement("p");
    p.className = "sp";
    const n = document.createElement("span");
    n.textContent = s.name + (s.id === MYID || (!ONLINE && s.id === (lokal && lokal.id)) ? " (du)" : "");
    const b = document.createElement("b");
    b.textContent = s.punkte + " Punkte · " + s.treffer;
    p.append(n, b);
    elSpieler.appendChild(p);
  }

  elLog.innerHTML = "";
  for (const f of (funde || []).slice(-6)) {
    const d = document.createElement("div");
    d.textContent = f.vonName + ": " + f.wort;
    elLog.appendChild(d);
  }

  elEnde.classList.toggle("versteckt", status !== "ende");
  zeichneWorte(worte, funde);
}

function zeichneLokal() {
  const rest = lokalRest();
  zeichneAlles({
    status: lokal.status, runde: lokal.runde, rest, worte: lokal.worte, funde: lokal.funde,
    note: lokal.note, sieger: lokal.sieger,
    spieler: [{ id: lokal.id, name: lokal.name, punkte: lokal.punkte, treffer: lokal.treffer }]
  });
  zeichneGitter(lokal.gitter, lokal.funde);
}

function zeichneOnline() {
  const g = onlineGame;
  $("startLeiste").classList.add("versteckt");
  $("onlineLeiste").classList.remove("versteckt");
  if (!g) {
    elLage.textContent = "Keine Runde";
    elRunde.textContent = "—";
    elZeit.textContent = "";
    elGitter.innerHTML = "";
    elWorte.innerHTML = "";
    elSpieler.innerHTML = "";
    elLog.innerHTML = "";
    elNotiz.textContent = "Eröffne eine Runde – Mitspieler treten im Raum bei.";
    elEnde.classList.add("versteckt");
    $("btnErstellen").classList.remove("versteckt");
    $("btnBereit").classList.add("versteckt");
    $("btnLos").classList.add("versteckt");
    onlineGitter = [];
    return;
  }
  onlineGitter = g.gitter || [];
  onlineWorte = g.worte || [];
  zeichneAlles({
    status: g.status, runde: g.runde, rest: g.rest, worte: g.worte, funde: g.funde,
    note: g.note, sieger: g.sieger, spieler: g.spieler
  });
  zeichneGitter(onlineGitter, g.funde);
  const ich = (g.spieler || []).find((s) => s.id === MYID);
  $("btnErstellen").classList.toggle("versteckt", true);
  $("btnBereit").classList.toggle("versteckt", g.status !== "invited");
  $("btnLos").classList.toggle("versteckt", g.status !== "invited");
  if (g.status === "invited") {
    $("btnBereit").textContent = ich && ich.ready ? "Nicht bereit" : "Bereit";
    $("btnLos").textContent = "Los (" + g.spieler.filter((s) => s.ready).length + "/" + g.spieler.length + " bereit)";
  }
}

/* ---------------------------- Bedienung --------------------------- */
elGitter.addEventListener("click", (e) => {
  const b = e.target.closest(".zelle");
  if (!b || b.disabled) return;
  const z = Number(b.dataset.z), s = Number(b.dataset.s);
  if (!wahl) {
    wahl = { z, s };
    zeichne();
    return;
  }
  if (wahl.z === z && wahl.s === s) { wahl = null; zeichne(); return; }
  const von = wahl;
  wahl = null;
  if (ONLINE) onlineFinden(von, { z, s });
  else lokalFinden(von, { z, s });
  zeichne();
});

$("btnStart").addEventListener("click", () => { lokaleRunde(false); zeichne(); });
$("btnNochmal").addEventListener("click", () => {
  if (ONLINE) schicke("naechste");
  else { lokaleRunde(true); zeichne(); }
});
$("btnNeu").addEventListener("click", () => {
  if (ONLINE) schicke("reset");
  else {
    lokal = null; wahl = null;
    elWorte.innerHTML = ""; elSpieler.innerHTML = ""; elLog.innerHTML = ""; elRunde.textContent = "Runde 1";
    elZeit.textContent = ""; elNotiz.textContent = "Starte eine Runde – das Gitter wird gemischt.";
    elEnde.classList.add("versteckt");
    zeichneGitter([], []);
    $("startLeiste").classList.remove("versteckt");
  }
});
$("btnErstellen").addEventListener("click", () => schicke("create"));
$("btnBereit").addEventListener("click", () => schicke("ready"));
$("btnLos").addEventListener("click", () => schicke("start"));

if (ONLINE) {
  hole();
  setInterval(hole, 1500);
  // Die Uhr läuft auch ohne Antwort des Servers weiter.
  setInterval(() => { if (onlineGame && onlineGame.status === "spiel" && onlineGame.rest > 0) { onlineGame.rest--; elZeit.textContent = "· " + onlineGame.rest + " s"; } }, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) hole(); });
} else {
  zeichneGitter([], []);
  setInterval(() => {
    if (!lokal || lokal.status !== "spiel") return;
    const rest = lokalRest();
    if (rest > 0) elZeit.textContent = "· " + rest + " s";
    else zeichne();
  }, 1000);
  elNotiz.textContent = "Starte eine Runde – das Gitter wird gemischt.";
}
})();
</script>
</body>
</html>
