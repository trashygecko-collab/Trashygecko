
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON – Mühle</title>

<style>
:root {
  --bg:#080710;
  --panel:#151322;
  --red:#ff405c;
  --blue:#35d8ff;
  --purple:#a855f7;
  --white:#f5f0ff;
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  min-height:100svh;
  background:var(--bg);
  color:var(--white);
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  padding:12px 10px 24px;
}

.game {
  width:100%;
  max-width:480px;
  text-align:center;
}

h1 {
  margin:5px 0 14px;
  font-size:clamp(27px,7vw,36px);
  color:#e5a2ff;
  text-shadow:0 0 8px #a855f7,0 0 20px #a855f7;
  letter-spacing:4px;
}

.turn {
  background:var(--panel);
  border:1px solid #69418b;
  border-radius:12px;
  padding:12px 8px;
  margin-bottom:10px;
  font-size:19px;
  font-weight:bold;
  color:var(--red);
  text-shadow:0 0 10px currentColor;
}

.scores {
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.score {
  flex:1;
  padding:9px 5px;
  background:var(--panel);
  border:1px solid #393047;
  border-radius:10px;
  font-size:15px;
  font-weight:bold;
}

.score.red { color:var(--red); }
.score.blue { color:var(--blue); }

.score span {
  display:block;
  font-size:22px;
  margin-top:3px;
}

.board-frame {
  width:100%;
  padding:7px;
  border-radius:15px;
  background:linear-gradient(145deg,#43215d,#171326,#33204d);
  border:2px solid var(--purple);
  box-shadow:0 0 12px #a855f7,0 0 28px #7c3aad66;
}

.board {
  position:relative;
  width:100%;
  aspect-ratio:1;
  background:#0b0914;
  border-radius:9px;
  overflow:hidden;
  touch-action:manipulation;
}

.board svg {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.board-line {
  fill:none;
  stroke:#a855f7;
  stroke-width:5;
  stroke-linecap:round;
  filter:drop-shadow(0 0 5px #a855f7);
}

.point {
  position:absolute;
  width:10%;
  height:10%;
  min-width:0;
  padding:0;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid #a855f7;
  background:#21152e;
  box-shadow:0 0 7px #a855f7;
  cursor:pointer;
  z-index:2;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

.point.red {
  background:var(--red);
  border:2px solid #ffb2bd;
  box-shadow:0 0 8px var(--red),0 0 18px var(--red);
}

.point.blue {
  background:var(--blue);
  border:2px solid #b6f5ff;
  box-shadow:0 0 8px var(--blue),0 0 18px var(--blue);
}

.point.selected {
  outline:4px solid white;
  outline-offset:3px;
  animation:pulse .6s infinite alternate;
}

.point.mill {
  box-shadow:0 0 10px white,0 0 22px currentColor;
}

.point.possible {
  border:3px solid white;
  background:#a855f7;
  box-shadow:0 0 12px white,0 0 22px #a855f7;
  animation:pulse .7s infinite alternate;
}

@keyframes pulse {
  from { filter:brightness(1); }
  to { filter:brightness(1.8); }
}

.message {
  min-height:45px;
  margin:12px 0;
  padding:10px;
  background:#151322;
  border:1px solid #393047;
  border-radius:10px;
  font-size:15px;
  line-height:1.4;
  color:#e5d5f5;
}

.reset {
  width:100%;
  max-width:300px;
  border:1px solid #c77aff;
  border-radius:12px;
  background:#24132f;
  color:white;
  padding:14px 20px;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 0 12px #a855f755;
  cursor:pointer;
  touch-action:manipulation;
}

.reset:active {
  transform:scale(.97);
  background:#48205e;
}

.hint {
  color:#82758f;
  font-size:12px;
  margin-top:12px;
}

@media (max-height:720px) {
  body { padding-top:4px; }
  h1 { margin:2px 0 7px; }
  .turn { padding:8px; margin-bottom:7px; }
  .scores { margin-bottom:7px; }
  .score { padding:5px; }
  .board-frame { padding:5px; }
  .message { margin:7px 0; padding:7px; }
  .reset { padding:10px; }
}

</style>
</head>

<body>
<div class="game">

  <h1>MÜHLE</h1>

  <div class="turn" id="turn">Rot ist am Zug</div>

  <div class="scores">
    <div class="score red">
      ROT
      <span id="redCount">9</span>
      <small>Spielsteine</small>
    </div>

    <div class="score blue">
      BLAU
      <span id="blueCount">9</span>
      <small>Spielsteine</small>
    </div>
  </div>

  <div class="board-frame">
    <div class="board" id="board">
      <svg id="lines" viewBox="0 0 700 700"></svg>
    </div>
  </div>

  <div class="message" id="message">
    Rot beginnt. Setze deinen ersten Stein auf einen freien Punkt.
  </div>

  <button class="reset" id="resetBtn" onclick="newGame()">
    ↻ NEUES SPIEL
  </button>

  <div class="hint">
    Drei eigene Steine in einer Reihe bilden eine Mühle.
  </div>

</div>

<script src="/spiele/netz.js"></script>
<script>
const board = document.getElementById("board");
const lines = document.getElementById("lines");

const RED = "red";
const BLUE = "blue";

// Die 24 Positionen des klassischen Mühlebretts.
// Jedes Quadrat ist im Uhrzeigersinn angeordnet.
const rings = [
  [[0,0],[3,0],[6,0],[6,3],[6,6],[3,6],[0,6],[0,3]],
  [[1,1],[3,1],[5,1],[5,3],[5,5],[3,5],[1,5],[1,3]],
  [[2,2],[3,2],[4,2],[4,3],[4,4],[3,4],[2,4],[2,3]]
];

const points = rings.flat().map(([x,y]) => ({
  x,y
}));

const mills = [];

// Mühlen aus den drei Quadraten
for (let ring=0; ring<3; ring++) {
  const offset = ring*8;

  for (let i=0; i<8; i+=2) {
    mills.push([
      offset+i,
      offset+i+1,
      offset+(i+2)%8
    ]);
  }
}

// Verbindungslinien zwischen den Quadraten
for (let i of [1,3,5,7]) {
  mills.push([i,8+i,16+i]);
}

// Aus den Mühlen die Bewegungsverbindungen ableiten
const neighbors = Array.from(
  {length:24},
  () => []
);

const edges = [];

for (let ring=0; ring<3; ring++) {
  const offset = ring*8;

  for (let i=0; i<8; i++) {
    const a = offset+i;
    const b = offset+(i+1)%8;

    edges.push([a,b]);
  }
}

for (let i of [1,3,5,7]) {
  edges.push([i,8+i]);
  edges.push([8+i,16+i]);
}

for (const [a,b] of edges) {
  neighbors[a].push(b);
  neighbors[b].push(a);
}

let state;
let current;
let placed;
let selected = null;
let phase;
let gameOver = false;
let capturePending = false;

function newGame() {
  if (ONLINE) { resetOnline(); return; }
  state = Array(24).fill(null);
  current = RED;
  placed = {red:0,blue:0};
  selected = null;
  phase = "placing";
  gameOver = false;
  capturePending = false;

  document.getElementById("resetBtn").textContent =
    "↻ NEUES SPIEL";

  renderBoard();
  updateDisplay();

  document.getElementById("message").textContent =
    "Rot beginnt. Setze deinen ersten Stein auf einen freien Punkt.";
}

function renderBoard() {
  // Alte Punkte entfernen, SVG-Linien bleiben bestehen
  board.querySelectorAll(".point").forEach(el => el.remove());

  lines.innerHTML = "";

  // Linien des klassischen Mühlebretts zeichnen
  for (const [a,b] of edges) {
    const p1 = points[a];
    const p2 = points[b];

    const line = document.createElementNS(
      "http://www.w3.org/2000/svg","line"
    );

    line.setAttribute("x1",p1.x*100+50);
    line.setAttribute("y1",p1.y*100+50);
    line.setAttribute("x2",p2.x*100+50);
    line.setAttribute("y2",p2.y*100+50);
    line.setAttribute("class","board-line");

    lines.appendChild(line);
  }

  // Die 24 anklickbaren Positionen
  for (let i=0; i<24; i++) {
    const p = points[i];
    const button = document.createElement("button");

    button.className = "point";

    button.style.left = ((p.x+0.5)/7*100)+"%";
    button.style.top = ((p.y+0.5)/7*100)+"%";

    if (state[i]) {
      button.classList.add(state[i]);
    }

    if (selected === i) {
      button.classList.add("selected");
    }

    if (isPossible(i)) {
      button.classList.add("possible");
    }

    if (state[i] && isMill(i,state[i])) {
      button.classList.add("mill");
    }

    button.setAttribute("aria-label",
      state[i]
        ? "Punkt "+(i+1)+", "+state[i]
        : "Freier Punkt "+(i+1)
    );

    button.onclick = () => clickPoint(i);

    board.appendChild(button);
  }
}

function isMill(index,player) {
  return mills.some(m =>
    m.includes(index) &&
    m.every(i => state[i] === player)
  );
}

function isPossible(index) {
  if (gameOver || capturePending) return false;

  if (phase === "placing") {
    return state[index] === null;
  }

  if (phase === "moving" && selected !== null) {
    return state[index] === null &&
      (getCount(current) === 3 ||
       neighbors[selected].includes(index));
  }

  return false;
}

function getCount(player) {
  return state.filter(s => s === player).length;
}

function canRemove(index) {
  if (state[index] !== other(current)) return false;

  const opponent = other(current);
  const opponentPieces = state
    .map((s,i) => s === opponent ? i : -1)
    .filter(i => i !== -1);

  // Steine in einer Mühle sind geschützt,
  // solange noch ein Stein außerhalb einer Mühle steht.
  const outside = opponentPieces.filter(i => !isMill(i,opponent));

  return outside.length > 0
    ? !isMill(index,opponent)
    : true;
}

function other(player) {
  return player === RED ? BLUE : RED;
}

function clickPoint(index) {
  if (ONLINE) { clickPointOnline(index); return; }
  if (gameOver) return;

  if (capturePending) {
    if (!canRemove(index)) {
      document.getElementById("message").textContent =
        "Du darfst diesen Stein nicht schlagen. Wähle einen anderen.";
      return;
    }

    state[index] = null;
    capturePending = false;
    selected = null;

    document.getElementById("message").textContent =
      (current === RED ? "Rot" : "Blau")+
      " hat einen gegnerischen Stein geschlagen!";

    renderBoard();
    updateDisplay();

    if (getCount(other(current)) <= 2) {
      finishGame(current);
      return;
    }

    endTurn();
    return;
  }

  if (phase === "placing") {
    if (state[index] !== null) return;

    state[index] = current;
    placed[current]++;

    renderBoard();
    updateDisplay();

    if (isMill(index,current)) {
      beginCapture();
      return;
    }

    endPlacementTurn();
    return;
  }

  // Bewegungsphase
  if (selected === null) {
    if (state[index] === current) {
      selected = index;

      document.getElementById("message").textContent =
        "Wähle jetzt einen freien Nachbarpunkt.";

      renderBoard();
    }
    return;
  }

  // Auswahl eines anderen eigenen Steins
  if (state[index] === current) {
    selected = index;

    document.getElementById("message").textContent =
      "Stein ausgewählt. Wähle einen freien Punkt.";

    renderBoard();
    return;
  }

  if (state[index] !== null) return;

  const flying = getCount(current) === 3;

  if (!flying && !neighbors[selected].includes(index)) {
    document.getElementById("message").textContent =
      "Du darfst nur entlang einer Linie zum Nachbarpunkt ziehen.";
    return;
  }

  state[index] = current;
  state[selected] = null;
  selected = null;

  renderBoard();
  updateDisplay();

  if (isMill(index,current)) {
    beginCapture();
    return;
  }

  endTurn();
}

function beginCapture() {
  capturePending = true;

  document.getElementById("message").textContent =
    "MÜHLE! Du darfst einen gegnerischen Stein entfernen.";

  renderBoard();
}

function endPlacementTurn() {
  if (placed.red === 9 && placed.blue === 9) {
    phase = "moving";

    current = other(current);

    document.getElementById("message").textContent =
      "Alle Steine sind gesetzt. Jetzt beginnt die Zugphase!";

    updateDisplay();
    renderBoard();
    return;
  }

  endTurn();
}

function endTurn() {
  current = other(current);
  selected = null;

  // Nach Abschluss der Setzphase wird geprüft,
  // ob der Spieler überhaupt noch ziehen kann.
  if (phase === "moving" && !hasMove(current)) {
    finishGame(other(current));
    return;
  }

  updateDisplay();
  renderBoard();
}

function hasMove(player) {
  const count = getCount(player);

  if (count === 3) {
    return state.some(s => s === null);
  }

  for (let i=0; i<24; i++) {
    if (state[i] === player) {
      if (neighbors[i].some(n => state[n] === null)) {
        return true;
      }
    }
  }

  return false;
}

function finishGame(winner) {
  gameOver = true;
  selected = null;

  document.getElementById("turn").textContent =
    winner === RED ? "ROT HAT GEWONNEN!" : "BLAU HAT GEWONNEN!";

  document.getElementById("turn").style.color =
    winner === RED ? "var(--red)" : "var(--blue)";

  document.getElementById("message").textContent =
    (winner === RED ? "Rot" : "Blau")+
    " gewinnt! Das Spiel ist beendet.";

  document.getElementById("resetBtn").textContent =
    "↻ NOCHMAL SPIELEN";

  renderBoard();
}

function updateDisplay() {
  document.getElementById("redCount").textContent =
    getCount(RED);

  document.getElementById("blueCount").textContent =
    getCount(BLUE);

  const turn = document.getElementById("turn");

  turn.style.color =
    current === RED ? "var(--red)" : "var(--blue)";

  turn.textContent =
    current === RED ? "Rot ist am Zug" : "Blau ist am Zug";

  if (phase === "placing") {
    document.getElementById("message").textContent =
      (current === RED ? "Rot" : "Blau")+
      " setzt einen Stein. Noch "+
      (9-placed[current])+" zu setzen.";
  } else if (phase === "moving" && !capturePending) {
    document.getElementById("message").textContent =
      getCount(current) === 3
        ? "Du hast drei Steine: Du darfst auf jeden freien Punkt springen."
        : "Wähle einen eigenen Stein und ziehe ihn entlang einer Linie.";
  }
}

// ---- Online über den Connector ----
const params = new URLSearchParams(location.search);
const ONLINE = params.has("room") && params.has("id");
const ROOM = params.get("room") || "";
const PLAYER_ID = params.get("id") || "";
const ONLINE_API = "/api/muehle";
let onlineBusy = false;
let onlineGame = null;

function applyOnlineState(game) {
  if (!game) return;
  onlineGame = game;

  state = Array.isArray(game.state) ? game.state.slice() : Array(24).fill(null);
  current = game.current;
  placed = {red: game.placedRed, blue: game.placedBlue};
  phase = game.phase;
  capturePending = !!game.capturePending;
  gameOver = game.status === "finished";

  if (gameOver) {
    finishGame(game.winner === BLUE ? BLUE : RED);
    return;
  }

  renderBoard();
  updateDisplay();

  if (game.status === "invited") {
    document.getElementById("message").textContent =
      "Warte auf die Antwort von " + game.blueName + " …";
  } else if (game.note) {
    document.getElementById("message").textContent = game.note;
  }
}

async function rejoinRoom(){
  let name = (typeof params !== "undefined" && params.get("name")) || "Spieler";
  if (typeof G !== "undefined" && G && G.you >= 0 && G.seats && G.seats[G.you]) {
    name = G.seats[G.you].name;
  }
  try{
    await fetch("/api/presence",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({room:ROOM,id:PLAYER_ID,name,active:true})
    });
  }catch(e){}
}

async function onlineFetch(url, options){
  let response = await fetch(url, options);
  if (response.status === 403) {
    const text = (await response.text()).trim();
    // "Bitte zuerst dem Spielraum beitreten" heißt: das Lebenszeichen ist
    // verloren gegangen (WLAN weg, Handy gesperrt). Einmal neu anmelden und
    // dieselbe Anfrage wiederholen, statt in einer Sackgasse zu enden.
    if (!/beitreten/i.test(text)) throw Error(text || "Die Aktion ist fehlgeschlagen.");
    await rejoinRoom();
    response = await fetch(url, options);
  }
  if (!response.ok) throw Error((await response.text()).trim() || "Die Aktion ist fehlgeschlagen.");
  return response.json();
}


async function refreshOnline() {
  if (onlineBusy) return;
  try {
    const data = await onlineFetch(ONLINE_API + "?room=" + encodeURIComponent(ROOM) + "&id=" + encodeURIComponent(PLAYER_ID));
    applyOnlineState(data.game);
  } catch (e) {}
}

async function muehleAction(action, payload) {
  if (onlineBusy) return;
  onlineBusy = true;
  try {
    const data = await onlineFetch(ONLINE_API + "?room=" + encodeURIComponent(ROOM) + "&action=" + action, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id: PLAYER_ID, ...payload})
    });
    selected = null;
    applyOnlineState(data.game);
  } catch (e) {
    document.getElementById("message").textContent = e.message;
  } finally {
    onlineBusy = false;
  }
}

async function resetOnline() {
  await muehleAction("reset", {});
}

function clickPointOnline(index) {
  if (onlineBusy || !onlineGame || onlineGame.status !== "active") return;

  if (capturePending) {
    muehleAction("capture", {index});
    return;
  }

  if (phase === "placing") {
    muehleAction("place", {index});
    return;
  }

  if (state[index] === current) {
    selected = index;
    document.getElementById("message").textContent =
      "Wähle jetzt einen freien Nachbarpunkt.";
    renderBoard();
    return;
  }

  if (selected === null) {
    return;
  }

  if (state[index] !== null) return;

  const from = selected;
  muehleAction("move", {from, to: index});
}

if (ONLINE) {
  // Eigener Zustand als Platzhalter, gleich kommt der echte vom Server.
  state = Array(24).fill(null);
  current = RED;
  placed = {red: 0, blue: 0};
  selected = null;
  phase = "placing";
  gameOver = false;
  capturePending = false;
  renderBoard();
  updateDisplay();

  const back = document.createElement("button");
  back.type = "button";
  back.className = "reset";
  back.id = "leaveBtn";
  back.textContent="Spiel verlassen";
  back.style.marginTop = "12px";
  back.onclick = () => tgVerlassen();
  document.getElementById("resetBtn").after(back);

  refreshOnline();
  setInterval(refreshOnline, 1500);
} else {
  newGame();
}
</script>
</body>
</html>
