<!doctype html>
<html lang="de" data-solitaer>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<script src="../../stil.js"></script>
<meta name="theme-color" content="#0b131b">
<title>Solitär – fünf Varianten</title>
<link rel="stylesheet" href="../../schrift.css">
<style>
*{box-sizing:border-box}
[hidden]{display:none !important}
:root{
  --bg1:#13222e; --bg2:#0b1420; --bg3:#060a0f;
  --panel:#111b25; --panel-2:#0b131b;
  --text:#e9eef4; --muted:#93a3b3;
  --warm:#f3c489; --warm-2:#c87a3e;
  --linie:rgba(255,255,255,.08); --linie-2:rgba(255,255,255,.16);
  --karte-1:#fdfaf1; --karte-2:#efe6d4;
  --karte-rand:#b9a887;
  --rot:#b1262a; --schwarz:#232a36;
  --ruecken-1:#1c3d68; --ruecken-2:#0d2038;
  --sfw:82px;
  --rand-oben:12px; --rand-unten:26px;
  --tg-schrift:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
html,body{min-height:100%}
body{margin:0;padding:var(--rand-oben) 10px var(--rand-unten);
  background:
    radial-gradient(900px 520px at 18% -10%,#1d516766 0%,#00000000 70%),
    radial-gradient(720px 420px at 92% 4%,#8a5a2e3d 0%,#00000000 72%),
    linear-gradient(180deg,var(--bg1),var(--bg2) 55%,var(--bg3)) fixed;
  color:var(--text);font:15px/1.5 var(--tg-schrift);
  -webkit-tap-highlight-color:transparent;overflow-x:clip}
a{color:var(--warm)}
.seite{max-width:1120px;margin:0 auto}

/* ------------------------------------------------------------------ Kopf */
/* Kopfleiste als eigene Leiste (Titel, Zurück). Die Form bleibt gleich, die
   Farben kommen aus der zentralen Stilwahl: Klassisch Panel/Gold, Mädchen
   helles Pink, Buben Anthrazit/Rot. Damit wechselt auch dieser zuvor
   übersehene Bereich bei jedem Stilwechsel mit. */
:root{
  --kopf-1:#111b25; --kopf-2:#0b131b; --kopf-rand:rgba(255,255,255,.16); --kopf-text:#f6ead6;
  --kopf-zurueck-text:#f6ead6; --kopf-zurueck-bg:rgba(255,255,255,.06); --kopf-zurueck-rand:rgba(255,255,255,.22);
  --kopf-zurueck-hover-bg:rgba(255,255,255,.12); --kopf-zurueck-hover-text:#fff8ec;
}
html[data-stil="maedchen"]{
  --kopf-1:#fff6fa; --kopf-2:#ffeaf3; --kopf-rand:#ef7aa8; --kopf-text:#5c0f38;
  --kopf-zurueck-text:#5b0f2e; --kopf-zurueck-bg:#ffffffb0; --kopf-zurueck-rand:#ef7aa8;
  --kopf-zurueck-hover-bg:#ffffff; --kopf-zurueck-hover-text:#3a0f24;
}
html[data-stil="buben"]{
  --kopf-1:#1b1e23; --kopf-2:#0b0e11; --kopf-rand:#2b3540; --kopf-text:#e6e9ec;
  --kopf-zurueck-text:#ff8a90; --kopf-zurueck-bg:#ffffff14; --kopf-zurueck-rand:#2b3540;
  --kopf-zurueck-hover-bg:#ffffff24; --kopf-zurueck-hover-text:#ffd0d3;
}
.kopf{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;margin:0 2px 10px;min-height:32px;
  padding:10px 14px;border-radius:12px;border:1px solid var(--kopf-rand);color:var(--kopf-text);
  background:linear-gradient(180deg,var(--kopf-1),var(--kopf-2))}
.kopf h1{margin:0;font-size:clamp(19px,2.6vw,26px);font-weight:600;letter-spacing:.02em;line-height:1.12;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--kopf-text)}
.kopf .zurueck{margin-left:auto;flex:0 0 auto;font-size:13px;text-decoration:none;color:var(--kopf-zurueck-text);
  border:1px solid var(--kopf-zurueck-rand);border-radius:999px;padding:5px 12px;background:var(--kopf-zurueck-bg)}
.kopf .zurueck:hover{color:var(--kopf-zurueck-hover-text);background:var(--kopf-zurueck-hover-bg)}

/* ---------------------------------------------------------- Knöpfe */
.knopf{font-family:inherit;font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer;
  border:1px solid var(--linie-2);background:rgba(255,255,255,.06);color:#e9eef4;
  transition:background .15s,border-color .15s,transform .06s}
.knopf:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.knopf:active{transform:translateY(1px)}
.knopf:disabled{opacity:.36;cursor:default;transform:none}
.knopf.zweit{background:rgba(255,255,255,.03)}
/* „Neues Spiel“ trug fest das klassische Gold – jetzt drei Paletten, gesteuert
   über dieselbe zentrale Wahl wie die Kopfleiste. */
:root{--neu-1:#f6d3a3;--neu-2:#dfa060;--neu-text:#2b1a0c;--neu-rand:#f9dcb0;--neu-1-h:#ffd9b0;--neu-2-h:#e8ad70}
html[data-stil="maedchen"]{--neu-1:#ff9ecb;--neu-2:#f0509f;--neu-text:#3a0f24;--neu-rand:#f0509f;--neu-1-h:#ffb0d5;--neu-2-h:#f260a9}
html[data-stil="buben"]{--neu-1:#e0242f;--neu-2:#c41724;--neu-text:#150a0c;--neu-rand:#e0242f;--neu-1-h:#ff6a73;--neu-2-h:#d81c2a}
#btnNeu{background:linear-gradient(180deg,var(--neu-1),var(--neu-2));color:var(--neu-text);border-color:var(--neu-rand);font-weight:600}
#btnNeu:hover{background:linear-gradient(180deg,var(--neu-1-h),var(--neu-2-h))}

/* ------------------------------------------------------- Modusauswahl */
.auswahl{margin-top:6px}
.modus-liste{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.modus{position:relative;display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:start;
  padding:16px;border:1px solid var(--linie);border-radius:16px;
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  box-shadow:inset 0 1px 0 #ffffff10,0 18px 40px -28px #000}
.modus-vorschau{grid-row:span 3;width:104px;border-radius:10px;background:var(--vv-flaeche);
  border:1px solid var(--linie);padding:6px}
.modus-vorschau svg{display:block;width:100%;height:auto}
.modus-text h3{margin:0 0 4px;font-size:17px;font-weight:600}
.modus-text p{margin:0 0 8px;color:var(--muted);font-size:13px;line-height:1.45}
.modus-option{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:0 0 6px}
.modus-option select,.leiste-option select{font-family:inherit;font-size:12.5px;padding:4px 6px;border-radius:8px;
  background:#0e1822;color:var(--text);border:1px solid var(--linie-2)}
.modus .start{justify-self:start;grid-column:2}
.modus-quote{grid-column:1/-1;color:var(--muted);font-size:11.5px;min-height:0}
.modus-quote:empty{display:none}

/* ------------------------------------------------------------ Spielfenster */
.fenster{border:1px solid var(--linie);border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  box-shadow:inset 0 1px 0 #ffffff12,0 26px 60px -30px #000}
.leiste{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--linie)}
.leiste-optionen{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.leiste-option{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.anzeige{display:flex;flex-wrap:wrap;gap:8px;padding:6px 12px;border-bottom:1px solid var(--linie)}
.anzeige span{display:inline-flex;align-items:baseline;gap:6px;font-size:12px;color:var(--muted);
  padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.045);border:1px solid var(--linie)}
.anzeige b{color:#fff;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.bahn{padding:10px 12px 8px;background:radial-gradient(120% 90% at 50% 0%,#16252f 0%,#0a1117 70%,#080d12 100%);
  overflow:visible}
.hinweis{min-height:20px;margin:0;padding:6px 12px 8px;font-size:12.5px;color:#a9c3b6}
.hinweis.warnung{color:#e8b9a4}

/* ---------------------------------------------------------------- Karten */
.karte{position:relative;aspect-ratio:5/7;border-radius:7px;overflow:hidden;
  background:linear-gradient(165deg,var(--karte-1),var(--karte-2));
  border:1px solid var(--karte-rand);
  box-shadow:0 2px 5px #00000059,inset 0 1px 0 #ffffff40;
  user-select:none;touch-action:none;-webkit-touch-callout:none;cursor:grab;
  font-family:Georgia,"Times New Roman",serif;container-type:inline-size}
.karte.rot{color:var(--rot)}
.karte.schwarz{color:var(--schwarz)}
.karte .ecke{position:absolute;display:flex;flex-direction:column;align-items:center;
  line-height:.86;font-weight:700;z-index:2}
.karte .ecke b{font-size:clamp(11px,31cqw,30px);letter-spacing:-.03em}
.karte .ecke i{font-size:clamp(9px,26cqw,24px);font-style:normal;margin-top:.08em;opacity:.9}
.karte .ecke.oben{left:6%;top:4%}
.karte .ecke.unten{right:6%;bottom:4%;transform:rotate(180deg)}
.karte .pips{position:absolute;inset:17% 14%}
.karte .pip{position:absolute;transform:translate(-50%,-50%);font-style:normal;line-height:1;
  font-size:clamp(8px,18cqw,18px);opacity:.88}
.karte .pip.unten{transform:translate(-50%,-50%) rotate(180deg)}
.karte .bild{position:absolute;inset:26% 22%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border:1px solid currentColor;border-radius:3px;opacity:.9;
  background:repeating-linear-gradient(45deg,#ffffff0d 0 2px,#00000000 2px 5px)}
.karte .bild b{font-size:clamp(13px,35cqw,32px);line-height:1}
.karte .bild i{font-size:clamp(9px,22cqw,20px);font-style:normal;margin-top:.08em}
.karte.hinten{background:
    repeating-linear-gradient(45deg,#ffffff14 0 2px,#00000000 2px 8px),
    linear-gradient(160deg,var(--ruecken-1),var(--ruecken-2));
  border-color:#3f5a6b;cursor:default}
.karte.hinten::before{content:"";position:absolute;inset:8%;border:1px solid #ffffff2b;border-radius:3px}
.karte.gewaehlt{outline:2px solid var(--warm);outline-offset:-2px;box-shadow:0 0 0 1px #000,0 6px 16px -6px #000}
.karte.tipp{outline:2px solid #9fd3c6;outline-offset:-2px}
.karte.moeglich{outline:2px dashed var(--warm);outline-offset:-2px;box-shadow:0 0 0 3px #f3c4891f}
.karte.verdeckt{opacity:.52;cursor:default}
.karte.bedeckt{opacity:.8;cursor:default}
.karte.spielbar{box-shadow:0 0 0 1px #ffffff1f,0 2px 6px #0006}
.karte.ohne-klick{cursor:default;pointer-events:none}
.geist{position:fixed;z-index:90;pointer-events:none;opacity:.9;transform:rotate(-2deg);
  box-shadow:0 14px 28px #000a}

/* Schmale Karten (Handy, Spider mit zehn Spalten): Rang und Farbe nebeneinander,
   keine Augen – sonst überdecken sich die Zeichen. */
@container (max-width:64px){
  .karte .pips{display:none}
  .karte .ecke{flex-direction:row;align-items:baseline;gap:.06em;line-height:1}
  .karte .ecke.oben{left:7%;top:4%}
  .karte .ecke.unten{display:none}
  .karte .ecke b{font-size:12.5px}
  .karte .ecke i{font-size:10.5px;margin-top:0}
  .karte .bild{inset:22% 14%;border:none;box-shadow:none;background:none}
  .karte .bild b{font-size:15px}
  .karte .bild i{font-size:11px}
}
body.zieht{cursor:grabbing}

/* -------------------------------------------------------- Stapel & Felder */
.stapelfeld{position:relative;width:var(--sfw);flex:0 0 auto;aspect-ratio:5/7;border-radius:5px;
  display:flex;align-items:center;justify-content:center}
.stapelfeld.leer{border:1px dashed #ffffff33;background:rgba(255,255,255,.03);cursor:pointer}
.stapelfeld.leer:hover{border-color:#ffffff66}
.stapelfeld.ziel{border:1px dashed #ffffff26;background:rgba(255,255,255,.02)}
.stapelfeld.moeglich{border-color:var(--warm);box-shadow:inset 0 0 0 1px #f3c48955,0 0 0 3px #f3c4891f;
  background:rgba(243,196,137,.08)}
.stapelfeld.ueber{border-color:#9fd3c6;box-shadow:inset 0 0 0 2px #9fd3c655}
.stapelfeld .karte{position:absolute;inset:0;width:100%;height:100%}
.stapelfeld .karte.hinten{cursor:pointer}
.stapelfeld.voll{cursor:pointer}
.leerzeichen{font-size:11px;color:#7f8f9d;letter-spacing:.04em;text-align:center;padding:0 4px}
.leerzeichen.farbe{font-size:clamp(16px,2.4vw,24px);opacity:.55}
.leerzeichen.farbe.rot{color:var(--rot)}
/* Leere Farbplätze im klassischen Bild: voll deckend und aufgehellt, sonst sind
   die Symbole auf dem dunklen Grund zu blass (gemessen 22.11.2026). */
html:not([data-stil="maedchen"]):not([data-stil="buben"]) .leerzeichen.farbe{opacity:1;color:#9fb0bf}
html:not([data-stil="maedchen"]):not([data-stil="buben"]) .leerzeichen.farbe.rot{color:#e0836c}
.stapelzahl{position:absolute;right:-5px;bottom:-5px;min-width:18px;height:18px;border-radius:9px;
  background:var(--chip-bg);border:1px solid var(--chip-rand);color:var(--chip-text);font-size:10.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:var(--tg-schrift)}
.waste-rest{position:absolute;left:-6px;top:-4px;width:70%;opacity:.55;pointer-events:none}

/* ------------------------------------------------------------ Klondike */
.kopfreihe{display:flex;align-items:flex-start;gap:8px;row-gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kopfreihe .luft{flex:1 1 auto}
.ablagen{display:flex;gap:8px;flex:0 1 auto;min-width:0;flex-wrap:wrap}
.tableau{display:grid;gap:6px;align-items:start}
.tableau.zehn{grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.tableau.acht{grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.klondike .tableau{grid-template-columns:repeat(7,minmax(0,1fr))}
.spalte{position:relative;min-height:40px;border-radius:5px}
.spalte.leer{border:1px dashed var(--leer-rand);background:var(--leer-fuell)}
.spalte.leer .leerfeld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--leer-text);font-family:Georgia,serif;font-size:clamp(12px,3vw,18px)}
.spalte.moeglich{border-color:var(--warm);background:rgba(243,196,137,.07);box-shadow:inset 0 0 0 1px #f3c48955}
.spalte.ueber{box-shadow:inset 0 0 0 2px #9fd3c655}
.spalte .karte{width:100%}

/* --------------------------------------------------------------- Spider */
.spider .tableau{margin-bottom:14px}
.spider-fuss{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.fertige{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.fertigplatz{position:relative;width:calc(var(--sfw) * .82);aspect-ratio:5/7;border-radius:5px;
  display:flex;align-items:center;justify-content:center;border:1px dashed var(--leer-rand);background:var(--leer-fuell)}
.fertigplatz.voll{border-style:solid;border-color:var(--karte-rand)}
.fertigplatz .karte{position:absolute;inset:0;width:100%;height:100%}
.vorrat{position:relative;width:var(--sfw);aspect-ratio:5/7;border-radius:5px;display:flex;
  align-items:center;justify-content:center;border:1px dashed var(--leer-rand);background:var(--leer-fuell);cursor:pointer}
.vorrat .karte{position:absolute;inset:0;width:100%;height:100%}
.vorrat.leer{cursor:default;opacity:.6}

/* ------------------------------------------------------------- FreeCell */
.zellen{display:flex;gap:8px;flex:0 1 auto;min-width:0;flex-wrap:wrap}
.stapelfeld.zelle{width:calc(var(--sfw) * .84)}

/* -------------------------------------------------------------- Pyramid */
.pyramid{display:flex;flex-direction:column;align-items:center;gap:14px}
.pyramide{position:relative}
.pyramide .karte{position:absolute}
.pyr-platz,.berg-platz{position:absolute;border-radius:5px;border:1px dashed var(--leer-rand)}
.pyramid-fuss,.tripeaks-fuss{display:flex;gap:16px;justify-content:center;position:relative;z-index:2}

/* ------------------------------------------------------------- TriPeaks */
.tripeaks{display:flex;flex-direction:column;align-items:center;gap:14px}
.berge{position:relative}
.berge .karte{position:absolute}
.stapelfeld.waste .waste-zahl{position:absolute;right:-6px;top:-6px;min-width:18px;height:18px;border-radius:9px;
  background:var(--chip-bg);border:1px solid var(--chip-rand);color:var(--chip-text);font-size:10.5px;
  display:flex;align-items:center;justify-content:center;padding:0 4px}

/* -------------------------------------------------------------- Dialoge */
.schleier{position:fixed;inset:0;background:#04080bcc;display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:80;backdrop-filter:blur(2px)}
.dialog{width:min(460px,100%);border-radius:14px;overflow:hidden;border:1px solid var(--linie-2);
  background:linear-gradient(180deg,#16232e,#0c141c);box-shadow:0 30px 70px -20px #000}
.dialog-kopf{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--linie);
  font-weight:600;font-size:14px}
.dialog-kopf span{flex:1 1 auto}
.dialog-zu{width:28px;height:28px;border-radius:50%;border:1px solid var(--linie);background:rgba(255,255,255,.05);
  color:#c9d6e0;font-size:15px;line-height:1;cursor:pointer}
.dialog-inhalt{padding:14px 16px;font-size:13.5px;line-height:1.6;max-height:60dvh;overflow:auto}
.dialog-inhalt p{margin:0 0 8px}
.dialog-inhalt ol{margin:0;padding-left:20px}
.dialog-inhalt li{margin-bottom:7px}
.dialog-inhalt .klein{color:var(--muted);font-size:12px}
.dialog-knoepfe{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 16px}

/* ------------------------------------------------------------- Anpassung */
@media(max-width:900px){:root{--sfw:clamp(42px,8vw,70px)}}
@media(max-width:640px){
  :root{--sfw:clamp(38px,12vw,54px);--rand-oben:8px;--rand-unten:18px}
  .kopfreihe .luft{display:none}
  .ablagen{margin-left:auto}
  body{padding-left:6px;padding-right:6px}
  .modus{grid-template-columns:78px 1fr;padding:13px;gap:11px}
  .modus-vorschau{width:78px}
  .kopfreihe{gap:5px}
  .ablagen{gap:5px}
  .leiste{gap:6px}
  .knopf{padding:7px 11px;font-size:12.5px}
  .anzeige{gap:5px}
  .anzeige span{padding:3px 8px;font-size:11px}
  .spider-fuss{gap:8px}
  .fertige{gap:3px}
}
@media(max-width:420px){
  :root{--sfw:clamp(34px,12vw,46px)}
  .modus-liste{grid-template-columns:1fr}
  .fertigplatz{width:calc(var(--sfw) * .8)}
}

/* ---- Grafikstil für Vorschau-Miniaturen und leere Plätze (22.11.2026) ----
   Die Miniaturen der Modus-Auswahl waren fest dunkel gezeichnet und blieben
   deshalb in Mädchen und Buben schwarz. Jetzt holen sie ihre Farben aus
   Variablen; die SVG-Module setzen nur noch var(--vv-*). */
:root{--vv-flaeche:#0a121a;--vv-karte:#2a3138;--vv-rand:#4b5661;--vv-hell:#d9d3c6;--vv-rot:#c9705f;--vv-leise:#8fa0b0;
  --leer-rand:#ffffff26;--leer-fuell:rgba(255,255,255,.02);--leer-text:#6e7f8d;
  --chip-bg:#1c2a34;--chip-rand:#4b6474;--chip-text:#d7e3ec}
html[data-stil="maedchen"]{--vv-flaeche:#ffe3ef;--vv-karte:#ffffff;--vv-rand:#ef7aa8;--vv-hell:#5b2340;--vv-rot:#b0286a;--vv-leise:#b06bff;
  --leer-rand:#b03a6a66;--leer-fuell:rgba(255,255,255,.5);--leer-text:#8f2450;
  --chip-bg:#fff6fa;--chip-rand:#ef7aa8;--chip-text:#5b2340}
html[data-stil="buben"]{--vv-flaeche:#0d1217;--vv-karte:#1e252d;--vv-rand:#e0242f;--vv-hell:#e6e9ec;--vv-rot:#ff6b74;--vv-leise:#c8ff3d;
  --leer-rand:#e0242f55;--leer-fuell:rgba(255,255,255,.03);--leer-text:#8b96a1;
  --chip-bg:#16181c;--chip-rand:#2b3540;--chip-text:#e6e9ec}

/* ---- Grafikstil (zentral): Klassisch bleibt unverändert ---- */
html[data-stil="maedchen"]{--bg1:#ffe0ef;--bg2:#f7a6d4;--bg3:#eb7bc0;--panel:#fff6fa;--panel-2:#ffeaf3;--text:#3a0f24;--muted:#8f2450;--warm:#b06bff;--warm-2:#7a2fbf;--linie:rgba(181,42,99,.12);--linie-2:rgba(181,42,99,.22);--karte-1:#ffffff;--karte-2:#ffeaf3;--karte-rand:#ef7aa8;--rot:#b0286a;--schwarz:#3a0f24}
html[data-stil="maedchen"] body{background:radial-gradient(120% 90% at 50% 0%,#ffe0ef 0%,#f7a6d4 60%,#eb7bc0 100%);color:#3a0f24}
html[data-stil="maedchen"] .fenster{background:#fff6fa;border-color:#ef7aa8;box-shadow:0 18px 40px #b52a6340}

/* ---- Anordnung: eine Überschrift, Platz fürs Brett (22.11.2026) ---- */
/* Der Rahmen nimmt genau die Fensterhöhe; die Ränder stehen als Variablen,
   damit die Rechnung zum body-Polster passt (sonst 12 px Überhang). */
.seite{display:flex;flex-direction:column;min-height:calc(100dvh - var(--rand-oben) - var(--rand-unten))}
body.spielt .seite{min-height:calc(100dvh - var(--rand-oben) - var(--rand-unten));height:auto}
#spielbereich{flex:1 0 auto;min-height:0;display:flex;flex-direction:column}
#spielbereich .bahn{flex:0 0 auto;min-height:0;max-height:none}
@media(min-width:761px){.leiste-optionen{margin-left:auto}}
@media(max-width:760px){.kopf{margin-bottom:8px}}

/* Die Kopfleiste holt ihre Farben vollständig aus --kopf-* (siehe oben):
   eine Stelle für alle drei Stile, kein Sonderfall mehr pro Stil. */

/* ==================================================================
   STARTBILDSCHIRM, PAUSE, STATISTIK (26.11.2026)
   ================================================================== */
.start-text{margin:0 2px 12px;color:var(--muted);font-size:13px;line-height:1.5}
.stil-wahl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;
  padding:12px 16px;border:1px solid var(--linie);border-radius:14px;
  background:linear-gradient(180deg,var(--panel),var(--panel-2))}
.stil-titel{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stil-knoepfe{display:flex;gap:8px;flex-wrap:wrap}
.stil-knopf{font-family:inherit;font-size:13px;padding:7px 16px;border-radius:999px;cursor:pointer;
  border:1px solid var(--linie-2);background:rgba(255,255,255,.05);color:var(--text)}
.stil-knopf:hover{border-color:var(--warm)}
.stil-knopf[aria-pressed="true"]{border-color:var(--warm);box-shadow:inset 0 0 0 1px var(--warm);font-weight:600}
html[data-stil="maedchen"] .stil-wahl{background:#fff6fa;border-color:#ef7aa8}
html[data-stil="maedchen"] .stil-titel{color:#8f2450}
html[data-stil="maedchen"] .stil-knopf{background:#fff;border-color:#ef7aa8;color:#8f2450}
html[data-stil="maedchen"] .stil-knopf[aria-pressed="true"]{background:#ffe3ef;color:#3a0f24;border-color:#b0286a;box-shadow:inset 0 0 0 1px #b0286a}
html[data-stil="buben"] .stil-wahl{background:#101317;border-color:#23262c}
html[data-stil="buben"] .stil-knopf{background:#16181c;border-color:#2b3540;color:#e6e9ec}
html[data-stil="buben"] .stil-knopf[aria-pressed="true"]{background:#e0242f;border-color:#ff6a73;color:#150a0c;font-weight:700;box-shadow:none}

.kopf .zurueck{font-family:inherit;cursor:pointer}
#btnPause[aria-pressed="true"]{border-color:var(--warm);color:var(--warm);font-weight:600}
#pauseSchleier .dialog{width:min(400px,100%)}
#pauseSchleier .dialog-inhalt p{margin:0;color:var(--muted)}

.stat{width:100%;border-collapse:collapse;margin:4px 0 2px;font-size:13px}
.stat th,.stat td{padding:6px 8px;border-bottom:1px solid var(--linie);text-align:left}
.stat th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat td:nth-child(n+2),.stat th:nth-child(n+2){text-align:right}
.stat tbody tr:last-child td{border-bottom:0}
html[data-stil="maedchen"] .stat th,html[data-stil="maedchen"] .stat td{border-color:#ef7aa833}

/* ==================================================================
   DREI EIGENSTÄNDIGE KARTENBILDER (26.11.2026)
   Jede Ansicht hat eigene Vorderseite, Rückseite und Dekor; gemeinsam
   bleiben nur Rang, Farbe und Aufbau.
   ================================================================== */

/* NORMAL – klassisches Kartenblatt: Elfenbein, Goldrand, feine Innenlinie,
   Rückseite in Nachtblau mit Ovalmedaillon. */
html:not([data-stil="maedchen"]):not([data-stil="buben"]) .karte{
  border-radius:7px;
  font-family:Georgia,"Times New Roman",serif;
  box-shadow:0 2px 5px #00000059,inset 0 1px 0 #ffffff8c;
  background:linear-gradient(168deg,#fffdf7 0%,#f7f0df 58%,#efe4cd 100%)}
html:not([data-stil="maedchen"]):not([data-stil="buben"]) .karte:not(.hinten)::after{
  content:"";position:absolute;inset:4px;border-radius:4px;
  border:1px solid #a98f5a40;pointer-events:none}
html:not([data-stil="maedchen"]):not([data-stil="buben"]) .karte .bild{
  border-radius:4px;border-color:#a98f5a80;
  background:repeating-linear-gradient(45deg,#a98f5a0f 0 2px,#00000000 2px 5px)}
html:not([data-stil="maedchen"]):not([data-stil="buben"]) .karte.hinten{
  border-color:#c9ab6d;
  background:repeating-linear-gradient(45deg,#ffffff0f 0 2px,#00000000 2px 8px),
    linear-gradient(160deg,var(--ruecken-1),var(--ruecken-2))}
html:not([data-stil="maedchen"]):not([data-stil="buben"]) .karte.hinten::before{
  inset:8%;border:1px solid #e8cd8e80;border-radius:3px;box-shadow:inset 0 0 0 3px #0b1a2e}
html:not([data-stil="maedchen"]):not([data-stil="buben"]) .karte.hinten::after{
  content:"";position:absolute;inset:26%;border:1px solid #e8cd8e66;border-radius:50%;
  clip-path:none;
  background:repeating-linear-gradient(45deg,#e8cd8e26 0 1px,#00000000 1px 5px)}

/* MÄDCHEN – zartes Rosé, runde Ecken, gepunktete Innenlinie; Rückseite
   perlweiß mit rosa Rautengitter und Schleifenmitte. */
html[data-stil="maedchen"] .karte{
  border-radius:11px;border-color:#ef7aa8;
  font-family:Georgia,"Times New Roman",serif;
  background:linear-gradient(160deg,#fffdfe 0%,#ffeef5 62%,#ffe0ec 100%);
  box-shadow:0 3px 7px #b52a6333,inset 0 1px 0 #ffffff}
html[data-stil="maedchen"] .karte:not(.hinten)::after{
  content:"";position:absolute;inset:4px;border-radius:8px;
  border:1px dashed #ef7aa8a6;pointer-events:none}
html[data-stil="maedchen"] .karte .bild{
  border-radius:6px;border-color:#ef7aa899;
  background:radial-gradient(circle at 50% 40%,#fff 0%,#ffe3ef 100%)}
html[data-stil="maedchen"] .karte .ecke b{font-weight:700;letter-spacing:0}
html[data-stil="maedchen"] .karte.hinten{
  border-color:#b0286a;
  background:radial-gradient(circle at 50% 50%,#ffffff 0 17%,#00000000 18%),
    repeating-linear-gradient(45deg,#ffffff66 0 1px,#00000000 1px 9px),
    repeating-linear-gradient(-45deg,#ffffff66 0 1px,#00000000 1px 9px),
    linear-gradient(155deg,#ffd7e8 0%,#ff9ec4 58%,#e0629f 100%)}
html[data-stil="maedchen"] .karte.hinten::before{
  inset:7%;border:2px solid #ffffffd9;border-radius:7px;
  box-shadow:inset 0 0 0 3px #f0509f33}
html[data-stil="maedchen"] .karte.hinten::after{
  content:"";position:absolute;left:50%;top:50%;width:30%;height:30%;
  right:auto;bottom:auto;border:0;transform:translate(-50%,-50%) rotate(45deg);
  border-radius:6px 50% 6px 50%;clip-path:none;
  background:#ffffffe6;box-shadow:0 0 0 3px #ffffff59}

/* BUBEN – Anthrazit, harte Kanten, rote Schrägkante; Rückseite mit
   Kohlefaser und roten Winkeln. */
html[data-stil="buben"] .karte{
  border-radius:3px;border-color:#3a424b;
  font-family:"Segoe UI Semibold","Segoe UI",system-ui,sans-serif;
  background:linear-gradient(160deg,#2a3138 0%,#1b2128 60%,#141920 100%);
  box-shadow:0 2px 6px #000000b3,inset 0 1px 0 #ffffff17}
html[data-stil="buben"] .karte:not(.hinten)::after{
  content:"";position:absolute;inset:0;border:0;border-radius:0;pointer-events:none;
  background:linear-gradient(135deg,#e0242f40 0%,#00000000 46%);
  clip-path:polygon(0 0,74% 0,0 42%)}
html[data-stil="buben"] .karte .bild{
  border-radius:1px;border-color:#ff6b7499;
  background:repeating-linear-gradient(135deg,#ffffff12 0 2px,#00000000 2px 6px)}
html[data-stil="buben"] .karte.hinten{
  border-color:#c41724;
  background:repeating-linear-gradient(135deg,#ffffff12 0 2px,#00000000 2px 7px),
    repeating-linear-gradient(45deg,#e0242f2e 0 3px,#00000000 3px 12px),
    linear-gradient(160deg,#232a32 0%,#0d1116 72%,#070a0d 100%)}
html[data-stil="buben"] .karte.hinten::before{
  inset:9%;border:2px solid #e0242f;border-radius:1px;
  box-shadow:inset 0 0 0 2px #0b0e11,inset 0 0 0 4px #ffffff1f}
html[data-stil="buben"] .karte.hinten::after{
  content:"";position:absolute;left:50%;top:50%;width:48%;height:13%;
  right:auto;bottom:auto;border:0;transform:translate(-50%,-50%) skewX(-26deg);opacity:.85;
  clip-path:none;
  background:repeating-linear-gradient(90deg,#e0242f 0 6px,#00000000 6px 12px)}

/* --- Tisch und Rahmen ---------------------------------------------- */
html[data-solitaer]{background:var(--bg2)}
html[data-solitaer][data-stil] body{
  background-color:var(--bg2);
  background-size:auto;
  background-repeat:no-repeat;
  background-image:
    radial-gradient(1100px 660px at 50% -12%,var(--tisch-glow) 0%,rgba(0,0,0,0) 62%),
    radial-gradient(820px 540px at 94% 8%,var(--tisch-glow) 0%,rgba(0,0,0,0) 70%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,rgba(0,0,0,0) 1px 4px),
    linear-gradient(180deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;
  color:var(--text)
}
html[data-stil] body .fenster{
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border-color:var(--linie-2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 28px 64px -34px #000
}
html[data-stil] body .kopf{
  background:linear-gradient(180deg,var(--kopf-1),var(--kopf-2));
  border-color:var(--kopf-rand); color:var(--kopf-text);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)
}
html[data-stil] body .kopf h1{color:var(--kopf-text)}
html[data-stil] body .kopf .zurueck{color:var(--kopf-zurueck-text);background:var(--kopf-zurueck-bg);border-color:var(--kopf-zurueck-rand)}
html[data-stil] body .kopf .zurueck:hover{color:var(--kopf-zurueck-hover-text);background:var(--kopf-zurueck-hover-bg)}
html[data-stil] body .modus{background:linear-gradient(180deg,var(--panel),var(--panel-2));border-color:var(--linie)}
html[data-stil] body .modus-vorschau{background:var(--vv-flaeche);border-color:var(--linie-2)}
html[data-stil] body .stil-wahl{background:linear-gradient(180deg,var(--panel),var(--panel-2));border-color:var(--linie-2)}
html[data-stil] body .stil-knopf{background:rgba(255,255,255,.06);border-color:var(--linie-2);color:var(--text)}
html[data-stil] body .stil-knopf:hover{border-color:var(--warm)}
html[data-stil] body .stil-knopf[aria-pressed="true"]{background:var(--warm);color:var(--neu-text);border-color:var(--warm);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
html[data-stil] body .knopf{background:rgba(255,255,255,.07);border-color:var(--linie-2);color:var(--text)}
html[data-stil] body .knopf:hover{background:rgba(255,255,255,.13);border-color:var(--warm)}
html[data-stil] body .knopf.zweit{background:rgba(0,0,0,.14)}
html[data-stil] body .anzeige span{background:rgba(0,0,0,.16);border-color:var(--linie);color:var(--muted)}
html[data-stil] body .anzeige b{color:var(--text)}
html[data-stil] body .hinweis{color:var(--muted)}
html[data-stil] body .hinweis.warnung{color:var(--warn)}
html[data-stil] body .leiste-option select,html[data-stil] body .modus-option select{background:var(--panel-2);border-color:var(--linie-2);color:var(--text)}
html[data-stil] body .dialog{background:linear-gradient(180deg,var(--panel),var(--panel-2));border-color:var(--linie-2)}
html[data-stil] body .dialog-zu{background:rgba(255,255,255,.06);border-color:var(--linie-2);color:var(--text)}
html[data-stil] body .schleier{background:rgba(2,8,6,.80);backdrop-filter:blur(3px)}
html[data-stil="maedchen"] body .schleier{background:rgba(18,4,12,.82)}
html[data-stil="buben"] body .schleier{background:rgba(2,10,15,.84)}
html[data-stil] body .stat th,html[data-stil] body .stat td{border-color:var(--linie)}

/* Der Tisch: eigene Fläche mit Rahmen, Licht und feiner Webstruktur. */
html[data-solitaer][data-stil] body .bahn{
  margin:0 10px 8px;padding:16px 16px 12px;border-radius:14px;
  border:1px solid var(--tisch-rand);
  background-color:var(--tisch-2);
  background-image:
    radial-gradient(120% 90% at 50% -12%,var(--tisch-glow) 0%,rgba(0,0,0,0) 58%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,rgba(0,0,0,0) 1px 4px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 1px,rgba(0,0,0,0) 1px 7px),
    linear-gradient(180deg,var(--tisch-1),var(--tisch-2) 62%,var(--tisch-3));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -24px 46px rgba(0,0,0,.28),0 18px 40px -30px #000;
  overflow:visible
}

/* --- Karten: deckend, mit Papierkante und klaren Zeichen ----------- */
html[data-stil] body .bahn .karte{
  opacity:1;filter:none;
  background-color:var(--karte-1);border:1px solid var(--karte-rand);
  box-shadow:0 2px 5px var(--karte-schatten),inset 0 1px 0 rgba(255,255,255,.82)
}
html[data-stil] body .bahn .karte.rot{color:var(--rot)}
html[data-stil] body .bahn .karte.schwarz{color:var(--schwarz)}
html[data-stil] body .bahn .karte.verdeckt,html[data-stil] body .bahn .karte.bedeckt{opacity:1;filter:none}
html[data-stil] body .bahn .karte .ecke i,html[data-stil] body .bahn .karte .pip,html[data-stil] body .bahn .karte .bild{opacity:1}
html[data-stil] body .bahn .karte .ecke b{font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.5)}
html[data-stil] body .bahn .karte .ecke i{font-weight:700}
html[data-stil] body .bahn .karte .pip{text-shadow:0 1px 0 rgba(255,255,255,.35)}
html[data-stil] body .bahn .karte .bild{border:1px solid var(--bild-rand);background-color:var(--bild-flaeche)}
html[data-stil] body .bahn .karte.gewaehlt{outline-color:var(--warm);box-shadow:0 0 0 1px #000,0 0 0 3px var(--ziel-glow),0 7px 18px -8px #000}
html[data-stil] body .bahn .karte.moeglich{outline-color:var(--warm);box-shadow:0 0 0 3px var(--ziel-glow),0 2px 6px var(--karte-schatten)}
html[data-stil] body .bahn .karte.tipp{outline-color:var(--warm)}
html[data-stil] body .bahn .karte.spielbar{box-shadow:0 0 0 1px var(--linie-2),0 2px 6px var(--karte-schatten)}
html[data-stil] body .bahn .karte.hinten{opacity:1;filter:none;border-color:var(--karte-rand)}
html[data-stil] body .bahn .karte.hinten::before,html[data-stil] body .bahn .karte.hinten::after{pointer-events:none}
.geist{opacity:1!important;filter:none;transform:rotate(-1deg);box-shadow:0 16px 32px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.25)}
.waste-rest{opacity:1;filter:none;width:76%;left:-5px;top:-5px;z-index:0;pointer-events:none}
.stapelfeld > .karte{position:absolute;inset:0;width:100%;height:100%;z-index:1}
html[data-stil] body .bahn .karte.hinten{background-color:var(--ruecken-2)}

/* Normal: Elfenbein, Gold, grüner Filz, Medaillon-Rückseite. */
html[data-stil="klassisch"] body .bahn .karte:not(.hinten){
  background-color:#fffdf7;
  background-image:
    radial-gradient(120% 80% at 18% 0%,rgba(255,255,255,.88),rgba(255,255,255,0) 56%),
    linear-gradient(168deg,#fffdf7 0%,#f8f0de 58%,#efe2c8 100%)}
html[data-stil="klassisch"] body .bahn .karte:not(.hinten)::after{
  content:"";position:absolute;inset:4px;border:1px solid rgba(166,130,68,.55);border-radius:4px;pointer-events:none;
  background:none;clip-path:none
}
html[data-stil="klassisch"] body .bahn .karte .bild{
  border-radius:4px;background-image:repeating-linear-gradient(45deg,rgba(166,130,68,.08) 0 2px,rgba(0,0,0,0) 2px 5px)
}
html[data-stil="klassisch"] body .bahn .karte.hinten{
  border-color:#c9ab6d;
  background-color:#061a14;
  background-image:
    radial-gradient(circle at 50% 50%,rgba(232,205,142,.20) 0 15%,rgba(0,0,0,0) 16%),
    repeating-conic-gradient(from 0deg at 50% 50%,rgba(232,205,142,.10) 0 6deg,rgba(0,0,0,0) 6deg 12deg),
    repeating-linear-gradient(45deg,rgba(232,205,142,.09) 0 1px,rgba(0,0,0,0) 1px 9px),
    linear-gradient(160deg,var(--ruecken-1),var(--ruecken-2))}
html[data-stil="klassisch"] body .bahn .karte.hinten::before{
  content:"";position:absolute;inset:6%;border:1px solid rgba(232,205,142,.78);border-radius:3px;
  box-shadow:inset 0 0 0 3px rgba(6,26,20,.92)
}
html[data-stil="klassisch"] body .bahn .karte.hinten::after{
  content:"";position:absolute;left:50%;top:50%;width:36%;height:36%;right:auto;bottom:auto;
  transform:translate(-50%,-50%) rotate(45deg);border:1px solid rgba(232,205,142,.72);border-radius:2px;
  background:radial-gradient(circle at 50% 50%,rgba(232,205,142,.14) 0 34%,rgba(0,0,0,0) 35%);
  box-shadow:0 0 0 1px rgba(6,26,20,.75)
}

/* Mädchen: Elfenbein mit Rosenkante, dunkler Beerentisch, Rosetten-Rückseite. */
html[data-stil="maedchen"] body .bahn .karte:not(.hinten){
  background-color:#fffafc;
  background-image:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.92),rgba(255,255,255,0) 56%),
    linear-gradient(160deg,#fffafc 0%,#fff2f7 60%,#ffe6f0 100%)}
html[data-stil="maedchen"] body .bahn .karte:not(.hinten)::after{
  content:"";position:absolute;inset:4px;border:1px dashed rgba(176,30,85,.48);border-radius:8px;pointer-events:none;
  background:none;clip-path:none
}
html[data-stil="maedchen"] body .bahn .karte .bild{
  border-radius:7px;background-image:radial-gradient(circle at 50% 35%,rgba(255,255,255,.95),rgba(255,255,255,0) 60%),repeating-linear-gradient(45deg,rgba(196,122,153,.06) 0 1px,rgba(0,0,0,0) 1px 5px)
}
html[data-stil="maedchen"] body .bahn .karte.hinten{
  border-color:#c47a99;
  background-color:#280a1b;
  background-image:
    radial-gradient(circle at 50% 50%,rgba(255,230,240,.22) 0 14%,rgba(0,0,0,0) 15%),
    repeating-linear-gradient(45deg,rgba(230,179,198,.11) 0 1px,rgba(0,0,0,0) 1px 9px),
    repeating-linear-gradient(-45deg,rgba(230,179,198,.09) 0 1px,rgba(0,0,0,0) 1px 9px),
    linear-gradient(155deg,var(--ruecken-1),#3a1028 56%,var(--ruecken-2))}
html[data-stil="maedchen"] body .bahn .karte.hinten::before{
  content:"";position:absolute;inset:7%;border:1px solid rgba(255,225,235,.72);border-radius:7px;
  box-shadow:inset 0 0 0 3px rgba(40,10,27,.92)
}
html[data-stil="maedchen"] body .bahn .karte.hinten::after{
  content:"";position:absolute;left:50%;top:50%;width:31%;height:31%;right:auto;bottom:auto;
  transform:translate(-50%,-50%) rotate(45deg);border:1px solid rgba(255,225,235,.82);
  border-radius:50% 8% 50% 8%;
  background:
    radial-gradient(circle at 30% 30%,rgba(255,235,243,.95) 0 13%,rgba(0,0,0,0) 14%),
    radial-gradient(circle at 70% 30%,rgba(255,235,243,.95) 0 13%,rgba(0,0,0,0) 14%),
    radial-gradient(circle at 30% 70%,rgba(255,235,243,.95) 0 13%,rgba(0,0,0,0) 14%),
    radial-gradient(circle at 70% 70%,rgba(255,235,243,.95) 0 13%,rgba(0,0,0,0) 14%),
    #5a1738;
  box-shadow:0 0 0 1px rgba(40,10,27,.7)
}

/* Buben: kühles Elfenbein, Teal-Kanten, geometrische Rückseite. */
html[data-stil="buben"] body .bahn .karte:not(.hinten){
  background-color:#f6fbfc;
  background-image:
    radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.92),rgba(255,255,255,0) 58%),
    linear-gradient(160deg,#f8fcfd 0%,#e8f1f3 62%,#dbe8ec 100%)}
html[data-stil="buben"] body .bahn .karte:not(.hinten)::after{
  content:"";position:absolute;inset:3px;border:1px solid rgba(47,127,122,.48);border-radius:2px;pointer-events:none;
  background:none;clip-path:none
}
html[data-stil="buben"] body .bahn .karte .bild{
  border-radius:1px;background-image:repeating-linear-gradient(135deg,rgba(47,127,122,.08) 0 2px,rgba(0,0,0,0) 2px 6px)
}
html[data-stil="buben"] body .bahn .karte.hinten{
  border-color:#2f7f7a;
  background-color:#04141c;
  background-image:
    linear-gradient(135deg,rgba(53,214,196,0) 44%,rgba(53,214,196,.16) 45% 55%,rgba(53,214,196,0) 56%),
    repeating-linear-gradient(45deg,rgba(53,214,196,.09) 0 1px,rgba(0,0,0,0) 1px 10px),
    repeating-linear-gradient(-45deg,rgba(53,214,196,.06) 0 1px,rgba(0,0,0,0) 1px 10px),
    linear-gradient(160deg,var(--ruecken-1),#071f2a 55%,var(--ruecken-2))}
html[data-stil="buben"] body .bahn .karte.hinten::before{
  content:"";position:absolute;inset:8%;border:1px solid rgba(53,214,196,.72);border-radius:2px;
  box-shadow:inset 0 0 0 3px rgba(4,20,28,.92),inset 0 0 18px rgba(53,214,196,.14)
}
html[data-stil="buben"] body .bahn .karte.hinten::after{
  content:"";position:absolute;left:50%;top:50%;width:44%;height:18%;right:auto;bottom:auto;
  opacity:1;transform:translate(-50%,-50%) skewX(-20deg);border:0;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);
  background:repeating-linear-gradient(90deg,rgba(53,214,196,.8) 0 4px,rgba(0,0,0,0) 4px 8px);
  box-shadow:none
}

/* --- Leere Plätze, Stapel, Markierungen ---------------------------- */
html[data-stil] body .spalte.leer{border-color:var(--leer-rand);background:var(--leer-fuell)}
html[data-stil] body .spalte.leer .leerfeld{color:var(--leer-text)}
html[data-stil] body .stapelfeld.leer,html[data-stil] body .fertigplatz,html[data-stil] body .vorrat{border-color:var(--leer-rand);background:var(--leer-fuell)}
html[data-stil] body .stapelfeld.leer:hover{border-color:var(--warm)}
html[data-stil] body .leerzeichen{color:var(--leer-text)}
html[data-stil] body .leerzeichen.farbe{opacity:1;color:var(--muted)}
html[data-stil] body .leerzeichen.farbe.rot{color:var(--rot)}
html[data-stil] body .spalte.moeglich,html[data-stil] body .stapelfeld.moeglich{border-color:var(--warm);background:var(--ziel-glow);box-shadow:inset 0 0 0 1px var(--ziel-glow),0 0 0 3px var(--ziel-glow)}
html[data-stil] body .stapelfeld.ueber,html[data-stil] body .spalte.ueber{box-shadow:inset 0 0 0 2px var(--warm)}
html[data-stil] body .stapelzahl{background:var(--chip-bg);border-color:var(--chip-rand);color:var(--chip-text)}
html[data-stil] body .vorrat.leer{opacity:1}

/* --- Spider: eigener Fußbereich mit Luft und Beschriftung ---------- */
.spider{padding-bottom:6px}
.spider .tableau{margin-bottom:0}
.spider-fuss{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:26px;align-items:start;
  margin-top:28px;padding:18px 18px 14px;border-top:1px solid var(--linie-2);
  border-radius:0 0 12px 12px;
  background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.20))
}
.spider-zone{display:flex;flex-direction:column;gap:9px;min-width:0}
.spider-zone--vorrat{align-items:flex-end}
.spider-zone-titel{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.spider-zone-titel b{color:var(--warm);font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.fertige{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;min-width:0;
  max-width:calc(8 * var(--sfw) + 42px)}
.fertigplatz{width:auto;min-width:0;border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.fertigplatz.voll{border-style:solid;border-color:var(--karte-rand);background:rgba(0,0,0,.10)}
.fertigplatz .karte{box-shadow:0 3px 8px var(--karte-schatten)}
.spider-fuss .vorrat{justify-self:end;width:var(--sfw);border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.spider-fuss .leerzeichen{font-size:10px;letter-spacing:.06em}

/* --- Anpassungen ---------------------------------------------------- */
@media(max-width:760px){
  html[data-stil] body .bahn{margin:0 6px 6px;padding:12px 10px 10px;border-radius:11px}
  .spider-fuss{gap:16px;margin-top:20px;padding:14px 12px 12px}
}
@media(max-width:520px){
  .spider-fuss{grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-top:20px;padding:10px 8px 9px}
  .spider-zone--vorrat{align-items:flex-end}
  .spider-fuss .vorrat{justify-self:end}
  .fertige{max-width:none;gap:3px}
  .spider-zone-titel{font-size:9.5px;letter-spacing:.09em}
}
@media(max-width:420px){
  .spider-fuss{margin-top:16px;padding:10px 8px 9px}
  .spider-zone{gap:7px}
}
@media(max-width:760px){
  html[data-solitaer][data-stil] body .bahn{margin:0 2px 4px;padding:10px 4px 8px;border-radius:10px}
}
@media(max-width:520px){
  html[data-solitaer][data-stil] body{padding-left:3px;padding-right:3px}
  .tableau.zehn{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 6px}
}

/* Der Tisch füllt den freien Platz; der Spider-Fuß sitzt unten, nicht direkt
   unter dem Tableau. Bei viel Inhalt darf die Seite normal wachsen. */
html[data-solitaer][data-stil] body.spielt{min-height:100dvh;overflow-y:auto}
html[data-solitaer][data-stil] body.spielt .seite{min-height:calc(100dvh - var(--rand-oben) - var(--rand-unten));height:auto;display:flex;flex-direction:column}
html[data-solitaer][data-stil] #spielbereich{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
html[data-solitaer][data-stil] #spielbereich .bahn{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
html[data-solitaer][data-stil] #brett{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
html[data-solitaer][data-stil] .klondike,html[data-solitaer][data-stil] .spider,html[data-solitaer][data-stil] .freecell{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
html[data-solitaer][data-stil] .spider{justify-content:center}
html[data-solitaer][data-stil] .spider-fuss{margin-top:30px}
html[data-solitaer][data-stil] .pyramid,html[data-solitaer][data-stil] .tripeaks{flex:1 1 auto;min-height:0;justify-content:center}
html[data-solitaer][data-stil="maedchen"]{background-color:#24091a;background-image:none}
</style>
</head>
<body>
<main class="seite">
  <header class="kopf">
    <h1 id="kopfTitel">Solitär</h1>
    <button type="button" class="zurueck" id="btnZurueck">← Übersicht</button>
  </header>

  <section class="auswahl" id="modusAuswahl" aria-label="Spielmodus wählen">
    <p class="start-text">Fünf Varianten, drei Grafikstile. Wähle Stil und Variante – Start, Einstellungen und Bedienung liegen vollständig im Spiel.</p>
    <div class="stil-wahl" id="stilWahl" aria-label="Grafikstil wählen">
      <span class="stil-titel">Grafikstil</span>
      <div class="stil-knoepfe" id="stilKnoepfe">
        <button type="button" class="stil-knopf" data-stil="normal" aria-pressed="true">Normal</button>
        <button type="button" class="stil-knopf" data-stil="maedchen" aria-pressed="false">Mädchen</button>
        <button type="button" class="stil-knopf" data-stil="buben" aria-pressed="false">Buben</button>
      </div>
    </div>
    <div class="modus-liste" id="modusListe"></div>
  </section>

  <section class="fenster" id="spielbereich" hidden aria-label="Spielfeld">
    <div class="leiste">
      <button type="button" class="knopf zweit" id="btnMenue">☰ Modi</button>
      <button type="button" class="knopf" id="btnNeu">Neues Spiel</button>
      <button type="button" class="knopf zweit" id="btnPause" aria-pressed="false">Pause</button>
      <button type="button" class="knopf zweit" id="btnUndo">Rückgängig</button>
      <button type="button" class="knopf zweit" id="btnTipp">Tipp</button>
      <button type="button" class="knopf zweit" id="btnAuto" disabled>Automatisch fertigspielen</button>
      <button type="button" class="knopf zweit" id="btnRegeln">Regeln</button>
      <button type="button" class="knopf zweit" id="btnStat">Statistik</button>
      <div class="leiste-optionen" id="optionen" hidden></div>
    </div>
    <div class="anzeige">
      <span>Punkte <b id="hudPunkte">0</b></span>
      <span>Züge <b id="hudZuege">0</b></span>
      <span>Zeit <b id="hudZeit">0:00</b></span>
      <span id="hudExtraBox" hidden><b id="hudExtra"></b></span>
    </div>
    <div class="bahn" id="bahn"><div id="brett"></div></div>
    <p class="hinweis" id="hinweis" role="status"></p>
  </section>
</main>

<div class="schleier" id="dialogSchleier" hidden>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
</div>

<div class="schleier" id="pauseSchleier" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-label="Pause">
    <div class="dialog-kopf"><span>Pause</span></div>
    <div class="dialog-inhalt"><p>Die Zeit steht, das Brett ist gesperrt. Taste P setzt ebenfalls fort.</p></div>
    <div class="dialog-knoepfe">
      <button type="button" class="knopf" id="btnWeiter">Weiterspielen</button>
      <button type="button" class="knopf zweit" id="btnPauseNeu">Neues Spiel</button>
      <button type="button" class="knopf zweit" id="btnPauseMenue">Modi</button>
    </div>
  </div>
</div>

<!-- Gemeinsames Kartenbild, Spaltenaufbau, dann die fünf Modi, zuletzt der Rahmen. -->
<script src="js/karten.js"></script>
<script src="js/tableau.js"></script>
<script src="js/klondike.js"></script>
<script src="js/spider.js"></script>
<script src="js/freecell.js"></script>
<script src="js/pyramid.js"></script>
<script src="js/tripeaks.js"></script>
<script src="js/shell.js"></script>
<script src="js/schnittstelle.js"></script>
<script src="../../zurueck.js" data-kein-knopf="1"></script>
</body>
</html>
