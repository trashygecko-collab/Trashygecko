<!DOCTYPE html>
<html lang="de">
<head>
<script src="../../token.js"></script>
<script src="../../stil.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SKYJO</title>
<link rel="stylesheet" href="../../schrift.css">
<style>
:root{
  --bg:#0a211b;--panel:#12332a;--panel2:#0f2b23;--rand:#3a6455;
  --gold:#e8cd8e;--cyan:#8fe3ff;--rot:#ff7d9c;--text:#efe6d2;--muted:#a9c4b7;
  --karte:clamp(58px,21.5vw,104px);
}
html[data-stil="maedchen"]{
  --bg:#f7a6d4;--panel:#fff6fa;--panel2:#ffeaf3;--rand:#ef7aa8;
  --gold:#b06bff;--cyan:#7ea6ff;--rot:#e0487d;--text:#3a0f24;--muted:#7c3355;
}
html[data-stil="buben"]{
  --bg:#04070b;--panel:#111316;--panel2:#16181c;--rand:#2b3540;
  --gold:#c8ff3d;--cyan:#57f0ff;--rot:#ff5d67;--text:#e6e9ec;--muted:#9aa4ae;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(circle 900px at 50% -6%,#1d4b3e 0%,#123329 46%,#0a211b 100%) fixed;
  color:var(--text);font-family:var(--tg-schrift);text-align:center;overflow:hidden;
}
html[data-stil="maedchen"] body{background:radial-gradient(circle 900px at 50% -6%,#ffe0ef 0%,#f7a6d4 42%,#eb7bc0 100%) fixed}
html[data-stil="buben"] body{background:radial-gradient(circle 900px at 50% -6%,#1c2a3d 0%,#0c1219 46%,#04070b 100%) fixed}

#buehne{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:4px;padding:4px;max-width:940px;margin:0 auto}
.kopf{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kopf h1{margin:0;font-size:17px;letter-spacing:2px;color:var(--gold)}
.kopf .kn{padding:5px 10px;font-size:12px}
button{
  font-family:inherit;font-size:14px;border-radius:9px;padding:8px 12px;cursor:pointer;
  background:var(--panel2);color:var(--text);border:1px solid var(--rand);
}
button:disabled{opacity:.45;cursor:default}
button.primary{background:linear-gradient(100deg,#f3dfa6,#e8cd8e);border-color:#d9bc7c;color:#0b241d;font-weight:bold}
html[data-stil="maedchen"] button.primary{background:linear-gradient(100deg,#ff9ec4,#eb7bc0);color:#3a0f24}
html[data-stil="buben"] button.primary{background:#c8ff3d;color:#0b241d}

/* ---------- Startbildschirm ---------- */
#start{overflow:auto;text-align:left;padding:2px 6px 10px}
#start .karte-start{background:var(--panel);border:1px solid var(--rand);border-radius:14px;padding:12px;margin:0 auto;max-width:560px}
#start h2{margin:2px 0 6px;font-size:20px;color:var(--gold)}
#start p{margin:0 0 8px;font-size:13px;line-height:1.45;color:var(--muted)}
.felder{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.feld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.feld select{font-family:inherit;font-size:14px;padding:6px;border-radius:8px;border:1px solid var(--rand);background:var(--panel2);color:var(--text)}
.stilwahl{display:flex;gap:6px;flex-wrap:wrap}
.stilwahl button{padding:6px 10px;font-size:12px}
.stilwahl button[aria-pressed="true"]{outline:2px solid var(--gold)}
#start .regeln-kurz{font-size:12px;line-height:1.45;color:var(--muted);margin:6px 0 10px}
#startKnopf{width:100%;font-size:17px;padding:11px}

/* ---------- Spiel ---------- */
#spiel{display:grid;grid-template-rows:auto minmax(0,auto) minmax(0,1fr) auto;gap:4px;min-height:0}
#gegner{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:flex-start}
.gegner{
  --breite:96px;
  width:var(--breite);min-width:0;padding:3px 4px;border-radius:9px;
  background:var(--panel2);border:1px solid var(--rand);
  display:flex;flex-direction:column;gap:2px;text-align:left;font-size:10px;
}
.gegner.aktiv{border-color:var(--gold);box-shadow:0 0 0 2px #e8cd8e55;background:var(--panel)}
.gegner .gz{display:flex;justify-content:space-between;align-items:baseline;gap:3px}
.gegner .gname{font-weight:bold;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gegner .gpkt{color:var(--gold);font-weight:bold}
.gegner .gzug{font-size:9px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gegner .gmini{display:flex;gap:1px;flex-wrap:wrap}
.gegner .gkarte{width:9px;height:12px;border-radius:2px;border:1px solid var(--rand);background:repeating-linear-gradient(135deg,#184536,#184536 2px,#12332a 2px,#12332a 4px)}
html[data-stil="maedchen"] .gegner .gkarte{background:repeating-linear-gradient(135deg,#ffb8d4,#ffb8d4 2px,#ffd0e4 2px,#ffd0e4 4px)}
html[data-stil="buben"] .gegner .gkarte{background:repeating-linear-gradient(135deg,#2a1418,#2a1418 2px,#3a1a1e 2px,#3a1a1e 4px)}
.gegner .gkarte.offen{background:var(--gold);border-color:var(--gold)}
.gegner .gkarte.weg{opacity:.2}

.mitte{background:var(--panel);border:1px solid var(--rand);border-radius:11px;padding:4px 6px}
#turnBanner{font-size:14px;font-weight:bold;letter-spacing:.4px;color:var(--gold);margin-bottom:1px}
#status{font-size:11px;color:var(--muted);min-height:14px}
.stapel{display:flex;justify-content:center;align-items:center;gap:10px;margin:4px 0 2px}
.stapel .st{display:flex;flex-direction:column;gap:2px;align-items:center;font-size:9px;color:var(--muted)}
.pile{
  width:46px;height:62px;border-radius:8px;border:1px solid var(--rand);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;
  background:repeating-linear-gradient(135deg,#184536,#184536 6px,#12332a 6px,#12332a 12px);
  color:var(--gold);
}
.pile.ablage{background:var(--panel2);color:var(--text);font-size:20px}
.pile.ablage.leer{font-size:14px;color:var(--muted)}
.pile.klickbar{cursor:pointer;border-color:var(--gold)}
.aktionen{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.aktionen button{font-size:12px;padding:6px 10px}
#hinweis{font-size:11px;color:var(--muted);margin-top:3px;min-height:13px}

#eigenes{background:var(--panel);border:1px solid var(--rand);border-radius:11px;padding:4px 6px 6px;min-height:0;display:flex;flex-direction:column}
.eigkopf{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:bold}
.eigkopf .pkt{color:var(--gold)}
.hand{display:grid;grid-template-columns:repeat(4,var(--karte));grid-auto-rows:min-content;gap:4px;justify-content:center;align-content:center;margin:3px auto 0;flex:1;min-height:0}
.card{
  position:relative;border-radius:8px;border:1px solid var(--rand);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:bold;aspect-ratio:1/1.28;min-height:0;padding:0;
  transition:transform .12s,box-shadow .12s;
}
.card .value{font-size:clamp(14px,4.4vw,26px);line-height:1}
.card .mini{font-size:8px;letter-spacing:1px;opacity:.75;margin-top:2px}
.card.blue{color:#c9faff;background:#073d59;border-color:#28cfff}
.card.green{color:#d7ffdb;background:#07502c;border-color:#29e77b}
.card.yellow{color:#fff2b2;background:#69500a;border-color:#ffdc38}
.card.orange{color:#ffe2ae;background:#74330a;border-color:#ff9c35}
.card.red{color:#ffd0e4;background:#650c37;border-color:#ff438e}
.card.back{color:var(--gold);border-color:#2f6b52;background:repeating-linear-gradient(135deg,#12332a,#12332a 7px,#184536 7px,#184536 14px)}
html[data-stil="maedchen"] .card.blue{color:#3a0f24;background:#cfe6ff;border-color:#7ea6ff}
html[data-stil="maedchen"] .card.green{color:#0b3a2a;background:#c6f5e0;border-color:#4fd3a0}
html[data-stil="maedchen"] .card.yellow{color:#4a3607;background:#fff2b8;border-color:#ffd23f}
html[data-stil="maedchen"] .card.orange{color:#5a2606;background:#ffd9bd;border-color:#ffa06b}
html[data-stil="maedchen"] .card.red{color:#5b0f2e;background:#ffd0e4;border-color:#ef7aa8}
html[data-stil="maedchen"] .card.back{background:repeating-linear-gradient(135deg,#ffb8d4,#ffb8d4 7px,#ffd0e4 7px,#ffd0e4 14px);border-color:#b06bff;color:#8f2450}
html[data-stil="buben"] .card{box-shadow:inset 0 0 12px #ffffff10}
html[data-stil="buben"] .card.blue{color:#c9faff;background:#062a3d;border-color:#57f0ff}
html[data-stil="buben"] .card.green{color:#d8ffb8;background:#16260c;border-color:#6dff4a}
html[data-stil="buben"] .card.yellow{color:#f2ffb8;background:#2a2a0a;border-color:#c8ff3d}
html[data-stil="buben"] .card.orange{color:#ffd9b8;background:#3a1d08;border-color:#ff9c35}
html[data-stil="buben"] .card.red{color:#ffd0d2;background:#3a0d12;border-color:#e0242f}
.card.weg{background:var(--panel2);border:1px dashed var(--rand);color:var(--rand);box-shadow:none}
.card.waehlbar{cursor:pointer}
.card.waehlbar:hover{transform:translateY(-2px);box-shadow:0 4px 10px #00000055}
.card.ziel{outline:2px solid var(--gold);outline-offset:-1px}
.card.auswahl{outline:3px solid var(--cyan);outline-offset:1px}
.card.frisch{animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}

/* ---------- Blatt (Runde, Pause, Ende) ---------- */
.blatt{position:fixed;inset:0;background:#000000aa;display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
.blatt .inhalt{background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:14px;max-width:520px;width:100%;max-height:88vh;overflow:auto;text-align:center}
.blatt h2{margin:0 0 6px;font-size:20px;color:var(--gold)}
.blatt p{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.4}
.tabelle{display:flex;flex-direction:column;gap:4px;margin:0 0 10px}
.tz{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;background:var(--panel2);font-size:13px;text-align:left}
.tz.sieger{outline:1px solid var(--gold);background:linear-gradient(90deg,#e8cd8e22,#00000000)}
.tz .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tz .tr{color:var(--muted);font-size:12px}
.tz .tg{font-weight:bold;color:var(--gold)}
.blatt .knopfreihe{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#hinweisBlatt{font-size:11px;color:var(--muted);margin-top:8px}

/* ---------- Handy ---------- */
@media (max-width:520px){
  :root{--karte:clamp(58px,22vw,92px)}
  #buehne{padding:3px;gap:3px}
  .kopf h1{font-size:14px}
  .kopf .kn{padding:4px 8px;font-size:11px}
  .gegner{--breite:80px;font-size:9px;padding:2px 3px}
  .gegner .gname{font-size:10px}
  #turnBanner{font-size:12px}
  #status,#hinweis{font-size:10px}
  .pile{width:40px;height:54px;font-size:16px}
  .hand{gap:3px}
}
@media (max-height:560px) and (orientation:landscape){
  #buehne{max-width:760px}
  .gegner{--breite:78px}
  #start .karte-start{padding:8px}
  #start h2{font-size:16px}
  .felder{gap:4px}
}
</style>
</head>
<body>
<div id="buehne">
  <header class="kopf">
    <h1>SKYJO</h1>
    <div>
      <button class="kn" type="button" id="btnRegeln">Regeln</button>
      <button class="kn" type="button" id="btnAuswahl">Auswahl</button>
    </div>
  </header>

  <section id="start">
    <div class="karte-start">
      <h2>SKYJO</h2>
      <p>Zwölf Karten vor dir, zwei davon offen. Sammle so wenige Punkte wie möglich – wer zuerst 100 hat, verliert.</p>
      <div class="felder">
        <label class="feld">Spieler insgesamt
          <select id="wahlSpieler">
            <option value="2">2 Spieler</option>
            <option value="3">3 Spieler</option>
            <option value="4">4 Spieler</option>
            <option value="5">5 Spieler</option>
            <option value="6">6 Spieler</option>
            <option value="7">7 Spieler</option>
            <option value="8">8 Spieler</option>
          </select>
        </label>
        <label class="feld">Menschen am Gerät
          <select id="wahlMenschen"></select>
        </label>
        <label class="feld">Bot-Stärke
          <select id="wahlStufe">
            <option value="leicht">leicht</option>
            <option value="normal" selected>normal</option>
            <option value="schwer">schwer</option>
          </select>
        </label>
        <label class="feld">Grafikstil
          <span class="stilwahl" id="wahlStil"></span>
        </label>
      </div>
      <p class="regeln-kurz" id="startInfo"></p>
      <button class="primary" type="button" id="startKnopf">Spiel starten</button>
      <div class="regeln-kurz" id="startHinweis"></div>
    </div>
  </section>

  <section id="spiel" hidden>
    <div id="gegner"></div>
    <div class="mitte">
      <div id="turnBanner">–</div>
      <div id="status"></div>
      <div class="stapel">
        <div class="st">
          <div class="pile" id="nachziehStapel">?</div>
          <span id="stapelZahl">150 Karten</span>
        </div>
        <div class="st">
          <div class="pile ablage" id="ablageStapel">–</div>
          <span>Ablage</span>
        </div>
      </div>
      <div class="aktionen" id="aktionen"></div>
      <div id="hinweis"></div>
    </div>
    <div id="eigenes">
      <div class="eigkopf"><span id="eigenName">Du</span><span class="pkt" id="eigenPunkte">0 Punkte</span></div>
      <div class="hand" id="hand"></div>
    </div>
  </section>
</div>

<div class="blatt" id="blatt" hidden>
  <div class="inhalt">
    <h2 id="blattTitel">Runde beendet</h2>
    <p id="blattText"></p>
    <div class="tabelle" id="blattTabelle"></div>
    <div class="knopfreihe" id="blattKnoepfe"></div>
    <div id="hinweisBlatt"></div>
  </div>
</div>

<script>
"use strict";
/* ======================================================================
   SKYJO – Schnittstelle 2.0
   ----------------------------------------------------------------------
   Eigenständiges Spiel: Startbildschirm, Regeln, Spieler 2–8, Bots in
   drei Stufen, Runden- und Gesamtwertung. Online kommt der Stand vom
   Connector über aktion('stand', {spiel, ich}); das Spiel rechnet dann
   nichts selbst und meldet nur Absichten (skyjo:ziehen, skyjo:tauschen,
   skyjo:abwerfen, skyjo:umdrehen, skyjo:aufdecken, skyjo:neueRunde).
   ====================================================================== */

const ZIEL = 100;
const KARTEN = 12;
const SPALTEN = 4;
const STUFEN = ["leicht", "normal", "schwer"];
const STILE = ["normal", "maedchen", "buben"];

const CARD_COUNTS = [
  [-2, 5], [-1, 10], [0, 15],
  [1, 10], [2, 10], [3, 10], [4, 10],
  [5, 10], [6, 10], [7, 10], [8, 10],
  [9, 10], [10, 10], [11, 10], [12, 10]
];

const $ = (id) => document.getElementById(id);

const el = {
  start: $("start"), spiel: $("spiel"), gegner: $("gegner"),
  banner: $("turnBanner"), status: $("status"), hinweis: $("hinweis"),
  nachzieh: $("nachziehStapel"), ablage: $("ablageStapel"), stapelZahl: $("stapelZahl"),
  aktionen: $("aktionen"), hand: $("hand"),
  eigenName: $("eigenName"), eigenPunkte: $("eigenPunkte"),
  blatt: $("blatt"), blattTitel: $("blattTitel"), blattText: $("blattText"),
  blattTabelle: $("blattTabelle"), blattKnoepfe: $("blattKnoepfe"), hinweisBlatt: $("hinweisBlatt"),
  wahlSpieler: $("wahlSpieler"), wahlMenschen: $("wahlMenschen"),
  wahlStufe: $("wahlStufe"), wahlStil: $("wahlStil"),
  startInfo: $("startInfo"), startHinweis: $("startHinweis"),
  btnRegeln: $("btnRegeln"), btnAuswahl: $("btnAuswahl"), startKnopf: $("startKnopf")
};

const auswahl = { spieler: 2, menschen: 1, stufe: "normal", stil: "normal" };

let sp = null;             // laufende Partie
let pausiert = false;
let tick = 0;
let botTimer = 0;
let online = null;         // {id, name}
let stilVonAussen = false;
let sicht = 0;             // wessen Kartenfeld gerade gezeigt wird
let endGemeldet = "";      // Partie#Runde, deren Ende schon gemeldet wurde
let standMarke = "";

/* ---------------------------- Karten ---------------------------- */

function cardClass(v) {
  if (v <= -1) return "blue";
  if (v <= 4) return "green";
  if (v <= 8) return "yellow";
  if (v <= 10) return "orange";
  return "red";
}
function cardText(v) { return v > 0 ? "+" + v : String(v); }

function deckBauen() {
  const deck = [];
  for (const [wert, anzahl] of CARD_COUNTS) for (let i = 0; i < anzahl; i++) deck.push(wert);
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

function karteNeu() { return { w: 0, offen: false, weg: false }; }

function spielerNeu(name, bot, stufe) {
  return { name, bot: !!bot, stufe: stufe || auswahl.stufe, ich: false, punkte: 0, runde: 0,
    karten: Array.from({ length: KARTEN }, karteNeu) };
}

/* ---------------------------- Partie ---------------------------- */

function partieBauen(anzahlSpieler, anzahlMenschen, stufe) {
  const n = Math.max(2, Math.min(8, anzahlSpieler));
  const menschen = Math.max(1, Math.min(n, anzahlMenschen));
  const spieler = [];
  for (let i = 0; i < n; i++) {
    const mensch = i < menschen;
    spieler.push(spielerNeu(mensch ? (menschen === 1 ? "Du" : "Spieler " + (i + 1)) : "Bot " + (i - menschen + 1), !mensch, stufe));
  }
  spieler[0].ich = true;
  const neu = {
    modus: "lokal", online: false, spieler, deck: deckBauen(), ablage: [],
    zug: 0, phase: "setup", gezogen: null, quelle: "", runde: 1,
    startSpieler: 0, finisher: -1, restZuege: 0, sieger: null, notiz: "", setupFertig: [],
    letzteRunde: null, ende: false
  };
  rundeAusteilen(neu);
  return neu;
}

function rundeAusteilen(g) {
  g.deck = deckBauen();
  g.ablage = [];
  for (const p of g.spieler) {
    p.runde = 0;
    p.karten = Array.from({ length: KARTEN }, karteNeu);
    for (let i = 0; i < KARTEN; i++) p.karten[i].w = g.deck.pop();
  }
  g.ablage.push(g.deck.pop());
  g.zug = 0;
  g.phase = "setup";
  g.gezogen = null;
  g.quelle = "";
  g.finisher = -1;
  g.restZuege = 0;
  g.setupFertig = g.spieler.map(() => 0);
  g.notiz = g.spieler[0].name + " deckt zwei Karten auf.";
  g.letzteRunde = null;
}

function anzOffen(p) { return p.karten.filter((k) => k.offen && !k.weg).length; }
function verdecktZahl(p) { return p.karten.filter((k) => !k.offen && !k.weg).length; }

function spaltenPruefen(p) {
  for (let s = 0; s < SPALTEN; s++) {
    const idx = [s, s + SPALTEN, s + SPALTEN * 2];
    if (idx.some((i) => p.karten[i].weg)) continue;
    if (idx.some((i) => !p.karten[i].offen)) continue;
    const w = p.karten[idx[0]].w;
    if (p.karten[idx[1]].w === w && p.karten[idx[2]].w === w) {
      idx.forEach((i) => { p.karten[i].weg = true; });
      return true;
    }
  }
  return false;
}

function punkteVon(p) {
  return p.karten.reduce((sum, k) => (k.weg ? sum : sum + k.w), 0);
}

function naechster(i, n) { return (i + 1) % n; }

function zugWeiter(g) {
  if (g.finisher >= 0) {
    // Nach dem Finisher bekommt jeder andere genau einen Zug.
    g.restZuege -= 1;
    if (g.restZuege <= 0) { rundeBeenden(g); return; }
  }
  g.zug = naechster(g.zug, g.spieler.length);
  g.phase = "play";
  g.gezogen = null;
  g.quelle = "";
  g.notiz = g.spieler[g.zug].name + " ist am Zug.";
  if (g.spieler[g.zug].bot) planen();
}

function zugBeenden(g) {
  const p = g.spieler[g.zug];
  if (g.finisher < 0 && verdecktZahl(p) === 0) {
    g.finisher = g.zug;
    g.restZuege = g.spieler.length;
    g.notiz = p.name + " hat alle Karten offen – jeder andere hat noch einen Zug.";
  }
  zugWeiter(g);
}

function rundeBeenden(g) {
  for (const p of g.spieler) {
    for (const k of p.karten) if (!k.weg) k.offen = true;
    let weiter = true;
    while (weiter) weiter = spaltenPruefen(p);
  }
  const werte = g.spieler.map((p) => punkteVon(p));
  const fin = g.finisher;
  if (fin >= 0) {
    const min = Math.min(...werte);
    const andere = werte.filter((w, i) => i !== fin);
    const minAndere = Math.min(...andere);
    const verstoss = werte[fin] >= minAndere && werte[fin] > 0;
    if (verstoss) werte[fin] *= 2;
  }
  g.spieler.forEach((p, i) => { p.runde = werte[i]; p.punkte += werte[i]; });

  const beste = Math.min(...werte);
  const siegerIdx = werte.map((w, i) => (w === beste ? i : -1)).filter((i) => i >= 0);
  g.letzteRunde = {
    runde: g.runde,
    werte: werte.slice(),
    gesamte: g.spieler.map((p) => p.punkte),
    sieger: siegerIdx,
    finisher: g.finisher,
    verdoppelt: fin >= 0 && werte[fin] !== punkteVon(g.spieler[fin])
  };
  g.startSpieler = fin >= 0 ? fin : 0;
  g.phase = "between";
  const namen = siegerIdx.map((i) => g.spieler[i].name);
  g.notiz = "Runde " + g.runde + " beendet – " + (siegerIdx.length > 1 ? "unentschieden" : namen[0] + " gewinnt die Runde") + ".";
  if (!g.online) {
    melde("runde", {
      runde: g.runde,
      werte: werte.slice(),
      gesamte: g.spieler.map((x) => x.punkte),
      sieger: siegerIdx.map((i) => g.spieler[i].name)
    });
  }
  if (g.spieler.some((p) => p.punkte >= ZIEL)) spielBeenden(g);
}

function spielBeenden(g) {
  g.ende = true;
  g.phase = "fertig";
  const beste = Math.min(...g.spieler.map((p) => p.punkte));
  const kandidaten = g.spieler.map((p, i) => (p.punkte === beste ? i : -1)).filter((i) => i >= 0);
  let sieger = kandidaten;
  if (kandidaten.length > 1) {
    const runde = g.letzteRunde ? g.letzteRunde.werte : null;
    if (runde) {
      const bestRunde = Math.min(...kandidaten.map((i) => runde[i]));
      sieger = kandidaten.filter((i) => runde[i] === bestRunde);
    }
  }
  g.sieger = sieger;
  g.notiz = sieger.length === 1
    ? g.spieler[sieger[0]].name + " gewinnt mit " + g.spieler[sieger[0]].punkte + " Punkten."
    : "Unentschieden bei " + beste + " Punkten.";
  if (!g.online) {
    const marke = "partie#" + g.runde;
    if (endGemeldet !== marke) {
      endGemeldet = marke;
      const ich = Math.max(0, g.spieler.findIndex((x) => x.ich));
      melde("ende", {
        grund: "gewonnen",
        punkte: g.spieler[ich].punkte,
        level: g.runde,
        levelAnzahl: 1,
        tick,
        sieger: sieger.length === 1 ? g.spieler[sieger[0]].name : null,
        tabelle: g.spieler.map((x) => ({ name: x.name, punkte: x.punkte }))
      });
    }
  }
}

/* ---------------------------- Bot-Entscheidungen ---------------------------- */

function bekannteWerte(p) {
  return p.karten.filter((k) => k.offen && !k.weg).map((k) => k.w);
}

function verdecktIndexHoechste(p) {
  // Verdeckte Karte mit dem höchsten geschätzten Wert: offene Nachbarn in der
  // Spalte geben einen Anhalt, sonst der Mittelwert des Rests.
  let bester = -1, besterWert = -Infinity;
  for (let i = 0; i < KARTEN; i++) {
    const k = p.karten[i];
    if (k.offen || k.weg) continue;
    const s = i % SPALTEN;
    const nachbarn = [s, s + SPALTEN, s + SPALTEN * 2].filter((j) => j !== i && p.karten[j].offen && !p.karten[j].weg);
    const schaetzung = nachbarn.length ? Math.max(...nachbarn.map((j) => p.karten[j].w)) : 5;
    if (schaetzung > besterWert) { besterWert = schaetzung; bester = i; }
  }
  return bester;
}

function offeneSchwaechste(p, mindest) {
  // Offene Karte, die sich durch die gezogene Karte verbessern lässt.
  let index = -1, wert = -Infinity;
  p.karten.forEach((k, i) => {
    if (!k.offen || k.weg) return;
    if (k.w > wert && k.w > mindest) { wert = k.w; index = i; }
  });
  return index;
}

function botEntscheidung(p, g) {
  const top = g.ablage.length ? g.ablage[g.ablage.length - 1] : null;
  const offen = p.karten.filter((k) => k.offen && !k.weg).map((k) => k.w);
  const summe = offen.reduce((a, b) => a + b, 0);
  const hoechste = offen.length ? Math.max(...offen) : 12;

  if (p.stufe === "leicht") {
    // Spielt nach Gefühl: nimmt die Ablage nur bei sehr niedrigen Werten,
    // tauscht oft daneben und deckt zufällig auf.
    if (top !== null && top <= 0 && Math.random() < 0.55) {
      return { art: "nehmen", quelle: "ablage", ziel: zufallsZiel(p) };
    }
    if (top !== null && top <= 2 && Math.random() < 0.3) {
      return { art: "nehmen", quelle: "ablage", ziel: zufallsZiel(p) };
    }
    return { art: "ziehen", quelle: "deck" };
  }

  if (p.stufe === "normal") {
    if (top !== null && top < hoechste - 1) {
      const ziel = offeneSchwaechste(p, top);
      if (ziel >= 0) return { art: "nehmen", quelle: "ablage", ziel };
    }
    return { art: "ziehen", quelle: "deck" };
  }

  // schwer: schätzt die Kosten jeder Wahl. Verdeckte Karten kosten im Mittel
  // den Durchschnitt des Nachziehstapels; eine Spalte mit zwei gleichen
  // offenen Karten ist fast fertig und wird bevorzugt.
  const mittel = mittelwert(g.deck);
  const erwartet = offen.reduce((a, b) => a + b, 0) + verdecktZahl(p) * mittel;
  if (top !== null) {
    const ziel = bestesZiel(p, top);
    if (ziel !== null) {
      const nachher = erwartet - p.karten[ziel].w + top;
      if (nachher < erwartet - 0.4) return { art: "nehmen", quelle: "ablage", ziel };
    }
  }
  return { art: "ziehen", quelle: "deck" };
}

function mittelwert(deck) {
  if (!deck.length) return 4;
  let summe = 0;
  for (const w of deck) summe += w;
  return summe / deck.length;
}

function bestesZiel(p, wert) {
  // Tausch lohnt nur gegen eine höhere offene Karte; fast fertige Spalten
  // (zwei gleiche offene) zählen dabei mehr.
  let bester = null, besterGewinn = 0;
  p.karten.forEach((k, i) => {
    if (k.weg) return;
    const offen = k.offen ? k.w : -1;
    if (offen <= wert) return;
    let gewinn = offen - wert;
    const s = i % SPALTEN;
    const spalte = [s, s + SPALTEN, s + SPALTEN * 2].map((j) => p.karten[j]);
    const gleicheOffen = spalte.filter((x) => x !== k && x.offen && !x.weg && x.w === wert).length;
    if (gleicheOffen === 1) gewinn += 8;
    if (gleicheOffen === 2) gewinn += 20;
    if (gewinn > besterGewinn) { besterGewinn = gewinn; bester = i; }
  });
  return bester;
}

function zufallsZiel(p) {
  const offen = p.karten.map((k, i) => (!k.weg ? i : -1)).filter((i) => i >= 0);
  return offen[Math.floor(Math.random() * offen.length)];
}

function botTauschZiel(p, gezogen) {
  if (p.stufe === "leicht") {
    if (Math.random() < 0.35) {
      const offen = p.karten.map((k, i) => (k.offen && !k.weg ? i : -1)).filter((i) => i >= 0);
      if (offen.length) return { tausch: offen[Math.floor(Math.random() * offen.length)] };
    }
    const ziel = offeneSchwaechste(p, gezogen);
    if (ziel >= 0 && Math.random() < 0.8) return { tausch: ziel };
    return { abwerfen: true, umdrehen: verdecktZufall(p) };
  }
  if (p.stufe === "normal") {
    const ziel = offeneSchwaechste(p, gezogen);
    if (ziel >= 0) return { tausch: ziel };
    return { abwerfen: true, umdrehen: verdecktIndexHoechste(p) };
  }
  const ziel = bestesZiel(p, gezogen);
  if (ziel !== null) return { tausch: ziel };
  // Nichts zu verbessern: abwerfen und die teuerste verdeckte Karte aufdecken.
  return { abwerfen: true, umdrehen: verdecktIndexHoechste(p) };
}

function verdecktZufall(p) {
  const liste = p.karten.map((k, i) => (!k.offen && !k.weg ? i : -1)).filter((i) => i >= 0);
  if (!liste.length) return -1;
  return liste[Math.floor(Math.random() * liste.length)];
}

/* ---------------------------- Züge (ein Seam) ---------------------------- */

function zugMoeglich() {
  return !!sp && sp.phase !== "fertig" && !pausiert;
}

function aufdecken(index) {
  if (!zugMoeglich() || !sp || sp.phase !== "setup") return { ok: false, fehler: "aktion-nicht-erlaubt" };
  const p = sp.spieler[sp.zug];
  const k = p.karten[index];
  if (!k || k.offen || k.weg) return { ok: false, fehler: "aktion-nicht-erlaubt" };
  if (sp.online && !p.ich) return { ok: false, fehler: "nicht-am-zug" };
  if (sp.online) { melde("aufdecken", { index }); return { ok: true, gesendet: true }; }
  k.offen = true;
  sp.setupFertig[sp.zug] += 1;
  tick++;
  if (sp.setupFertig[sp.zug] < 2) {
    sp.notiz = p.name + " deckt noch eine Karte auf.";
  } else if (sp.setupFertig.some((n) => n < 2)) {
    sp.zug = naechster(sp.zug, sp.spieler.length);
    sp.notiz = sp.spieler[sp.zug].name + " deckt zwei Karten auf.";
    planen();
  } else {
    startSpielerBestimmen();
  }
  anzeige();
  return { ok: true };
}

function startSpielerBestimmen() {
  const summen = sp.spieler.map((p) => p.karten.reduce((a, k) => a + (k.offen ? k.w : 0), 0));
  const beste = Math.max(...summen);
  const kandidaten = summen.map((s, i) => (s === beste ? i : -1)).filter((i) => i >= 0);
  sp.startSpieler = kandidaten[Math.floor(Math.random() * kandidaten.length)];
  sp.zug = sp.startSpieler;
  sp.phase = "play";
  sp.notiz = sp.spieler[sp.zug].name + " beginnt (höchste Startsumme).";
  planen();
}

function ziehen(quelle) {
  if (!zugMoeglich() || !sp || sp.phase !== "play" || sp.gezogen) return { ok: false, fehler: "aktion-nicht-erlaubt" };
  const p = sp.spieler[sp.zug];
  if (sp.online && !p.ich) return { ok: false, fehler: "nicht-am-zug" };
  if (sp.online) { melde("ziehen", { quelle: quelle === "ablage" ? "ablage" : "deck" }); return { ok: true, gesendet: true }; }
  if (quelle === "ablage") {
    if (!sp.ablage.length) return { ok: false, fehler: "aktion-nicht-erlaubt" };
    sp.gezogen = sp.ablage.pop();
    sp.quelle = "ablage";
    sp.notiz = p.name + " nimmt die Ablagekarte und muss sie tauschen.";
  } else {
    if (!sp.deck.length) return { ok: false, fehler: "aktion-nicht-erlaubt" };
    sp.gezogen = sp.deck.pop();
    sp.quelle = "deck";
    sp.notiz = p.name + " zieht vom Stapel.";
  }
  tick++;
  anzeige();
  return { ok: true };
}

function tauschen(index) {
  if (!zugMoeglich() || !sp || sp.phase !== "play" || sp.gezogen === null) return { ok: false, fehler: "aktion-nicht-erlaubt" };
  const p = sp.spieler[sp.zug];
  const k = p.karten[index];
  if (!k || k.weg) return { ok: false, fehler: "aktion-nicht-erlaubt" };
  if (sp.online && !p.ich) return { ok: false, fehler: "nicht-am-zug" };
  if (sp.online) { melde("tauschen", { index }); return { ok: true, gesendet: true }; }
  const alt = k.w;
  k.w = sp.gezogen;
  k.offen = true;
  k.frisch = true;
  sp.ablage.push(alt);
  sp.gezogen = null;
  sp.quelle = "";
  tick++;
  spaltenPruefen(p);
  p.runde = punkteVon(p);
  anzeige();
  zugBeenden(sp);
  anzeige();
  return { ok: true };
}

function abwerfen() {
  if (!zugMoeglich() || !sp || sp.phase !== "play" || sp.gezogen === null) return { ok: false, fehler: "aktion-nicht-erlaubt" };
  if (sp.quelle !== "deck") return { ok: false, fehler: "aktion-nicht-erlaubt" };
  const p = sp.spieler[sp.zug];
  if (sp.online && !p.ich) return { ok: false, fehler: "nicht-am-zug" };
  if (sp.online) { melde("abwerfen", {}); return { ok: true, gesendet: true }; }
  sp.ablage.push(sp.gezogen);
  sp.gezogen = null;
  sp.quelle = "";
  tick++;
  if (verdecktZahl(p) === 0) {
    anzeige();
    zugBeenden(sp);
    anzeige();
    return { ok: true };
  }
  sp.phase = "reveal";
  sp.notiz = p.name + " wirft ab und deckt eine eigene Karte auf.";
  anzeige();
  return { ok: true };
}

function umdrehen(index) {
  if (!zugMoeglich() || !sp) return { ok: false, fehler: "aktion-nicht-erlaubt" };
  if (sp.phase !== "reveal" && sp.phase !== "play") return { ok: false, fehler: "aktion-nicht-erlaubt" };
  const p = sp.spieler[sp.zug];
  const k = p.karten[index];
  if (!k || k.offen || k.weg) return { ok: false, fehler: "aktion-nicht-erlaubt" };
  if (sp.phase === "play" && sp.gezogen === null) return { ok: false, fehler: "aktion-nicht-erlaubt" };
  if (sp.online && !p.ich) return { ok: false, fehler: "nicht-am-zug" };
  if (sp.online) { melde("umdrehen", { index }); return { ok: true, gesendet: true }; }
  k.offen = true;
  k.frisch = true;
  tick++;
  spaltenPruefen(p);
  p.runde = punkteVon(p);
  sp.phase = "play";
  anzeige();
  zugBeenden(sp);
  anzeige();
  return { ok: true };
}

function naechsteRunde() {
  if (!sp || sp.phase !== "between") return { ok: false, fehler: "aktion-nicht-erlaubt" };
  if (sp.online) {
    if (!sp.spieler.some((p) => p.ich)) return { ok: false, fehler: "nicht-am-zug" };
    melde("neueRunde", { runde: sp.runde });
    return { ok: true, gesendet: true };
  }
  sp.runde += 1;
  rundeAusteilen(sp);
  sp.setupFertig = sp.spieler.map(() => 0);
  sp.notiz = sp.spieler[0].name + " deckt zwei Karten auf.";
  blattZu();
  anzeige();
  planen();
  return { ok: true, runde: sp.runde };
}

/* ---------------------------- Bot-Ablauf ---------------------------- */

function planen() {
  clearTimeout(botTimer);
  if (!sp || sp.online || pausiert) return;
  const p = sp.spieler[sp.zug];
  if (!p || !p.bot) return;
  botTimer = setTimeout(botSchritt, 850 + Math.random() * 350);
}

function botSchritt() {
  if (!sp || pausiert || sp.online || sp.phase === "fertig") return;
  const p = sp.spieler[sp.zug];
  if (!p || !p.bot) return;
  if (sp.phase === "setup") {
    const zu = p.karten.map((k, i) => (!k.offen && !k.weg ? i : -1)).filter((i) => i >= 0);
    if (zu.length) {
      const i = zu[Math.floor(Math.random() * zu.length)];
      sp.notiz = p.name + " deckt eine Karte auf.";
      aufdecken(i);
    }
    planen();
    return;
  }
  if (sp.phase === "reveal") {
    const i = verdecktIndexHoechste(p);
    if (i >= 0) umdrehen(i);
    planen();
    return;
  }
  if (sp.phase === "play") {
    if (sp.gezogen === null) {
      const e = botEntscheidung(p, sp);
      if (e.art === "nehmen") {
        sp.notiz = p.name + " nimmt die Ablagekarte.";
        anzeige();
        botTimer = setTimeout(() => {
          if (!sp || sp.phase !== "play" || sp.gezogen === null) return;
          tauschen(e.ziel);
          planen();
        }, 700);
        ziehen("ablage");
        return;
      }
      sp.notiz = p.name + " zieht vom Stapel.";
      anzeige();
      botTimer = setTimeout(() => {
        if (!sp || sp.phase !== "play" || sp.gezogen === null) return;
        const wahl = botTauschZiel(p, sp.gezogen);
        if (wahl.tausch !== undefined) {
          tauschen(wahl.tausch);
        } else {
          abwerfen();
          if (wahl.umdrehen >= 0 && sp.phase === "reveal") botTimer = setTimeout(() => { umdrehen(wahl.umdrehen); planen(); }, 700);
          return;
        }
        planen();
      }, 700);
      ziehen("deck");
      return;
    }
    const wahl = botTauschZiel(p, sp.gezogen);
    if (wahl.tausch !== undefined) tauschen(wahl.tausch);
    else { abwerfen(); if (sp.phase === "reveal") botTimer = setTimeout(() => umdrehen(wahl.umdrehen), 700); }
    planen();
  }
}

/* ---------------------------- Anzeige ---------------------------- */

function stilAnwenden() {
  document.documentElement.setAttribute("data-stil", auswahl.stil);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = { normal: "#0a211b", maedchen: "#f7a6d4", buben: "#04070b" }[auswahl.stil] || "#0a211b";
}

function startAnzeigen(an) {
  el.start.hidden = !an;
  el.spiel.hidden = an;
}

function startAuswahl() {
  startAnzeigen(true);
  el.blatt.hidden = true;
  auswahlAnzeigen();
}

function auswahlAnzeigen() {
  el.wahlSpieler.value = String(auswahl.spieler);
  const optionen = [];
  for (let i = 1; i <= auswahl.spieler; i++) optionen.push('<option value="' + i + '">' + i + (i === 1 ? " Mensch" : " Menschen") + "</option>");
  el.wahlMenschen.innerHTML = optionen.join("");
  el.wahlMenschen.value = String(Math.min(auswahl.menschen, auswahl.spieler));
  auswahl.menschen = Number(el.wahlMenschen.value);
  el.wahlStufe.value = auswahl.stufe;
  el.wahlStil.innerHTML = STILE.map((s) =>
    '<button type="button" data-stil="' + s + '" aria-pressed="' + (auswahl.stil === s) + '">' + (s === "normal" ? "Normal" : s === "maedchen" ? "Mädchen" : "Buben") + "</button>").join("");
  el.wahlStil.hidden = stilVonAussen;
  const bots = auswahl.spieler - auswahl.menschen;
  el.startInfo.textContent = auswahl.menschen + (auswahl.menschen === 1 ? " Mensch" : " Menschen") + " und " + bots + (bots === 1 ? " Bot" : " Bots") + " – 12 Karten, zwei offen, gespielt wird bis 100 Punkte.";
  el.startHinweis.textContent = "Am Handy spielen mehrere Menschen nacheinander am selben Gerät.";
}

function gegnerZeichnen() {
  el.gegner.innerHTML = "";
  if (!sp) return;
  sp.spieler.forEach((p, i) => {
    if (i === sicht) return;   // das eigene Feld steht groß unten
    const box = document.createElement("div");
    box.className = "gegner" + (i === sp.zug && sp.phase !== "fertig" ? " aktiv" : "");
    const kopf = document.createElement("div");
    kopf.className = "gz";
    const name = document.createElement("span");
    name.className = "gname";
    name.textContent = p.name;
    const pkt = document.createElement("span");
    pkt.className = "gpkt";
    pkt.textContent = p.punkte;
    kopf.append(name, pkt);
    const zug = document.createElement("div");
    zug.className = "gzug";
    zug.textContent = i === sp.zug && sp.phase !== "fertig" ? "am Zug" : (p.runde ? "Runde " + p.runde : "wartet");
    const mini = document.createElement("div");
    mini.className = "gmini";
    p.karten.forEach((k) => {
      const d = document.createElement("span");
      d.className = "gkarte" + (k.weg ? " weg" : k.offen ? " offen" : "");
      d.title = k.weg ? "weg" : k.offen ? "offen: " + cardText(k.w) : "verdeckt";
      mini.appendChild(d);
    });
    box.append(kopf, zug, mini);
    box.title = p.name + " · " + p.punkte + " Punkte – antippen für die offenen Karten";
    box.tabIndex = 0;
    box.setAttribute("role", "button");
    box.addEventListener("click", () => peekZeigen(i));
    box.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); peekZeigen(i); } });
    el.gegner.appendChild(box);
  });
}

function karteZeichnen(p, i, optionen) {
  const k = p.karten[i];
  const b = document.createElement("button");
  b.type = "button";
  b.className = "card";
  if (k.weg) {
    b.classList.add("weg");
    b.innerHTML = '<span class="value">×</span>';
    b.disabled = true;
    return b;
  }
  if (k.offen) {
    b.classList.add(cardClass(k.w));
    b.innerHTML = '<span class="value">' + cardText(k.w) + "</span>" + (sp && sp.spieler.length <= 4 ? '<span class="mini">SKYJO</span>' : "");
    b.setAttribute("aria-label", "Karte " + cardText(k.w));
  } else {
    b.classList.add("back");
    b.innerHTML = '<span class="value">S</span>';
    b.setAttribute("aria-label", "Verdeckte Karte");
  }
  if (k.frisch) { b.classList.add("frisch"); delete k.frisch; }
  if (optionen && optionen.klickbar) {
    b.classList.add("waehlbar");
    if (optionen.ziel) b.classList.add("ziel");
    b.addEventListener("click", () => optionen.beiKlick(i));
  } else {
    b.disabled = true;
  }
  return b;
}

function handZeichnen() {
  el.hand.innerHTML = "";
  if (!sp) return;
  const p = sp.spieler[sicht];
  if (!p) return;
  el.eigenName.textContent = p.name;
  el.eigenPunkte.textContent = p.punkte + " Punkte";
  const aktiv = sicht === sp.zug && sp.phase !== "fertig" && !pausiert;
  const setup = aktiv && sp.phase === "setup";
  const tausch = aktiv && sp.phase === "play" && sp.gezogen !== null;
  const umdreh = aktiv && sp.phase === "reveal";
  p.karten.forEach((k, i) => {
    const klickbar = (setup && !k.offen) || tausch || (umdreh && !k.offen);
    el.hand.appendChild(karteZeichnen(p, i, {
      klickbar,
      ziel: tausch,
      beiKlick: (idx) => {
        if (setup) aufdecken(idx);
        else if (tausch) tauschen(idx);
        else if (umdreh) umdrehen(idx);
      }
    }));
  });
}

function aktionenZeichnen() {
  el.aktionen.innerHTML = "";
  if (!sp) return;
  const p = sp.spieler[sicht];
  const aktiv = sicht === sp.zug && sp.phase !== "fertig" && !pausiert;
  const knopf = (text, art, klasse) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = text;
    if (klasse) b.className = klasse;
    b.addEventListener("click", art);
    return b;
  };
  if (sp.phase === "between") {
    el.aktionen.appendChild(knopf("Nächste Runde", () => naechsteRunde(), "primary"));
    return;
  }
  if (!aktiv) return;
  if (sp.phase === "play" && sp.gezogen === null) {
    el.aktionen.appendChild(knopf("Vom Stapel ziehen", () => ziehen("deck"), "primary"));
    const ab = knopf("Ablage nehmen (" + (sp.ablage.length ? cardText(sp.ablage[sp.ablage.length - 1]) : "–") + ")", () => ziehen("ablage"));
    ab.disabled = !sp.ablage.length;
    el.aktionen.appendChild(ab);
  } else if (sp.phase === "play" && sp.gezogen !== null) {
    el.hinweis.textContent = "Gezogen: " + cardText(sp.gezogen) + " – tausche gegen eine eigene Karte" +
      (sp.quelle === "deck" ? " oder wirf sie ab." : ".");
    if (sp.quelle === "deck") el.aktionen.appendChild(knopf("Abwerfen und aufdecken", () => abwerfen()));
  } else if (sp.phase === "setup") {
    el.hinweis.textContent = "Decke zwei deiner Karten auf.";
  } else if (sp.phase === "reveal") {
    el.hinweis.textContent = "Decke eine verdeckte eigene Karte auf.";
  }
  if (sp.phase === "play" && sp.gezogen === null) el.hinweis.textContent = "Ziehe vom Stapel oder nimm die Ablagekarte.";
}

function mitteZeichnen() {
  el.banner.textContent = !sp ? "" :
    sp.phase === "fertig" ? "Partie beendet" :
    sp.phase === "between" ? "Runde " + sp.runde + " beendet" :
    sp.spieler[sp.zug].name + " ist am Zug" + (sp.modus === "lokal" && sp.spieler[sp.zug].bot ? " (Bot)" : "");
  el.status.textContent = pausiert ? "Pausiert." : (sp ? sp.notiz : "");
  el.nachzieh.textContent = sp && sp.deck.length ? "?" : "–";
  el.stapelZahl.textContent = sp ? sp.deck.length + " Karten" : "";
  if (sp && sp.ablage.length) {
    el.ablage.textContent = cardText(sp.ablage[sp.ablage.length - 1]);
    el.ablage.classList.remove("leer");
    el.ablage.classList.remove("klickbar");
  } else {
    el.ablage.textContent = "–";
    el.ablage.classList.add("leer");
  }
  if (sp && sp.phase === "play" && sp.gezogen === null && sp.zug === sicht && !pausiert) {
    el.ablage.classList.add("klickbar");
    el.ablage.onclick = () => ziehen("ablage");
    el.nachzieh.classList.add("klickbar");
    el.nachzieh.onclick = () => ziehen("deck");
  } else {
    el.ablage.onclick = null;
    el.nachzieh.onclick = null;
    el.ablage.classList.remove("klickbar");
    el.nachzieh.classList.remove("klickbar");
  }
}

function sichtFolgen() {
  if (!sp || sp.online) return;
  const p = sp.spieler[sp.zug];
  if (p && !p.bot) sicht = sp.zug;
}

function anzeige() {
  if (!sp) { startAuswahl(); return; }
  sichtFolgen();
  startAnzeigen(false);
  gegnerZeichnen();
  mitteZeichnen();
  handZeichnen();
  aktionenZeichnen();
  if (sp.phase === "between" || sp.phase === "fertig") blattZeigen();
}

/* ---------------------------- Blatt (Runde/Ende) ---------------------------- */

function siegerNamen() {
  if (!sp || !Array.isArray(sp.sieger)) return [];
  return sp.sieger
    .map((x) => (typeof x === "number" ? (sp.spieler[x] ? sp.spieler[x].name : "") : String(x)))
    .filter(Boolean);
}

function blattZeigen() {
  if (!sp) return;
  const fertig = sp.phase === "fertig";
  const namen = siegerNamen();
  el.blattTitel.textContent = fertig
    ? (namen.length === 1 ? namen[0] + " gewinnt!" : (namen.length > 1 ? "Unentschieden: " + namen.join(", ") : "Spiel beendet"))
    : "Runde " + sp.runde + " beendet";
  const runde = sp.letzteRunde || { werte: sp.spieler.map((p) => p.runde), gesamte: sp.spieler.map((p) => p.punkte), sieger: [] };
  const besteRunde = Math.min(...runde.werte);
  const besteGesamt = Math.min(...sp.spieler.map((p) => p.punkte));
  el.blattText.textContent = fertig
    ? "Endstand nach " + sp.runde + (sp.runde === 1 ? " Runde" : " Runden") + " – wer zuerst 100 Punkte hat, verliert."
    : "Punkte dieser Runde und Gesamtstand. Die nächste Runde beginnt nur auf Knopfdruck.";
  el.blattTabelle.innerHTML = "";
  sp.spieler.forEach((p, i) => {
    const z = document.createElement("div");
    z.className = "tz" + ((fertig ? p.punkte === besteGesamt : runde.werte[i] === besteRunde) ? " sieger" : "");
    const n = document.createElement("span");
    n.className = "tn";
    n.textContent = p.name + (p.bot ? " · Bot" : "");
    const r = document.createElement("span");
    r.className = "tr";
    r.textContent = "Runde " + (Number.isFinite(runde.werte[i]) ? runde.werte[i] : p.runde);
    const g = document.createElement("span");
    g.className = "tg";
    g.textContent = p.punkte + " ges.";
    z.append(n, r, g);
    el.blattTabelle.appendChild(z);
  });
  el.blattKnoepfe.innerHTML = "";
  if (!fertig) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "primary";
    b.textContent = "Nächste Runde";
    b.addEventListener("click", () => naechsteRunde());
    el.blattKnoepfe.appendChild(b);
  } else {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "primary";
    b.textContent = "Neue Partie";
    b.addEventListener("click", () => starten({}));
    el.blattKnoepfe.appendChild(b);
    const c = document.createElement("button");
    c.type = "button";
    c.textContent = "Zur Auswahl";
    c.addEventListener("click", () => beenden());
    el.blattKnoepfe.appendChild(c);
  }
  const offen = sp.spieler.filter((p) => !p.bot && !(sp.online && !p.ich));
  el.hinweisBlatt.textContent = sp.online
    ? "Online: Der Stand kommt vom Connector, sobald alle bereit sind."
    : (offen.length > 1 ? "Am selben Gerät: Punkte besprechen, dann weitergeben." : "");
  el.blatt.hidden = false;
}

let peekOffen = false;

function blattZu() {
  el.blatt.hidden = true;
  peekOffen = false;
}

function peekZeigen(index) {
  if (!sp) return;
  const p = sp.spieler[index];
  if (!p) return;
  peekOffen = true;
  el.blattTitel.textContent = p.name;
  el.blattText.textContent = p.punkte + " Punkte gesamt · Runde " + p.runde + " · " + verdecktZahl(p) + " Karten verdeckt.";
  el.blattTabelle.innerHTML = "";
  const offen = p.karten.map((k, i) => ({ k, i })).filter((x) => x.k.offen && !x.k.weg);
  if (!offen.length) {
    const z = document.createElement("div");
    z.className = "tz";
    z.textContent = "Noch keine Karte offen.";
    el.blattTabelle.appendChild(z);
  }
  offen.forEach((x) => {
    const z = document.createElement("div");
    z.className = "tz";
    const n = document.createElement("span");
    n.className = "tn";
    n.textContent = "Karte " + (x.i + 1);
    const r = document.createElement("span");
    r.className = "tr";
    r.textContent = "offen";
    const g = document.createElement("span");
    g.className = "tg";
    g.textContent = cardText(x.k.w);
    z.append(n, r, g);
    el.blattTabelle.appendChild(z);
  });
  el.blattKnoepfe.innerHTML = "";
  const b = document.createElement("button");
  b.type = "button";
  b.className = "primary";
  b.textContent = "Zurück";
  b.addEventListener("click", () => {
    if (sp && (sp.phase === "between" || sp.phase === "fertig")) blattZeigen();
    else blattZu();
  });
  el.blattKnoepfe.appendChild(b);
  el.hinweisBlatt.textContent = "Fremde verdeckte Karten bleiben verdeckt – hier stehen nur die offenen.";
  el.blatt.hidden = false;
}

/* ---------------------------- Schnittstelle ---------------------------- */

function melde(was, detail) {
  try {
    window.dispatchEvent(new CustomEvent("skyjo:" + was, { detail: JSON.parse(JSON.stringify(detail || {})) }));
  } catch (e) { /* Ereignisse sind Beiwerk */ }
}

function kopie(wert) { return JSON.parse(JSON.stringify(wert)); }

function zustand() {
  if (!sp) {
    return kopie({
      laeuft: false, pausiert, tick, richtung: { x: 0, y: 0 }, level: 0, punkte: 0,
      extras: [], startbildschirm: true, version: "2.0.0", modus: auswahl.modus || "lokal",
      spieler: [], zug: 0, amZug: null, phase: "start", runde: 0, ziel: ZIEL
    });
  }
  const p = sp.spieler[sicht] || sp.spieler[0];
  return kopie({
    laeuft: sp.phase !== "fertig" && sp.phase !== "between",
    pausiert, tick, richtung: { x: 0, y: 0 }, level: sp.runde, punkte: p.punkte,
    extras: [], startbildschirm: false, version: "2.0.0",
    modus: sp.modus, phase: sp.phase, runde: sp.runde, ziel: ZIEL,
    spieler: sp.spieler.map((x) => ({ name: x.name, bot: x.bot, stufe: x.bot ? x.stufe : null, punkte: x.punkte, runde: x.runde, offen: anzOffen(x), verdeckt: verdecktZahl(x) })),
    zug: sp.zug, amZug: sp.spieler[sp.zug] ? sp.spieler[sp.zug].name : null,
    eigeneKarten: p.karten.map((k) => ({ wert: k.offen ? k.w : null, offen: k.offen, weg: k.weg })),
    gezogen: sp.gezogen, quelle: sp.quelle,
    deck: sp.deck.length, ablage: sp.ablage.length ? sp.ablage[sp.ablage.length - 1] : null,
    sieger: siegerNamen().length ? siegerNamen() : null,
    beendet: sp.phase === "fertig"
  });
}

function einstellungen() {
  return kopie({
    version: "2.0.0",
    stufen: STUFEN.slice(),
    stufe: auswahl.stufe,
    stile: !stilVonAussen ? STILE.slice() : [],
    stil: auswahl.stil,
    stilWahl: !stilVonAussen,
    spieler: auswahl.spieler,
    menschen: auswahl.menschen,
    spielerAnzahl: { min: 2, max: 8 },
    modi: ["lokal", "online"]
  });
}

function starten(konf) {
  const k = konf === undefined || konf === null ? {} : konf;
  if (typeof k !== "object" || Array.isArray(k)) return { ok: false, fehler: "konfiguration-muss-objekt-sein" };
  if (k.online) {
    if (typeof k.online !== "object" || typeof k.online.id !== "string" || !k.online.id) {
      return { ok: false, fehler: "online-muss-id-haben" };
    }
    if (sp && sp.modus === "online" && sp.phase !== "fertig") return { ok: false, fehler: "spiel-laeuft" };
    if (typeof k.stil === "string" && STILE.includes(k.stil)) {
      auswahl.stil = k.stil;
      stilVonAussen = true;
      stilAnwenden();
    }
    online = { id: k.online.id, name: typeof k.online.name === "string" ? k.online.name : "Du" };
    sp = { modus: "online", online: true, spieler: [], deck: [], ablage: [], zug: 0, phase: "warten",
      gezogen: null, quelle: "", runde: 1, startSpieler: 0, finisher: -1, restZuege: 0,
      sieger: null, notiz: "Warte auf den Tisch …", letzteRunde: null, ende: false, setupFertig: [] };
    sicht = 0;
    standMarke = "";
    endGemeldet = "";
    clearTimeout(botTimer);
    blattZu();
    startAnzeigen(false);
    el.gegner.innerHTML = "";
    el.hand.innerHTML = "";
    el.banner.textContent = "Warte auf den Tisch …";
    el.status.textContent = "Der Raum stellt die Partie zusammen.";
    el.aktionen.innerHTML = "";
    return { ok: true, online: true, warte: true };
  }
  const erlaubt = ["spieler", "menschen", "stufe", "stil"];
  for (const feld of Object.keys(k)) {
    if (!erlaubt.includes(feld)) return { ok: false, fehler: "unbekanntes-feld", feld };
  }
  if (sp && sp.phase !== "fertig" && sp.phase !== "between") return { ok: false, fehler: "spiel-laeuft" };
  if ("stufe" in k) {
    if (typeof k.stufe !== "string") return { ok: false, fehler: "stufe-muss-text-sein" };
    if (!STUFEN.includes(k.stufe)) return { ok: false, fehler: "unbekannte-stufe" };
  }
  if ("spieler" in k) {
    if (!Number.isInteger(k.spieler) || k.spieler < 2 || k.spieler > 8) return { ok: false, fehler: "spieler-muessen-2-bis-8-sein" };
  }
  if ("menschen" in k) {
    if (!Number.isInteger(k.menschen) || k.menschen < 1) return { ok: false, fehler: "menschen-muessen-1-bis-8-sein" };
  }
  if ("stil" in k) {
    if (typeof k.stil !== "string") return { ok: false, fehler: "stil-muss-text-sein" };
    if (!STILE.includes(k.stil)) return { ok: false, fehler: "unbekannter-stil" };
  }
  if ("stufe" in k) auswahl.stufe = k.stufe;
  if ("spieler" in k) auswahl.spieler = k.spieler;
  if ("menschen" in k) auswahl.menschen = k.menschen;
  if (auswahl.menschen > auswahl.spieler) auswahl.menschen = auswahl.spieler;
  if ("stil" in k) { auswahl.stil = k.stil; if (k.stilVonAussen) stilVonAussen = true; }
  stilAnwenden();
  auswahl.modus = "lokal";
  sp = partieBauen(auswahl.spieler, auswahl.menschen, auswahl.stufe);
  sp.stil = auswahl.stil;
  pausiert = false;
  tick = 0;
  standMarke = "";
  endGemeldet = "";
  sicht = 0;
  blattZu();
  anzeige();
  planen();
  return { ok: true, spieler: auswahl.spieler, menschen: auswahl.menschen, bots: auswahl.spieler - auswahl.menschen, stufe: auswahl.stufe, stil: auswahl.stil };
}

function beenden() {
  clearTimeout(botTimer);
  sp = null;
  pausiert = false;
  online = null;
  sicht = 0;
  standMarke = "";
  endGemeldet = "";
  blattZu();
  startAuswahl();
  return { ok: true };
}

function pausieren() {
  if (!sp || sp.phase === "fertig") return { ok: false, fehler: "spiel-laeuft-nicht" };
  if (pausiert) return { ok: true, pausiert: true };
  pausiert = true;
  clearTimeout(botTimer);
  anzeige();
  melde("pausiert", { tick });
  return { ok: true, pausiert: true };
}

function fortsetzen() {
  if (!sp || sp.phase === "fertig") return { ok: false, fehler: "spiel-laeuft-nicht" };
  if (!pausiert) return { ok: true, pausiert: false };
  pausiert = false;
  anzeige();
  melde("weiter", { tick });
  planen();
  return { ok: true, pausiert: false };
}

function einstellungenUebernehmen(k) {
  // Nur die Auswahl, keine laufende Partie.
  if (!("spieler" in k || "menschen" in k || "stufe" in k || "stil" in k)) return;
  if ("spieler" in k && Number.isInteger(k.spieler) && k.spieler >= 2 && k.spieler <= 8) auswahl.spieler = k.spieler;
  if ("menschen" in k && Number.isInteger(k.menschen) && k.menschen >= 1 && k.menschen <= 8) auswahl.menschen = Math.min(k.menschen, auswahl.spieler);
  if ("stufe" in k && STUFEN.includes(k.stufe)) auswahl.stufe = k.stufe;
  if ("stil" in k && STILE.includes(k.stil)) { auswahl.stil = k.stil; stilAnwenden(); }
  if (sp) anzeige(); else auswahlAnzeigen();
}

function aktion(name, daten) {
  if (daten !== undefined && (daten === null || typeof daten !== "object" || Array.isArray(daten))) {
    return { ok: false, fehler: "daten-muessen-objekt-sein" };
  }
  const d = daten || {};
  switch (name) {
    case "aufdecken": return aufdecken(Number(d.index));
    case "ziehen": return ziehen(d.quelle === "ablage" ? "ablage" : "deck");
    case "tauschen": return tauschen(Number(d.index));
    case "abwerfen": return abwerfen();
    case "umdrehen": return umdrehen(Number(d.index));
    case "neueRunde": return naechsteRunde();
    case "pause": return pausieren();
    case "weiter": return fortsetzen();
    case "start": return starten(d);
    case "stand": return standUebernehmen(d.spiel, d.ich);
    case "online": return starten({ online: d.online, stil: d.stil });
    default: return { ok: false, fehler: "unbekannte-aktion" };
  }
}

/* -------- Online: Stand vom Connector (nur öffentliche Infos + eigene Hand) -------- */

function standUebernehmen(g, ich) {
  if (!g || !Array.isArray(g.spieler) || !g.spieler.length) return { ok: false, fehler: "stand-fehlt" };
  if (ich && typeof ich.id === "string" && !online) online = { id: ich.id, name: ich.name || "Du" };
  const meineId = online ? online.id : "";
  const marke = String(g.id || "") + "#" + (Number(g.runde) || 1) + "#" + (g.status || "");
  const vorher = sp ? sp.phase : "";
  const spieler = g.spieler.map((s, i) => ({
    name: s.name || "Spieler " + (i + 1),
    bot: !!s.bot,
    stufe: s.stufe || s.botStufe || null,
    ich: !!meineId && s.id === meineId,
    punkte: Number(s.gesamt) || 0,
    runde: Number(s.runden) || 0,
    karten: Array.isArray(s.karten) ? s.karten.map((k) => ({ w: Number(k.wert) || 0, offen: !!k.offen, weg: !!k.weg })) : []
  }));
  const meinIndex = Math.max(0, spieler.findIndex((p) => p.ich));
  sp = {
    modus: "online", online: true, spieler,
    deck: new Array(Number(g.deckCount) || 0), ablage: Number(g.ablageOben) !== undefined && g.ablageOben !== null ? [Number(g.ablageOben)] : [],
    zug: Number.isInteger(g.zug) ? Math.max(0, Math.min(spieler.length - 1, g.zug)) : 0,
    phase: g.status === "finished" ? "fertig" : (g.status === "invited" ? "warten" : (g.phase || "play")),
    gezogen: g.gezogen === null || g.gezogen === undefined ? null : Number(g.gezogen),
    quelle: g.quelle || "",
    runde: Number(g.runde) || 1,
    startSpieler: meinIndex, finisher: g.finisher ?? -1, restZuege: 0,
    sieger: Array.isArray(g.sieger) ? g.sieger : null,
    notiz: g.notiz || "", letzteRunde: g.letzteRunde || null, ende: g.status === "finished",
    setupFertig: spieler.map((p) => p.karten.filter((k) => k.offen).length)
  };
  sicht = meinIndex;
  // Die eigene Hand kommt vollständig, fremde Karten nur offen.
  if (Array.isArray(g.eigeneKarten)) {
    sp.spieler[meinIndex].karten = g.eigeneKarten.map((k) => ({ w: Number(k.wert) || 0, offen: !!k.offen, weg: !!k.weg }));
  }
  standMarke = marke;
  anzeige();
  if (sp.phase === "between" || sp.phase === "fertig") blattZeigen();
  if (sp.phase === "fertig" && endGemeldet !== marke) {
    endGemeldet = marke;
    melde("ende", { grund: "gewonnen", punkte: sp.spieler[meinIndex].punkte, level: sp.runde, levelAnzahl: 1, tick, sieger: sp.sieger });
  }
  return { ok: true, phase: sp.phase, zug: sp.zug, runde: sp.runde };
}

/* ---------------------------- Bedienung ---------------------------- */

el.wahlSpieler.addEventListener("change", () => {
  auswahl.spieler = Number(el.wahlSpieler.value);
  if (auswahl.menschen > auswahl.spieler) auswahl.menschen = auswahl.spieler;
  auswahlAnzeigen();
});
el.wahlMenschen.addEventListener("change", () => {
  auswahl.menschen = Number(el.wahlMenschen.value);
  auswahlAnzeigen();
});
el.wahlStufe.addEventListener("change", () => { auswahl.stufe = el.wahlStufe.value; auswahlAnzeigen(); });
el.wahlStil.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-stil]");
  if (!b) return;
  auswahl.stil = b.dataset.stil;
  stilAnwenden();
  auswahlAnzeigen();
  try { localStorage.setItem("skyjo-auswahl", JSON.stringify(auswahl)); } catch (err) {}
});
el.startKnopf.addEventListener("click", () => {
  try { localStorage.setItem("skyjo-auswahl", JSON.stringify(auswahl)); } catch (err) {}
  starten({ spieler: auswahl.spieler, menschen: auswahl.menschen, stufe: auswahl.stufe, stil: auswahl.stil });
});
el.btnAuswahl.addEventListener("click", () => beenden());
el.btnRegeln.addEventListener("click", () => {
  const alt = el.blatt.hidden;
  if (!alt) { blattZu(); return; }
  el.blattTitel.textContent = "Spielregeln";
  el.blattText.textContent = "Kurzfassung – im Spiel zählt jede Karte.";
  el.blattTabelle.innerHTML = "";
  const regeln = [
    "Jeder bekommt 12 Karten (4 Spalten × 3 Reihen), zwei davon werden zu Beginn offen hingelegt.",
    "Wer am Zug ist, zieht vom Nachziehstapel oder nimmt die oberste Ablagekarte.",
    "Ablagekarte: muss gegen eine eigene Karte getauscht werden.",
    "Stapelkarte: gegen eine eigene Karte tauschen oder abwerfen und eine eigene verdeckte Karte aufdecken.",
    "Drei gleiche Zahlen untereinander verschwinden samt Spalte.",
    "Wer alle Karten offen hat, löst die letzte Runde aus – jeder andere hat noch genau einen Zug.",
    "Danach werden alle Karten aufgedeckt; die Summe ist das Rundenergebnis.",
    "Wer die Runde beendet und nicht die niedrigste Summe hat, bekommt seine Punkte verdoppelt.",
    "Gespielt wird bis 100 Gesamtpunkte – wer am Ende am wenigsten hat, gewinnt."
  ];
  regeln.forEach((t) => {
    const z = document.createElement("div");
    z.className = "tz";
    z.textContent = t;
    el.blattTabelle.appendChild(z);
  });
  el.blattKnoepfe.innerHTML = "";
  const b = document.createElement("button");
  b.type = "button";
  b.className = "primary";
  b.textContent = "Weiterspielen";
  b.addEventListener("click", () => { blattZu(); });
  el.blattKnoepfe.appendChild(b);
  el.hinweisBlatt.textContent = "";
  el.blatt.hidden = false;
});

/* ---------------------------- Init ---------------------------- */

const Schnittstelle = {
  version: "2.0.0",
  bereit: true,
  whenReady() { return Promise.resolve({ ok: true, version: this.version }); },
  start: starten,
  einstellungen,
  zustand,
  startbildschirm: () => beenden(),
  stop: () => beenden(),
  pause: pausieren,
  resume: fortsetzen,
  aktion
};

(function init() {
  try {
    const roh = localStorage.getItem("skyjo-auswahl");
    if (roh) {
      const g = JSON.parse(roh);
      if ([2, 3, 4, 5, 6, 7, 8].includes(g.spieler)) auswahl.spieler = g.spieler;
      if (Number.isInteger(g.menschen) && g.menschen >= 1) auswahl.menschen = Math.min(g.menschen, auswahl.spieler);
      if (STUFEN.includes(g.stufe)) auswahl.stufe = g.stufe;
      if (STILE.includes(g.stil)) auswahl.stil = g.stil;
    }
  } catch (e) { /* ohne Speicher geht es auch */ }
  stilAnwenden();
  startAuswahl();
  window.Skyjo = Object.freeze(Schnittstelle);
  melde("bereit", { version: "2.0.0" });
})();
</script>
