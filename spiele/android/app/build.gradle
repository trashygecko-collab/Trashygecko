plugins {
    id "com.android.application"
}

// Release-Signatur: keystore.properties (lokal, per .gitignore ausgenommen) oder TRASHY_RELEASE_*.
def keystoreWerte = new Properties()
def keystoreDatei = rootProject.file("keystore.properties")
if (keystoreDatei.isFile()) {
    keystoreDatei.withInputStream { keystoreWerte.load(it) }
}
def releaseKeyPath = keystoreWerte.getProperty("storeFile") ?: System.getenv("TRASHY_RELEASE_KEYSTORE")
def releaseStorePassword = keystoreWerte.getProperty("storePassword") ?: System.getenv("TRASHY_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = keystoreWerte.getProperty("keyAlias") ?: System.getenv("TRASHY_RELEASE_KEY_ALIAS")
def releaseKeyPassword = keystoreWerte.getProperty("keyPassword") ?: System.getenv("TRASHY_RELEASE_KEY_PASSWORD")
def releaseValues = [releaseKeyPath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
def hasReleaseSigning = releaseValues.every { it != null && !it.trim().isEmpty() }
if (releaseValues.any { it != null && !it.trim().isEmpty() } && !hasReleaseSigning) {
    throw new GradleException("Für Release-Signierung müssen alle vier Werte gesetzt sein (keystore.properties oder TRASHY_RELEASE_*).")
}

android {
    namespace "de.trashygecko.tmahjong"
    compileSdk 34

    defaultConfig {
        applicationId "de.trashygecko.tmahjong"
        minSdk 21
        targetSdk 34
        versionCode 16
        versionName "1.15"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeyPath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Kein Qualitaetsverlust bei Schrift und Bildern im WebView.
    buildFeatures {
        buildConfig false
    }
}

dependencies {
    // WebViewAssetLoader: liefert die Spieldateien unter einer echten https-Herkunft
    // aus, damit localStorage und die Sicherheitsregeln des Spiels greifen.
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.core:core:1.13.1"
}

// Die Spieldateien liegen nur an einer Stelle (spiele/brettspiele/mahjong) und
// werden beim Bauen in die Assets kopiert - so kann die App nicht von der
// Webfassung abweichen.  file() zaehlt vom App-Modul (spiele/android/app) aus:
// ../../ ist spiele/.
def homepageQuelle = file("../../../")
def wwwZiel = file("src/main/assets/www")
def remoteQuelle = file("../../../WLAN-Fernbedienung")

// Die Seiten, die die Startseite (index.html) verlinkt: Tagebuch, Buecher, Rezepte,
// Anleitungen und so weiter. Ohne sie waeren die Kacheln der Homepage im APK tot.
// Die Liste ist der erreichbare Teil des Baums (von index.html aus verfolgt);
// css/ enthaelt daneben den alten Seiten-Spiegel, der unten ausgenommen wird.
def homepageSeiten = ["anbau", "batch", "bucher", "cheats", "css", "filme", "gedichte", "html",
                      "musik", "rezepte", "russisch", "script", "seiten", "sprueche", "tagebuch",
                      "tipps", "weisheiten", "witze", "youtube"]

tasks.register("homepageKopieren", Sync) {
    // Spiele, die verlinkten Homepage-Seiten, Fernbedienung und die geteilten
    // Grunddateien. Quellcode, Tests und Altlasten bleiben draussen.
    from(homepageQuelle) {
        include "spiele/**", "main.css", "monofonto.ttf"
        include homepageSeiten.collect { "${it}/**" }
        exclude "**/.backup-*/**"
        // Tagebucheintrag ohne Seite, in .gitignore als Altlast gefuehrt.
        exclude "tagebuch/Textdokument (neu).txt"
        // Der alte Seiten-Spiegel unter css/ (in .gitignore, u. a. mit alten
        // Zugangsdaten) gehoert nicht ins APK - nur die fuenf Anleitungsseiten.
        exclude "css/index.html", "css/main.css", "css/monofonto.ttf",
                "css/batch/**", "css/bucher/**", "css/cheats/**", "css/css/**", "css/filme/**",
                "css/gedichte/**", "css/html/**", "css/musik/**", "css/rezepte/**", "css/russisch/**",
                "css/script/**", "css/seiten/**", "css/tipps/**", "css/witze/**"
        exclude "spiele/android/**", "spiele/connector/**", "spiele/connector-online/**"
        exclude "spiele/tests/**", "spiele/node_modules/**", "spiele/downloads/**"
        exclude "**/node_modules/**", "**/test-results/**", "**/playwright-report/**"
        exclude "**/backup-before-*/**", "**/*.backup-*"
        exclude "**/*.go", "**/*_test.go", "**/go.mod", "**/go.sum", "**/*.exe", "**/*-linux"
        exclude "**/*.apk", "**/*.log", "spiele/package.json", "spiele/package-lock.json", "spiele/playwright.config.js"
        // Keine Geheimnisse ins APK: das Betriebshandbuch nennt Passwoerter im Klartext,
        // schluessel.jks ist der Signaturschluessel selbst.
        exclude "ANLEITUNG.txt", "**/*.jks", "**/*.keystore"
    }
    // Die echte Startseite der Website (D-12) - als homepage.html, damit
    // www/index.html weiterhin der Rueckweg aus den Spielen bleibt.
    from(homepageQuelle) {
        include "index.html"
        rename { "homepage.html" }
    }
    from(remoteQuelle) {
        include "index.html", "styles.css", "README.md", "js/**"
        into "fernbedienung"
    }
    // Startbildschirm der App; zusaetzlich als index.html, damit alte
    // "../index.html"-Verweise aus den Spielen hier landen.
    from(rootProject.file("start")) {
        include "app.html"
    }
    from(rootProject.file("start")) {
        include "app.html"
        rename { "index.html" }
    }
    into(wwwZiel)
    doLast {
        // Alte Installationsdateien sind keine Spiele und liegen absichtlich nicht im App-Paket.
        File katalog = new File(wwwZiel, "spiele/spiele.html")
        String html = katalog.getText("UTF-8")
        String bereinigt = html.replaceAll(/(?m)^\s*\["[^"]+",\s*"android\/[^"]*\.apk",[^\r\n]*\r?\n/, "")
        if (html == bereinigt) throw new GradleException("Android-Installer-Einträge in der lokalen Spieleübersicht nicht gefunden")
        // In der App ist die Fernbedienung ausschließlich über „Extras“ erreichbar – auf der
        // Website bleibt die Kachel erhalten.
        String ohneFernbedienung = bereinigt.replaceAll(/(?m)^\s*\["[^"]+",\s*"\.\.\/WLAN-Fernbedienung\/[^"]*",[^\r\n]*\r?\n/, "")
        if (ohneFernbedienung == bereinigt) throw new GradleException("Fernbedienungs-Kachel in der lokalen Spieleübersicht nicht gefunden")
        katalog.setText(ohneFernbedienung, "UTF-8")
    }
}

tasks.register("verifyHomepageGames") {
    dependsOn "homepageKopieren"
    doLast {
        File katalog = new File(homepageQuelle, "spiele/spiele.html")
        String inhalt = katalog.getText("UTF-8")
        def matcher = (inhalt =~ /(?m)^\s*\["([^"]+)",\s*"([^"]+\.html)",\s*"([^"]+)",\s*"([^"]*)"/)
        List<String> rows = []
        while (matcher.find()) {
            String name = matcher.group(1)
            String relative = matcher.group(2).replace('\\', '/')
            if (relative.split('/').any { it == '..' }) throw new GradleException("Unsicherer Spielepfad: ${relative}")
            File quelle = new File(new File(homepageQuelle, "spiele"), relative)
            File asset = new File(new File(wwwZiel, "spiele"), relative)
            if (!quelle.isFile()) throw new GradleException("Spielekatalog verweist auf fehlende Quelldatei: ${relative}")
            if (!asset.isFile()) throw new GradleException("Spiel fehlt in den Android-Assets: ${relative}")
            rows.add("| ${name.replace('|','\\|')} | `spiele/${relative}` | `${matcher.group(3)}` | `${matcher.group(4).trim()}` |")
        }
        if (rows.isEmpty()) throw new GradleException("Keine aktiven Spiele im Homepage-Katalog erkannt")
        File report = new File(buildDir, "reports/homepage-integration/spiele-manifest.md")
        report.parentFile.mkdirs()
        report.setText("# Homepage-Spiele in TrashyGecko\n\nAktive Katalogeinträge: ${rows.size()}. Die HTML-Seite und ihre Unterordner sowie gemeinsam genutzte Dateien unter `spiele/` werden in gleicher relativer Struktur nach `app/src/main/assets/www/` kopiert.\n\n| Spiel | Homepage-Datei | Kategorie | Katalogmerkmale |\n|---|---|---|---|\n${rows.join('\n')}\n\nSkripte, CSS, Grafiken, Audio und Schriften werden aus dem vollständigen statischen `spiele/`-Baum mitkopiert. Online-Mehrspieler benötigt weiterhin den vorhandenen TrashyGecko-Connector-Server. Der Kopierschritt lässt Connector-Quellcode, Testläufe, `node_modules`, Android-Projekt/Backups und alte APK-Installer aus.\n", "UTF-8")
        println("Android-Homepage: ${rows.size()} aktive Spiele geprüft und eingebettet. Manifest: ${report}")
    }
}

// Der Spielekatalog der Website bleibt die einzige Quelle. Für die native
// Spieleliste entsteht daraus beim Bauen eine JSON-Datei im APK.
tasks.register("katalogBauen") {
    dependsOn "homepageKopieren"
    def quelle = new File(wwwZiel, "spiele/spiele.html")
    def register = new File(wwwZiel, "spiele/multiplayer-register.js")
    def ziel = new File(projectDir, "src/main/assets/katalog.json")
    inputs.file(quelle)
    inputs.files(register).optional()
    outputs.file(ziel)
    doLast {
        if (!quelle.isFile()) throw new GradleException("Spielekatalog fehlt: ${quelle}")
        String html = quelle.getText("UTF-8")

        def kategorien = []
        def katMatcher = (html =~ /\{\s*id:\s*"([^"]+)",\s*name:\s*"([^"]+)"/)
        while (katMatcher.find()) {
            kategorien << [id: katMatcher.group(1), name: katMatcher.group(2)]
        }
        if (kategorien.isEmpty()) throw new GradleException("Keine Kategorien im Spielekatalog erkannt")
        def katNamen = kategorien.collectEntries { [(it.id): it.name] }

        String registerText = register.isFile() ? register.getText("UTF-8") : ""
        String spieleBaum = new File(wwwZiel, "spiele").getPath().replace('\\', '/')

        def spiele = []
        def matcher = (html =~ /(?m)^\s*\["([^"]+)",\s*"([^"]+\.html)",\s*"([^"]+)",\s*"([^"]*)"(?:,\s*"([^"]*)")?\]/)
        while (matcher.find()) {
            String name = matcher.group(1)
            String relative = matcher.group(2).replace('\\', '/')
            if (relative.split('/').any { it == '..' }) throw new GradleException("Unsicherer Spielepfad: ${relative}")
            File seite = new File(new File(wwwZiel, "spiele"), relative)
            if (!seite.isFile()) throw new GradleException("Spiel fehlt in den Android-Assets: ${relative}")
            List<String> merkmale = (matcher.group(4) ?: "").trim().split(/\s+/).findAll { it } as List<String>
            if (registerText.contains("/spiele/${relative}")) {
                if (!merkmale.contains("multi")) merkmale << "multi"
                if (!merkmale.contains("online")) merkmale << "online"
            }
            spiele << [
                name: name,
                pfad: "spiele/${relative}",
                kategorie: matcher.group(3),
                kategorieName: katNamen[matcher.group(3)] ?: matcher.group(3),
                merkmale: merkmale,
                suche: (matcher.group(5) ?: "").trim().toLowerCase(Locale.ROOT)
            ]
        }
        if (spiele.isEmpty()) throw new GradleException("Keine Spiele für katalog.json erkannt")

        def daten = [
            quelle: "spiele/spiele.html",
            anzahl: spiele.size(),
            kategorien: kategorien,
            spiele: spiele
        ]
        ziel.parentFile.mkdirs()
        ziel.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(daten)) + "\n", "UTF-8")
        println("Spielekatalog für die App: ${spiele.size()} Spiele (${kategorien.size()} Kategorien) -> ${ziel}")
    }
}

def apkQuelle = hasReleaseSigning
        ? layout.buildDirectory.file("outputs/apk/release/app-release.apk")
        : layout.buildDirectory.file("outputs/apk/debug/app-debug.apk")
tasks.register("packageTrashyGeckoApk", Copy) {
    dependsOn([hasReleaseSigning ? "assembleRelease" : "assembleDebug", "verifyHomepageGames"])
    from(apkQuelle)
    into(layout.buildDirectory.dir("outputs/apk/universal"))
    rename { "TrashyGecko.apk" }
}
tasks.register("remoteProtocolTest", JavaExec) {
    dependsOn "compileDebugUnitTestJavaWithJavac"
    classpath = files("${buildDir}/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes", "${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes") + files(android.bootClasspath)
    mainClass = "de.trashygecko.tmahjong.remote.RemoteProtocolSelfTest"
}
tasks.named("preBuild") {
    dependsOn "homepageKopieren", "katalogBauen"
}





