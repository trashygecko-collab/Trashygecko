
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a211b">
<title>Neon Taschenrechner</title>

<style>
:root{
/* Token-Ebene. Klassisch sind genau die alten Farben. */
--bg:#0a211b;--gehaeuse:#0b0b14;--display:#030308;--display-rand:#b06a4a;
--gold:#e8cd8e;--gold-2:#d9bc7c;--gold-2-schein:#d9bc7c44;
--text:#fff;--muted:#aaa;--ziffer:#a9c3b6;
--taste:#101522;--taste-aktiv:#12313b;--warn:#c2765c;--dunkel:#0b241d;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  var(color:var(--text));
  font-family:var(--tg-schrift);
  display: flex;
  align-items: center;
  justify-content: center;
}

.calculator {
  width: min(94vw, 390px);
  padding: 22px;
  background: var(--gehaeuse);
  border: 2px solid var(--gold);
  border-radius: 22px;
  box-shadow: 0 0 18px var(--gold)55,
              inset 0 0 15px var(--gold)18;
}

.display {
  width: 100%;
  min-height: 95px;
  background: var(--display);
  border: 2px solid var(--display-rand);
  border-radius: 12px;
  margin-bottom: 18px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-end;
  box-shadow: 0 0 13px var(--display-rand)55;
  overflow: hidden;
}

.previous {
  color: var(--muted);
  font-size: 17px;
  min-height: 20px;
}

.current {
  color: var(--ziffer);
  font-size: clamp(28px, 8vw, 38px);
  font-weight: bold;
  text-shadow: 0 0 12px var(--ziffer);
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 11px;
}

button {
  height: 65px;
  border: 1px solid var(--gold);
  border-radius: 12px;
  background: var(--taste);
  color: var(--gold);
  font-size: 25px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 8px var(--gold)33;
  transition: .12s;
  touch-action: manipulation;
}

button:active {
  transform: scale(.94);
  background: var(--taste-aktiv);
  box-shadow: 0 0 18px var(--gold);
}

.operator {
  color: var(--gold-2);
  border-color: var(--gold-2);
  box-shadow: 0 0 8px var(--gold-2-schein);
}

.clear {
  color: var(--warn);
  border-color: var(--warn);
}

.equal {
  background: var(--gold-2);
  color: var(--dunkel);
  border-color: var(--gold);
  box-shadow: none;
}

.zero {
  grid-column: span 2;
}

@media (max-height: 600px) {
  .calculator { padding: 12px; }
  .display { min-height: 65px; margin-bottom: 10px; }
  .buttons { gap: 7px; }
  button { height: 48px; }
}
/* ---- Grafikstil (zentral): Klassisch bleibt unveraendert ---- */
html[data-stil="maedchen"]{
--bg:#eb7bc0;--gehaeuse:#fff6fa;--display:#ffeaf3;--display-rand:#ff9ec4;
--gold:#8f2450;--gold-2:#ef7aa8;--gold-2-schein:#ef7aa844;
--text:#3a0f24;--muted:#8f2450;--ziffer:#b0286a;
--taste:#ffffff;--taste-aktiv:#ffe3ef;--warn:#b0286a;--dunkel:#fff6fa;
}
html[data-stil="buben"]{
--bg:#04070b;--gehaeuse:#111316;--display:#06080b;--display-rand:#e0242f;
--gold:#c8ff3d;--gold-2:#e0242f;--gold-2-schein:#e0242f44;
--text:#e6e9ec;--muted:#adb4bc;--ziffer:#6dff4a;
--taste:#1b1e23;--taste-aktiv:#23262c;--warn:#ff8a90;--dunkel:#0a0d10;
}
/* Lesbarkeit: geprüft 21.11.2026 */
html[data-stil="maedchen"] .equal{color:#3a0f24}
html[data-stil="maedchen"] .operator{color:#b0286a}
</style>

<script src="/spiele/stil.js"></script>
<link rel="stylesheet" href="/spiele/schrift.css">
</head>

<body>

<div class="calculator">
  <div class="display">
    <div class="previous" id="previous"></div>
    <div class="current" id="current">0</div>
  </div>

  <div class="buttons">
    <button class="clear" onclick="clearAll()">C</button>
    <button class="operator" onclick="backspace()">⌫</button>
    <button class="operator" onclick="chooseOperator('/')">÷</button>
    <button class="operator" onclick="chooseOperator('*')">×</button>

    <button onclick="number('7')">7</button>
    <button onclick="number('8')">8</button>
    <button onclick="number('9')">9</button>
    <button class="operator" onclick="chooseOperator('-')">−</button>

    <button onclick="number('4')">4</button>
    <button onclick="number('5')">5</button>
    <button onclick="number('6')">6</button>
    <button class="operator" onclick="chooseOperator('+')">+</button>

    <button onclick="number('1')">1</button>
    <button onclick="number('2')">2</button>
    <button onclick="number('3')">3</button>
    <button class="equal" onclick="calculate()" style="grid-row: span 2;">=</button>

    <button class="zero" onclick="number('0')">0</button>
    <button onclick="number(',')">,</button>
  </div>
</div>

<script>
let current = '0';
let previous = '';
let operator = null;
let resetNext = false;

const currentDisplay = document.getElementById('current');
const previousDisplay = document.getElementById('previous');

function updateDisplay() {
  currentDisplay.textContent = current;
  previousDisplay.textContent =
    previous ? previous + ' ' + getSymbol(operator) : '';
}

function getSymbol(op) {
  return {'+':'+', '-':'−', '*':'×', '/':'÷'}[op] || '';
}

function number(value) {
  if (resetNext) {
    current = '0';
    resetNext = false;
  }

  if (value === ',') {
    if (!current.includes(',')) current += ',';
    return updateDisplay();
  }

  if (current === '0') current = value;
  else current += value;

  updateDisplay();
}

function chooseOperator(op) {
  if (operator && !resetNext) calculate();

  previous = current;
  operator = op;
  resetNext = true;
  updateDisplay();
}

function calculate() {
  if (!operator || !previous) return;

  const a = parseFloat(previous.replace(',', '.'));
  const b = parseFloat(current.replace(',', '.'));

  if (operator === '/' && b === 0) {
    current = 'Fehler';
  } else {
    let result;

    switch (operator) {
      case '+': result = a + b; break;
      case '-': result = a - b; break;
      case '*': result = a * b; break;
      case '/': result = a / b; break;
    }

    current = String(Number(result.toFixed(10))).replace('.', ',');
  }

  previous = '';
  operator = null;
  resetNext = true;
  updateDisplay();
}

function clearAll() {
  current = '0';
  previous = '';
  operator = null;
  resetNext = false;
  updateDisplay();
}

function backspace() {
  if (resetNext) return;
  current = current.length > 1 ? current.slice(0, -1) : '0';
  if (current === '-') current = '0';
  updateDisplay();
}

document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') number(e.key);
  else if (e.key === ',' || e.key === '.') number(',');
  else if (e.key === '+') chooseOperator('+');
  else if (e.key === '-') chooseOperator('-');
  else if (e.key === '*') chooseOperator('*');
  else if (e.key === '/') {
    e.preventDefault();
    chooseOperator('/');
  }
  else if (e.key === 'Enter' || e.key === '=') calculate();
  else if (e.key === 'Backspace') backspace();
  else if (e.key === 'Escape') clearAll();
});
</script>

<script>
/* Fensterfarbe des Browsers je Ansicht */
(function(){
 const setze=function(){
  const m=document.querySelector('meta[name="theme-color"]');
  if(!m||!window.TGStil||!TGStil.hole)return;
  m.content={klassisch:"#0a211b",maedchen:"#eb7bc0",buben:"#04070b"}[TGStil.hole()]||"#0a211b";
 };
 setze();
 if(window.TGStil&&TGStil.beiWechsel)TGStil.beiWechsel(setze);
})();
</script>
</body>
</html>
