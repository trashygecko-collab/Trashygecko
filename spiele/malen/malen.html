<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102b27">
<title>Malen – TrashyGecko</title>
<style>
:root{
  --table-dark:#102b27;
  --table-light:#1b4038;
  --gold:#d5b36a;
  --ivory:#f5edda;
  --muted:#b7c8bd;
  --teal:#4df5c2;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--ivory);
  font-family:Arial, Helvetica, sans-serif;
  background:radial-gradient(ellipse at center,#244b40 0%,#102b27 75%);
}
button{font:inherit;cursor:pointer}
.seite{
  width:min(1000px,96%);
  margin:0 auto;
  padding:12px 14px 16px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.kopf{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding-bottom:10px;
  border-bottom:1px solid rgba(213,179,106,.4);
}
.kopf h1{
  margin:0;
  color:var(--gold);
  font-size:clamp(18px,3vw,26px);
  letter-spacing:3px;
}
.kopf p{margin:4px 0 0;font-size:12px;color:var(--muted);letter-spacing:1px}
.kopf-knoepfe{display:flex;gap:8px;flex-wrap:wrap}
.knopf{
  padding:10px 14px;
  color:var(--ivory);
  background:linear-gradient(180deg,#315b4c,#1b4038);
  border:1px solid var(--gold);
  border-radius:7px;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
}
.knopf:hover{background:#426e59}
.werkzeug{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  padding:10px 12px;
  background:rgba(0,0,0,.17);
  border:1px solid rgba(213,179,106,.2);
  border-radius:12px;
}
.farben{display:flex;gap:7px;flex-wrap:wrap}
.farbe{
  width:38px;
  height:38px;
  border-radius:50%;
  border:3px solid #3d4a45;
  padding:0;
  background:#fff;
}
.farbe.aktiv{border-color:var(--teal);box-shadow:0 0 10px #4df5c288}
.hinweis{margin:0;font-size:12px;color:var(--muted)}
.farbkreis{
  width:44px;
  height:44px;
  flex:0 0 auto;
  padding:3px;
  border:3px solid #3d4a45;
  border-radius:50%;
  background:conic-gradient(#e53935,#fbc02d,#43a047,#1e88e5,#8e24aa,#e53935);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.farbkreis:hover{border-color:var(--teal)}
.farbkreis input{
  width:100%;
  height:100%;
  padding:0;
  border:none;
  border-radius:50%;
  background:transparent;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
}
.farbkreis input::-webkit-color-swatch-wrapper{padding:0}
.farbkreis input::-webkit-color-swatch{border:none;border-radius:50%}
.farbkreis input::-moz-color-swatch{border:none;border-radius:50%}
.knopf.aktiv{
  background:linear-gradient(180deg,#4df5c2,#37b492);
  border-color:var(--teal);
  color:#102b27;
}
.staerke{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  letter-spacing:1px;
  color:var(--muted);
}
.staerke input[type=range]{width:120px;accent-color:var(--teal)}
.staerke output{min-width:16px;color:var(--ivory);font-weight:bold;letter-spacing:0}
.felder{position:absolute;inset:0;pointer-events:none}
.felder i{position:absolute;background:rgba(120,112,96,.3)}
#gitterX{top:0;bottom:0;width:1.5px}
#gitterY{left:0;right:0;height:1.5px}
.flaeche{
  position:relative;
  background:#fff;
  border:2px solid rgba(213,179,106,.65);
  border-radius:12px;
  overflow:hidden;
  box-shadow:inset 0 0 0 1px #0002;
}
canvas{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:1 / 1;
  touch-action:none;
  cursor:crosshair;
  background:#fff;
}
.status{margin:0;font-size:12px;color:var(--gold)}
/* Leere Statuszeile nimmt keinen Platz weg. */
.status:empty{display:none}
/* ZURÜCKSETZEN und SPIELE sitzen in der Werkzeugleiste, damit oben keine
   eigene Kopfzeile nötig ist. */
.kopf-rechts{margin-left:auto;display:flex;gap:8px;align-items:center}
.knopf-klein{padding:7px 10px;font-size:11px}
/* Kleine Anzeige über dem Brett: Pinsel (mit Farbe) oder Radierer.
   Sie lässt Klicks durch und stört beim Malen nicht. */
.werkzeug-anzeige{
  position:absolute;left:10px;bottom:10px;z-index:3;
  display:flex;align-items:center;gap:6px;
  padding:4px 9px;border-radius:999px;
  background:rgba(16,43,39,.62);
  border:1px solid rgba(213,179,106,.45);
  color:var(--ivory);font-size:11px;letter-spacing:.4px;
  pointer-events:none;opacity:.92;
}
.werkzeug-anzeige .punkt{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px #0006}
.werkzeug-anzeige .punkt.radier{background:#fff;box-shadow:0 0 0 1px #59647c inset}
.werkzeug-anzeige .staerke-wert{opacity:.72}

/* Der kurze Hinweistext und die Statuszeile brauchen keinen Platz: die
   gewählte Farbe sieht man am hervorgehobenen Farbpunkt, Fehler erscheinen
   weiterhin unten in der Statuszeile. */
#malHinweis{display:none}
/* Am Handy alles eine Spur kleiner, damit das Brett mehr Platz behält. */
@media (max-width:600px){
  .seite{padding:8px 8px 12px;gap:6px}
  .werkzeug{gap:6px 8px;padding:6px 8px;border-radius:10px}
  .farbe{width:26px;height:26px;border-width:2px;position:relative}
  /* Unsichtbarer größerer Tippbereich, damit die kleinen Punkte treffbar bleiben. */
  .farbe::after{content:"";position:absolute;inset:-6px;border-radius:50%}
  .farben{gap:6px}
  .farbkreis{width:32px;height:32px;padding:2px;border-width:2px}
  .knopf{padding:8px 9px;font-size:10px;letter-spacing:.5px}
  .knopf-klein{padding:8px 9px;font-size:10px}
  .kopf-rechts{gap:6px}
  .staerke{font-size:10px;gap:5px}
  .staerke .wort{display:none}
  .staerke input[type=range]{width:74px}
  .mitmaler{gap:6px}
  .mitmaler .person{padding:3px 8px;font-size:11px}
  /* Werkzeug-Anzeige am Handy eine Spur kleiner und näher in die Ecke. */
  .werkzeug-anzeige{font-size:10px;padding:3px 7px;gap:5px;left:8px;bottom:8px;opacity:.88}
  .werkzeug-anzeige .punkt{width:9px;height:9px}
}
/* Wer malt gerade: je Person ein Punkt in ihrer Farbe. */
.mitmaler{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mitmaler:empty{display:none}
.mitmaler .person{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 10px;border-radius:20px;
  background:rgba(0,0,0,.22);
  border:1px solid rgba(213,179,106,.35);
  font-size:12px;color:var(--ivory);
}
.mitmaler .punkt{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px #0006}
.mitmaler .person.dran{border-color:var(--teal);box-shadow:0 0 12px #4df5c255}
.mitmaler .malt{font-size:11px;color:var(--teal)}
.mitmaler .legende{font-size:11px;color:var(--muted)}
</style>
</head>
<body>

<div class="seite">

  <div class="mitmaler" id="mitmaler" aria-live="polite"></div>

  <section class="werkzeug">
    <div class="farben" id="farben"></div>
    <label class="farbkreis" title="Eigene Farbe aussuchen">
      <input type="color" id="farbkreis" value="#111111" aria-label="Eigene Farbe aussuchen">
    </label>
    <button type="button" id="radierer" class="knopf" aria-pressed="false">RADIERER</button>
    <label class="staerke" for="staerke"><span class="wort">STÄRKE</span> <output id="staerkeWert">8</output>
      <input type="range" id="staerke" min="2" max="40" step="1" value="8">
    </label>
    <span class="kopf-rechts">
      <button type="button" id="resetButton" class="knopf knopf-klein" hidden>ZURÜCKSETZEN</button>
      <a href="../spiele.html" id="backButton" class="knopf knopf-klein">◀ SPIELE</a>
    </span>
    <p class="hinweis" id="malHinweis">Farbe wählen und loskritzeln.</p>
  </section>

  <section class="flaeche">
    <canvas id="blatt" width="1200" height="1200"></canvas>
    <div class="felder" aria-hidden="true"><i id="gitterX"></i><i id="gitterY"></i></div>
    <div class="werkzeug-anzeige" id="werkzeugAnzeige" aria-live="polite"></div>
  </section>

  <p class="status" id="status"></p>

</div>

<script>
const MAL = 1200;

const FARBEN = [
  { wert:"#111111", titel:"Schwarz" },
  { wert:"#e53935", titel:"Rot" },
  { wert:"#fbc02d", titel:"Gelb" },
  { wert:"#43a047", titel:"Grün" },
  { wert:"#1e88e5", titel:"Blau" },
  { wert:"#8e24aa", titel:"Lila" },
  { wert:"#fb8c00", titel:"Orange" },
  { wert:"#6d4c41", titel:"Braun" }
];

// Jede Person bekommt eine eigene Farbe. Sie hängt an der Kennung, damit
// Handy und Rechner dieselbe Person gleich einfärben (und damit farbig bleibt).
const PERSON_FARBEN = [
  "#e53935", "#1e88e5", "#43a047", "#8e24aa", "#fb8c00",
  "#00897b", "#c2185b", "#5e35b1", "#00acc1", "#6d4c41"
];
const personFarben = new Map();   // Kennung -> Farbe
const mitmalerNamen = new Map();  // Kennung -> Name
const mitmalerDrauf = new Map();  // Kennung -> Zeitpunkt des letzten Strichs

const parameter = new URLSearchParams(location.search);
const raum = (parameter.get("room") || "").trim().toUpperCase();
const spielerId = parameter.get("id") || "";
const spielerName = parameter.get("name") || "";
const zusammen = !!(raum && spielerId);

const blatt = document.getElementById("blatt");
const stift = blatt.getContext("2d");
const statusFeld = document.getElementById("status");
// Unten steht nur etwas, wenn es etwas zu sagen gibt (Fehler, kurze
// Bestätigung). statusBis sagt, wie lange die Zeile stehen bleiben darf.
let statusBis = 0;
function zeigeStatus(text, ms){
  statusFeld.textContent = text || "";
  statusBis = ms ? Date.now() + ms : 0;
}
const resetKnopf = document.getElementById("resetButton");
const hinweis = document.getElementById("malHinweis");
const farbkreis = document.getElementById("farbkreis");
const werkzeugAnzeige = document.getElementById("werkzeugAnzeige");
const radiererKnopf = document.getElementById("radierer");
const staerkeFeld = document.getElementById("staerke");
const staerkeWert = document.getElementById("staerkeWert");
const gitterX = document.getElementById("gitterX");
const gitterY = document.getElementById("gitterY");

let farbe = FARBEN[0].wert;
let breite = 8;
let radiert = false;        // Pinsel oder Radierer
let zeichnet = false;
let eigenerStrich = null;   // {color,width,points:[]}
let alleStriche = [];       // alles, was auf dem Brett ist – fürs Neuzeichnen
let epoche = -1;            // Fassung der Fläche laut Server
let stand = 0;              // so viele Striche kennen wir vom Server
let istAdmin = !zusammen;

// Das Brett ist vier Bildschirme groß: zwei Felder breit, zwei hoch. Der
// sichtbare Ausschnitt davon ist ein Viertel, deshalb fängt zoom bei 2 an
// (1 wäre das ganze Brett auf einem Bildschirm).
const WELT = MAL;
const FELD = WELT / 2;
const ZOOM_MIN = 1;
const ZOOM_MAX = 10;
let zoom = 2;
let kameraX = FELD / 2;     // linker Rand des Blicks in Brettkoordinaten
let kameraY = FELD / 2;     // oberer Rand des Blicks
let zeiger = new Map();     // welche Finger / Maustasten gerade drücken
let griff = null;           // läuft ein Verschieben / Zoomen?

// --------------------------------------------------
// FARBEN
// --------------------------------------------------

function baueFarben(){
  const box = document.getElementById("farben");
  FARBEN.forEach(eintrag=>{
    const knopf = document.createElement("button");
    knopf.type = "button";
    knopf.className = "farbe";
    knopf.style.background = eintrag.wert;
    knopf.title = eintrag.titel;
    knopf.dataset.wert = eintrag.wert;
    knopf.setAttribute("aria-label", eintrag.titel);
    if (eintrag.wert === farbe) knopf.classList.add("aktiv");
    knopf.addEventListener("click", ()=>{
      farbe = eintrag.wert;
      farbkreis.value = eintrag.wert;
      if (radiert) radiererUmschalten(false);
      markiereFarbe();
      hinweis.textContent = "Farbe " + eintrag.titel + " – jetzt malen.";
    });
    box.appendChild(knopf);
  });
}

// --------------------------------------------------
// FARBKREIS, RADIERER, STÄRKE
// --------------------------------------------------

function markiereFarbe(){
  document.querySelectorAll("#farben .farbe").forEach(knopf=>{
    knopf.classList.toggle("aktiv", knopf.dataset.wert === farbe && !radiert);
  });
  zeigeWerkzeug();
}

// Klein und unaufdringlich über dem Brett: was gerade eingestellt ist.
function zeigeWerkzeug(){
  if (!werkzeugAnzeige) return;
  const punkt = document.createElement("i");
  punkt.className = radiert ? "punkt radier" : "punkt";
  if (!radiert) punkt.style.background = farbe;
  const text = document.createElement("span");
  text.textContent = radiert ? "Radierer" : "Pinsel";
  const staerke = document.createElement("span");
  staerke.className = "staerke-wert";
  staerke.textContent = "· " + Math.round(breite) + " px";
  werkzeugAnzeige.replaceChildren(punkt, text, staerke);
}

function radiererUmschalten(an){
  radiert = !!an;
  radiererKnopf.classList.toggle("aktiv", radiert);
  radiererKnopf.setAttribute("aria-pressed", radiert ? "true" : "false");
  markiereFarbe();
  hinweis.textContent = radiert
    ? "Radierer: wische über die Fläche."
    : "Pinsel – Farbe " + farbe + ", jetzt malen.";
}

// Der Farbkreis öffnet die Farbauswahl des Geräts.
farbkreis.addEventListener("input", ()=>{
  farbe = farbkreis.value;
  if (radiert) radiererUmschalten(false);
  markiereFarbe();
  hinweis.textContent = "Eigene Farbe " + farbe + " – jetzt malen.";
});

radiererKnopf.addEventListener("click", ()=> radiererUmschalten(!radiert));

staerkeFeld.addEventListener("input", ()=>{
  breite = Math.min(60, Math.max(2, Number(staerkeFeld.value) || 8));
  staerkeWert.textContent = String(breite);
  zeigeWerkzeug();
});

// --------------------------------------------------
// ZEICHNEN
// --------------------------------------------------

// --------------------------------------------------
// WER MAL'T WAS: eigene Farbe je Person
// --------------------------------------------------

function personFarbe(id){
  if (!id) return "#102b27";
  if (personFarben.has(id)) return personFarben.get(id);
  let summe = 0;
  for (let i = 0; i < id.length; i++) summe = (summe * 31 + id.charCodeAt(i)) % 100003;
  const farbe = PERSON_FARBEN[summe % PERSON_FARBEN.length];
  personFarben.set(id, farbe);
  return farbe;
}

// Merkt sich, wer gerade einen Strich gemacht hat (für "malt" in der Liste).
function personMalt(id){
  if (!id || !zusammen) return;
  mitmalerDrauf.set(id, Date.now());
}

// Zeile über dem Brett: wer im Raum ist und wer gerade malt.
function mitmalerZeichnen(){
  const box = document.getElementById("mitmaler");
  if (!box || !zusammen) return;
  const jetzt = Date.now();
  box.innerHTML = "";
  if (!mitmalerNamen.size) return;
  mitmalerNamen.forEach((name, id)=>{
    const person = document.createElement("span");
    person.className = "person";
    const malt = jetzt - (mitmalerDrauf.get(id) || 0) < 2500;
    if (malt) person.classList.add("dran");
    const punkt = document.createElement("i");
    punkt.className = "punkt";
    punkt.style.background = personFarbe(id);
    const text = document.createElement("span");
    text.textContent = name + (id === spielerId ? " (du)" : "");
    person.append(punkt, text);
    if (malt) {
      const wort = document.createElement("span");
      wort.className = "malt";
      wort.textContent = "malt";
      person.appendChild(wort);
    }
    box.appendChild(person);
  });
}

// Wer ist im Raum? Für die Namen über dem Brett.
async function mitmalerHolen(){
  if (!zusammen) return;
  try{
    const antwort = await fetch("/api/players?room=" + encodeURIComponent(raum), { cache: "no-store" });
    if (!antwort.ok) return;
    const liste = await antwort.json();
    mitmalerNamen.clear();
    (liste || []).forEach(person=>{
      if (person && person.id) mitmalerNamen.set(person.id, person.name || "Maler");
    });
    if (!mitmalerNamen.has(spielerId)) mitmalerNamen.set(spielerId, spielerName || "Maler");
    mitmalerZeichnen();
  }catch(fehler){}
}

// Ein Strich als Linie (oder Punkt). Wird zweimal gebraucht: einmal als Saum
// in der Farbe der Person, einmal in der eigentlichen Farbe.
function strichPfad(punkte, breite){
  if (punkte.length === 1) {
    stift.beginPath();
    stift.arc(punkte[0][0], punkte[0][1], breite / 2, 0, Math.PI * 2);
    stift.fill();
    return;
  }
  stift.beginPath();
  stift.moveTo(punkte[0][0], punkte[0][1]);
  for (let i = 1; i < punkte.length; i++) stift.lineTo(punkte[i][0], punkte[i][1]);
  stift.stroke();
}

function strichZeichnen(strich){
  const punkte = strich.points || [];
  if (!punkte.length) return;
  const strichFarbe = strich.color || "#111111";
  const strichBreite = strich.width || 8;
  stift.lineCap = "round";
  stift.lineJoin = "round";

  // Saum in der Farbe der Person – beim Radieren (weiß) nicht, sonst bliebe
  // eine farbige Spur vom Wegwischen stehen.
  const saum = (zusammen && strich.author && strichFarbe.toLowerCase() !== "#ffffff")
    ? personFarbe(strich.author) : "";
  if (saum) {
    stift.globalAlpha = 0.5;
    stift.strokeStyle = saum;
    stift.fillStyle = saum;
    stift.lineWidth = strichBreite + 4;
    strichPfad(punkte, strichBreite + 4);
    stift.globalAlpha = 1;
  }

  stift.strokeStyle = strichFarbe;
  stift.fillStyle = strichFarbe;
  stift.lineWidth = strichBreite;
  strichPfad(punkte, strichBreite);
}

// --------------------------------------------------
// BLICK: ZOOM UND VERSCHIEBEN
// --------------------------------------------------

function kameraKlemmen(){
  const breite = WELT / zoom;
  kameraX = Math.min(Math.max(kameraX, 0), WELT - breite);
  kameraY = Math.min(Math.max(kameraY, 0), WELT - breite);
}

// Bildschirmpunkt (CSS-Pixel) in Brettkoordinaten umrechnen.
function aufDemBlatt(ereignis){
  const rechteck = blatt.getBoundingClientRect();
  const breite = WELT / zoom;
  return [
    kameraX + (ereignis.clientX - rechteck.left) / rechteck.width * breite,
    kameraY + (ereignis.clientY - rechteck.top) / rechteck.height * breite
  ];
}

// Zeichenfläche auf den Ausschnitt einstellen: ein Brettpunkt = k Bildpunkte.
function kameraSetzen(){
  const k = blatt.width * zoom / WELT;
  stift.setTransform(k, 0, 0, k, -kameraX * k, -kameraY * k);
}

// Alles neu zeichnen – nötig, sobald der Blick verschoben oder gezoomt wird.
function neuZeichnen(){
  stift.setTransform(1, 0, 0, 1, 0, 0);
  stift.fillStyle = "#e7e1d3";              // Rand außerhalb des Bretts
  stift.fillRect(0, 0, blatt.width, blatt.height);
  kameraSetzen();
  stift.fillStyle = "#ffffff";
  stift.fillRect(0, 0, WELT, WELT);

  alleStriche.forEach(strichZeichnen);
  linienSetzen();
}

// Die vier Felder: hauchdünne Linien als Lage über der Fläche. Sie gehören
// nicht zum Gemalten, verschwinden beim Radieren also nicht, und Striche
// laufen einfach darüber – die Fläche bleibt ein Stück.
function linienSetzen(){
  const anteil = 100 / (WELT / zoom);
  const x = (FELD - kameraX) * anteil;
  const y = (FELD - kameraY) * anteil;
  gitterX.style.display = (x < 0 || x > 100) ? "none" : "block";
  gitterX.style.left = x + "%";
  gitterY.style.display = (y < 0 || y > 100) ? "none" : "block";
  gitterY.style.top = y + "%";
}

function verschieben(dxPixel, dyPixel){
  const rechteck = blatt.getBoundingClientRect();
  const breite = WELT / zoom;
  kameraX -= dxPixel / rechteck.width * breite;
  kameraY -= dyPixel / rechteck.height * breite;
  kameraKlemmen();
  neuZeichnen();
}

function zoomenUm(faktor, clientX, clientY){
  const rechteck = blatt.getBoundingClientRect();
  const punkt = [
    kameraX + (clientX - rechteck.left) / rechteck.width * (WELT / zoom),
    kameraY + (clientY - rechteck.top) / rechteck.height * (WELT / zoom)
  ];
  zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom * faktor));
  const breite = WELT / zoom;
  kameraX = punkt[0] - (clientX - rechteck.left) / rechteck.width * breite;
  kameraY = punkt[1] - (clientY - rechteck.top) / rechteck.height * breite;
  kameraKlemmen();
  neuZeichnen();
}

// --------------------------------------------------
// MALEN
// --------------------------------------------------

function stiftFarbe(){
  return radiert ? "#ffffff" : farbe;
}

function punktAnhaengen(punkt){
  const punkte = eigenerStrich.points;
  const letzter = punkte[punkte.length - 1];
  if (letzter && Math.abs(letzter[0] - punkt[0]) < 1.5 && Math.abs(letzter[1] - punkt[1]) < 1.5) return;
  punkte.push(punkt);
  // Nur das neue Stück zeichnen, nicht den ganzen Strich.
  if (punkte.length === 1) {
    strichZeichnen({ color: stiftFarbe(), width: breite, points: punkte });
  } else {
    stift.strokeStyle = stiftFarbe();
    stift.lineWidth = breite;
    stift.lineCap = "round";
    stift.lineJoin = "round";
    stift.beginPath();
    stift.moveTo(letzter[0], letzter[1]);
    stift.lineTo(punkt[0], punkt[1]);
    stift.stroke();
  }
}

function strichStarten(ereignis){
  zeichnet = true;
  eigenerStrich = { color: stiftFarbe(), width: breite, points: [], author: spielerId || "" };
  punktAnhaengen(aufDemBlatt(ereignis));
}

function strichBeenden(){
  if (!zeichnet) return;
  zeichnet = false;
  const strich = eigenerStrich;
  eigenerStrich = null;
  if (!strich || !strich.points.length) return;
  alleStriche.push(strich);
  personMalt(spielerId);
  if (zusammen) strichSenden(strich);
  // Neu zeichnen, damit der Saum in der eigenen Farbe gleich mitkommt.
  if (zusammen) {
    neuZeichnen();
    mitmalerZeichnen();
  }
}

// Angefangenen Strich wegwerfen (z. B. wenn der zweite Finger dazukommt).
function strichVerwerfen(){
  if (!zeichnet) return;
  zeichnet = false;
  eigenerStrich = null;
  neuZeichnen();
}

function zweiFingerMerken(){
  const punkte = [...zeiger.values()];
  if (punkte.length < 2) { griff = null; return; }
  const dx = punkte[0].x - punkte[1].x;
  const dy = punkte[0].y - punkte[1].y;
  griff = {
    art: "finger",
    abstand: Math.max(1, Math.hypot(dx, dy)),
    mitteX: (punkte[0].x + punkte[1].x) / 2,
    mitteY: (punkte[0].y + punkte[1].y) / 2,
    zoom: zoom,
    kameraX: kameraX,
    kameraY: kameraY
  };
}

blatt.addEventListener("pointerdown", ereignis=>{
  ereignis.preventDefault();
  try { blatt.setPointerCapture(ereignis.pointerId); } catch (fehler) {}

  // Rechte oder mittlere Maustaste schiebt die Fläche – keine Extraknöpfe.
  if (ereignis.pointerType === "mouse" && ereignis.button !== 0) {
    zeiger.set(ereignis.pointerId, { x: ereignis.clientX, y: ereignis.clientY });
    griff = { art: "maus", x: ereignis.clientX, y: ereignis.clientY };
    blatt.style.cursor = "grabbing";
    return;
  }

  zeiger.set(ereignis.pointerId, { x: ereignis.clientX, y: ereignis.clientY });
  if (zeiger.size >= 2) {
    // Zwei Finger: nicht malen, sondern schieben und zoomen. Der eben
    // begonnene Punkt wird wieder verworfen, damit kein Klecks bleibt.
    strichVerwerfen();
    zweiFingerMerken();
    return;
  }
  strichStarten(ereignis);
});

blatt.addEventListener("pointermove", ereignis=>{
  if (zeiger.has(ereignis.pointerId)) {
    zeiger.set(ereignis.pointerId, { x: ereignis.clientX, y: ereignis.clientY });
  }

  if (griff && griff.art === "maus") {
    verschieben(ereignis.clientX - griff.x, ereignis.clientY - griff.y);
    griff.x = ereignis.clientX;
    griff.y = ereignis.clientY;
    return;
  }

  if (griff && griff.art === "finger" && zeiger.size >= 2) {
    const punkte = [...zeiger.values()];
    const rechteck = blatt.getBoundingClientRect();
    const dx = punkte[0].x - punkte[1].x;
    const dy = punkte[0].y - punkte[1].y;
    const abstand = Math.max(1, Math.hypot(dx, dy));
    const mitteX = (punkte[0].x + punkte[1].x) / 2;
    const mitteY = (punkte[0].y + punkte[1].y) / 2;

    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, griff.zoom * abstand / griff.abstand));
    const breite = WELT / zoom;
    const breiteAlt = WELT / griff.zoom;
    // Der Punkt, der unter der Finger-Mitte lag, bleibt dort stehen.
    const weltX = griff.kameraX + (griff.mitteX - rechteck.left) / rechteck.width * breiteAlt;
    const weltY = griff.kameraY + (griff.mitteY - rechteck.top) / rechteck.height * breiteAlt;
    kameraX = weltX - (mitteX - rechteck.left) / rechteck.width * breite;
    kameraY = weltY - (mitteY - rechteck.top) / rechteck.height * breite;
    kameraKlemmen();
    neuZeichnen();
    return;
  }

  if (!zeichnet || !eigenerStrich) return;
  punktAnhaengen(aufDemBlatt(ereignis));
});

function zeigerWeg(ereignis){
  zeiger.delete(ereignis.pointerId);
  if (griff && griff.art === "maus") {
    griff = null;
    blatt.style.cursor = "crosshair";
    return;
  }
  if (griff && griff.art === "finger") {
    if (zeiger.size >= 2) zweiFingerMerken(); else griff = null;
    return;
  }
  strichBeenden();
}

blatt.addEventListener("pointerup", zeigerWeg);
blatt.addEventListener("pointercancel", zeigerWeg);

blatt.addEventListener("wheel", ereignis=>{
  ereignis.preventDefault();

  if (ereignis.ctrlKey || ereignis.metaKey) {
    zoomenUm(Math.exp(-ereignis.deltaY * 0.002), ereignis.clientX, ereignis.clientY);
    return;
  }

  // Ohne Strg schiebt das Rad – so klappt auch das Zwei-Finger-Wischen
  // auf dem Touchpad. Mit Umschalt geht es waagerecht.
  const rechteck = blatt.getBoundingClientRect();
  const breite = WELT / zoom;
  const dx = ereignis.shiftKey ? ereignis.deltaY : ereignis.deltaX;
  const dy = ereignis.shiftKey ? 0 : ereignis.deltaY;
  kameraX += dx / rechteck.width * breite;
  kameraY += dy / rechteck.height * breite;
  kameraKlemmen();
  neuZeichnen();
}, { passive: false });

// Rechtsklick soll das Menü nicht aufziehen, sondern die Fläche schieben.
blatt.addEventListener("contextmenu", ereignis=>ereignis.preventDefault());

// Passt die Zeichenfläche an die Anzeige an (scharf auch auf dem Handy).
function blattGroesse(){
  const rechteck = blatt.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const kanten = Math.max(320, Math.round(rechteck.width * dpr));
  if (blatt.width !== kanten) {
    blatt.width = kanten;
    blatt.height = kanten;
  }
  neuZeichnen();
}

// --------------------------------------------------
// MIT DEM SERVER ABGLEICHEN
// --------------------------------------------------

async function strichSenden(strich){
  try{
    await fetch("/api/malen?room=" + encodeURIComponent(raum) + "&action=draw", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: spielerId, strokes: [strich] })
    });
  }catch(fehler){
    zeigeStatus("Verbindung kurz weg – der Strich geht beim nächsten Versuch mit.", 4000);
  }
}

async function abgleichen(){
  if (!zusammen) return;
  try{
    const antwort = await fetch(
      "/api/malen?room=" + encodeURIComponent(raum) +
      "&id=" + encodeURIComponent(spielerId) +
      "&epoch=" + epoche + "&since=" + stand,
      { cache: "no-store" }
    );
    if (!antwort.ok) {
      zeigeStatus(antwort.status === 404
        ? "Dieser Raum existiert nicht mehr."
        : "Kein Zugriff – bitte im Connector neu betreten.", 5000);
      return;
    }
    const daten = await antwort.json();

    if (daten.epoch !== epoche) {
      // Jemand hat die Fläche geleert (oder wir sind neu dabei).
      alleStriche = (daten.strokes || []).slice();
      epoche = daten.epoch;
      stand = daten.rev;
      neuZeichnen();
    } else {
      (daten.strokes || []).forEach(strich=>{
        // Eigene Striche liegen schon auf dem Brett.
        if (strich.author === spielerId) return;
        alleStriche.push(strich);
        strichZeichnen(strich);
        personMalt(strich.author);
        mitmalerZeichnen();
      });
      stand = daten.rev;
    }

    if (daten.admin !== istAdmin) {
      istAdmin = daten.admin;
      resetKnopf.hidden = !istAdmin;
    }
    // Im Normalfall bleibt die Zeile unten leer; nur Meldungen stehen dort.
    if (Date.now() > statusBis) statusFeld.textContent = "";
  }catch(fehler){
    zeigeStatus("Verbindung wird wiederhergestellt …");
  }
}

async function flaecheZuruecksetzen(){
  if (!zusammen) {
    alleStriche = [];
    stand = 0;
    neuZeichnen();
    zeigeStatus("Fläche geleert.", 2500);
    return;
  }
  try{
    const antwort = await fetch("/api/malen?room=" + encodeURIComponent(raum) + "&action=clear", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: spielerId })
    });
    if (!antwort.ok) {
      zeigeStatus("Nur der Admin kann die Fläche leeren.", 4000);
      return;
    }
    alleStriche = [];
    const daten = await antwort.json();
    epoche = daten.epoch;
    stand = 0;
    neuZeichnen();
    zeigeStatus("Fläche geleert – alle fangen neu an.", 2500);
  }catch(fehler){
    zeigeStatus("Zurücksetzen hat nicht geklappt.", 4000);
  }
}

// Präsenz halten, damit man im Connector nicht aus dem Raum fällt.
async function lebenszeichen(){
  if (!zusammen) return;
  try{
    await fetch("/api/presence", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ room: raum, id: spielerId, name: spielerName || "Maler" })
    });
  }catch(fehler){}
}

// --------------------------------------------------
// START
// --------------------------------------------------

function starten(){
  baueFarben();
  zeigeWerkzeug();
  blattGroesse();

  const zurueck = document.getElementById("backButton");
  zurueck.href = zusammen ? "/connector" : "../spiele.html";

  resetKnopf.hidden = !istAdmin;
  resetKnopf.addEventListener("click", flaecheZuruecksetzen);
  window.addEventListener("resize", blattGroesse);

  if (zusammen) {
    lebenszeichen();
    abgleichen();
    mitmalerHolen();
    setInterval(abgleichen, 600);
    setInterval(lebenszeichen, 5000);
    setInterval(mitmalerHolen, 5000);
    setInterval(mitmalerZeichnen, 1000);
  }
}

starten();
</script>
