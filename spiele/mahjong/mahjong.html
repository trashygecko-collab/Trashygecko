
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#171b24">

    <title>TrashyGecko Mahjong</title>

    <link rel="stylesheet" href="css/mahjong.css">
</head>
<body>

    <main class="game-container">

        <header class="topbar">
            <button id="levelButton" class="level-display" type="button"
                    title="Level wählen" aria-haspopup="dialog">
                LV <span id="levelNumber">01</span> <span class="level-pfeil">▾</span>
            </button>

            <div class="stats">
                <span class="stat-box"><strong id="remainingTiles">144</strong><span>Steine</span></span>
                <span class="stat-box"><strong id="remainingPairs">72</strong><span>Paare</span></span>
                <span class="stat-box"><strong id="gameTime">00:00</strong><span>Zeit</span></span>
                <span class="stat-box"><strong id="scoreDisplay">Punkte: 0</strong></span>
            </div>

            <div class="game-buttons">
                <button id="hintButton" type="button">TIPP</button>
                <button id="newGameButton" type="button">NEU</button>
                <button id="resetLevelButton" type="button" title="Wieder bei Level 1 beginnen">LEVEL 1</button>
                <button id="backButton" type="button" title="Zurück zur Spiele-Übersicht">◀ SPIELE</button>
                <button id="fullscreenButton" type="button" title="Vollbild ein/aus" aria-label="Vollbild">⛶</button>
            </div>
        </header>

        <section class="board-area">
            <div id="gameStatus" class="status-line" aria-live="polite">Viel Spaß beim Spielen!</div>

            <div id="siegEhrung" class="sieg-ehrung" role="status" aria-live="polite" hidden>
                <div id="gewonnenSymbol" class="sieg-symbol"></div>

                <div class="sieg-kopf">
                    <span class="sieg-titel">GEWONNEN</span>
                    <span id="siegLevel" class="sieg-level"></span>
                </div>

                <div class="sieg-punkte">
                    <strong id="siegPunkte">0</strong>
                    <span class="sieg-punkte-label">Punkte</span>
                </div>

                <div id="gewonnenText" class="sieg-spruch"></div>

                <button id="continueButton" type="button" class="weiter-knopf" hidden>WEITER SPIELEN</button>

                <div id="siegel" class="siegel" hidden>
                    <span id="siegelWerte" class="siegel-werte"></span>
                    <span class="siegel-titel">TRASHYGECKO MAHJONG</span>
                    <span class="siegel-autor">MADE BY THOMAS VOIGT</span>
                </div>
            </div>

            <div id="board" class="mahjong-board">
                <div class="loading-message">
                    MAHJONG WIRD VORBEREITET ...
                </div>
            </div>
        </section>

        <div id="levelPicker" class="level-picker" hidden>
            <div class="level-picker-panel" role="dialog" aria-modal="true"
                 aria-label="Level auswählen">
                <div class="level-picker-kopf">
                    <h2>LEVEL WÄHLEN</h2>
                    <button id="levelPickerClose" type="button" aria-label="Schließen">×</button>
                </div>
                <div id="levelGrid" class="level-grid"></div>
            </div>
        </div>

    </main>

    <!-- Klassische Skripte: funktionieren auch über file:// -->
    <script src="js/board-layout.js"></script>
    <script src="js/board.js"></script>
    <script src="js/solver.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/lob.js"></script>
    <script src="js/pech.js"></script>
    <script src="js/gewonnen.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
