
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f2b23">

    <title>TrashyGecko Mahjong</title>

    <link rel="stylesheet" href="css/mahjong.css?v=17">

    <!-- Setzt die Grundschrift vor dem ersten Aufbau: Knoepfe und Schrift
         wachsen mit der Bildschirmgroesse (5 Zoll = 1,00, 7 Zoll = 1,22). -->
    <script src="js/groesse.js?v=17"></script>
</head>
<body>

    <main class="game-container">

        <header class="topbar">
            <button id="levelButton" class="level-display" type="button"
                    aria-label="Levelauswahl" aria-haspopup="dialog">
                <span class="level-wort">LEVELAUSWAHL</span>
                <span id="levelNumber">01</span> <span class="level-pfeil">▾</span>
            </button>

            <div class="stats">
                <span class="stat-box"><strong id="remainingTiles">144</strong><span>S</span></span>
                <span class="stat-box"><strong id="remainingPairs">72</strong><span>P</span></span>
                <span class="stat-box"><strong id="gameTime">00:00</strong><span>Z</span></span>
                <span class="stat-box"><strong id="scoreDisplay">Punkte: 0</strong></span>
            </div>

            <div class="game-buttons">
                <button id="hintButton" type="button">TIPP</button>
                <button id="newGameButton" type="button">NEU</button>
                <button id="settingsButton" type="button" aria-haspopup="dialog">EINSTELLUNGEN</button>
            </div>
        </header>

        <section id="boardArea" class="board-area">
            <div id="gameStatus" class="status-line" aria-live="polite">Viel Spaß beim Spielen!</div>

            <!-- Nebenmeldungen (z.B. Speicherproblem) - eigene Zeile, damit
                 der Spruch bzw. der Siegtext in der Statuszeile stehen bleibt. -->
            <div id="speicherHinweis" class="speicher-hinweis" role="status" hidden></div>

            <button id="mischenButton" type="button" class="mischen-knopf" hidden>NEU MISCHEN</button>

            <div id="siegEhrung" class="sieg-ehrung" role="status" aria-live="polite" hidden>
                <div id="gewonnenSymbol" class="sieg-symbol"></div>

                <div class="sieg-kopf">
                    <span class="sieg-titel">GESCHAFFT!</span>
                    <span id="siegLevel" class="sieg-level"></span>
                </div>

                <div id="siegRunde" class="sieg-runde" hidden>
                    <span class="sieg-runde-titel">ALLE FARBEN DURCH</span>
                    <span class="sieg-runde-text">Neun Runden, neun Steinfarben – ab jetzt geht es wieder mit Elfenbein los.</span>
                </div>

                <div class="sieg-punkte">
                    <strong id="siegPunkte">0</strong>
                    <span class="sieg-punkte-label">Punkte</span>
                </div>

                <div id="gewonnenText" class="sieg-spruch"></div>

                <button id="continueButton" type="button" class="weiter-knopf" hidden>WEITER SPIELEN</button>

                <div id="siegel" class="siegel" hidden>
                    <span id="siegelWerte" class="siegel-werte"></span>
                    <span class="siegel-titel">TRASHYGECKO MAHJONG</span>
                </div>
            </div>

            <div id="board" class="mahjong-board">
                <div class="loading-message">
                    MAHJONG WIRD VORBEREITET ...
                </div>
            </div>
        </section>

        <div id="levelPicker" class="dialog" hidden>
            <div class="dialog-panel" role="dialog" aria-modal="true"
                 aria-labelledby="levelPickerTitel">
                <div class="dialog-kopf">
                    <h2 id="levelPickerTitel">LEVEL WÄHLEN</h2>
                    <button id="levelPickerClose" type="button" aria-label="Schließen">×</button>
                </div>
                <div id="satzUmschalter" class="satz-umschalter" role="group"
                     aria-label="Levelsystem">
                    <button type="button" data-satz="2" aria-pressed="false">HANDY-LEVEL</button>
                    <button type="button" data-satz="1" aria-pressed="false">NORMAL-LEVEL</button>
                </div>
                <span id="rundeAnzeige" class="runde-anzeige">Runde 1 · Elfenbein</span>
                <div id="levelGrid" class="level-grid"></div>
                <div id="farbeLeiste" class="farbe-leiste" role="group"
                     aria-label="Steinfarbe wählen"></div>
            </div>
        </div>

        <div id="einstellungen" class="dialog" hidden>
            <div class="dialog-panel" role="dialog" aria-modal="true"
                 aria-labelledby="einstellungenTitel">
                <div class="dialog-kopf">
                    <h2 id="einstellungenTitel">EINSTELLUNGEN</h2>
                    <button id="einstellungenClose" type="button" aria-label="Schließen">×</button>
                </div>
                <div class="dialog-koerper">
                    <div id="stilLeiste" class="stil-leiste"
                         role="group" aria-label="Steinform und Zustand">
                        <div class="stil-gruppe" data-gruppe="form" role="group"
                             aria-label="Steinform">
                            <span class="stil-titel">FORM</span>
                            <button type="button" data-wert="rund" aria-pressed="true">RUND</button>
                            <button type="button" data-wert="eckig" aria-pressed="false">ECKIG</button>
                        </div>
                        <div class="stil-gruppe" data-gruppe="zustand" role="group"
                             aria-label="Steinzustand">
                            <span class="stil-titel">ZUSTAND</span>
                            <button type="button" data-wert="neu" aria-pressed="true">NEU</button>
                            <button type="button" data-wert="alt" aria-pressed="false">ALT</button>
                        </div>
                    </div>

                    <div class="einstell-gruppe">
                        <span class="einstell-titel">HINTERGRUND</span>
                        <div id="hintergrundLeiste" class="hintergrund-leiste"
                             role="group" aria-label="Hintergrundfarbe"></div>
                    </div>

                    <button id="backButton" class="zurueck-knopf" type="button">
                        ◀ ZURÜCK ZU DEN SPIELEN
                    </button>

                    <!-- Nur in der Android-App sichtbar (JS prueft die Bruecke). -->
                    <button id="verlassenButton" class="zurueck-knopf verlassen-knopf"
                            type="button" hidden>
                        SPIEL VERLASSEN
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Versionszusatz ?v=17: nach dem Neuladen kommt garantiert die aktuelle
         Datei statt der Browser-Kopie. Bei Aenderungen hochzaehlen. -->
    <!-- Klassische Skripte: funktionieren auch über file:// -->
    <script src="js/board-layout.js?v=17"></script>
    <script src="js/board-layout-2.js?v=17"></script>
    <script src="js/board.js?v=17"></script>
    <script src="js/generator.js?v=17"></script>
    <script src="js/storage.js?v=17"></script>
    <script src="js/renderer.js?v=17"></script>
    <script src="js/hud.js?v=17"></script>
    <script src="js/dialoge.js?v=17"></script>
    <script src="../lob.js?v=17"></script>
    <script src="js/pech.js?v=17"></script>
    <script src="js/gewonnen.js?v=17"></script>
    <script src="js/main.js?v=17"></script>

</body>
</html>
