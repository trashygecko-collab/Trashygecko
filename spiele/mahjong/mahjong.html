
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102b27">

    <title>TrashyGecko Mahjong</title>

    <link rel="stylesheet" href="css/mahjong.css">
</head>
<body>

    <main class="game-container">

        <header class="game-header">
            <div class="brand">
                <span class="brand-icon">❖</span>
                <div>
                    <h1>TRASHYGECKO</h1>
                    <p>MAHJONG SOLITAIRE</p>
                </div>
            </div>

            <div class="header-right">
                <div class="level-display">
                    LEVEL <span id="levelNumber">01</span>
                </div>

                <div class="header-actions">
                    <button id="backButton" type="button" title="Zurück zur Spiele-Übersicht">◀ SPIELE</button>
                    <button id="fullscreenButton" type="button" title="Vollbild ein/aus" aria-label="Vollbild">⛶ VOLLBILD</button>
                </div>
            </div>
        </header>

        <section class="game-toolbar">

            <div class="stat-box">
                <span>SPIELSTEINE</span>
                <strong id="remainingTiles">114</strong>
            </div>

            <div class="stat-box">
                <span>PAARE</span>
                <strong id="remainingPairs">57</strong>
            </div>

            <div class="stat-box">
                <span>ZEIT</span>
                <strong id="gameTime">00:00</strong>
            </div>

            <div class="game-buttons">
                <button id="hintButton" type="button">TIPP</button>
                <button id="shuffleButton" type="button">NEU MISCHEN</button>
                <button id="newGameButton" type="button">NEUES SPIEL</button>
                <button id="resetLevelButton" type="button" title="Wieder bei Level 1 beginnen">AB LEVEL 1</button>
            </div>

        </section>

        <section class="board-area">
            <div id="board" class="mahjong-board">
                <div class="loading-message">
                    MAHJONG WIRD VORBEREITET ...
                </div>
            </div>
        </section>

        <footer class="game-footer">
            <span>TRASHYGECKO MAHJONG</span>
            <span>57 PAARE · 114 STEINE</span>
            <span>MADE BY THOMAS VOIGT</span>
        </footer>

    </main>

    <!-- Klassische Skripte: funktionieren auch über file:// -->
    <script src="js/board-layout.js"></script>
    <script src="js/board.js"></script>
    <script src="js/solver.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
