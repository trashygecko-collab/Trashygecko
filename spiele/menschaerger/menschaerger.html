<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>NEON – Mensch ärgere dich nicht</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#090b10;
  --cyan:#42e8ff;
  --pink:#ff4fd8;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:12px;
  min-height:100vh;
  background:var(--bg);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
button,select{font:inherit}
.app{
  width:min(100%,1000px);
  margin:0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}
.panel{
  width:100%;
  background:var(--panel);
  border:1px solid #29394c;
  border-radius:14px;
  padding:13px;
}
.setup{display:flex;flex-direction:column;gap:12px}
.section-title{
  color:var(--cyan);
  text-align:center;
  font-size:13px;
  letter-spacing:2px;
  margin-bottom:8px;
}
.player-count{display:flex;justify-content:center;gap:9px}
.count-btn{
  width:48px;height:43px;
  border:1px solid #536174;
  border-radius:9px;
  background:#191e2d;
  color:#fff;
  font-size:19px;
  cursor:pointer;
}
.count-btn.active{
  color:var(--cyan);
  border-color:var(--cyan);
  box-shadow:0 0 10px #42e8ff66;
}
.player-settings{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.player-setting{
  display:flex;align-items:center;gap:8px;
  background:#191e2d;border-radius:8px;
  padding:8px;font-size:13px;
}
.player-setting select{
  min-width:0;width:100%;padding:8px;
  background:#090d18;color:#fff;
  border:1px solid #46566b;border-radius:6px;
}
.start-game,.action{
  padding:12px 18px;
  border:1px solid var(--cyan);
  border-radius:9px;
  background:#102b38;color:var(--cyan);
  font-weight:bold;cursor:pointer;
}
.start-game{width:100%;font-size:17px;letter-spacing:2px}
.game-area{
  width:100%;display:none;
  flex-direction:column;align-items:center;gap:9px;
}
.top-info{
  width:100%;display:flex;
  justify-content:space-between;align-items:center;
  gap:8px;flex-wrap:wrap;
}
.turn{
  font-size:15px;font-weight:bold;
  padding:9px 13px;border:1px solid #435166;
  border-radius:9px;background:#111522;
}
.turn-dot{
  display:inline-block;width:12px;height:12px;
  border-radius:50%;margin-right:7px;vertical-align:middle;
}
.message{
  flex:1;color:#bbb;font-size:12px;
  text-align:center;min-height:16px;
}
/* Kein Rahmen, kein Schatten, keine Rundung – jeder Pixel gehört dem Spiel. */
.board-wrap{
  position:relative;
  width:min(100%,820px);
  aspect-ratio:1;
  background:#000;
  overflow:hidden;
  /* Kontrast- und Dunkelmodi von Handy und PC sollen das Brett nicht
     umfärben – sonst werden aus schwarzen Feldern graue Systemflächen. */
  forced-color-adjust:none;
  -webkit-forced-color-adjust:none;
}
/* Alte Browser ohne aspect-ratio: gleiche quadratische Fläche über Padding. */
@supports not (aspect-ratio:1/1){
  .board-wrap{height:0;padding-bottom:100%}
  #board{position:absolute;left:0;top:0;width:100%;height:100%}
}
#board{display:block;width:100%;height:100%;touch-action:manipulation}
.board-cross{fill:#101317;stroke:#555d69;stroke-width:2}
/* Parkplätze: schwarz, ohne Kasten drumherum. */
.base-slot{fill:#000;stroke:#2a3240;stroke-width:2}
/* Spielfelder: schwarzer Kreis mit hellem Rand – blendet nicht und die
   Figuren bleiben gut sichtbar. */
.track{fill:#050505;stroke:#dfe5ee;stroke-width:3.5}
.track.safe{stroke-width:4}
.lane{stroke-width:4}
/* Figuren ohne Leuchten und ohne hellen Ring – der machte sie aussenrum zu
   grell. Nur wer ziehen darf, bekommt Rand und Glühen. */
.token{
  stroke:#141414;stroke-width:2;
  cursor:pointer;
}
.token.legal{
  stroke:#fff;stroke-width:3;
  filter:drop-shadow(0 0 6px currentColor);
  animation:tokenPulse .7s ease-in-out infinite alternate;
}
@keyframes tokenPulse{from{opacity:1}to{opacity:.62}}
.token-number{
  fill:#fff;font-size:12px;font-weight:bold;
  text-anchor:middle;dominant-baseline:central;
  pointer-events:none;
}
.die{
  width:64px;height:64px;
  position:absolute;left:50%;top:50%;z-index:5;
  transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;
  background:var(--die-color,#ed3434);
  border:3px solid #fff;border-radius:13px;
  box-shadow:0 0 18px var(--die-glow,#ed3434),inset 0 0 8px #0008;
  cursor:pointer;touch-action:manipulation;user-select:none;
}
.die.rolling{animation:shake .15s infinite alternate}
@keyframes shake{
  from{transform:translate(-50%,-50%) rotate(-12deg)}
  to{transform:translate(-50%,-50%) rotate(12deg)}
}
.die-pip{
  position:absolute;width:11px;height:11px;
  border-radius:50%;background:var(--pip-color,#fff);
  box-shadow:0 0 4px #0008;
  transform:translate(-50%,-50%);
}
.die-question{
  font-size:32px;font-weight:bold;line-height:1;
  color:var(--pip-color,#fff);text-shadow:0 0 8px #0006;
}
.players-status{
  width:100%;display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;
}
.player-card{
  padding:9px 5px;text-align:center;
  background:#111522;border:1px solid #354155;
  border-radius:9px;font-size:11px;min-width:0;
}
.player-card.current{border-color:var(--cyan);box-shadow:0 0 10px #42e8ff55}
.player-card .name{font-weight:bold;margin-bottom:4px}
.player-card .pieces{color:#bbb}
.winner{
  color:#ffd166;font-weight:bold;text-align:center;
  font-size:20px;text-shadow:0 0 12px #ffbb33;
}
.new-game{background:#281329;color:var(--pink);border-color:var(--pink)}
/* Das Brett holt sich den Seitenabstand der Seite zurück und nutzt die volle
   Displaybreite – auf dem Handy zählt jeder Millimeter. */
@media(max-width:820px){
  .board-wrap{width:calc(100% + 24px);margin-left:-12px;margin-right:-12px}
}
@media(max-width:520px){
  body{padding:6px}
  .app{gap:8px}
  .panel{padding:9px}
  .player-settings{grid-template-columns:1fr 1fr}
  .players-status{gap:4px}
  .player-card{font-size:10px;padding:7px 2px}
  .board-wrap{width:calc(100% + 12px);margin-left:-6px;margin-right:-6px}
  .die{width:58px;height:58px}
  .die-question{font-size:27px}
}
@media(max-width:360px){
  .top-info{justify-content:center}
  .message{flex-basis:100%}
  .die{width:52px;height:52px}
  .die-question{font-size:24px}
}
</style>
</head>
<body>
<main class="app">
<section class="panel setup" id="setup">
  <div>
    <div class="section-title">WIE VIELE SPIELER?</div>
    <div class="player-count">
      <button class="count-btn active" data-count="2">2</button>
      <button class="count-btn" data-count="3">3</button>
      <button class="count-btn" data-count="4">4</button>
    </div>
  </div>
  <div>
    <div class="section-title">FARBEN AUSWÄHLEN</div>
    <div class="player-settings" id="playerSettings"></div>
  </div>
  <button class="start-game" id="startGame">SPIEL STARTEN</button>
</section>

<section class="game-area" id="gameArea">
  <div class="top-info">
    <div class="turn" id="turnDisplay">Am Zug</div>
    <div class="message" id="message">Würfle eine Sechs!</div>
  </div>

  <div class="board-wrap">
    <svg id="board" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg"
         aria-label="Kreuzförmiges Mensch ärgere dich nicht Spielfeld">
      <rect width="800" height="800" fill="#000"/>
      <g id="boardDrawing"></g>
      <g id="tokens"></g>
    </svg>
    <div class="die" id="die" role="button" aria-label="Würfeln" title="Zum Würfeln anklicken"></div>
  </div>

  <div class="players-status" id="playersStatus"></div>
  <button class="action new-game" id="newGame">NEUES SPIEL</button>
  <button class="action new-game" id="leaveBtn" hidden>SPIEL VERLASSEN</button>
  <div class="winner" id="winner"></div>
</section>
</main>

<script src="/spiele/netz.js"></script>
<script>
(() => {
"use strict";

/* Über den Connector geöffnet (?room=TG-XXXX&name=...&id=...) wird am Tisch
   gespielt. Ohne diese Parameter bleibt alles lokales Spiel. */
const onlineParams=new URLSearchParams(location.search);
const onlineRoom=(onlineParams.get("room")||"").trim().toUpperCase();
const ONLINE=/^TG-[A-F0-9]{4}$/.test(onlineRoom);
const onlineName=(onlineParams.get("name")||"").trim()||"Spieler";
let onlineID=(onlineParams.get("id")||"").trim();
if(ONLINE&&!onlineID){
  try{onlineID=sessionStorage.getItem("tg-player-id")||"";}catch(e){}
}
if(ONLINE&&!onlineID)onlineID="tg-"+Math.random().toString(36).slice(2)+Date.now();
let onlineGame=null;
let onlineBusy=false;

const COLORS = {
  red:{name:"Rot",hex:"#ed3434",dark:"#8e111b"},
  blue:{name:"Blau",hex:"#258cff",dark:"#104a9a"},
  yellow:{name:"Gelb",hex:"#ffd52e",dark:"#9d7610"},
  green:{name:"Grün",hex:"#20cf78",dark:"#087c46"}
};

const ORDER=["red","green","yellow","blue"];
/* Das Brett nutzt die volle Fläche – auf dem Handy zählt jeder Pixel. */
const MARGIN=0;
const CELL=(800-2*MARGIN)/11;

/* 40 Rundfelder: vier Abschnitte mit jeweils zehn Feldern. */
const TRACK=[
  [6,0],[5,0],[4,0],[4,1],[4,2],[4,3],[4,4],[3,4],[2,4],[1,4],
  [0,4],[0,5],[0,6],[1,6],[2,6],[3,6],[4,6],[4,7],[4,8],[4,9],
  [4,10],[5,10],[6,10],[6,9],[6,8],[6,7],[6,6],[7,6],[8,6],[9,6],
  [10,6],[10,5],[10,4],[9,4],[8,4],[7,4],[6,4],[6,3],[6,2],[6,1]
];

/* Startfelder: oben, links, unten, rechts – jeweils zehn Felder auseinander. */
const START_INDEX={green:0,yellow:10,blue:20,red:30};

/* Vier Zielfelder jeder Farbe, gerade bis zur Brettmitte. */
const HOME_LANES={
  green:[[5,1],[5,2],[5,3],[5,4]],
  yellow:[[1,5],[2,5],[3,5],[4,5]],
  blue:[[5,9],[5,8],[5,7],[5,6]],
  red:[[9,5],[8,5],[7,5],[6,5]]
};

/* Basen: 4×4 Felder in jeder Ecke, direkt am Spielfeld ausgerichtet. */
const BASE_ORIGIN={yellow:[0,0],green:[7,0],blue:[0,7],red:[7,7]};
const BASE_BOXES={};
/* Vier Warteplätze je Ecke – nur die Kreise, ohne farbige Umrandung. */
const HOME_SLOTS={};
Object.entries(BASE_ORIGIN).forEach(([color,[gx,gy]])=>{
  BASE_BOXES[color]={x:MARGIN+gx*CELL,y:MARGIN+gy*CELL};
  HOME_SLOTS[color]=[[1.25,1.25],[2.75,1.25],[1.25,2.75],[2.75,2.75]]
    .map(([sx,sy])=>[BASE_BOXES[color].x+sx*CELL,BASE_BOXES[color].y+sy*CELL]);
});

const boardDrawing=document.getElementById("boardDrawing");
const tokensGroup=document.getElementById("tokens");
const setup=document.getElementById("setup");
const gameArea=document.getElementById("gameArea");
const playerSettings=document.getElementById("playerSettings");
const turnDisplay=document.getElementById("turnDisplay");
const message=document.getElementById("message");
const dieElement=document.getElementById("die");
const playersStatus=document.getElementById("playersStatus");
const winnerElement=document.getElementById("winner");

let playerCount=2;
let chosenColors=["red","yellow"];
let players=[];
let currentPlayer=0;
let diceValue=null;
/* Zuletzt gewürfelte Zahl – der Würfel zeigt sie weiter, statt leer zu werden. */
let lastDie=null;
let rolling=false;
let gameOver=false;
let canMove=false;
let extraRoll=false;
let rollAttempts=0;
let turnLocked=false;
let rollTimer=null;
let autoAdvanceTimer=null;

const NS="http://www.w3.org/2000/svg";

function svgElement(tag,attrs={}){
  const el=document.createElementNS(NS,tag);
  Object.entries(attrs).forEach(([key,value])=>el.setAttribute(key,String(value)));
  return el;
}

function cellCenter(col,row){
  return [MARGIN+(col+.5)*CELL,MARGIN+(row+.5)*CELL];
}

function addBase(color){
  /* Kein Kasten drumherum, nur die vier schwarzen Parkplätze. */
  HOME_SLOTS[color].forEach(([cx,cy])=>{
    boardDrawing.appendChild(svgElement("circle",{
      cx,cy,r:CELL*.36,class:"base-slot",
      fill:"#000",stroke:"#2a3240","stroke-width":2
    }));
  });
}

function drawBoard(){
  boardDrawing.innerHTML="";

  /* Der Spielplan ist ein echtes Kreuz, nicht ein Quadrat mit vier Farbfeldern. */
  boardDrawing.appendChild(svgElement("rect",{
    x:MARGIN+4*CELL,y:MARGIN,width:3*CELL,height:11*CELL,
    rx:7,class:"board-cross",fill:"#101317",stroke:"#555d69","stroke-width":2
  }));
  boardDrawing.appendChild(svgElement("rect",{
    x:MARGIN,y:MARGIN+4*CELL,width:11*CELL,height:3*CELL,
    rx:7,class:"board-cross",fill:"#101317",stroke:"#555d69","stroke-width":2
  }));

  ["yellow","green","blue","red"].forEach(addBase);

  TRACK.forEach((point,index)=>{
    const [x,y]=point;
    const [cx,cy]=cellCenter(x,y);
    const startColor=Object.keys(START_INDEX).find(color=>START_INDEX[color]===index);
    boardDrawing.appendChild(svgElement("circle",{
      cx,cy,r:CELL*.34,class:"track"+(startColor?" safe":""),
      fill:"#050505",
      stroke:startColor?COLORS[startColor].hex:"#dfe5ee",
      "stroke-width":startColor?4:3.5
    }));
    if(startColor){
      boardDrawing.appendChild(svgElement("circle",{
        cx,cy,r:CELL*.10,fill:COLORS[startColor].hex
      }));
    }
  });

  Object.entries(HOME_LANES).forEach(([color,lane])=>{
    lane.forEach(([x,y],index)=>{
      const [cx,cy]=cellCenter(x,y);
      boardDrawing.appendChild(svgElement("circle",{
        cx,cy,r:CELL*.34,class:"lane",fill:"#050505",
        stroke:COLORS[color].hex,"stroke-width":4,opacity:index===3?1:.86
      }));
    });
  });

  /* Neutrales Mittelfeld – kein vierfarbiges Quadrat. */
  boardDrawing.appendChild(svgElement("circle",{
    cx:400,cy:400,r:CELL*.36,fill:"#050505",stroke:"#dfe5ee","stroke-width":3.5
  }));
}

function renderSetup(){
  playerSettings.innerHTML="";
  chosenColors=chosenColors.slice(0,playerCount);
  while(chosenColors.length<playerCount){
    const available=ORDER.filter(color=>!chosenColors.includes(color));
    chosenColors.push(available[0]);
  }

  for(let i=0;i<playerCount;i++){
    const row=document.createElement("label");
    row.className="player-setting";
    const select=document.createElement("select");
    select.dataset.player=i;

    ORDER.forEach(color=>{
      const option=document.createElement("option");
      option.value=color;
      option.textContent=COLORS[color].name;
      option.selected=chosenColors[i]===color;
      select.appendChild(option);
    });

    select.addEventListener("change",()=>{
      const value=select.value;
      const duplicate=chosenColors.findIndex((color,index)=>color===value&&index!==i);
      if(duplicate!==-1){
        const old=chosenColors[i];
        chosenColors[i]=value;
        chosenColors[duplicate]=old;
      }else{
        chosenColors[i]=value;
      }
      renderSetup();
    });

    const title=document.createElement("span");
    title.textContent="Spieler "+(i+1);
    row.append(title,select);
    playerSettings.appendChild(row);
  }
}

document.querySelectorAll(".count-btn").forEach(button=>{
  button.addEventListener("click",()=>{
    playerCount=Number(button.dataset.count);
    document.querySelectorAll(".count-btn").forEach(item=>
      item.classList.toggle("active",item===button)
    );
    const defaults={
      2:["red","yellow"],
      3:["red","green","yellow"],
      4:["red","green","yellow","blue"]
    };
    chosenColors=defaults[playerCount].slice();
    renderSetup();
  });
});

function clearTimers(){
  if(rollTimer!==null){clearInterval(rollTimer);rollTimer=null;}
  if(autoAdvanceTimer!==null){clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null;}
}

function startGame(){
  clearTimers();
  players=chosenColors.map(color=>({
    color,name:COLORS[color].name,pieces:[-1,-1,-1,-1]
  }));
  currentPlayer=0;
  diceValue=null;
  rolling=false;
  gameOver=false;
  canMove=false;
  extraRoll=false;
  rollAttempts=0;
  turnLocked=false;
  setup.style.display="none";
  gameArea.style.display="flex";
  winnerElement.textContent="";
  dieElement.style.pointerEvents="auto";
  lastDie=null;
  drawBoard();
  updateAll();
  showDie(null);
  message.textContent="Würfle eine Sechs, um eine Figur herauszubringen!";
}

function playerPosition(player,pieceIndex){
  const progress=player.pieces[pieceIndex];
  if(progress<0){
    return {home:true,coords:HOME_SLOTS[player.color][pieceIndex]};
  }
  if(progress<=39){
    const index=(START_INDEX[player.color]+progress)%40;
    const [x,y]=TRACK[index];
    return {home:false,coords:cellCenter(x,y),trackIndex:index};
  }
  /* Im Ziel (44) steht die Figur in der Brettmitte. Ohne diesen Fall würde
     lane[4] gelesen und das Zeichnen abstürzen. */
  if(progress>=44){
    return {home:false,coords:[400,400],lane:true};
  }
  const lane=HOME_LANES[player.color];
  const [x,y]=lane[progress-40];
  return {home:false,coords:cellCenter(x,y),lane:true};
}

function legalMoves(){
  if(diceValue===null||!players.length)return [];
  const player=players[currentPlayer];
  const result=[];

  player.pieces.forEach((progress,pieceIndex)=>{
    let destination;
    if(progress===-1){
      if(diceValue!==6)return;
      destination=0;
    }else{
      if(progress===44)return;
      destination=progress+diceValue;
      if(destination>44)return;
    }

    /* Auf einem Feld darf nur eine eigene Figur stehen. Überspringen ist erlaubt. */
    if(destination<=39){
      const target=(START_INDEX[player.color]+destination)%40;
      const occupied=player.pieces.some((other,otherIndex)=>
        otherIndex!==pieceIndex&&other>=0&&other<=39&&
        (START_INDEX[player.color]+other)%40===target
      );
      if(occupied)return;
    }else if(destination<=43){
      const occupied=player.pieces.some((other,otherIndex)=>
        otherIndex!==pieceIndex&&other===destination
      );
      if(occupied)return;
    }
    /* Im Ziel (44) dürfen mehrere Figuren stehen – sonst ist ein Sieg unmöglich. */
    result.push(pieceIndex);
  });
  return result;
}

function renderTokens(){
  tokensGroup.innerHTML="";
  const legal=legalMoves();
  const groups=new Map();

  players.forEach((player,pIndex)=>{
    player.pieces.forEach((progress,pieceIndex)=>{
      const pos=playerPosition(player,pieceIndex);
      if(pos.home)return;
      const key=pos.coords.join(",");
      if(!groups.has(key))groups.set(key,[]);
      groups.get(key).push({pIndex,pieceIndex});
    });
  });

  players.forEach((player,pIndex)=>{
    player.pieces.forEach((progress,pieceIndex)=>{
      const pos=playerPosition(player,pieceIndex);
      let [cx,cy]=pos.coords;
      const key=pos.coords.join(",");
      const group=groups.get(key)||[];
      const stackIndex=group.findIndex(item=>item.pIndex===pIndex&&item.pieceIndex===pieceIndex);
      const offsets=[[0,0],[-9,-9],[9,-9],[-9,9],[9,9]];
      if(group.length>1){
        const offset=offsets[Math.min(stackIndex,4)];
        cx+=offset[0];cy+=offset[1];
      }

      const isLegal=pIndex===currentPlayer&&legal.includes(pieceIndex);
      const circle=svgElement("circle",{
        cx,cy,r:CELL*.25,fill:COLORS[player.color].hex,
        class:"token"+(isLegal?" legal":""),
        style:isLegal?"color:"+COLORS[player.color].hex:"",
        "data-player":pIndex,"data-piece":pieceIndex
      });
      const title=svgElement("title");
      title.textContent=player.name+" – Figur "+(pieceIndex+1);
      circle.appendChild(title);
      tokensGroup.appendChild(circle);

      const number=svgElement("text",{x:cx,y:cy,class:"token-number"});
      number.textContent=pieceIndex+1;
      tokensGroup.appendChild(number);
    });
  });
}

function renderPlayerCards(){
  playersStatus.innerHTML="";
  players.forEach((player,index)=>{
    const card=document.createElement("div");
    card.className="player-card"+(index===currentPlayer&&!gameOver?" current":"");
    if(index===currentPlayer&&!gameOver){
      card.style.borderColor=COLORS[player.color].hex;
      card.style.boxShadow="0 0 12px "+COLORS[player.color].hex+"66";
    }
    const name=document.createElement("div");
    name.className="name";
    name.style.color=COLORS[player.color].hex;
    name.textContent=player.name;
    const pieces=document.createElement("div");
    pieces.className="pieces";
    const home=player.pieces.filter(value=>value===-1).length;
    const goal=player.pieces.filter(value=>value===44).length;
    pieces.textContent="Haus: "+home+" · Ziel: "+goal;
    card.append(name,pieces);
    playersStatus.appendChild(card);
  });
}

function updateTurn(){
  if(!players.length)return;
  const player=players[currentPlayer];
  const color=COLORS[player.color];
  turnDisplay.style.borderColor=color.hex;
  turnDisplay.style.boxShadow="0 0 12px "+color.hex+"66";
  turnDisplay.innerHTML=
    '<span class="turn-dot" style="background:'+color.hex+';box-shadow:0 0 8px '+color.hex+'"></span>'+player.name+" ist am Zug";
  dieElement.style.setProperty("--die-color",color.hex);
  dieElement.style.setProperty("--die-glow",color.hex);
  dieElement.style.setProperty("--pip-color",player.color==="yellow"?"#171717":"#fff");
  const canRoll=!gameOver&&!turnLocked&&!rolling&&!canMove&&(!ONLINE||(myTurnOnline()&&diceValue===null));
  dieElement.style.cursor=canRoll?"pointer":"default";
  dieElement.style.pointerEvents=canRoll?"auto":"none";
}

function updateAll(){
  updateTurn();
  renderTokens();
  renderPlayerCards();
}

/* Zeichnet nur die Punkte, ohne den letzten Wurf zu merken. Das nutzt die
   Würfel-Animation, damit dort keine Zufallszahl hängen bleibt. */
function renderPips(value){
  dieElement.innerHTML="";
  const positions={
    1:[4],2:[0,8],3:[0,4,8],
    4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]
  };
  const coords=[
    [25,25],[50,25],[75,25],
    [25,50],[50,50],[75,50],
    [25,75],[50,75],[75,75]
  ];
  positions[value].forEach(index=>{
    const pip=document.createElement("span");
    pip.className="die-pip";
    pip.style.left=coords[index][0]+"%";
    pip.style.top=coords[index][1]+"%";
    dieElement.appendChild(pip);
  });
}

/* Der Würfel zeigt ab dem ersten Wurf immer die gewürfelte Zahl und davor ein
   Fragezeichen – nie eine leere Fläche. */
function showDie(value){
  dieElement.classList.remove("rolling");
  if(value!==null&&value!==undefined&&value>0)lastDie=value;
  const shown=lastDie;
  if(!shown||shown<1||shown>6){
    dieElement.innerHTML="";
    const question=document.createElement("span");
    question.className="die-question";
    question.textContent="?";
    dieElement.appendChild(question);
    return;
  }
  renderPips(shown);
}

function lockAndAdvance(text){
  turnLocked=true;
  canMove=false;
  message.textContent=text;
  updateTurn();
  if(autoAdvanceTimer!==null)clearTimeout(autoAdvanceTimer);
  autoAdvanceTimer=setTimeout(()=>{
    autoAdvanceTimer=null;
    if(!gameOver)nextPlayer();
  },1000);
}

function rollDice(){
  if(rolling||gameOver||canMove||turnLocked)return;
  rolling=true;
  updateTurn();
  message.textContent="Der Würfel rollt …";
  dieElement.classList.add("rolling");

  let count=0;
  rollTimer=setInterval(()=>{
    renderPips(Math.floor(Math.random()*6)+1);
    dieElement.classList.add("rolling");
    count++;
    if(count>=12){
      clearInterval(rollTimer);
      rollTimer=null;
      diceValue=Math.floor(Math.random()*6)+1;
      rolling=false;
      showDie(diceValue);
      updateTurn();

      const player=players[currentPlayer];
      const hasPieceInPlay=player.pieces.some(value=>value>=0&&value<44);
      if(diceValue!==6&&!hasPieceInPlay&&!extraRoll){
        rollAttempts++;
        if(rollAttempts<3){
          message.textContent="Keine Sechs! Noch "+(3-rollAttempts)+" Wurfversuch(e).";
          updateTurn();
          return;
        }
        lockAndAdvance("Dreimal keine Sechs – Spielerwechsel …");
        return;
      }

      if(diceValue===6)rollAttempts=0;
      afterRoll();
    }
  },75);
}

function afterRoll(){
  const moves=legalMoves();
  if(moves.length===0){
    lockAndAdvance(diceValue===6
      ?"Keine Figur kann ziehen – nächster Spieler …"
      :"Kein gültiger Zug möglich – nächster Spieler …");
    return;
  }
  canMove=true;
  updateTurn();
  message.textContent=moves.length===1
    ?"Deine leuchtende Figur anklicken!"
    :"Wähle eine der leuchtenden Figuren!";
  renderTokens();
}

function movePiece(pieceIndex){
  if(!canMove||gameOver||turnLocked)return;
  const moves=legalMoves();
  if(!moves.includes(pieceIndex))return;

  const player=players[currentPlayer];
  const old=player.pieces[pieceIndex];
  player.pieces[pieceIndex]=old===-1?0:old+diceValue;
  const newProgress=player.pieces[pieceIndex];

  /* Gegner auf dem Rundweg schlagen – die eigenen Startfelder sind nicht geschützt. */
  if(newProgress<=39){
    const target=(START_INDEX[player.color]+newProgress)%40;
    players.forEach((other,otherIndex)=>{
      if(otherIndex===currentPlayer)return;
      other.pieces.forEach((progress,otherPiece)=>{
        if(progress>=0&&progress<=39){
          const otherTarget=(START_INDEX[other.color]+progress)%40;
          if(otherTarget===target){
            other.pieces[otherPiece]=-1;
            message.textContent=other.name+" wurde geschlagen!";
          }
        }
      });
    });
  }

  canMove=false;
  if(player.pieces.every(value=>value===44)){
    gameOver=true;
    message.textContent="";
    winnerElement.textContent="🏆 "+player.name+" GEWINNT! 🏆";
    updateAll();
    return;
  }

  const rolledSix=diceValue===6;
  diceValue=null;
  if(rolledSix){
    extraRoll=true;
    rollAttempts=0;
    message.textContent="Sechs! Du darfst noch einmal würfeln – Würfel anklicken.";
  }else{
    extraRoll=false;
    nextPlayer();
    return;
  }
  updateAll();
  showDie(null);
}

function nextPlayer(){
  if(autoAdvanceTimer!==null){clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null;}
  currentPlayer=(currentPlayer+1)%players.length;
  diceValue=null;
  canMove=false;
  extraRoll=false;
  rollAttempts=0;
  rolling=false;
  turnLocked=false;
  message.textContent="Würfle eine Sechs, um eine Figur herauszubringen!";
  showDie(null);
  updateAll();
}

/* ---------- Online über den Connector ---------- */
function myTurnOnline(){
  return !!(onlineGame&&onlineGame.players&&onlineGame.players[onlineGame.current]&&onlineGame.players[onlineGame.current].id===onlineID);
}
async function postPresence(){
  if(!onlineRoom||!onlineID)return;
  await fetch("/api/presence",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({room:onlineRoom,id:onlineID,name:onlineName})
  });
}
async function fetchOnlineGame(){
  const r=await fetch("/api/menschaerger?room="+encodeURIComponent(onlineRoom)+"&id="+encodeURIComponent(onlineID),{cache:"no-store"});
  if(!r.ok)throw new Error("Spielstand nicht erreichbar ("+r.status+").");
  return (await r.json()).game;
}
async function onlineAction(action,payload={}){
  const r=await fetch("/api/menschaerger?room="+encodeURIComponent(onlineRoom)+"&action="+encodeURIComponent(action),{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id:onlineID,...payload})
  });
  if(!r.ok)throw new Error((await r.text()).trim()||"Aktion fehlgeschlagen.");
  return (await r.json()).game;
}
function onlineMessage(){
  if(!onlineGame)return "Verbinde mit dem Connector …";
  if(onlineGame.status==="invited")return "Warte auf den Spielstart …";
  if(onlineGame.status==="finished"){
    const winner=onlineGame.players.find(p=>p.id===onlineGame.winner);
    return winner?winner.name+" gewinnt!":"Spiel beendet.";
  }
  const current=onlineGame.players[onlineGame.current];
  if(!current)return "";
  if(current.id===onlineID){
    return onlineGame.dice>0?"Wähle eine deiner Figuren!":"Du bist dran – würfle!";
  }
  return current.name+(onlineGame.dice>0?" wählt eine Figur …":" ist am Zug …");
}
function applyOnlineState(game){
  onlineGame=game||null;
  if(!game||(game.status!=="active"&&game.status!=="finished")){
    players=[];
    currentPlayer=0;
    diceValue=null;
    turnDisplay.textContent="Warte auf den Spielstart …";
    message.textContent=onlineMessage();
    playersStatus.innerHTML="";
    tokensGroup.innerHTML="";
    showDie(null);
    return;
  }
  players=game.players.map(p=>({color:p.color,name:p.name,pieces:p.pieces.slice()}));
  currentPlayer=game.current;
  diceValue=game.dice||null;
  gameOver=game.status==="finished";
  turnLocked=false;
  rolling=false;
  extraRoll=!!game.extraRoll;
  canMove=!gameOver&&diceValue!==null&&legalMoves().length>0;
  const winner=game.players.find(p=>p.id===game.winner);
  winnerElement.textContent=gameOver&&winner?"🏆 "+winner.name+" GEWINNT! 🏆":"";
  updateAll();
  // Auch ohne offenen Wurf zeigt der Würfel die zuletzt gewürfelte Zahl.
  showDie(game.lastDice||game.dice||null);
  message.textContent=game.note||onlineMessage();
}
async function pollOnline(){
  if(!onlineRoom||!onlineID||onlineBusy)return;
  try{
    const game=await fetchOnlineGame();
    if(!onlineBusy)applyOnlineState(game);
  }catch(e){
    message.textContent="Verbindung zum Connector verloren …";
  }
}
async function rollDiceOnline(){
  if(onlineBusy||!myTurnOnline()||diceValue!==null)return;
  onlineBusy=true;
  let frames=0;
  const spin=setInterval(()=>{
    renderPips(Math.floor(Math.random()*6)+1);
    dieElement.classList.add("rolling");
    if(++frames>=8)clearInterval(spin);
  },70);
  try{
    const game=await onlineAction("roll");
    clearInterval(spin);
    dieElement.classList.remove("rolling");
    applyOnlineState(game);
  }catch(e){
    clearInterval(spin);
    dieElement.classList.remove("rolling");
    message.textContent=e.message;
  }finally{
    onlineBusy=false;
  }
}
async function movePieceOnline(pieceIndex){
  if(onlineBusy||!myTurnOnline()||!canMove)return;
  onlineBusy=true;
  try{
    const game=await onlineAction("move",{piece:pieceIndex});
    if(game)applyOnlineState(game);
  }catch(e){
    message.textContent=e.message;
  }finally{
    onlineBusy=false;
  }
}
function startOnlineTable(){
  setup.style.display="none";
  gameArea.style.display="flex";
  const leave=document.getElementById("leaveBtn");
  if(leave){
    leave.hidden=false;
    leave.addEventListener("click",()=>{
      tgVerlassen(); });
  }
  lastDie=null;
  message.textContent="Verbinde mit dem Connector …";
  postPresence().catch(()=>{});
  setInterval(()=>postPresence().catch(()=>{}),5000);
  pollOnline();
  setInterval(pollOnline,700);
}

tokensGroup.addEventListener("click",event=>{
  const token=event.target.closest(".token");
  if(!token)return;
  const playerIndex=Number(token.dataset.player);
  const pieceIndex=Number(token.dataset.piece);
  if(playerIndex!==currentPlayer)return;
  if(ONLINE){
    movePieceOnline(pieceIndex);
    return;
  }
  movePiece(pieceIndex);
});

dieElement.addEventListener("click",()=>{
  if(ONLINE){
    rollDiceOnline();
    return;
  }
  rollDice();
});
document.getElementById("startGame").addEventListener("click",startGame);
document.getElementById("newGame").addEventListener("click",()=>{
  if(ONLINE){
    if(!onlineGame||onlineGame.status!=="finished"){
      message.textContent="Die laufende Partie läuft noch.";
      return;
    }
    if(onlineGame.hostId!==onlineID){
      message.textContent="Der Gastgeber startet eine neue Runde.";
      return;
    }
    onlineAction("reset").then(game=>{if(game)applyOnlineState(game);})
      .catch(e=>{message.textContent=e.message;});
    return;
  }
  clearTimers();
  rolling=false;
  turnLocked=false;
  gameArea.style.display="none";
  setup.style.display="flex";
  winnerElement.textContent="";
  renderSetup();
});

renderSetup();
drawBoard();

if(ONLINE){
  startOnlineTable();
}
})();
</script>
