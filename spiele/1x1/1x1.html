<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1x1</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at top, #101b35, #080b16 60%, #03050a);
    color: white;
    font-family: Arial, sans-serif;
}

.game {
    width: 100%;
    max-width: 490px;
    padding: 22px;
    background: rgba(5, 10, 24, .97);
    border: 1px solid #164e75;
    border-radius: 20px;
    box-shadow: 0 0 18px #0077ff33, 0 0 40px #00c8ff18;
}

h1 {
    margin: 0;
    text-align: center;
    font-size: 45px;
    letter-spacing: 6px;
    color: #00f0ff;
    text-shadow: 0 0 8px #00dfff, 0 0 22px #008cff;
}

.subtitle {
    margin: 4px 0 22px;
    text-align: center;
    color: #8298b9;
    font-size: 11px;
    letter-spacing: 3px;
}

h2 {
    margin: 12px 0 18px;
    text-align: center;
    color: #00eaff;
    font-size: 19px;
    text-shadow: 0 0 10px #008cff;
}

.intro {
    text-align: center;
    font-size: 13px;
    color: #8da8c8;
    line-height: 1.6;
    margin-bottom: 20px;
}

/* AUSWAHL */

.menu-buttons {
    display: grid;
    gap: 14px;
}

.menu-button {
    padding: 22px 15px;
    border: 1px solid #17608a;
    border-radius: 13px;
    background: linear-gradient(145deg, #10243d, #081323);
    color: white;
    cursor: pointer;
    text-align: left;
    box-shadow: 0 0 10px #0077ff22;
}

.menu-button:active,
.level-button:active {
    transform: scale(.98);
    box-shadow: 0 0 18px #00dfff77;
}

.menu-title {
    display: block;
    margin-bottom: 8px;
    font-size: 21px;
    font-weight: bold;
    color: #00edff;
}

.menu-button:nth-child(2) .menu-title {
    color: #ff55dc;
}

.menu-description {
    display: block;
    color: #a0b5d0;
    font-size: 12px;
    line-height: 1.6;
}

/* SCHWIERIGKEIT */

#levelScreen,
#gameScreen,
#endScreen {
    display: none;
}

.levels {
    display: grid;
    gap: 12px;
}

.level-button {
    padding: 17px 12px;
    border: 1px solid #17608a;
    border-radius: 12px;
    background: linear-gradient(145deg, #10243d, #081323);
    color: white;
    cursor: pointer;
    text-align: left;
}

.level-title {
    display: block;
    margin-bottom: 6px;
    font-size: 19px;
    font-weight: bold;
    color: #00edff;
}

.level-button:nth-child(2) .level-title {
    color: #ff55dc;
}

.level-button:nth-child(3) .level-title {
    color: #ffc857;
}

.level-description {
    display: block;
    color: #a0b5d0;
    font-size: 12px;
    line-height: 1.5;
}

.back {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    border: 1px solid #465b76;
    border-radius: 10px;
    background: #101c30;
    color: #a9c3df;
    cursor: pointer;
    font-size: 14px;
}

/* SPIEL */

.stats {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
}

.stat {
    flex: 1;
    padding: 10px 5px;
    text-align: center;
    border: 1px solid #17436c;
    border-radius: 10px;
    background: #091629;
    color: #8eb5d9;
    font-size: 11px;
}

.stat strong {
    display: block;
    margin-top: 5px;
    font-size: 20px;
    color: #00edff;
    text-shadow: 0 0 9px #00bfff;
}

.progress {
    height: 7px;
    margin-bottom: 18px;
    overflow: hidden;
    background: #14243a;
    border-radius: 10px;
}

.progress-bar {
    width: 10%;
    height: 100%;
    background: linear-gradient(90deg, #0077ff, #00f0ff);
    box-shadow: 0 0 12px #00cfff;
    transition: width .3s;
}

.question-panel {
    min-height: 185px;
    padding: 20px 10px;
    text-align: center;
    border: 1px solid #17486c;
    border-radius: 15px;
    background: linear-gradient(145deg, #0b1d35, #080e1c);
    box-shadow: inset 0 0 20px #0077ff12;
}

.operation {
    margin-bottom: 15px;
    color: #ff42df;
    font-size: 12px;
    letter-spacing: 3px;
    text-shadow: 0 0 10px #ff00c8;
}

.question {
    min-height: 65px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 7px;
    font-size: clamp(32px, 9vw, 48px);
    font-weight: bold;
    color: white;
    text-shadow: 0 0 8px #00dfff, 0 0 22px #008cff;
}

.equation-line {
    font-size: clamp(22px, 6vw, 31px);
    line-height: 1.4;
    white-space: nowrap;
}

.target {
    color: #ff55dc;
    text-shadow: 0 0 10px #ff00c8;
}

.answer-label {
    margin: 17px 0 8px;
    color: #8199b8;
    font-size: 11px;
    letter-spacing: 2px;
}

.display {
    height: 58px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    border: 1px solid #007c9b;
    border-radius: 10px;
    background: #020b16;
    color: #00f0ff;
    font-size: 31px;
    font-weight: bold;
    box-shadow: inset 0 0 15px #00aaff22;
}

.display.correct {
    color: #43ff91;
    border-color: #24db79;
    box-shadow: 0 0 15px #00ff6655;
}

.display.wrong {
    color: #ff5278;
    border-color: #ff315d;
    box-shadow: 0 0 15px #ff174455;
}

.feedback {
    min-height: 35px;
    margin: 10px 0 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8da8c8;
    text-align: center;
    font-size: 13px;
}

.feedback.good {
    color: #43ff91;
    text-shadow: 0 0 8px #00ff66;
}

.feedback.bad {
    color: #ff7190;
}

/* TASTEN */

.keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
    margin-top: 12px;
}

.key {
    height: 57px;
    border: 1px solid #17547b;
    border-radius: 11px;
    background: linear-gradient(145deg, #10243d, #081323);
    color: #e5faff;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 0 #06101e, 0 0 8px #0077ff22;
}

.key:active {
    transform: translateY(3px);
    box-shadow: 0 0 12px #00cfff;
}

.key:disabled {
    opacity: .4;
    cursor: default;
}

.key.action {
    color: #ff65df;
    border-color: #823c91;
    font-size: 18px;
}

.submit {
    width: 100%;
    height: 56px;
    margin-top: 13px;
    border: 1px solid #00eaff;
    border-radius: 11px;
    background: linear-gradient(90deg, #0054a8, #007caa);
    color: white;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 15px #00aaff55;
}

.submit:active {
    transform: scale(.98);
}

.submit:disabled {
    opacity: .4;
}

/* ENDE */

.end-screen {
    padding: 15px 5px;
    text-align: center;
}

.end-screen h2 {
    color: #00f0ff;
    font-size: 27px;
}

.final-score {
    margin: 20px 0;
    color: #43ff91;
    font-size: 60px;
    font-weight: bold;
    text-shadow: 0 0 20px #00ff80;
}

.final-text {
    margin-bottom: 24px;
    color: #b4c7df;
    font-size: 15px;
    line-height: 1.6;
}

.restart,
.change-level {
    width: 100%;
    padding: 16px;
    border-radius: 11px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.restart {
    border: 1px solid #00eaff;
    background: #09243a;
    color: #00edff;
    box-shadow: 0 0 15px #00aaff33;
}

.change-level {
    margin-top: 10px;
    border: 1px solid #823c91;
    background: #23102b;
    color: #ff72e6;
    box-shadow: 0 0 15px #ff00c833;
}

.footer {
    margin-top: 18px;
    color: #506783;
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
}

@media (max-width: 380px) {
    body {
        padding: 8px;
    }

    .game {
        padding: 15px;
    }

    .key {
        height: 51px;
    }

    h1 {
        font-size: 38px;
    }
}

@media (max-height: 720px) {
    body {
        align-items: flex-start;
    }

    .game {
        padding: 15px;
    }

    .subtitle {
        margin-bottom: 13px;
    }

    .question-panel {
        padding: 13px 8px;
    }

    .key {
        height: 48px;
    }

    .footer {
        margin-top: 10px;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>1x1</h1>
    <div class="subtitle">DAS NEON-MATHESPIEL</div>

    <!-- SPIELART AUSWÄHLEN -->

    <div id="startScreen">

        <h2>WAS MÖCHTEST DU SPIELEN?</h2>

        <div class="menu-buttons">

            <button class="menu-button" onclick="selectMode('arithmetic')">
                <span class="menu-title">＋ − × ÷ GRUNDRECHENARTEN</span>
                <span class="menu-description">
                    Plus, Minus, Mal und Geteilt.<br>
                    Zehn Aufgaben pro Runde.
                </span>
            </button>

            <button class="menu-button" onclick="selectMode('equations')">
                <span class="menu-title">x GLEICHUNGEN</span>
                <span class="menu-description">
                    Rechne mit Variablen wie a, b und c.<br>
                    Finde die gesuchte Zahl.
                </span>
            </button>

        </div>

    </div>

    <!-- SCHWIERIGKEIT AUSWÄHLEN -->

    <div id="levelScreen">

        <h2 id="levelHeading">SCHWIERIGKEIT</h2>

        <div class="intro" id="levelIntro"></div>

        <div class="levels">

            <button class="level-button" onclick="startGame(1)">
                <span class="level-title">STUFE 1 · LEICHT</span>
                <span class="level-description" id="desc1"></span>
            </button>

            <button class="level-button" onclick="startGame(2)">
                <span class="level-title">STUFE 2 · MITTEL</span>
                <span class="level-description" id="desc2"></span>
            </button>

            <button class="level-button" onclick="startGame(3)">
                <span class="level-title">STUFE 3 · SCHWER</span>
                <span class="level-description" id="desc3"></span>
            </button>

        </div>

        <button class="back" onclick="showStartScreen()">
            ← ZURÜCK
        </button>

    </div>

    <!-- SPIEL -->

    <div id="gameScreen">

        <div class="stats">

            <div class="stat">
                FRAGE
                <strong id="questionCount">1 / 10</strong>
            </div>

            <div class="stat">
                RICHTIG
                <strong id="score">0</strong>
            </div>

        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="question-panel">

            <div class="operation" id="operation"></div>

            <div class="question" id="question"></div>

            <div class="answer-label">DEINE ANTWORT</div>

            <div class="display" id="display">?</div>

        </div>

        <div class="feedback" id="feedback">
            Tippe unten deine Antwort ein.
        </div>

        <div class="keypad">

            <button class="key" onclick="addNumber('7')">7</button>
            <button class="key" onclick="addNumber('8')">8</button>
            <button class="key" onclick="addNumber('9')">9</button>
            <button class="key action" onclick="clearAnswer()">C</button>

            <button class="key" onclick="addNumber('4')">4</button>
            <button class="key" onclick="addNumber('5')">5</button>
            <button class="key" onclick="addNumber('6')">6</button>
            <button class="key action" onclick="deleteNumber()">⌫</button>

            <button class="key" onclick="addNumber('1')">1</button>
            <button class="key" onclick="addNumber('2')">2</button>
            <button class="key" onclick="addNumber('3')">3</button>
            <button class="key" onclick="addNumber('0')">0</button>

        </div>

        <button class="submit" id="submitButton" onclick="checkAnswer()">
            ANTWORT
        </button>

        <button class="back" onclick="showStartScreen()">
            ← SPIEL ABBRECHEN
        </button>

    </div>

    <!-- SPIELENDE -->

    <div id="endScreen" class="end-screen">

        <h2>RUNDE BEENDET!</h2>

        <div class="final-score" id="finalScore">0 / 10</div>

        <div class="final-text" id="finalText"></div>

        <button class="restart" onclick="startGame(currentLevel)">
            NOCH EINE RUNDE
        </button>

        <button class="change-level" onclick="showLevelScreen()">
            SCHWIERIGKEIT ÄNDERN
        </button>

        <button class="back" onclick="showStartScreen()">
            ZURÜCK ZUR AUSWAHL
        </button>

    </div>

    <div class="footer">
        1x1 · MATHETRAINING · MADE BY THOMAS
    </div>

</div>

<script>

let currentMode = "arithmetic";
let currentLevel = 1;
let questionNumber = 0;
let score = 0;
let correctAnswer = 0;
let answer = "";
let answered = false;
let playing = false;

const totalQuestions = 10;

function randomNumber(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

// SPIELART AUSWÄHLEN

function selectMode(mode) {

    currentMode = mode;

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("levelScreen").style.display = "block";

    const heading = document.getElementById("levelHeading");
    const intro = document.getElementById("levelIntro");

    if (mode === "arithmetic") {

        heading.textContent = "GRUNDRECHENARTEN";

        intro.textContent =
            "Vier Rechenarten, drei Schwierigkeitsstufen. Alle Aufgaben bleiben reine Rechenaufgaben.";

        document.getElementById("desc1").textContent =
            "+ und − bis 100 · × und ÷ bis 5";

        document.getElementById("desc2").textContent =
            "+ und − bis 500 · × und ÷ bis 10";

        document.getElementById("desc3").textContent =
            "+ und − bis 1000 · × und ÷ bis 12";

    } else {

        heading.textContent = "GLEICHUNGEN";

        intro.textContent =
            "Finde den Wert der gesuchten Variablen. Jede Stufe baut auf der vorherigen auf.";

        document.getElementById("desc1").textContent =
            "Eine Variable berechnen. Beispiel: a = 3 + 3 − 2";

        document.getElementById("desc2").textContent =
            "Zwei Variablen verknüpfen. Beispiel: a = 5 · b = 2 × a";

        document.getElementById("desc3").textContent =
            "Drei Variablen verknüpfen. Beispiel: a = 1 · b = 2 × a · c = a + 2 × b";
    }
}

// MENÜS

function showStartScreen() {

    playing = false;

    document.getElementById("startScreen").style.display = "block";
    document.getElementById("levelScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("endScreen").style.display = "none";
}

function showLevelScreen() {

    playing = false;

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("levelScreen").style.display = "block";
    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("endScreen").style.display = "none";
}

// SPIELSTART

function startGame(level) {

    currentLevel = level;
    questionNumber = 0;
    score = 0;
    answer = "";
    answered = false;
    playing = true;

    document.getElementById("levelScreen").style.display = "none";
    document.getElementById("endScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    document.getElementById("score").textContent = "0";

    createQuestion();
}

// FRAGEN ERSTELLEN

function createQuestion() {

    if (currentMode === "arithmetic") {
        createArithmeticQuestion();
    } else {
        createEquationQuestion();
    }

    answered = false;
    answer = "";

    updateDisplay();

    document.getElementById("display").className = "display";

    document.getElementById("feedback").textContent =
        "Tippe unten deine Antwort ein.";

    document.getElementById("feedback").className = "feedback";

    document.getElementById("submitButton").disabled = false;

    document.querySelectorAll(".key").forEach(button => {
        button.disabled = false;
    });

    document.getElementById("questionCount").textContent =
        (questionNumber + 1) + " / " + totalQuestions;

    document.getElementById("progressBar").style.width =
        ((questionNumber + 1) / totalQuestions * 100) + "%";
}

// ========================================
// GRUNDRECHENARTEN
// ========================================

function createArithmeticQuestion() {

    const settings = [
        { maximum: 100, factor: 5 },
        { maximum: 500, factor: 10 },
        { maximum: 1000, factor: 12 }
    ];

    const limit = settings[currentLevel - 1];

    const operation = randomNumber(1, 4);

    let a, b, symbol, name;

    if (operation === 1) {

        a = randomNumber(1, limit.maximum - 1);
        b = randomNumber(1, limit.maximum - a);

        correctAnswer = a + b;
        symbol = "+";
        name = "ADDIEREN";

    } else if (operation === 2) {

        a = randomNumber(2, limit.maximum);
        b = randomNumber(1, a - 1);

        correctAnswer = a - b;
        symbol = "−";
        name = "SUBTRAHIEREN";

    } else if (operation === 3) {

        a = randomNumber(1, limit.factor);
        b = randomNumber(1, limit.factor);

        correctAnswer = a * b;
        symbol = "×";
        name = "MULTIPLIZIEREN";

    } else {

        b = randomNumber(1, limit.factor);

        const result = randomNumber(1, limit.factor);

        a = b * result;

        correctAnswer = result;
        symbol = "÷";
        name = "DIVIDIEREN";
    }

    document.getElementById("operation").textContent =
        name + " · STUFE " + currentLevel;

    document.getElementById("question").innerHTML =
        `<div>${a} ${symbol} ${b}</div>`;
}

// ========================================
// GLEICHUNGEN
// ========================================

function createEquationQuestion() {

    if (currentLevel === 1) {
        createEasyEquation();
    } else if (currentLevel === 2) {
        createMediumEquation();
    } else {
        createHardEquation();
    }
}

// STUFE 1: EINE VARIABLE

function createEasyEquation() {

    const type = randomNumber(1, 4);

    let x, y, z, result, expression;

    if (type === 1) {

        // a = x + y - z

        x = randomNumber(2, 30);
        y = randomNumber(2, 30);
        z = randomNumber(0, x + y - 1);

        result = x + y - z;

        expression = `${x} + ${y} − ${z}`;

    } else if (type === 2) {

        // a = x * y

        x = randomNumber(1, 5);
        y = randomNumber(1, 5);

        result = x * y;

        expression = `${x} × ${y}`;

    } else if (type === 3) {

        // a = x / y

        y = randomNumber(1, 5);
        z = randomNumber(1, 5);

        x = y * z;

        result = z;

        expression = `${x} ÷ ${y}`;

    } else {

        // a = x + y + z

        x = randomNumber(1, 20);
        y = randomNumber(1, 20);
        z = randomNumber(1, 20);

        result = x + y + z;

        expression = `${x} + ${y} + ${z}`;
    }

    correctAnswer = result;

    document.getElementById("operation").textContent =
        "GLEICHUNG · STUFE 1";

    document.getElementById("question").innerHTML = `
        <div class="equation-line">a = ${expression}</div>
        <div class="equation-line target">a = ?</div>
    `;
}

// STUFE 2: ZWEI VARIABLEN

function createMediumEquation() {

    let a, b, expression;

    const type = randomNumber(1, 4);

    if (type === 1) {

        a = randomNumber(1, 50);

        const factor = randomNumber(2, 6);

        b = factor * a;
        expression = `${factor} × a`;

    } else if (type === 2) {

        a = randomNumber(1, 100);

        const addition = randomNumber(1, 50);

        b = a + addition;
        expression = `a + ${addition}`;

    } else if (type === 3) {

        const subtraction = randomNumber(1, 20);

        a = randomNumber(subtraction + 1, 100);

        b = a - subtraction;
        expression = `a − ${subtraction}`;

    } else {

        const divisor = randomNumber(2, 6);

        a = divisor * randomNumber(1, 20);

        b = a / divisor;
        expression = `a ÷ ${divisor}`;
    }

    correctAnswer = b;

    document.getElementById("operation").textContent =
        "GLEICHUNG · STUFE 2";

    document.getElementById("question").innerHTML = `
        <div class="equation-line">a = ${a}</div>
        <div class="equation-line">b = ${expression}</div>
        <div class="equation-line target">b = ?</div>
    `;
}

// STUFE 3: DREI VARIABLEN

function createHardEquation() {

    const a = randomNumber(1, 12);
    const factor = randomNumber(2, 5);
    const b = factor * a;

    let c, expression;

    const type = randomNumber(1, 4);

    if (type === 1) {

        const multiplier = randomNumber(2, 4);

        c = a + multiplier * b;
        expression = `a + ${multiplier} × b`;

    } else if (type === 2) {

        const multiplier = randomNumber(2, 4);

        c = b + multiplier * a;
        expression = `b + ${multiplier} × a`;

    } else if (type === 3) {

        const multiplier = randomNumber(2, 4);

        c = b * multiplier - a;
        expression = `b × ${multiplier} − a`;

    } else {

        const addition = randomNumber(2, 20);

        c = a + b + addition;
        expression = `a + b + ${addition}`;
    }

    correctAnswer = c;

    document.getElementById("operation").textContent =
        "GLEICHUNG · STUFE 3";

    document.getElementById("question").innerHTML = `
        <div class="equation-line">a = ${a}</div>
        <div class="equation-line">b = ${factor} × a</div>
        <div class="equation-line">c = ${expression}</div>
        <div class="equation-line target">c = ?</div>
    `;
}

// ========================================
// TASTATUR
// ========================================

function updateDisplay() {

    document.getElementById("display").textContent =
        answer === "" ? "?" : answer;
}

function addNumber(number) {

    if (!playing || answered || answer.length >= 4) return;

    if (answer === "0") {
        answer = number;
    } else {
        answer += number;
    }

    updateDisplay();
}

function clearAnswer() {

    if (!playing || answered) return;

    answer = "";
    updateDisplay();
}

function deleteNumber() {

    if (!playing || answered) return;

    answer = answer.slice(0, -1);
    updateDisplay();
}

// ========================================
// ANTWORT PRÜFEN
// ========================================

function checkAnswer() {

    if (!playing || answered) return;

    if (answer === "") {

        document.getElementById("feedback").textContent =
            "Bitte gib zuerst eine Zahl ein.";

        return;
    }

    answered = true;

    const userAnswer = Number(answer);

    const display = document.getElementById("display");
    const feedback = document.getElementById("feedback");

    if (userAnswer === correctAnswer) {

        score++;

        display.className = "display correct";
        feedback.className = "feedback good";
        feedback.textContent = "✓ RICHTIG! Sehr gut!";

    } else {

        display.className = "display wrong";
        feedback.className = "feedback bad";

        feedback.textContent =
            "✗ Falsch! Richtig ist: " + correctAnswer;
    }

    document.getElementById("score").textContent = score;

    document.getElementById("submitButton").disabled = true;

    document.querySelectorAll(".key").forEach(button => {
        button.disabled = true;
    });

    setTimeout(() => {

        if (!playing) return;

        questionNumber++;

        if (questionNumber >= totalQuestions) {
            finishGame();
        } else {
            createQuestion();
        }

    }, 1200);
}

// ========================================
// SPIELENDE
// ========================================

function finishGame() {

    playing = false;

    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("endScreen").style.display = "block";

    document.getElementById("finalScore").textContent =
        score + " / " + totalQuestions;

    let message;

    if (score === 10) {
        message = "Fantastisch! Zehn von zehn richtig!";
    } else if (score >= 8) {
        message = "Super gemacht! Das war eine starke Runde.";
    } else if (score >= 6) {
        message = "Gut gemacht! Du bist auf einem guten Weg.";
    } else if (score >= 4) {
        message = "Da geht noch was! Versuch es gleich noch einmal.";
    } else {
        message = "Übung macht den Meister. Gib nicht auf!";
    }

    document.getElementById("finalText").textContent =
        message + "\n\n" +
        (currentMode === "arithmetic" ? "Grundrechenarten" : "Gleichungen") +
        " · Schwierigkeitsstufe " + currentLevel;
}

// PC-TASTATUR

document.addEventListener("keydown", function(event) {

    if (!playing) return;

    if (event.key >= "0" && event.key <= "9") {
        addNumber(event.key);
    }

    else if (event.key === "Backspace") {
        deleteNumber();
    }

    else if (event.key === "Escape") {
        clearAnswer();
    }

    else if (event.key === "Enter") {
        checkAnswer();
    }
});

</script>
