<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a211b">
<title>Würfelbecher</title>
<script src="../stil.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100dvh;padding:max(16px,min(6vh,54px)) 15px 24px;
  display:flex;justify-content:center;align-items:flex-start;
  background:radial-gradient(circle 900px at 50% -6%,#1d4b3e 0%,#123329 46%,#0a211b 100%) fixed;
  color:#efe6d2;font-family:var(--tg-schrift);
  -webkit-tap-highlight-color:transparent}
.game{width:min(100%,700px);display:grid;gap:12px}
.area,.controls,.result,.history{
  background:#0a211b;border:1px solid #184536;border-radius:15px;padding:15px
}
.label{text-align:center;color:#a9c3b6;font-size:12px;letter-spacing:2px;margin-bottom:12px}

/* ------------------------------------------------------------- Würfel */
.cup{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  gap:clamp(6px,1.5vw,14px);padding-top:10px
}
.die{
  position:relative;width:100%;max-width:84px;aspect-ratio:1;margin:0 auto;padding:0;
  background:linear-gradient(145deg,#f6edda,#efe6d2);
  border:2px solid #ffffff;border-radius:14%;
  box-shadow:0 3px 8px #00000066,inset 0 0 6px #a9c3b6;
  cursor:pointer;font:inherit;touch-action:manipulation;
  transition:transform .12s,box-shadow .15s,border-color .15s
}
.die:hover{transform:translateY(-2px)}
.die:active{transform:translateY(1px)}
.die:focus-visible{outline:3px solid #e8cd8e;outline-offset:2px}

/* Jedes Auge wird absolut positioniert */
.pip{position:absolute;width:18%;height:18%;transform:translate(-50%,-50%)}
.pip::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:#184536;box-shadow:inset 0 0 4px #a8873f;opacity:0
}
.pip.on::after{opacity:1}

/* Drei Spalten und drei Reihen */
.pip:nth-child(1){left:25%;top:25%}
.pip:nth-child(2){left:50%;top:25%}
.pip:nth-child(3){left:75%;top:25%}
.pip:nth-child(4){left:25%;top:50%}
.pip:nth-child(5){left:50%;top:50%}
.pip:nth-child(6){left:75%;top:50%}
.pip:nth-child(7){left:25%;top:75%}
.pip:nth-child(8){left:50%;top:75%}
.pip:nth-child(9){left:75%;top:75%}

/* Festgehalten: goldener Rahmen, angehoben, kleines Schild */
.die.held{
  border-color:#e8cd8e;
  box-shadow:0 0 0 3px #e8cd8e2e,0 7px 15px #00000066,inset 0 0 8px #e8cd8e33;
  transform:translateY(-3px)
}
.die.held::after{
  content:"HALT";position:absolute;left:50%;top:-11px;transform:translateX(-50%);
  background:#e8cd8e;color:#0b241d;font:700 8px/1 var(--tg-schrift);
  letter-spacing:.1em;padding:3px 6px;border-radius:999px;
  box-shadow:0 2px 6px #00000066;pointer-events:none
}

/* Rollen: drehen und dabei die Augen wechseln (macht das Skript) */
@keyframes wirbeln{
  0%{transform:rotate(0deg) scale(1)}
  50%{transform:rotate(180deg) scale(.93)}
  100%{transform:rotate(360deg) scale(1)}
}
.die.rolling{animation:wirbeln .38s linear infinite;cursor:default}
@media(prefers-reduced-motion:reduce){
  .die{transition:none}
  .die.rolling{animation:none}
}

/* Zwei Zeilen Platz, damit die Seite beim Wurf nicht springt */
.hint{min-height:34px;margin:12px 0 0;text-align:center;color:#a9c3b6;font-size:12.5px;line-height:1.35}
.hint.warnung{color:#e8b9a4}

/* ----------------------------------------------------------- Bedienung */
.status{text-align:center;color:#a9c3b6;font-size:13px;letter-spacing:.06em;margin-bottom:11px}
.status b{color:#e8cd8e;font-size:15px}
.roll-btn{
  width:100%;padding:15px;
  background:#184536;border:1px solid #e8cd8e;
  border-radius:10px;color:#e8cd8e;font-family:inherit;font-size:19px;
  font-weight:bold;letter-spacing:3px;cursor:pointer
}
.roll-btn:hover:not(:disabled){background:#1d4b3e}
.roll-btn:disabled{opacity:.55;cursor:default}
.neben{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.knopf{
  min-height:44px;padding:11px 8px;background:#0f2b23;border:1px solid #d9bc7c66;
  color:#e8cd8e;border-radius:9px;font-family:inherit;font-size:12px;
  letter-spacing:.08em;cursor:pointer
}
.knopf:hover:not(:disabled){background:#184536}
.knopf:disabled{opacity:.45;cursor:default}

/* --------------------------------------------------------- Ergebnis */
.total{text-align:center;color:#d9bc7c;font-size:44px;font-weight:bold}
.history-list{display:grid;gap:6px;max-height:150px;overflow:auto}
.entry{display:flex;justify-content:space-between;gap:10px;background:#0f2b23;padding:8px;border-radius:7px;font-size:13px}
.values{color:#e8cd8e;font-weight:bold}
.sum{color:#d9bc7c;font-weight:bold;white-space:nowrap}
.clear{
  display:block;margin:auto;background:none;color:#a9c3b6;
  border:1px solid #2c5a49;border-radius:8px;padding:9px 16px;
  font-family:inherit;cursor:pointer
}
.clear:hover{background:#0f2b23}

@media(max-width:430px){
  body{padding:10px}
  .area,.controls,.result,.history{padding:12px}
  .cup{gap:6px}
  .roll-btn{padding:13px;font-size:17px;letter-spacing:2px}
  .total{font-size:36px}
  .die.held::after{font-size:7px;padding:2px 4px;top:-10px}
}
@media(max-height:650px) and (min-width:600px){
  body{align-items:flex-start;padding:10px}
  .game{gap:8px}
  .area,.controls,.result,.history{padding:9px}
  .die{max-width:64px}
  .roll-btn{padding:10px}
  .total{font-size:32px}
}
/* ---- Zentraler Grafikstil: Mädchen (Candy Pop) und Buben ------------------
   Getauscht werden nur Flächen, Rahmen und Knöpfe. Die Würfel behalten ihre
   hellen Flächen und dunklen Augen, damit jeder Wert sofort erkennbar bleibt. */
body[data-stil="maedchen"]{background:radial-gradient(circle 900px at 50% -6%,#ffd9ec 0%,#f39bd1 46%,#a86bd8 100%) fixed;color:#3a1030}
body[data-stil="maedchen"] .area,body[data-stil="maedchen"] .controls,body[data-stil="maedchen"] .result,body[data-stil="maedchen"] .history{background:#fff8fd;border-color:#f0a9d3}
body[data-stil="maedchen"] .label,body[data-stil="maedchen"] .status,body[data-stil="maedchen"] .hint{color:#6b3a5e}
body[data-stil="maedchen"] .status b,body[data-stil="maedchen"] .values{color:#a8326e}
body[data-stil="maedchen"] .total{color:#8a4fff}
body[data-stil="maedchen"] .die{border-color:#fff;box-shadow:0 4px 10px #7a1f5233,inset 0 0 6px #ffc2e0}
body[data-stil="maedchen"] .pip::after{background:#5c2350;box-shadow:none}
body[data-stil="maedchen"] .die.held{border-color:#8a4fff;box-shadow:0 0 0 3px #8a4fff2e,0 7px 15px #7a1f5244,inset 0 0 8px #8a4fff33}
body[data-stil="maedchen"] .die.held::after{background:#8a4fff;color:#fff}
body[data-stil="maedchen"] .roll-btn{background:linear-gradient(#ff8fc4,#f0509f);border-color:#f0509f;color:#3a0f24}
body[data-stil="maedchen"] .roll-btn:hover:not(:disabled){background:linear-gradient(#ffa3cf,#f260a9)}
body[data-stil="maedchen"] .knopf{background:#fff;border-color:#f0a9d3;color:#a8326e}
body[data-stil="maedchen"] .knopf:hover:not(:disabled){background:#ffe4f2}
body[data-stil="maedchen"] .entry{background:#ffeef7}
body[data-stil="maedchen"] .sum{color:#8a4fff}
body[data-stil="maedchen"] .clear{color:#6b3a5e;border-color:#f0a9d3}
body[data-stil="maedchen"] .clear:hover{background:#ffeef7}
body[data-stil="maedchen"] .hint.warnung{color:#a8326e}

body[data-stil="buben"]{background:radial-gradient(circle 900px at 50% -6%,#1a1c20 0%,#141312 46%,#060708 100%) fixed;color:#e4e7ea}
body[data-stil="buben"] .area,body[data-stil="buben"] .controls,body[data-stil="buben"] .result,body[data-stil="buben"] .history{background:#14161a;border-color:#2b3038}
body[data-stil="buben"] .label,body[data-stil="buben"] .status,body[data-stil="buben"] .hint{color:#8b929b}
body[data-stil="buben"] .status b,body[data-stil="buben"] .values{color:#e0242f}
body[data-stil="buben"] .total{color:#b8c0c8}
body[data-stil="buben"] .die{background:linear-gradient(145deg,#f3f2f1,#d9d6d4);border-color:#ffffff;box-shadow:0 4px 10px #00000088,inset 0 0 6px #8b929b}
body[data-stil="buben"] .pip::after{background:#1b1e23;box-shadow:none}
body[data-stil="buben"] .die.held{border-color:#e0242f;box-shadow:0 0 0 3px #e0242f2e,0 7px 15px #00000066,inset 0 0 8px #e0242f33}
body[data-stil="buben"] .die.held::after{background:#e0242f;color:#150a0c}
body[data-stil="buben"] .roll-btn{background:linear-gradient(#e0242f,#b31722);border-color:#e0242f;color:#ffffff}
body[data-stil="buben"] .roll-btn:hover:not(:disabled){background:linear-gradient(#ff6a73,#d81c2a)}
body[data-stil="buben"] .knopf{background:#191c21;border-color:#33383f;color:#e0242f}
body[data-stil="buben"] .knopf:hover:not(:disabled){background:#1a1c20}
body[data-stil="buben"] .entry{background:#191c21}
body[data-stil="buben"] .sum{color:#b8c0c8}
body[data-stil="buben"] .clear{color:#8b929b;border-color:#33383f}
body[data-stil="buben"] .clear:hover{background:#191c21}
body[data-stil="buben"] .hint.warnung{color:#ffb4a8}

/* ---- Red Reactor: Titel in Silber, Rot bleibt der LED-Akzent ------------- */
body[data-stil="buben"] .titel,
body[data-stil="buben"] .titelleiste .titel,
body[data-stil="buben"] .fenster .titel,
body[data-stil="buben"] h2,
body[data-stil="buben"] .meldung h2,
body[data-stil="buben"] #regeln summary {
  color: #e6e9ec;
}
body[data-stil="buben"] .titel,
body[data-stil="buben"] .titelleiste .titel {
  text-shadow: none;
}

/* Red Reactor: Knopfaufschrift in Silber, Rot nur an Kante und Aktiv-Zustand */
body[data-stil="buben"] button,
body[data-stil="buben"] .menueleiste button,
body[data-stil="buben"] .knopf,
body[data-stil="buben"] select {
  color: #e6e9ec;
}
body[data-stil="buben"] button:hover:not(:disabled),
body[data-stil="buben"] .menueleiste button:hover,
body[data-stil="buben"] .knopf:hover:not(:disabled) {
  color: #ffffff;
}
body[data-stil="buben"] button.aktiv,
body[data-stil="buben"] .menueleiste button.aktiv,
body[data-stil="buben"] .knopf.aktiv,
body[data-stil="buben"] button.haupt,
body[data-stil="buben"] .aktion.haupt,
body[data-stil="buben"] .meldung button {
  color: #ffffff;
  text-shadow: none;
}

/* Lesbarkeit 3: geprüft 21.11.2026 */
html[data-stil="maedchen"] #clear{color:#2a0f22}

/* Lesbarkeit 4: geprüft 21.11.2026 */
html[data-stil="buben"] #holdCount{color:#ff7b84}
</style>
<link rel="stylesheet" href="../schrift.css">
</head>
<body>
<main class="game">
  <section class="area">
    <div class="cup" id="cup" aria-label="Sechs Würfel"></div>
    <p class="hint" id="hint" role="status">Würfel antippen, um ihn festzuhalten.</p>
  </section>

  <section class="controls">
    <div class="status">Festgehalten <b id="holdCount">0</b> von <span id="anzahl">6</span></div>
    <button class="roll-btn" id="roll">🎲 WÜRFELN</button>
    <div class="neben">
      <button class="knopf" id="release">ALLE FREIGEBEN</button>
      <button class="knopf" id="reset">NEU WÜRFELN</button>
    </div>
  </section>

  <section class="result">
    <div class="label">GESAMTSUMME</div>
    <div class="total" id="total">–</div>
  </section>

  <section class="history">
    <div class="label">LETZTE WÜRFE</div>
    <div class="history-list" id="history">
      <div style="text-align:center;color:#6f8f80">Noch keine Würfe</div>
    </div>
  </section>

  <button class="clear" id="clear">VERLAUF LÖSCHEN</button>
</main>

<script>
(() => {
  "use strict";
  const ANZAHL = 6;
  const WURFZEIT = 900;
  const cup = document.getElementById("cup");
  const rollButton = document.getElementById("roll");
  const releaseButton = document.getElementById("release");
  const resetButton = document.getElementById("reset");
  const totalElement = document.getElementById("total");
  const verlaufListe = document.getElementById("history");
  const holdCount = document.getElementById("holdCount");
  const anzahlFeld = document.getElementById("anzahl");
  const hint = document.getElementById("hint");

  const patterns = {
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8]
  };

  let dice = [];          // {value, held, el}
  let verlauf = [];
  let busy = false;

  function randomDie() {
    return Math.floor(Math.random() * 6) + 1;
  }

  function meldung(text, warnung) {
    hint.textContent = text;
    hint.classList.toggle("warnung", !!warnung);
  }

  /* ---------------------------------------------------------- Würfelbau */
  function createDie(index) {
    const die = document.createElement("button");
    die.type = "button";
    die.className = "die";
    die.dataset.index = String(index);
    for (let i = 0; i < 9; i++) {
      const pip = document.createElement("span");
      pip.className = "pip";
      die.appendChild(pip);
    }
    die.addEventListener("click", () => halteUmschalten(index));
    return die;
  }

  function setFace(die, value) {
    const pips = die.children;
    for (let i = 0; i < 9; i++) {
      pips[i].classList.toggle("on", patterns[value].includes(i));
    }
    die.dataset.value = String(value);
  }

  function beschrifte() {
    dice.forEach((d, i) => {
      d.el.classList.toggle("held", d.held);
      d.el.setAttribute("aria-pressed", d.held ? "true" : "false");
      d.el.setAttribute("aria-label",
        "Würfel " + (i + 1) + ": " + d.value + (d.held ? ", festgehalten" : ", frei"));
      d.el.title = d.held ? "Festgehalten – Klick gibt den Würfel frei" : "Klick hält den Würfel fest";
    });
    const gehalten = dice.filter(d => d.held).length;
    holdCount.textContent = String(gehalten);
    releaseButton.disabled = busy || gehalten === 0;
  }

  function summe() {
    return dice.reduce((a, d) => a + d.value, 0);
  }

  function aufbauen() {
    cup.innerHTML = "";
    dice = [];
    for (let i = 0; i < ANZAHL; i++) {
      const el = createDie(i);
      const d = { value: randomDie(), held: false, el };
      setFace(el, d.value);
      dice.push(d);
      cup.appendChild(el);
    }
    beschrifte();
    totalElement.textContent = "–";
  }

  /* --------------------------------------------------------- Festhalten */
  function halteUmschalten(index) {
    if (busy) return;
    const d = dice[index];
    if (!d) return;
    d.held = !d.held;
    beschrifte();
    if (d.held) {
      meldung(dice.every(x => x.held)
        ? "Alle sechs Würfel sind festgehalten – „ALLE FREIGEBEN“ löst sie wieder."
        : "Würfel " + (index + 1) + " bleibt beim nächsten Wurf liegen.");
    } else {
      meldung("Würfel " + (index + 1) + " wird wieder mitgewürfelt.");
    }
  }

  function alleFreigeben() {
    if (busy) return;
    const hatteGehalten = dice.some(d => d.held);
    dice.forEach(d => { d.held = false; });
    beschrifte();
    meldung(hatteGehalten ? "Alle Würfel sind wieder frei." : "Es war kein Würfel festgehalten.");
  }

  /* ------------------------------------------------------------- Würfeln */
  async function wurf() {
    if (busy) return;
    const frei = dice.filter(d => !d.held);
    if (frei.length === 0) {
      meldung("Alle sechs Würfel sind festgehalten – erst welche freigeben.", true);
      return;
    }
    busy = true;
    rollButton.disabled = true;
    releaseButton.disabled = true;
    resetButton.disabled = true;
    rollButton.textContent = "WÜRFEL ROLLEN …";
    totalElement.textContent = "…";

    const ziele = frei.map(d => d.el);
    ziele.forEach(el => el.classList.add("rolling"));
    const takt = setInterval(() => {
      ziele.forEach(el => setFace(el, randomDie()));
    }, 90);

    await new Promise(resolve => setTimeout(resolve, WURFZEIT));
    clearInterval(takt);

    frei.forEach(d => {
      d.value = randomDie();
      setFace(d.el, d.value);
      d.el.classList.remove("rolling");
    });

    const gehalten = ANZAHL - frei.length;
    const gesamt = summe();

    busy = false;
    rollButton.disabled = false;
    resetButton.disabled = false;
    rollButton.textContent = "🎲 NOCHMAL WÜRFELN";
    beschrifte();
    totalElement.textContent = String(gesamt);

    verlauf.unshift({ values: dice.map(d => d.value), sum: gesamt, gehalten: gehalten });
    renderHistory();

    meldung(gehalten
      ? frei.length + " Würfel neu gewürfelt – " + gehalten + " festgehalten."
      : "Alle sechs Würfel neu gewürfelt.");
  }

  /* Alle Markierungen löschen und alle sechs würfeln. */
  async function allesNeu() {
    if (busy) return;
    dice.forEach(d => { d.held = false; });
    beschrifte();
    await wurf();
  }

  /* ------------------------------------------------------------- Verlauf */
  function renderHistory() {
    verlaufListe.innerHTML = "";
    if (verlauf.length === 0) {
      verlaufListe.textContent = "Noch keine Würfe";
      return;
    }
    verlauf.slice(0, 10).forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "entry";

      const number = document.createElement("span");
      number.textContent = "Wurf " + (verlauf.length - index);

      const values = document.createElement("span");
      values.className = "values";
      values.textContent = item.values.join(" · ");

      const sum = document.createElement("span");
      sum.className = "sum";
      sum.textContent = "Σ " + item.sum;

      row.append(number, values, sum);
      verlaufListe.appendChild(row);
    });
  }

  /* -------------------------------------------------------------- Start */
  rollButton.addEventListener("click", wurf);
  releaseButton.addEventListener("click", alleFreigeben);
  resetButton.addEventListener("click", allesNeu);
  document.getElementById("clear").addEventListener("click", () => {
    if (busy) return;
    verlauf = [];
    renderHistory();
    meldung("Verlauf gelöscht – die Würfel bleiben liegen.");
  });

  // Grafikstil: zentral aus /spiele/stil.js, nur Flächen und Rahmen färben um.
  function stilAnwenden() {
    const s = TGStil.hole();
    document.body.dataset.stil = s;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = s === "maedchen" ? "#f39bd1" : s === "buben" ? "#070c12" : "#0a211b";
  }
  stilAnwenden();
  TGStil.beiWechsel(stilAnwenden);

  anzahlFeld.textContent = String(ANZAHL);
  aufbauen();
  renderHistory();
})();
</script>
</body>
</html>
