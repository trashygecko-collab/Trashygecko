        starteExtraTakt();
        /* Wie außerhalb der Pause: bewegt wird nur, solange eine Richtung
           gehalten wird – Fortsetzen selbst hält keine. */
        if (haeltRichtung()) starteMove();
        if (!animationFrame) animationFrame = requestAnimationFrame(animate);
      } else if (state === 'lost' && respawnAusstehend) {
        planeRespawn();
      }
      zeigePause();
      meldeWeiter();
    }

    /* Ereignisse nur bei einer echten Zustandsänderung (die Aufrufer prüfen
       das vorher); Details sind Kopien. */
    function meldePause() {
      window.dispatchEvent(new CustomEvent('superpimmelchen:pausiert', { detail: { tick } }));
    }

    function meldeWeiter() {
      window.dispatchEvent(new CustomEvent('superpimmelchen:weiter', { detail: { tick } }));
    }

    // ---- Spielablauf ----
    /* Einziger Weg in eine Partie – Startknopf, Tastatur und Schnittstelle
       laufen hier zusammen, damit nichts doppelt initialisiert wird. */
    function starteSpiel(konfiguration) {
      if (state === 'playing' || state === 'lost') {
        return { gestartet: false, stufe, level: stage + 1 };
      }
      const ziel = konfiguration || {};
      if (ziel.stil) setzeStil(ziel.stil);
      if (STUFEN[ziel.stufe]) stufe = ziel.stufe;
      try { localStorage.setItem(STUFE_SCHLUESSEL, stufe); } catch (_) { /* ohne Speicher egal */ }
      if (Number.isInteger(ziel.level)) {
        selectedStartLevel = Math.min(Math.max(ziel.level - 1, 0), LEVEL_COUNT - 1);
      }
      if (ui.levelSelect) ui.levelSelect.value = String(selectedStartLevel);
      zeigeStufe();
      start();
      return { gestartet: true, stufe, level: stage + 1 };
    }

    /* Alles anhalten, was tickt – für Rückkehr und Neustart. */
    function stoppeAlles() {
      stopMove();
      clearInterval(clockTimer); clockTimer = null;
      stoppeExtraTakt();
      stoppeExtraEntferner();
      respawnAusstehend = false;
      clearProjectile();
      clearTimeout(speedTimer); speedTimer = null;
      clearTimeout(sunEffectTimer); sunEffectTimer = null;
      clearTimeout(respawnTimer); respawnTimer = null;
      if (animationFrame) { cancelAnimationFrame(animationFrame); animationFrame = 0; }
    }

    /* Zurück zum Startbildschirm: Timer aus, Level neu aufbauen, Werte der
       letzten Runde stehen im Startblatt. Highscore und Einstellungen bleiben. */
    function zurueckZumStart() {
      isPaused = false;
      stoppeAlles();
      state = 'title';
      stage = selectedStartLevel;
      resetStage();
      zeigePause();
    }

    function start() {
      if (state === 'playing' || state === 'lost') return;
      highscoreForThisRunSaved = false;
      score = 0;
      lives = 3;
      pucks = 0;
      fruitCount = 0;
      moveDelay = 200;
      tick = 0;
      if (state === 'title' || state === 'gameover' || state === 'won') stage = selectedStartLevel;
      isPaused = false;
      state = 'playing';
      resetStage();
      clearInterval(clockTimer); clockTimer = null;
      clearTimeout(respawnTimer); respawnTimer = null;
      zeigePause();
      startClock();
      starteExtraTakt();
      canvas.focus();
      passeBuehne();
    }

    function stopMove() {
      clearInterval(moveTimer);
      moveTimer = null;
    }

    /* Bewegung läuft nur mit Takt. Jede Drehung setzt ihn neu auf, damit die
       neue Richtung sofort greift; ohne gehaltene Richtung ruft ihn niemand. */
    function starteMove() {
      stopMove();
      moveTimer = setInterval(step, moveDelay);
    }

    function setDirection(d) {
      if (state === 'title' || state === 'gameover' || state === 'won') {
        starteSpiel({});
      }
      if (state !== 'playing' || isPaused) return;
      if (snake.length > 1 && d.x === -dir.x && d.y === -dir.y) return;
      dir = d;
      facing = d;
      if (step()) starteMove();
      if (!animationFrame) animationFrame = requestAnimationFrame(animate);
    }

    /* Schnittstelle: genau ein Schritt. Geprüft wird wie bei Tastatur und
       Steuerkreuz (im Spiel, nicht in der Pause, keine Kehrtwende), aber ohne
       Takt: Ein Aufruf hält keine Richtung, also läuft danach nichts weiter. */
    function schrittFuerRichtung(d) {
      if (state !== 'playing' || isPaused) return false;
      if (snake.length > 1 && d.x === -dir.x && d.y === -dir.y) return false;
      dir = d;
      facing = d;
      if (!animationFrame) animationFrame = requestAnimationFrame(animate);
      return step();
    }

    function activateSpeed() {
      moveDelay = 120;
      clearTimeout(speedTimer);
      if (moveTimer) starteMove();
      speedTimer = setTimeout(() => {
        moveDelay = 200;
        if (moveTimer) starteMove();
      }, 7000);
    }

    function collectExtra(item) {
      const i = extras.indexOf(item);
      if (i >= 0) extras.splice(i, 1);
      const type = item.type;
      switch (type) {
        case 'puck': pucks += 2; break;
        case 'uhr': seconds += 40; break;
        case 'eiswuerfel': snake = snake.slice(0, Math.max(1, Math.floor(snake.length / 2))); break;
        case 'frucht': {
          const bonus = [100, 200, 400, 800];
          score += bonus[Math.min(fruitCount++, bonus.length - 1)];
          break;
        }
        case 'sonne-klein':
          clearTimeout(sunEffectTimer);
          foodRadius = 2.2; growthPerFood = 0; foodScoreMultiplier = 1;
          sunEffectTimer = setTimeout(() => {
            foodRadius = 3.5; growthPerFood = 1; foodScoreMultiplier = 1;
            sunEffectTimer = null;
          }, 10000);
          break;
        case 'sonne-gross':
          clearTimeout(sunEffectTimer);
          foodRadius = 5.5; growthPerFood = 1; foodScoreMultiplier = 2;
          sunEffectTimer = setTimeout(() => {
            foodRadius = 3.5; growthPerFood = 1; foodScoreMultiplier = 1;
            sunEffectTimer = null;
          }, 10000);
          break;
        case 'elixier-kurz': snake = snake.slice(0, Math.max(1, snake.length - 5)); break;
        case 'elixier-leer': snake = snake.slice(0, 1); break;
        case 'totenschaedel': loseLife('SCHÄDEL!'); return true;
        case 'blitz': advanceLevel(); return true;
        case 'herz': lives++; break;
        case 'powerdose': activateSpeed(); break;
      }
      updateHud();
      return false;
    }

    function step() {
      if (state !== 'playing' || isPaused) return false;
      const head = snake[0];
      const next = { x: head.x + dir.x, y: head.y + dir.y };
      const nextLayer = layerForEntry(next.x, next.y, dir.x, dir.y);
      if (nextLayer === null) { stopMove(); return false; }
      next.layer = nextLayer;

      const nextKey = key(next.x, next.y);
      const eatingPellet = pellets.has(nextKey);
      const willGrow = eatingPellet && growthPerFood > 0;
      const tailIndex = snake.length - 1;
      const hitBody = snake.some((part, i) =>
        i > 0 &&
        !(i === tailIndex && !willGrow) &&
        part.x === next.x && part.y === next.y &&
        (part.layer || 0) === nextLayer
      );
      if (hitBody) { loseLife('KÖRPERKOLLISION'); return false; }

      tick++;
      const before = snake.map(s => ({ ...s }));
      snake.unshift(next);

      if (eatingPellet) {
        pellets.delete(nextKey);
        score += 10 * foodScoreMultiplier;
        if (pellets.size === 0) { advanceLevel(); return false; }
        updateHud();
      }
      if (!willGrow) snake.pop();

      const getroffen = extraBei(next.x, next.y);
      if (getroffen && collectExtra(getroffen)) return false;

      visualFrom = before;
      moveAnimStart = performance.now();
      if (!animationFrame) animationFrame = requestAnimationFrame(animate);
      draw();
      return true;
    }

    function animate() {
      animationFrame = 0;
      if (isPaused || state !== 'playing') return;
      draw();
      const progress = (performance.now() - moveAnimStart) / moveDelay;
      if (moveTimer || projectile || progress < 1) animationFrame = requestAnimationFrame(animate);
    }

    function fire() {
      if (state === 'title' || state === 'gameover' || state === 'won') {
        starteSpiel({});
        return;
      }
      if (state !== 'playing' || isPaused || pucks < 1 || projectile) return;
      const head = snake[0];
      const x = head.x + facing.x;
      const y = head.y + facing.y;
      if (blocked(x, y)) return;
      pucks--;
      projectile = { x, y, dx: facing.x, dy: facing.y };

      const getroffen = extraBei(x, y);
      if (getroffen && collectExtra(getroffen)) { updateHud(); return; }
      if (pellets.delete(key(x, y))) {
        score += 10;
        if (pellets.size === 0) { advanceLevel(); updateHud(); return; }
      }
      updateHud();
      draw();
      projectileTimer = setInterval(moveProjectile, 90);
      if (!animationFrame) animationFrame = requestAnimationFrame(animate);
    }

    function moveProjectile() {
      if (isPaused) return;
      if (!projectile || state !== 'playing') { clearProjectile(); return; }
      const nx = projectile.x + projectile.dx;
      const ny = projectile.y + projectile.dy;
      if (blocked(nx, ny)) { clearProjectile(); draw(); return; }
      projectile.x = nx;
      projectile.y = ny;
      const getroffen = extraBei(nx, ny);
      if (getroffen && collectExtra(getroffen)) { updateHud(); return; }
      if (pellets.delete(key(nx, ny))) {
        score += 10;
        if (pellets.size === 0) { advanceLevel(); return; }
      }
      updateHud();
      draw();
    }

    /* Spielende melden, bevor die Highscore-Dialoge den Faden anhalten. */
    function meldeEnde(grund) {
      window.dispatchEvent(new CustomEvent('superpimmelchen:ende', {
        detail: {
          grund,
          punkte: score,
          level: Math.min(stage + 1, LEVEL_COUNT),
          levelAnzahl: LEVEL_COUNT,
          tick
        }
      }));
    }

    function advanceLevel() {
      stopMove();
      clearProjectile();
      stage++;
      if (stage >= LEVEL_COUNT) {
        state = 'won';
        clearInterval(clockTimer); clockTimer = null;
        stoppeExtraTakt();
        clearTimeout(respawnTimer); respawnTimer = null;
        zeigePause();
        meldeEnde('gewonnen');
        recordHighscore();
        updateHud();
        draw(`ALLE ${LEVEL_COUNT} LEVEL GESCHAFFT!`);
        return;
      }
      resetStage();
    }

    function loseLife(message) {
      stopMove();
      clearTimeout(speedTimer);
      speedTimer = null;
      moveDelay = 200;
      clearProjectile();
      state = 'lost';
      lives--;
      updateHud();
      draw(message);
      planeRespawn();
    }

    /* Respawn nach einem verlorenen Leben – läuft nicht unter einer Pause. */
    function planeRespawn() {
      clearTimeout(respawnTimer);
      respawnAusstehend = false;
      respawnTimer = setTimeout(respawnNachTod, 1200);
    }

    function respawnNachTod() {
      respawnTimer = null;
      if (state !== 'lost') return;
      if (lives <= 0) {
        state = 'gameover';
        clearInterval(clockTimer); clockTimer = null;
        stoppeExtraTakt();
        zeigePause();
        meldeEnde('verloren');
        recordHighscore();
        draw('SPIEL VORBEI');
        return;
      }
      const spawn = findSpawn();
      snake = [{ ...spawn, layer: 0 }];
      pellets.delete(key(spawn.x, spawn.y));
      visualFrom = [];
      moveAnimStart = 0;
      dir = { x: 1, y: 0 };
      facing = { x: 1, y: 0 };
      seconds = 120;
      state = 'playing';
      updateHud();
      draw();
    }

    // ---- Rendering ----
    function herz(x, y, groesse, farbe) {
      ctx.fillStyle = farbe;
      ctx.beginPath();
      ctx.moveTo(x, y + groesse);
      ctx.bezierCurveTo(x - groesse * 1.7, y - groesse * 0.2, x - groesse * 0.5, y - groesse * 1.6, x, y - groesse * 0.55);
      ctx.bezierCurveTo(x + groesse * 0.5, y - groesse * 1.6, x + groesse * 1.7, y - groesse * 0.2, x, y + groesse);
      ctx.fill();
    }

    function tile(x, y, p) {
      const px = x * T, py = y * T;
      const zufall = (x * 13 + y * 7) % 5;

      if (grid[y][x] === 1) {
        ctx.fillStyle = p.wall;
        ctx.fillRect(px, py, T, T);
        /* Fase: helle Oberkante, dunkle Unterkante – die Wand bekommt Tiefe. */
        ctx.fillStyle = p.wallTop;
        ctx.fillRect(px, py, T, 2);
        ctx.fillStyle = p.wallEdge;
        ctx.fillRect(px, py + T - 2, T, 2);
        ctx.strokeStyle = p.ink;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(px + 0.5, py + 0.5, T - 1, T - 1);

        if (p.muster === 'marmor') {
          /* Edel: eingelegte Goldlinien und ein kleiner Diamant. */
          ctx.fillStyle = p.trim;
          ctx.fillRect(px + 4, py + 4, T - 8, 1);
          ctx.fillRect(px + 4, py + T - 5, T - 8, 1);
          ctx.fillStyle = p.cream + 'cc';
          ctx.beginPath();
          ctx.moveTo(px + T / 2, py + T / 2 - 3);
          ctx.lineTo(px + T / 2 + 3, py + T / 2);
          ctx.lineTo(px + T / 2, py + T / 2 + 3);
          ctx.lineTo(px + T / 2 - 3, py + T / 2);
          ctx.closePath();
          ctx.fill();
        } else if (p.muster === 'herzen') {
          /* Mädchen: weiße Herzchen auf rosa Wand. */
          herz(px + T / 2, py + T / 2 + 1, T * 0.27, p.trim);
        } else if (p.muster === 'risse') {
          /* Buben: Risse und Blut, das die Wand hinabläuft. */
          ctx.strokeStyle = p.trim + '55';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(px + 4, py + 5);
          ctx.lineTo(px + 12, py + 12);
          ctx.lineTo(px + 8, py + 21);
          ctx.stroke();
          if (zufall % 3 === 0) {
            ctx.fillStyle = p.blut;
            const breite = 2 + (zufall % 2);
            ctx.fillRect(px + T / 2 - breite / 2, py + T - 9, breite, 7);
            ctx.beginPath();
            ctx.arc(px + T / 2, py + T - 9, breite, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          ctx.fillStyle = p.trim;
          ctx.fillRect(px + 2, py + 2, T - 4, 3);
          ctx.fillRect(px + 2, py + 2, 3, T - 4);
          ctx.fillStyle = p.cream + 'aa';
          ctx.fillRect(px + 4, py + 4, 2, 2);
        }
      } else {
        ctx.fillStyle = ((x + y) % 2 === 0) ? p.floor : p.floor2;
        ctx.fillRect(px, py, T, T);
        ctx.strokeStyle = p.ink + '20';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, py + 0.5, T - 1, T - 1);

        if (p.muster === 'marmor') {
          ctx.strokeStyle = p.ader + 'aa';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(px, py + 4 + (zufall * 3) % (T - 8));
          ctx.quadraticCurveTo(px + T * 0.5, py + (zufall * 7) % T, px + T, py + 4 + (zufall * 5) % (T - 8));
          ctx.stroke();
        } else if (p.muster === 'herzen') {
          if (zufall === 0) herz(px + T / 2, py + T / 2, 3.6, p.musterFarbe + 'aa');
          else if (zufall === 2) {
            ctx.fillStyle = p.musterFarbe + '88';
            ctx.beginPath();
            ctx.arc(px + T / 2, py + T / 2, 1.7, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (p.muster === 'risse') {
          if (zufall === 0) {
            ctx.strokeStyle = p.ader + 'cc';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(px + 3, py + T - 5);
            ctx.lineTo(px + T * 0.55, py + T * 0.4);
            ctx.lineTo(px + T - 4, py + 6);
            ctx.stroke();
          } else if (zufall === 3) {
            ctx.fillStyle = p.blut + 'aa';
            ctx.beginPath();
            ctx.ellipse(px + T * 0.6, py + T * 0.55, 3.6, 2.2, 0.5, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (zufall === 0) {
          ctx.fillStyle = p.cream + '50';
          ctx.beginPath();
          ctx.arc(px + T / 2, py + T / 2, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawBridgeTile(x, y, p, overlay = false) {
      const value = grid[y][x];
      if (value !== 4 && value !== 5) return;
      const axis = bridgeAxisAt(x, y);
      const vertical = axis === 'vertical';
      let first = axis === 'horizontal' ? x : y;
      let last = first;
      const isBridgeAt = n => {
        const bx = axis === 'horizontal' ? n : x;
        const by = axis === 'horizontal' ? y : n;
        if (bx < 0 || by < 0 || bx >= W || by >= H) return false;
        const v = grid[by][bx];
        if (v !== 4 && v !== 5) return false;
        return bridgeAxisAt(bx, by) === axis;
      };
      while (isBridgeAt(first - 1)) first--;
      while (isBridgeAt(last + 1)) last++;
      const span = Math.max(1, last - first + 1);
      const u0 = ((axis === 'horizontal' ? x : y) - first) / span;
      const u1 = u0 + 1 / span;
      const localX = u => -T / 2 + (u - u0) * span * T;
      const archY = u => {
        const n = Math.max(-1, Math.min(1, (u - 0.5) * 2));
        return T * (0.43 - 0.39 * Math.sqrt(Math.max(0, 1 - n * n)));
      };
      ctx.save();
      ctx.translate(x * T + T / 2, y * T + T / 2);
      if (vertical) ctx.rotate(Math.PI / 2);

      if (!overlay) {
        ctx.fillStyle = p.bruecke.schatten;
        ctx.fillRect(-T / 2, T * 0.02, T, T * 0.43);

        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.13);
        ctx.lineTo(T / 2, -T * 0.13);
        ctx.lineTo(T / 2, archY(u1));
        for (let i = 12; i >= 0; i--) {
          const u = u0 + (u1 - u0) * i / 12;
          ctx.lineTo(localX(u), archY(u));
        }
        ctx.closePath();
        const wall = ctx.createLinearGradient(0, -T * 0.13, 0, T * 0.44);
        wall.addColorStop(0, p.bruecke.deck);
        wall.addColorStop(0.55, p.bruecke.deckMitte);
        wall.addColorStop(1, p.bruecke.deckTief);
        ctx.fillStyle = wall;
        ctx.fill();

        ctx.save();
        ctx.clip();
        ctx.strokeStyle = p.bruecke.fuge;
        ctx.lineWidth = 1;
        for (let row = 0; row < 4; row++) {
          const yy = -T * 0.08 + row * T * 0.105;
          ctx.beginPath(); ctx.moveTo(-T / 2, yy); ctx.lineTo(T / 2, yy); ctx.stroke();
        }
        for (let xx = -T / 2 + 5; xx < T / 2; xx += 10) {
          ctx.beginPath(); ctx.moveTo(xx, -T * 0.13); ctx.lineTo(xx, T * 0.38); ctx.stroke();
        }
        ctx.restore();

        ctx.strokeStyle = p.bruecke.rand;
        ctx.lineWidth = Math.max(4, T * 0.10);
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) {
          const u = u0 + (u1 - u0) * i / 12;
          const xx = localX(u), yy = archY(u);
          if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.stroke();

        ctx.strokeStyle = p.bruecke.gelb;
        ctx.lineWidth = Math.max(2, T * 0.045);
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) {
          const u = u0 + (u1 - u0) * i / 12;
          const xx = localX(u), yy = archY(u) - T * 0.025;
          if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.stroke();

        ctx.fillStyle = p.bruecke.dunkel;
        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.15);
        ctx.quadraticCurveTo(0, -T * 0.43, T / 2, -T * 0.15);
        ctx.lineTo(T / 2, -T * 0.055);
        ctx.quadraticCurveTo(0, -T * 0.31, -T / 2, -T * 0.055);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = p.bruecke.gelb;
        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.20);
        ctx.quadraticCurveTo(0, -T * 0.47, T / 2, -T * 0.20);
        ctx.lineTo(T / 2, -T * 0.13);
        ctx.quadraticCurveTo(0, -T * 0.37, -T / 2, -T * 0.13);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = p.bruecke.dunkel;
        ctx.lineWidth = 1.2;
        for (let i = 1; i < 6; i++) {
          const u = i / 6;
          const xx = -T / 2 + u * T;
          const rise = Math.sqrt(Math.max(0, 1 - Math.pow((u - 0.5) * 2, 2)));
          const yy = -T * (0.20 + 0.27 * rise);
          ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx, yy + T * 0.07); ctx.stroke();
        }

        ctx.strokeStyle = p.bruecke.gelb;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.23);
        ctx.quadraticCurveTo(0, -T * 0.51, T / 2, -T * 0.23);
        ctx.stroke();

        ctx.strokeStyle = p.bruecke.dunkel;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.12);
        ctx.quadraticCurveTo(0, -T * 0.40, T / 2, -T * 0.12);
        ctx.stroke();
      } else {
        ctx.strokeStyle = p.bruecke.rand;
        ctx.lineWidth = Math.max(4, T * 0.10);
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) {
          const u = u0 + (u1 - u0) * i / 12;
          const xx = localX(u), yy = archY(u);
          if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBridges(p) {
      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++)
          drawBridgeTile(x, y, p);
    }

    function drawFood(x, y, p) {
      const px = x * T + T / 2;
      const py = y * T + T / 2;
      /* Jede Welt hat ihr eigenes Leuchten hinter dem Futter. */
      const glanz = ctx.createRadialGradient(px, py, 1, px, py, T * 0.55);
      glanz.addColorStop(0, p.glueh);
      glanz.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glanz;
      ctx.fillRect(px - T / 2, py - T / 2, T, T);
      let imageKey = 'food';
      let size = T;
      if (foodRadius === 2.2) { imageKey = 'foodKlein'; size = T * 0.65; }
      else if (foodRadius === 5.5) { imageKey = 'foodGross'; size = T * 1.2; }
      if (!drawAsset(imageKey, px, py, size)) {
        ctx.fillStyle = p.dot;
        ctx.beginPath();
        ctx.arc(px, py, foodRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = p.ink;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function drawExtraItem(x, y, type) {
      const p = stilPalette();
      const px = x * T + T / 2;
      const py = y * T + T / 2;
      const schein = ctx.createRadialGradient(px, py, 1, px, py, T * 0.6);
      schein.addColorStop(0, p.glueh);
      schein.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = schein;
      ctx.fillRect(px - T / 2, py - T / 2, T, T);
      if (drawAsset(type, px, py, T * 0.9)) return;
      const icons = {
        uhr: '🕒', eiswuerfel: '🧊', frucht: '🍑', totenschaedel: '💀',
        blitz: '⚡', herz: '❤️', powerdose: '🥤', puck: '🟡',
        'elixier-kurz': '🧪', 'elixier-leer': '🧪',
        'sonne-gross': '☀️', 'sonne-klein': '🌤️'
      };
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(icons[type] || '⭐', px, py);
    }

    function drawHead(s, dx, dy) {
      const p = stilPalette();
      const x = s.x * T + T / 2;
      const y = s.y * T + T / 2;
      const angle = Math.atan2(dy, dx) + Math.PI / 2;
      if (drawAsset('snakeHead', x, y, T, angle)) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.lineWidth = 2;
      ctx.strokeStyle = p.kopfRand;
      const bodyGrad = ctx.createLinearGradient(0, -9, 0, 9);
      bodyGrad.addColorStop(0, p.kopf);
      bodyGrad.addColorStop(0.5, p.kopf);
      bodyGrad.addColorStop(1, p.kopfRand);
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, 10, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = p.cream + '80';
      ctx.beginPath();
      ctx.ellipse(-2, -4, 4, 1.5, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = p.cream;
      ctx.beginPath();
      ctx.arc(3, -3, 2.8, 0, Math.PI * 2);
      ctx.arc(6, -1.5, 2.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = p.ink;
      ctx.beginPath();
      ctx.arc(4, -3, 1.2, 0, Math.PI * 2);
      ctx.arc(7, -1.5, 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawWormBody(points) {
      const p = stilPalette();
      if (!points.length) return;
      if (points.length > 1) {
        const centers = points.map(p => ({ x: p.x * T + T / 2, y: p.y * T + T / 2 }));
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(centers[0].x, centers[0].y);
        if (centers.length === 2) {
          ctx.lineTo(centers[1].x, centers[1].y);
        } else {
          for (let i = 1; i < centers.length - 1; i++) {
            const midX = (centers[i].x + centers[i + 1].x) / 2;
            const midY = (centers[i].y + centers[i + 1].y) / 2;
            ctx.quadraticCurveTo(centers[i].x, centers[i].y, midX, midY);
          }
          const last = centers[centers.length - 1];
          const beforeLast = centers[centers.length - 2];
          ctx.quadraticCurveTo(beforeLast.x, beforeLast.y, last.x, last.y);
        }
        ctx.strokeStyle = p.schlange;
        ctx.lineWidth = T * 0.50;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();
      }
      for (let i = 1; i < points.length - 1; i++) {
        const prev = points[i - 1];
        const next = points[i + 1];
        const s = points[i];
        const x = s.x * T + T / 2;
        const y = s.y * T + T / 2;
        const inDir = { x: s.x - prev.x, y: s.y - prev.y };
        const outDir = { x: next.x - s.x, y: next.y - s.y };
        const cross = inDir.x * outDir.y - inDir.y * outDir.x;
        const isCorner = cross !== 0;
        if (isCorner) {
          const incomingAngle = Math.atan2(inDir.y, inDir.x);
          if (!drawAsset('snakeCorner', x, y, T, incomingAngle, cross < 0)) {
            ctx.save();
            ctx.strokeStyle = p.schlange;
            ctx.lineWidth = T * 0.50;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(prev.x * T + T / 2, prev.y * T + T / 2);
            ctx.quadraticCurveTo(x, y, next.x * T + T / 2, next.y * T + T / 2);
            ctx.stroke();
            ctx.restore();
          }
        } else {
          const angle = Math.atan2(outDir.y, outDir.x);
          drawAsset('snakeBody', x, y, T, angle);
        }
      }
      if (points.length > 1) {
        const tail = points[points.length - 1];
        const before = points[points.length - 2];
        const x = tail.x * T + T / 2;
        const y = tail.y * T + T / 2;
        const outwardAngle = Math.atan2(tail.y - before.y, tail.x - before.x);
        const tailRotation = outwardAngle - Math.PI / 2;
        if (!drawAsset('snakeTail', x, y, T, tailRotation)) {
          ctx.fillStyle = p.schlange;
          ctx.beginPath();
          ctx.arc(x, y, T * 0.29, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawPuckShot(s) {
      const p = stilPalette();
      const x = s.x * T + T / 2;
      const y = s.y * T + T / 2;
      const angle = Math.atan2(s.dy, s.dx) + Math.PI / 2;
      if (drawAsset('puck', x, y, T * 0.65, angle)) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = p.trim;
      ctx.strokeStyle = p.ink;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    /* Verzierungen über dem Feld: Ecken, Blut, Herzen – und ein weicher
       Rand, der das Feld in seine Welt einbettet. Rein dekorativ, ohne
       Einfluss auf Spielfeld, Kollisionen oder Lesbarkeit. */
    function zeichneDeko(p) {
      const rand = ctx.createRadialGradient(
        GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_HEIGHT * 0.34,
        GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_HEIGHT
      );
      rand.addColorStop(0, 'rgba(0,0,0,0)');
      rand.addColorStop(1, p.vignette);
      ctx.fillStyle = rand;
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      const ecken = [
        [0, 0, 1, 1], [GAME_WIDTH, 0, -1, 1],
        [0, GAME_HEIGHT, 1, -1], [GAME_WIDTH, GAME_HEIGHT, -1, -1]
      ];

      for (const [ex, ey, sx, sy] of ecken) {
        ctx.save();
        ctx.translate(ex, ey);
        ctx.scale(sx, sy);
        if (p.deko === 'normal') {
          ctx.strokeStyle = p.trim;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(7, 30); ctx.lineTo(7, 7); ctx.lineTo(30, 7);
          ctx.stroke();
          ctx.strokeStyle = p.trim + '99';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(12, 25); ctx.lineTo(12, 12); ctx.lineTo(25, 12);
          ctx.stroke();
          ctx.fillStyle = p.trim;
          ctx.beginPath();
          ctx.moveTo(17, 15); ctx.lineTo(21, 19); ctx.lineTo(17, 23); ctx.lineTo(13, 19);
          ctx.closePath();
          ctx.fill();
        } else if (p.deko === 'maedchen') {
          herz(15, 17, 4.4, '#ff9ec4');
          herz(27, 22, 3.2, '#ffc4dc');
          herz(35, 14, 2.4, '#ffffff');
          ctx.fillStyle = '#fff2a8';
          ctx.beginPath(); ctx.arc(24, 10, 1.8, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(41, 24, 1.2, 0, Math.PI * 2); ctx.fill();
        } else if (p.deko === 'buben') {
          ctx.strokeStyle = p.ader;
          ctx.lineWidth = 1.4;
          for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(7 + i * 4, 9);
            ctx.lineTo(23 + i * 5, 27);
            ctx.stroke();
          }
          ctx.fillStyle = p.blut + 'aa';
          ctx.beginPath();
          ctx.ellipse(19, 19, 9, 5.5, 0.45, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      if (p.deko === 'buben') {
        for (let i = 0; i < 8; i++) {
          const dx = 18 + ((i * 97) % (GAME_WIDTH - 36));
          const hoehe = 7 + ((i * 41) % 17);
          ctx.fillStyle = p.blut + 'cc';
          ctx.fillRect(dx, 0, 2.5, hoehe);
          ctx.beginPath();
          ctx.arc(dx + 1.25, hoehe, 2.1, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (p.deko === 'normal') {
        ctx.strokeStyle = p.trim + '55';
        ctx.lineWidth = 1;
        ctx.strokeRect(11.5, 11.5, GAME_WIDTH - 23, GAME_HEIGHT - 23);
      } else if (p.deko === 'maedchen') {
        for (let i = 0; i < 6; i++) {
          const dx = 40 + ((i * 83) % (GAME_WIDTH - 80));
          const dy = 20 + ((i * 59) % (GAME_HEIGHT - 40));
          ctx.fillStyle = '#ffffffb0';
          ctx.beginPath(); ctx.arc(dx, dy, 1.4, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    function draw(message = '') {
      const p = stilPalette();
      ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++)
          tile(x, y, p);

      drawBridges(p);

      const extraFelder = new Set(extras.map(e => `${e.x},${e.y}`));
      for (const k of pellets) {
        if (extraFelder.has(k)) continue;
        const [x, y] = k.split(',').map(Number);
        drawFood(x, y, p);
      }

      for (const e of extras) drawExtraItem(e.x, e.y, e.type);

      const progress = visualFrom.length
        ? Math.min(1, (performance.now() - moveAnimStart) / Math.max(1, moveDelay))
        : 1;
      const shownSnake = snake.map((s, i) => {
        const from = visualFrom.length
          ? visualFrom[Math.min(Math.max(i - 1, 0), visualFrom.length - 1)]
          : s;
        return {
          x: from.x + (s.x - from.x) * progress,
          y: from.y + (s.y - from.y) * progress,
          layer: s.layer || 0
        };
      });

      drawWormBody(shownSnake);
      if (shownSnake.length) drawHead(shownSnake[0], facing.x, facing.y);

      for (const part of shownSnake) {
        if (part.layer === 2) {
          drawBridgeTile(Math.round(part.x), Math.round(part.y), p, true);
        }
      }

      if (projectile) drawPuckShot(projectile);

      zeichneDeko(p);

      const spielt = state === 'playing' || state === 'lost';
      if (ui.picker && ui.picker.hidden !== spielt) {
        ui.picker.hidden = spielt;
        document.body.classList.toggle('spiel-laeuft', spielt);
        document.body.classList.toggle('start-aktiv', !spielt);
        if (!spielt) aktualisiereStartInfo();
        passeBuehne();
      }

      if (state === 'title' || state === 'gameover' || state === 'won' || message) {
        ctx.fillStyle = p.schleier;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        ctx.textAlign = 'center';
        ctx.font = '700 22px "Press Start 2P", cursive, sans-serif';
        const titleText = message || (state === 'gameover' ? 'SPIEL VORBEI' : state === 'won' ? 'GESCHAFFT!' : '');
        if (titleText) {
          ctx.lineWidth = 4;
          ctx.strokeStyle = p.ink;
          ctx.strokeText(titleText, GAME_WIDTH / 2, GAME_HEIGHT / 2 - 10);
          ctx.fillStyle = p.titelFarbe;
          ctx.fillText(titleText, GAME_WIDTH / 2, GAME_HEIGHT / 2 - 10);
        }
        ctx.fillStyle = p.unterFarbe;
        ctx.font = '700 12px "Fredoka", sans-serif';
        const subText = (state === 'gameover' || state === 'won')
          ? 'DRÜCKE ENTER / LEERTASTE FÜR NEUSTART'
          : 'DRÜCKE ENTER / PFEILTASTE ZUM STARTEN';
        ctx.fillText(subText, GAME_WIDTH / 2, GAME_HEIGHT / 2 + (titleText ? 30 : 0));
      }
    }

    // ---- Eingaben: Tastatur ----
    /* Fokussierte Bedienelemente behalten Leertaste und Enter für sich. */
    function fokussiertesBedienelement() {
      const el = document.activeElement;
      if (!el || el === document.body || el === document.documentElement || el === canvas) return null;
      /* Ein ausgeblendetes Bedienelement (Startbildschirm zu) kann keine Taste
         mehr gebrauchen – sonst wären Leertaste und Enter stumm. */
      if (typeof el.getClientRects === 'function' && el.getClientRects().length === 0) return null;
      return el.closest('button, select, input, textarea, a[href], [contenteditable="true"]');
    }

    function handleKeyDown(e) {
      /* Die Highscore-Karte liegt über dem Spiel: solange sie offen ist,
         gehören die Tasten ihr – Spielfeld und Partie bleiben unberührt. */
      if (highscoreOffen) {
        if (e.key === 'Escape') {
          e.preventDefault();
          if (istVollbild()) vollbildUmschalten();
          else highscoreKarte(false, {});
        }
        return;
      }

      /* Tasten gehören dem fokussierten Bedienelement: Knopf, Auswahl und Feld
         behalten Leertaste, Enter und die Pfeile für sich (sonst startet ein
         Pfeil im Level-Auswahlfeld nebenbei die Partie). */
      const bedienelement = fokussiertesBedienelement();

      const d = dirs[e.key];
      if (d) {
        if (bedienelement) return;
        e.preventDefault();
        if (e.repeat) return;
        pressedDirs.add(e.key);
        activeDirectionKey = e.key;
        setDirection(d);
        return;
      }

      if (e.code === 'Space') {
        if (bedienelement) return;
        e.preventDefault();
        if (state === 'playing' || state === 'lost') fire();
        else starteSpiel({});
        return;
      }
      if (e.key === 'Enter') {
        if (bedienelement) return;
        e.preventDefault();
        starteSpiel({});
        return;
      }
      if (e.key === 'Escape' && istVollbild()) {
        /* Escape verlässt zuerst das Vollbild; die Pause bleibt, wie sie ist. */
        e.preventDefault();
        vollbildUmschalten();
        return;
      }
      if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
        e.preventDefault();
        if (state === 'playing' || state === 'lost') {
          if (isPaused) resumeGame(); else pauseGame();
        }
      }
    }

    function handleKeyUp(e) {
      if (!dirs[e.key]) return;
      if (fokussiertesBedienelement()) return;
      e.preventDefault();
      pressedDirs.delete(e.key);
      if (pressedDirs.size === 0) {
        activeDirectionKey = null;
        stopMove();
      } else if (e.key === activeDirectionKey) {
        activeDirectionKey = [...pressedDirs].pop();
      }
    }

    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);
    /* Fensterverlust hält die Partie an; zurück kommt sie nur auf Wunsch
       (Knopf, P oder resume()) – kein automatisches Weiterlaufen. */
    window.addEventListener('blur', () => {
      pressedDirs.clear();
      activeDirectionKey = null;
      pauseGame();
    });

    // ---- Bühne: Spielfeld aus der verfügbaren Fläche, nie verzerrt ----
    const cabinet = document.querySelector('.cabinet');
    const screenWrapper = document.querySelector('.screen-wrapper');

    function istVollbild() {
      return !!document.fullscreenElement || document.body.classList.contains('pseudo-vollbild');
    }

    function passeBuehne() {
      if (!screenWrapper) return;
      // Auf dem Startbildschirm gibt es kein Spielfeld zu bemessen.
      if (document.body.classList.contains('start-aktiv')) return;
      let platzH;
      let platzW;
      // Steht die Leiste im Fluss (Hochformat), muss ihre Höhe vom Feld abgehen –
      // auch im Vollbild.
      const leiste = document.querySelector('#spiel-leiste');
      const leisteH = (leiste && getComputedStyle(leiste).position !== 'absolute')
        ? leiste.getBoundingClientRect().height + 8 : 0;
      if (istVollbild()) {
        // Im Vollbild gibt die freie Fläche unter der Anzeige den Ausschlag.
        const bereich = document.querySelector('.game-area').getBoundingClientRect();
        platzH = Math.max(90, bereich.height - 8 - leisteH);
        platzW = Math.max(160, bereich.width - 8);
      } else {
        const kopf = document.querySelector('.cabinet > section');
        const kopfH = kopf ? kopf.getBoundingClientRect().height : 0;
        const pickerH = (ui.picker && !ui.picker.hidden) ? ui.picker.getBoundingClientRect().height + 14 : 0;
        const quer = window.innerWidth > window.innerHeight && window.innerHeight <= 620;
        const steuerung = (isTouch && !quer) ? 58 : 0;
        platzH = window.innerHeight - kopfH - pickerH - steuerung - leisteH - 12;
        const bereich = document.querySelector('.game-area');
        platzW = (bereich && bereich.clientWidth) ? bereich.clientWidth : Math.min(window.innerWidth, 960) - 24;
      }
      setzeFeld(platzW, platzH);

      /* Nachmessen statt hoffen: Adressleiste, Rahmen und schwebende Leiste
         verschieben die Rechnung um wenige Pixel. Das Feld wird so lange
         nachgezogen, bis es vollständig im sichtbaren Bereich liegt – auch
         bei 844 × 390. */
      const kasten = document.querySelector('.cabinet');
      for (let runde = 0; runde < 4; runde++) {
        const feld = screenWrapper.getBoundingClientRect();
        const kastenUnten = kasten ? kasten.getBoundingClientRect().bottom : feld.bottom;
        const zuTief = Math.max(0, feld.bottom - window.innerHeight, kastenUnten - window.innerHeight);
        const zuBreit = Math.max(0, feld.right - window.innerWidth);
        if (zuTief < 1 && zuBreit < 1) break;
        setzeFeld(feld.width - zuBreit - 1, feld.height - zuTief - 1);
      }
    }

    function setzeFeld(platzBreite, platzHoehe) {
      const skala = Math.min(platzBreite / GAME_WIDTH, platzHoehe / GAME_HEIGHT);
      const breite = Math.max(120, Math.min(Math.floor(GAME_WIDTH * skala), Math.floor(platzBreite)));
      const hoehe = Math.max(66, Math.min(Math.floor(GAME_HEIGHT * skala), Math.floor(platzHoehe)));
      screenWrapper.style.width = `${breite}px`;
      screenWrapper.style.height = `${hoehe}px`;
      canvas.style.width = `${breite}px`;
      canvas.style.height = `${hoehe}px`;
    }

        let passeGeplant = 0;
    function passeBald() {
      if (passeGeplant) return;
      passeGeplant = requestAnimationFrame(() => { passeGeplant = 0; passeBuehne(); });
    }

    window.addEventListener('resize', passeBald);
    window.addEventListener('orientationchange', () => setTimeout(passeBuehne, 150));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', passeBald);

    // ---- Vollbild (echt, sonst Fensterfüllung als Rückfall) ----
    const exitFullscreenButton = document.querySelector('#exit-fullscreen-button');
    const vollbildKnoepfe = [...document.querySelectorAll('#fullscreen-button, #spiel-vollbild, #pause-vollbild')];

    function vollbildKlasse() {
      const voll = istVollbild();
      cabinet.classList.toggle('bildschirm-voll', voll);
      vollbildKnoepfe.forEach(b => { b.textContent = voll ? '⤢ FENSTER' : '⛶ VOLLBILD'; });
      passeBuehne();
    }

    function pseudoVollbild(an) {
      document.body.classList.toggle('pseudo-vollbild', an);
      vollbildKlasse();
    }

    async function vollbildUmschalten() {
      if (document.fullscreenElement) {
        try { await document.exitFullscreen(); } catch (error) {
          console.warn('Vollbild konnte nicht beendet werden:', error);
        }
        return;
      }
      if (document.body.classList.contains('pseudo-vollbild')) { pseudoVollbild(false); return; }
      if (!cabinet.requestFullscreen) { pseudoVollbild(true); return; }
      try {
        await cabinet.requestFullscreen();
        if (isTouch && screen.orientation && screen.orientation.lock) {
          try { await screen.orientation.lock('landscape'); } catch (_) {
            console.info('Automatisches Querformat wird vom Browser nicht unterstützt.');
          }
        }
      } catch (error) {
        console.warn('Vollbild nicht möglich, nutze Fensterfüllung:', error);
        pseudoVollbild(true);
      }
    }

    vollbildKnoepfe.forEach(b => b.addEventListener('click', vollbildUmschalten));
    if (exitFullscreenButton) exitFullscreenButton.addEventListener('click', () => vollbildUmschalten());

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        if (isTouch && screen.orientation && screen.orientation.unlock) {
          try { screen.orientation.unlock(); } catch (_) {}
        }
      }
      vollbildKlasse();
      stopMove();
    });

    // ---- Pause, Neustart, Verlassen ----
    function neustart() {
      isPaused = false;
      zeigePause();
      stoppeAlles();
      state = 'gameover';
      starteSpiel({});
    }

    const pauseButton = document.querySelector('#pause-button');
    if (pauseButton) pauseButton.addEventListener('click', () => {
      if (isPaused) resumeGame(); else pauseGame();
    });
    const pauseWeiter = document.querySelector('#pause-weiter');
    if (pauseWeiter) pauseWeiter.addEventListener('click', resumeGame);
    const pauseNeustart = document.querySelector('#pause-neustart');
    if (pauseNeustart) pauseNeustart.addEventListener('click', neustart);
    const schnellNeustart = document.querySelector('#schnell-neustart');
    if (schnellNeustart) schnellNeustart.addEventListener('click', neustart);
    const pauseStart = document.querySelector('#pause-start');
    if (pauseStart) pauseStart.addEventListener('click', zurueckZumStart);
    const pauseVerlassen = document.querySelector('#pause-verlassen');
    if (pauseVerlassen) pauseVerlassen.addEventListener('click', () => {
      if (typeof window.tgZurueck === 'function') { window.tgZurueck(); return; }
      window.location.href = '../spiele.html';
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && state === 'playing') pauseGame();
    });

    // ---- Touch-Steuerung ----
    document.querySelectorAll('[data-dir]').forEach(btn => {
      const dirMap = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
      const d = dirs[dirMap[btn.dataset.dir]];
      btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        if (btn.setPointerCapture) {
          try { btn.setPointerCapture(e.pointerId); } catch (_) {}
        }
        heldDirections.set(e.pointerId, d);
        setDirection(d);
      });
      const release = e => {
        if (heldDirections.delete(e.pointerId) && heldDirections.size === 0) {
          stopMove();
        }
      };
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('lostpointercapture', release);
      btn.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    });

    const fireBtn = document.querySelector('#btn-fire');
    if (fireBtn) {
      fireBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        fire();
      });
      fireBtn.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    }

    /* ---- Öffentliche Spielschnittstelle (Standard 2.0) ----
       start({ stufe, level, stil }): stufe ist 'leicht' | 'mittel' | 'schwer',
       level 1–61, stil ist 'normal' | 'maedchen' | 'buben'.
       Ein unbekannter oder fehlender Stil ist "normal" (kein Fehler).
       Eine Konfiguration mit ausschließlich "stil" setzt die Spielwelt und
       lässt den Startbildschirm stehen (Stilübergabe des Connectors).
       Fehlende Felder bleiben auf der aktuellen Auswahl,
       ungültige Werte und unbekannte Felder brechen mit festem Fehlercode ab,
       ohne das Spiel anzufassen. Dazu whenReady(), pause(), resume(), stop(),
       startbildschirm(), einstellungen(), zustand() und aktion(name, daten).
       bereit = true, sobald das Spiel initialisiert ist
       ('superpimmelchen:bereit'); 'superpimmelchen:ende' meldet das Ergebnis,
       'superpimmelchen:pausiert' und 'superpimmelchen:weiter' folgen jeder
       echten Zustandsänderung.

       Aktionen für aktion(name, daten):
         richtung  {x, y}  genau ein Schritt (eine Achse ±1), nur im Spiel,
                           kein Dauerlauf; Antwort {ok, schritt}
         feuer     –       Spermschuss wie die Leertaste, nur im Spiel
         start     –       Partie beginnen (wie der Startknopf)
         pause     –       anhalten (wie P)
         weiter    –       fortsetzen (wie P)
         neu       –       Neustart des laufenden Levels (wie „NEU“)
       Ungültige daten (diagonal, 0/0, Text) antworten mit aktion-nicht-erlaubt,
       fremde Felder mit unbekanntes-feld – es gibt keinen Code außerhalb der
       Tabelle in SPIELE-SCHNITTSTELLE.md. */
    const SCHNITTSTELLE_VERSION = '2.0.0';

    /* Nur bekannte Felder, nur echte Typen: eine Zahl bleibt eine Zahl, ein
       Text bleibt ein Text. Die Fehlercodes sind fest und stehen in
       SPIELE-SCHNITTSTELLE.md. */
    const START_FELDER = ['stufe', 'level', 'stil'];
    function hatFeld(objekt, feld) {
      return Object.prototype.hasOwnProperty.call(objekt, feld);
    }

    function pruefeStartKonfiguration(konfiguration) {
      if (konfiguration === undefined || konfiguration === null) {
        return { ok: true, wert: { stufe, level: selectedStartLevel + 1, stil } };
      }
      if (typeof konfiguration !== 'object' || Array.isArray(konfiguration)) {
        return { ok: false, fehler: 'konfiguration-muss-objekt-sein' };
      }
      for (const feld of Object.keys(konfiguration)) {
        if (!START_FELDER.includes(feld)) return { ok: false, fehler: 'unbekanntes-feld', feld };
      }
      const wert = { stufe, level: selectedStartLevel + 1, stil };
      if (hatFeld(konfiguration, 'stil')) {
        /* Ein unbekannter oder fehlender Stil ist kein Fehler: er fällt auf
           "normal" zurück. Die Stilwahl gehört dem Connector, nicht dem Spiel. */
        wert.stil = stilWert(konfiguration.stil);
      }
      if (hatFeld(konfiguration, 'stufe')) {
        if (typeof konfiguration.stufe !== 'string') return { ok: false, fehler: 'stufe-muss-text-sein' };
        const gewuenscht = konfiguration.stufe.toLowerCase();
        if (!STUFEN[gewuenscht]) return { ok: false, fehler: 'unbekannte-stufe' };
        wert.stufe = gewuenscht;
      }
      if (hatFeld(konfiguration, 'level')) {
        const zahl = konfiguration.level;
        if (typeof zahl !== 'number' || !Number.isInteger(zahl) || zahl < 1 || zahl > LEVEL_COUNT) {
          return { ok: false, fehler: `level-muss-1-bis-${LEVEL_COUNT}-sein` };
        }
        wert.level = zahl;
      }
      return { ok: true, wert };
    }

    /* whenReady(): auch ein später Aufruf bekommt eine Antwort – vor der
       Initialisierung wartet das Versprechen, danach ist es sofort erfüllt. */
    let bereitAufloesen = () => {};
    const bereitVersprechen = new Promise(resolve => { bereitAufloesen = resolve; });

    const schnittstelle = {
      version: SCHNITTSTELLE_VERSION,
      bereit: false,
      whenReady() {
        return schnittstelle.bereit
          ? Promise.resolve({ ok: true, version: SCHNITTSTELLE_VERSION })
          : bereitVersprechen;
      },
      start(konfiguration) {
        if (!schnittstelle.bereit) return { ok: false, fehler: 'spiel-nicht-bereit' };
        const pruefung = pruefeStartKonfiguration(konfiguration);
        if (!pruefung.ok) {
          const antwort = { ok: false, fehler: pruefung.fehler };
          if (pruefung.feld) antwort.feld = pruefung.feld;
          return antwort;
        }
        /* Eine Konfiguration, die nur den Stil nennt, richtet die Spielwelt
           ein, ohne eine Partie zu beginnen – so übergibt der Connector den
           Stil beim Öffnen des Spiels, und der Startbildschirm bleibt stehen. */
        const nurStil = konfiguration && typeof konfiguration === 'object' &&
          hatFeld(konfiguration, 'stil') &&
          !hatFeld(konfiguration, 'stufe') && !hatFeld(konfiguration, 'level');
        setzeStil(pruefung.wert.stil);
        /* Kam der Stil von außen (Connector), verschwindet die Auswahl: Die
           Connector-Wahl hat Vorrang, auch vor einer gemerkten Lokalwahl. */
        if (konfiguration && typeof konfiguration === 'object' && !Array.isArray(konfiguration) &&
            hatFeld(konfiguration, 'stil')) {
          stilVonAussen = true;
        }
        zeigeStilWahl();
        if (nurStil) {
          return {
            ok: true, gestartet: false, stil,
            stufe, level: selectedStartLevel + 1, levelAnzahl: LEVEL_COUNT
          };
        }
        const lauf = starteSpiel(pruefung.wert);
        if (!lauf.gestartet) return { ok: false, fehler: 'spiel-laeuft' };
        return {
          ok: true, gestartet: true, stil,
          stufe: lauf.stufe, level: lauf.level, levelAnzahl: LEVEL_COUNT
        };
      },
      /* Nur die Möglichkeiten, nicht ihre Bedeutung: welche Stufen es gibt,
         welches Level als Nächstes startet, wie viele es gibt. */
      einstellungen() {
        return {
          bereit: schnittstelle.bereit,
          stufe,
          stufen: Object.keys(STUFEN),
          stil,
          stile: STILE.slice(),
          level: selectedStartLevel + 1,
          levelAnzahl: LEVEL_COUNT
        };
      },
      zustand() {
        return {
          laeuft: state === 'playing' || state === 'lost',
          pausiert: isPaused,
          tick,
          richtung: { x: dir.x, y: dir.y },
          stufe,
          stil,
          level: stage + 1,
          punkte: score,
          leben: lives,
          sekunden: seconds,
          specials: extras.length,
          extras: extras.map(e => ({ x: e.x, y: e.y, type: e.type })),
          laenge: snake.length,
          kopf: snake.length ? { x: snake[0].x, y: snake[0].y } : null,
          startbildschirm: state !== 'playing' && state !== 'lost'
        };
      },
      startbildschirm() {
        zurueckZumStart();
        return { ok: true };
      },
      /* stop = Partie abbrechen, dieselbe Rückkehr wie der Startbildschirm. */
      stop() {
        zurueckZumStart();
        return { ok: true };
      },
      pause() {
        if (state !== 'playing' && state !== 'lost') return { ok: false, fehler: 'spiel-laeuft-nicht' };
        pauseGame();
        return { ok: true, pausiert: isPaused };
      },
      resume() {
        if (state !== 'playing' && state !== 'lost') return { ok: false, fehler: 'spiel-laeuft-nicht' };
        resumeGame();
        return { ok: true, pausiert: isPaused };
      },
      /* Externe Spielaktionen laufen über dieselben internen Funktionen wie
         Tastatur und Touch – keine zweite Steuerung daneben. */
      aktion(name, daten) {
        if (!schnittstelle.bereit) return { ok: false, fehler: 'spiel-nicht-bereit' };
        if (daten !== undefined && daten !== null &&
            (typeof daten !== 'object' || Array.isArray(daten))) {
          return { ok: false, fehler: 'daten-muessen-objekt-sein' };
        }
        const d = daten || {};

        if (name === 'richtung') {
          for (const feld of Object.keys(d)) {
            if (feld !== 'x' && feld !== 'y') return { ok: false, fehler: 'unbekanntes-feld', feld };
          }
          const x = d.x === undefined ? 0 : d.x;
          const y = d.y === undefined ? 0 : d.y;
          if (!Number.isInteger(x) || !Number.isInteger(y) ||
              Math.abs(x) > 1 || Math.abs(y) > 1 || (x === 0) === (y === 0)) {
            return { ok: false, fehler: 'aktion-nicht-erlaubt' };
          }
          if (state !== 'playing' || isPaused) return { ok: false, fehler: 'aktion-nicht-erlaubt' };
          /* Ein Aufruf = ein Schritt. Vorher lief hier der Dauerlauf an, den
             Tastatur und Steuerkreuz nur solange fortsetzen, wie sie gehalten
             werden – ein Aufruf über die Schnittstelle hält nichts. */
          const bewegt = schrittFuerRichtung({ x, y });
          return { ok: true, schritt: bewegt };
        }
        if (name === 'feuer') {
          if (state !== 'playing' || isPaused) return { ok: false, fehler: 'aktion-nicht-erlaubt' };
          fire();
          return { ok: true };
        }
        if (name === 'start') {
          const lauf = starteSpiel({});
          return lauf.gestartet
            ? { ok: true, stufe: lauf.stufe, level: lauf.level, levelAnzahl: LEVEL_COUNT }
            : { ok: false, fehler: 'aktion-nicht-erlaubt' };
        }
        if (name === 'pause') {
          if (state !== 'playing' && state !== 'lost') return { ok: false, fehler: 'aktion-nicht-erlaubt' };
          pauseGame();
          return { ok: true, pausiert: isPaused };
        }
        if (name === 'weiter') {
          if (state !== 'playing' && state !== 'lost') return { ok: false, fehler: 'aktion-nicht-erlaubt' };
          resumeGame();
          return { ok: true, pausiert: isPaused };
        }
        if (name === 'neu') {
          if (state !== 'playing' && state !== 'lost') return { ok: false, fehler: 'aktion-nicht-erlaubt' };
          neustart();
          return { ok: true, level: stage + 1 };
        }
        return { ok: false, fehler: 'unbekannte-aktion' };
      }
    };
    window.SuperPimmelchen = schnittstelle;

    // ---- Init ----
    // Erst das Feld aufbauen, dann die Welt setzen: setzeStil() zeichnet bei
    // einem Wechsel sofort neu und braucht ein fertiges Spielfeld. Ohne
    // Connector gilt die gemerkte Wahl dieses Browsers, sonst normal.
    resetStage();
    state = 'title';
    setzeStil(gemerkterStil());
    zeigeStilWahl();
    draw();
    aktualisiereStartInfo();
    passeBuehne();
    requestAnimationFrame(passeBuehne);
    schnittstelle.bereit = true;
    bereitAufloesen({ ok: true, version: SCHNITTSTELLE_VERSION });
    window.dispatchEvent(new CustomEvent('superpimmelchen:bereit', {
      detail: { version: SCHNITTSTELLE_VERSION }
    }));
    Object.freeze(schnittstelle);
  })();
  </script>
<script src="../zurueck.js" data-ziel="main.cabinet > section"></script>
