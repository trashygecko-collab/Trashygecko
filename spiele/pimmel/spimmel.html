<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Super Pimmelchen — Retro Arcade Edition (20×11)</title>
  <style>
    :root {
      --ink: #24142f;
      --panel: #fff0bd;
      --accent: #f32d83;
      --accent-yellow: #f8c94e;
    }
    [hidden]{display:none !important}

    html {
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      height: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 16px;
      box-sizing: border-box;
      color: var(--ink);
      background-color: #30b9b2;
      background-image:
        radial-gradient(#ffffff80 1.5px, transparent 1.5px),
        linear-gradient(135deg, #20aaa8 0%, #52cfbd 45%, #f2b846 100%);
      background-size: 14px 14px, auto;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .cabinet {
      width: min(100%, 960px);
      flex: 0 0 auto;
      margin: auto;
      padding: 24px;
      border: 4px solid #24142f;
      border-radius: 20px;
      background: #fff0bd;
      box-shadow: 8px 10px 0 #24142f, 0 20px 50px rgba(0, 0, 0, 0.35);
      transform: rotate(-0.1deg);
      touch-action: manipulation;
    }

    .brand-title {
      font-family: 'Courier New', monospace;
      color: #f32d83;
      -webkit-text-stroke: 1.5px #24142f;
      text-shadow: 3px 3px 0 #24142f, 5px 5px 0 #f29a32;
    }

    .hud-box {
      border: 3px solid #24142f;
      border-radius: 10px;
      background: #f8c94e;
      box-shadow: 3px 4px 0 #24142f;
      transform: rotate(-0.4deg);
    }

    .hud-label {
      color: #56375b;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .hud-value {
      font-family: 'Courier New', monospace;
      color: #f32d83;
      -webkit-text-stroke: 0.5px #24142f;
      text-shadow: 2px 2px #fff0bd;
    }

    .screen-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      border: 5px solid #24142f;
      border-radius: 12px;
      background: #29bbb6;
      box-shadow: 6px 7px 0 #f07836;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      outline: none;
      touch-action: none;
    }

    .game-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin: 14px auto 0;
    }

    .cabinet:fullscreen {
      box-sizing: border-box;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: none;
      margin: 0;
      padding: 4px 6px;
      border: 0;
      border-radius: 0;
      transform: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff0bd;
    }

    .cabinet:fullscreen > header,
    .cabinet:fullscreen #keyboard-help {
      display: none !important;
    }

    .cabinet:fullscreen .game-area {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      width: 100%;
      max-width: none;
      display: flex;
      flex-direction: column;
    }

    .cabinet:fullscreen .screen-wrapper {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    .cabinet:fullscreen canvas {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 20 / 11;
      object-fit: contain;
      flex: 0 1 auto;
    }

    .cabinet:fullscreen .game-actions {
      max-width: none;
      margin-top: 8px;
    }

    .cabinet:fullscreen > header,
    .cabinet:fullscreen > section,
    .cabinet:fullscreen > #level-picker,
    .cabinet:fullscreen > .mt-4 {
      flex-shrink: 0;
    }

    @media (max-height: 650px) {
      .cabinet:fullscreen { padding: 6px 12px; }
      .cabinet:fullscreen > header { margin-bottom: 6px; }
      .cabinet:fullscreen > section { margin-bottom: 8px; }
      .cabinet:fullscreen .game-actions { margin-top: 5px; }
      .cabinet:fullscreen .mt-4 { margin-top: 6px; }
    }

    .arcade-btn {
      border: 3px solid #24142f;
      border-radius: 8px;
      background: #f8c94e;
      color: #24142f;
      box-shadow: 3px 4px 0 #24142f;
      font-weight: 700;
      transition: all 0.05s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .arcade-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 2px 0 #24142f;
    }

    kbd {
      padding: 3px 7px;
      border: 2px solid #24142f;
      border-radius: 6px;
      background: #fff0bd;
      color: #24142f;
      box-shadow: 2px 2px 0 #24142f;
      font-family: monospace;
      font-weight: bold;
    }

    .flex{display:flex}.grid{display:grid}.hidden{display:none}.block{display:block}
    .flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}
    .justify-between{justify-content:space-between}.justify-center{justify-content:center}
    .text-center{text-align:center}.text-left{text-align:left}.mx-auto{margin-left:auto;margin-right:auto}
    .w-full{width:100%}.w-56{width:14rem}.gap-1{gap:.25rem}.gap-1\.5{gap:.375rem}
    .gap-2{gap:.5rem}.gap-3{gap:.75rem}.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}
    .mb-4{margin-bottom:1rem}.mt-1{margin-top:.25rem}.mt-4{margin-top:1rem}.mt-6{margin-top:1.5rem}
    .p-1\.5{padding:.375rem}.p-2{padding:.5rem}.p-3{padding:.75rem}.px-3{padding-left:.75rem;padding-right:.75rem}
    .px-4{padding-left:1rem;padding-right:1rem}.py-1\.5{padding-top:.375rem;padding-bottom:.375rem}
    .py-2{padding-top:.5rem;padding-bottom:.5rem}.pt-4{padding-top:1rem}
    .text-2xl{font-size:1.5rem;line-height:2rem}.text-xs{font-size:.75rem}.text-sm{font-size:.875rem}
    .text-base{font-size:1rem}.text-lg{font-size:1.125rem}
    .font-bold{font-weight:700}.font-black{font-weight:900}.font-bold strong{font-weight:900}
    .tracking-wide{letter-spacing:.025em}.tracking-wider{letter-spacing:.05em}.uppercase{text-transform:uppercase}
    .rounded-lg{border-radius:.5rem}.rounded-xl{border-radius:.75rem}.border-2{border-width:2px;border-style:solid}
    .border-t-2{border-top:2px solid}.border-dashed{border-style:dashed}.text-gray-600{color:#4b5563}
    .grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .col-span-3{grid-column:span 3 / span 3}
    .bg-white{background:#fff}.text-\[\#24142f\]{color:#24142f}.text-\[\#56375b\]{color:#56375b}
    .text-\[\#f32d83\]{color:#f32d83}.bg-\[\#f8c94e\]{background:#f8c94e}
    .bg-\[\#fff0bd\]{background:#fff0bd}.bg-\[\#fff5d7\]{background:#fff5d7}
    .border-\[\#24142f\]{border-color:#24142f}.border-\[\#24142f40\]{border-color:#24142f40}
    .shadow-\[2px_2px_0_\#24142f\]{box-shadow:2px 2px 0 #24142f}
    @media(min-width:640px){.sm\:flex-row{flex-direction:row}.sm\:text-left{text-align:left}.sm\:gap-3{gap:.75rem}.sm\:text-3xl{font-size:1.875rem;line-height:2.25rem}.sm\:text-xl{font-size:1.25rem;line-height:1.75rem}.sm\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.sm\:hidden{display:none}}
    @media(min-width:768px){.md\:flex-row{flex-direction:row}.md\:text-left{text-align:left}.md\:grid-cols-6{grid-template-columns:repeat(6,minmax(0,1fr))}}

    .game-area{position:relative;width:100%;max-width:800px;margin:0 auto}
    .cabinet:fullscreen .game-area{
      flex:1 1 0;
      min-height:0;
      min-width:0;
      width:100%;
      max-width:none;
      display:flex;
      flex-direction:column;
    }

    /* ---- Touch-Steuerung ---- */
    #touch-controls{display:none}

    /* Grundlayout: Feuer links (waagerecht), Richtungstasten rechts (Kreuz) */
    .touch-device #touch-controls{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      width:300px;
      max-width:100%;
      margin:14px auto 0;
      padding:0;
      gap:16px;
      border:0;
      background:transparent;
      box-shadow:none;
      backdrop-filter:none;
      box-sizing:border-box;
    }

    .touch-device #touch-controls button{
      touch-action:none;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
    }

    /* Feuerknopf: waagerecht, links */
    .touch-device #touch-controls #btn-fire{
      width:120px;
      min-height:52px;
      padding:6px 10px;
      font-size:11px;
      font-weight:900;
      line-height:1.15;
      white-space:normal;
      overflow-wrap:break-word;
      background:rgba(248,201,78,.78);
      box-shadow:2px 2px 0 rgba(36,20,47,.65);
    }

    /* Richtungskreuz: 3x2-Grid rechts */
    .touch-device #touch-dpad{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      grid-template-rows:repeat(2,minmax(0,1fr));
      gap:8px;
      width:150px;
    }
    .touch-device #touch-dpad > :nth-child(1),
    .touch-device #touch-dpad > :nth-child(3){display:none}
    .touch-device #touch-dpad > :nth-child(2){grid-column:2;grid-row:1}
    .touch-device #touch-dpad > :nth-child(4){grid-column:1;grid-row:2}
    .touch-device #touch-dpad > :nth-child(5){grid-column:2;grid-row:2}
    .touch-device #touch-dpad > :nth-child(6){grid-column:3;grid-row:2}

    .touch-device #touch-dpad button{
      min-height:48px;
      padding:0;
      font-size:18px;
      background:rgba(248,201,78,.78);
      box-shadow:2px 2px 0 rgba(36,20,47,.65);
    }

    /* Landscape auf Touch-Geräten: Controls schweben über dem Spielfeld
       – Feuer unten links, Richtungstasten unten rechts */
    @media (orientation:landscape) and (pointer:coarse),
           (orientation:landscape) and (hover:none){
      .touch-device #touch-controls{
        position:absolute;
        z-index:5;
        left:0;
        right:0;
        bottom:0;
        width:100%;
        max-width:none;
        margin:0;
        padding:0 max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        gap:16px;
        background:transparent;
        border:0;
        box-shadow:none;
        backdrop-filter:none;
        pointer-events:none;
        box-sizing:border-box;
      }
      .touch-device #touch-controls #btn-fire,
      .touch-device #touch-controls #touch-dpad{
        pointer-events:auto;
      }
      .touch-device #touch-controls #btn-fire{
        width:130px;
        min-height:46px;
        font-size:11px;
        background:rgba(248,201,78,.72);
        box-shadow:2px 2px 0 rgba(36,20,47,.6);
      }
      .touch-device #touch-controls #touch-dpad{
        width:162px;
      }
      .touch-device #touch-controls #touch-dpad button{
        min-height:44px;
        font-size:18px;
        background:rgba(248,201,78,.72);
        box-shadow:2px 2px 0 rgba(36,20,47,.6);
      }
    }

    /* Mobiles Vollbild: mehr Platz für das eigentliche Spielfeld */
    @media (pointer:coarse) {
      .cabinet:fullscreen {
        padding: max(4px, env(safe-area-inset-top))
                 max(6px, env(safe-area-inset-right))
                 max(4px, env(safe-area-inset-bottom))
                 max(6px, env(safe-area-inset-left));
      }

      .touch-device .cabinet:fullscreen > section {
        flex: 0 0 auto;
        gap: 3px;
        margin: 0 0 4px;
      }

      .touch-device .cabinet:fullscreen .hud-box {
        padding: 3px 1px;
        border-width: 2px;
        border-radius: 6px;
        box-shadow: 1px 2px 0 #24142f;
        transform: none;
      }

      .touch-device .cabinet:fullscreen .hud-label {
        font-size: 8px;
        letter-spacing: 0.04em;
      }

      .touch-device .cabinet:fullscreen .hud-value {
        font-size: clamp(13px, 3.5vh, 18px) !important;
        line-height: 1.05;
      }

      .touch-device .cabinet:fullscreen .game-area {
        flex: 1 1 0;
        min-height: 0;
        min-width: 0;
      }

      .touch-device .cabinet:fullscreen .screen-wrapper {
        flex: 1 1 0;
        min-height: 0;
        min-width: 0;
        height: 100%;
        border-width: 3px;
        border-radius: 7px;
        box-shadow: 2px 3px 0 #f07836;
      }

      /* Touch-Tasten über dem Spielfeld: Feuer unten links, Dpad unten rechts.
         Kein graues Kästchen, Tasten halbtransparent. */
      .touch-device .cabinet:fullscreen #touch-controls {
        position: absolute;
        z-index: 5;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 0 8px 8px;
        gap: 12px;
        background: transparent;
        border: 0;
        box-shadow: none;
        backdrop-filter: none;
        pointer-events: none;
        box-sizing: border-box;
      }

      .touch-device .cabinet:fullscreen #touch-controls #btn-fire,
      .touch-device .cabinet:fullscreen #touch-controls #touch-dpad {
        pointer-events: auto;
      }

      .touch-device .cabinet:fullscreen #touch-controls #btn-fire {
        width: 130px;
        min-height: 46px;
        padding: 5px 8px;
        font-size: 11px;
        background: rgba(248,201,78,.72);
        box-shadow: 2px 2px 0 rgba(36,20,47,.6);
      }

      .touch-device .cabinet:fullscreen #touch-controls #touch-dpad {
        width: 168px;
        gap: 6px;
      }

      .touch-device .cabinet:fullscreen #touch-controls #touch-dpad button {
        min-height: 42px;
        padding: 0;
        font-size: 17px;
        background: rgba(248,201,78,.72);
        box-shadow: 2px 2px 0 rgba(36,20,47,.6);
      }
    }

    /* Auf Handys nach Möglichkeit automatisch ins Querformat wechseln. */
    @media (orientation:landscape) and (pointer:coarse),
           (orientation:landscape) and (hover:none) {
      .touch-device .cabinet:fullscreen .game-area {
        width: 100%;
      }
    }

    /* Normales Scrollen bleibt außerhalb des Vollbilds ausdrücklich erlaubt. */
    html, body { overscroll-behavior-y: auto; }
  </style>
</head>
<body>

  <main class="cabinet">
    <header class="flex flex-col md:flex-row items-center justify-center gap-2 mb-4 text-center">
      <div>
        <h1 class="brand-title text-2xl sm:text-3xl tracking-wider">SUPER PIMMELCHEN</h1>
      </div>
    </header>

    <section class="grid gap-2 sm:gap-3 mb-4" style="grid-template-columns:repeat(5,minmax(0,1fr))">
      <div class="hud-box p-2 text-center">
        <div class="hud-label">PUNKTE</div>
        <div class="hud-value text-base sm:text-xl" id="score">0000</div>
      </div>
      <div class="hud-box p-2 text-center">
        <div class="hud-label">ZEIT</div>
        <div class="hud-value text-base sm:text-xl" id="time">120</div>
      </div>
      <div class="hud-box p-2 text-center">
        <div class="hud-label">LEVEL</div>
        <div class="hud-value text-base sm:text-xl" id="stage-display">01</div>
      </div>
      <div class="hud-box p-2 text-center">
        <div class="hud-label">SPERM</div>
        <div class="hud-value text-base sm:text-xl" id="pucks">00</div>
      </div>
      <div class="hud-box p-2 text-center">
        <div class="hud-label">LEBEN</div>
        <div class="hud-value text-base sm:text-xl" id="lives">3</div>
      </div>
    </section>

    <div class="game-area">
      <div class="screen-wrapper">
        <canvas id="game" width="560" height="308" tabindex="0" aria-label="Spielfeld 20x11"></canvas>
      </div>

      <div id="touch-controls">
        <button class="arcade-btn" id="btn-fire" type="button">SPERM SCHIESSEN</button>
        <div id="touch-dpad">
          <div></div>
          <button class="arcade-btn" data-dir="up" type="button">▲</button>
          <div></div>
          <button class="arcade-btn" data-dir="left" type="button">◀</button>
          <button class="arcade-btn" data-dir="down" type="button">▼</button>
          <button class="arcade-btn" data-dir="right" type="button">▶</button>
        </div>
      </div>
    </div>

    <div id="level-picker" class="flex flex-wrap items-center justify-center gap-3 mt-4 p-3 rounded-xl border-2 border-[#24142f] bg-[#fff0bd]">
      <label for="start-level" class="font-black text-[#24142f]">START-LEVEL:</label>
      <select id="start-level" class="rounded-lg border-2 border-[#24142f] px-3 py-2 font-bold bg-white text-[#24142f]">
        <option value="0">Level 1</option>
      </select>
      <button id="start-game" class="arcade-btn px-4 py-2 font-black" type="button">SPIEL STARTEN</button>
      <button id="show-highscore" class="arcade-btn px-4 py-2 font-black" type="button">🏆 HIGHSCORE</button>
      <button id="fullscreen-button" class="arcade-btn px-4 py-2 font-black" type="button">⛶ VOLLBILD</button>
    </div>

    <div id="keyboard-help" class="flex flex-col sm:flex-row justify-center items-center gap-3 mt-4 text-xs font-bold text-[#56375b]">
      <div class="flex flex-wrap gap-1.5 items-center justify-center">
        <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
        <span class="mx-1">|</span>
        <kbd>Leertaste</kbd> Puck
        <span class="mx-1">|</span>
        <kbd>Enter</kbd> Start
      </div>
    </div>
  </main>

  <script>
  (() => {
    'use strict';

    // Touch-Erkennung: mehrere Signale, damit auch hybride Geräte & Tablets erkannt werden
    const isTouch =
      navigator.maxTouchPoints > 0 ||
      'ontouchstart' in window ||
      (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
      (window.matchMedia && window.matchMedia('(hover: none)').matches);
    if (isTouch) document.documentElement.classList.add('touch-device');

    const W = 20, H = 11, T = 28;
    const GAME_WIDTH = W * T;
    const GAME_HEIGHT = H * T;
    const LEVEL_COUNT = 61; // 4 letzte Level entfernt (vorher 65)

    const canvas = document.querySelector('#game');
    const pixelRatio = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(GAME_WIDTH * pixelRatio);
    canvas.height = Math.round(GAME_HEIGHT * pixelRatio);

    const ctx = canvas.getContext('2d');
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const ASSET_FILES = {
      food: 'futter',
      foodKlein: 'futterklein',
      foodGross: 'futtergross',
      uhr: 'uhr',
      puck: 'puck',
      eiswuerfel: 'eiswuerfel',
      frucht: 'frucht',
      totenschaedel: 'totenschaedel',
      blitz: 'blitz',
      herz: 'herz',
      powerdose: 'powerdose',
      'elixier-kurz': 'elixier-kurz',
      'elixier-leer': 'elixier-leer',
      'sonne-gross': 'sonne-gross',
      'sonne-klein': 'sonne-klein',
      snakeHead: 'schlangenkopf',
      snakeBody: 'schlangekoerper',
      snakeCorner: 'schlangekurve',
      snakeTail: 'schlangenschwanz'
    };
    const ASSET_EXTENSIONS = ['png', 'webp', 'jpg', 'jpeg', 'gif', 'bmp', 'avif', 'svg'];
    const assets = {};

    function loadAsset(key, basename) {
      const img = new Image();
      assets[key] = img;
      let extensionIndex = 0;
      const tryNextFormat = () => {
        if (extensionIndex >= ASSET_EXTENSIONS.length) {
          assets[key] = null;
          return;
        }
        const extension = ASSET_EXTENSIONS[extensionIndex++];
        img.src = `assets/${basename}.${extension}`;
      };
      img.onerror = tryNextFormat;
      img.onload = () => { if (typeof draw === 'function') draw(); };
      tryNextFormat();
    }
    for (const [key, basename] of Object.entries(ASSET_FILES)) loadAsset(key, basename);

    function drawAsset(key, x, y, size = T, angle = null, flipY = false) {
      const img = assets[key];
      if (!img || !img.complete || !img.naturalWidth) return false;
      ctx.save();
      ctx.translate(x, y);
      if (angle !== null) ctx.rotate(angle);
      if (flipY) ctx.scale(1, -1);
      ctx.drawImage(img, -size / 2, -size / 2, size, size);
      ctx.restore();
      return true;
    }

    const ui = {
      score: document.querySelector('#score'),
      time: document.querySelector('#time'),
      pucks: document.querySelector('#pucks'),
      lives: document.querySelector('#lives'),
      stage: document.querySelector('#stage-display'),
      picker: document.querySelector('#level-picker'),
      levelSelect: document.querySelector('#start-level'),
      startButton: document.querySelector('#start-game')
    };

    const HIGHSCORE_STORAGE_KEY = 'superPimmelchenHighscore';
    let highscoreForThisRunSaved = false;

    function readHighscores() {
      try {
        const entries = JSON.parse(localStorage.getItem(HIGHSCORE_STORAGE_KEY) || '[]');
        return Array.isArray(entries) ? entries.filter(entry =>
          entry && typeof entry.name === 'string' &&
          Number.isFinite(Number(entry.score)) && Number.isFinite(Number(entry.level))
        ) : [];
      } catch (error) {
        console.warn('Highscore konnte nicht gelesen werden:', error);
        return [];
      }
    }

    function showHighscore() {
      const entries = readHighscores().sort((a, b) =>
        Number(b.score) - Number(a.score) || Number(b.level) - Number(a.level)
      ).slice(0, 10);
      if (!entries.length) {
        alert('Noch keine Highscores vorhanden. Spiele eine Runde und sichere dir den ersten Platz!');
        return;
      }
      const lines = entries.map((entry, index) =>
        `${String(index + 1).padStart(2, '0')}. ${entry.name} – ${Number(entry.score)} Punkte | Level ${Number(entry.level)} | ${entry.date || ''}`
      );
      alert('🏆 SUPER PIMMELCHEN – TOP 10\n\n' + lines.join('\n'));
    }

    function recordHighscore() {
      if (highscoreForThisRunSaved || score <= 0) return;
      highscoreForThisRunSaved = true;
      const entries = readHighscores();
      entries.sort((a, b) => Number(b.score) - Number(a.score) || Number(b.level) - Number(a.level));
      if (entries.length >= 10) {
        const last = entries[9];
        const reachedLevel = Math.min(stage + 1, LEVEL_COUNT);
        if (score < Number(last.score) || (score === Number(last.score) && reachedLevel <= Number(last.level))) return;
      }
      const enteredName = prompt(
        `Neuer Highscore!\n${score} Punkte – Level ${Math.min(stage + 1, LEVEL_COUNT)}\n\nWie soll dein Name in der Rangliste lauten?`,
        'Thomas'
      );
      if (enteredName === null || !enteredName.trim()) return;
      entries.push({
        name: enteredName.trim().slice(0, 20),
        score: Number(score),
        level: Number(Math.min(stage + 1, LEVEL_COUNT)),
        date: new Date().toLocaleDateString('de-DE')
      });
      entries.sort((a, b) => Number(b.score) - Number(a.score) || Number(b.level) - Number(a.level));
      try {
        localStorage.setItem(HIGHSCORE_STORAGE_KEY, JSON.stringify(entries.slice(0, 10)));
        alert('🏆 Dein Ergebnis wurde in der Highscore gespeichert!');
      } catch (error) {
        alert('Die Highscore konnte leider nicht gespeichert werden. Bitte prüfe, ob der Browser lokale Daten speichern darf.');
        console.error('Highscore konnte nicht gespeichert werden:', error);
      }
    }

    const highscoreButton = document.querySelector('#show-highscore');
    if (highscoreButton) highscoreButton.addEventListener('click', showHighscore);

    let selectedStartLevel = 0;
    for (let i = 2; i <= LEVEL_COUNT; i++) {
      const option = document.createElement('option');
      option.value = String(i - 1);
      option.textContent = `Level ${i}`;
      ui.levelSelect.appendChild(option);
    }
    ui.levelSelect.addEventListener('change', () => {
      if (state === 'playing' || state === 'lost') {
        ui.levelSelect.value = String(stage);
        return;
      }
      selectedStartLevel = Number(ui.levelSelect.value) || 0;
      stage = selectedStartLevel;
      updateHud();
      resetStage();
    });

      W: { x: 0, y: -1 }, S: { x: 0, y: 1 }, A: { x: -1, y: 0 }, D: { x: 1, y: 0 }
    };

    const key = (x, y) => `${x},${y}`;

    function buildMap() {
      grid = getLevelMap(Math.min(stage, LEVEL_COUNT - 1));
    }

    function placePellets() {
      pellets.clear();
      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++)
          if (grid[y][x] === 2) pellets.add(`${x},${y}`);
    }

    function blocked(x, y) {
      return x < 0 || y < 0 || x >= W || y >= H || grid[y][x] === 1;
    }

    function bridgeAxisAt(x, y) {
      const isBridge = (nx, ny) =>
        nx >= 0 && ny >= 0 && nx < W && ny < H &&
        (grid[ny][nx] === 4 || grid[ny][nx] === 5);
      const left = isBridge(x - 1, y);
      const right = isBridge(x + 1, y);
      const up = isBridge(x, y - 1);
      const down = isBridge(x, y + 1);
      if (left && right) return 'horizontal';
      if (up && down) return 'vertical';
      if ((left || right) && !(up || down)) return 'horizontal';
      if ((up || down) && !(left || right)) return 'vertical';
      if ((left || right) && (up || down)) {
        return (left && right) || !(up && down) ? 'horizontal' : 'vertical';
      }
      return 'horizontal';
    }

    function layerForEntry(x, y, dx, dy) {
      if (x < 0 || y < 0 || x >= W || y >= H || grid[y][x] === 1) return null;
      const value = grid[y][x];
      if (value !== 4 && value !== 5) return 0;
      const axis = bridgeAxisAt(x, y);
      const alongBridge = axis === 'horizontal' ? dy === 0 : dx === 0;
      if (alongBridge) return 1;
      if (value === 5) return 2;
      return null;
    }

    function findSpawn() {
      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++)
          if (grid[y][x] === 3 && !blocked(x, y)) return { x, y };
      const wanted = { x: 12, y: 9 };
      if (!blocked(wanted.x, wanted.y)) return wanted;
      for (let y = H - 2; y >= 1; y--)
        for (let x = 1; x < W - 1; x++)
          if (!blocked(x, y)) return { x, y };
      return { x: 1, y: 1 };
    }

    function placeExtra() {
      if (state !== 'playing' || extra) return;
      const free = [];
      for (let y = 1; y < H - 1; y++) {
        for (let x = 1; x < W - 1; x++) {
          if (!blocked(x, y) &&
              !snake.some(s => s.x === x && s.y === y) &&
              (!projectile || projectile.x !== x || projectile.y !== y)) {
            free.push({ x, y });
          }
        }
      }
      if (free.length) {
        const types = [
          'puck','puck','puck','uhr','eiswuerfel','frucht','totenschaedel','blitz',
          'herz','powerdose','sonne-klein','sonne-gross','elixier-kurz','elixier-leer'
        ];
        const type = types[Math.floor(Math.random() * types.length)];
        extra = { ...free[Math.floor(Math.random() * free.length)], type };
        if (type === 'totenschaedel') {
          clearTimeout(extraExpireTimer);
          const thisSkull = extra;
          extraExpireTimer = setTimeout(() => {
            if (extra === thisSkull) { extra = null; draw(); }
            extraExpireTimer = null;
          }, 5000 + Math.random() * 5000);
        }
      }
      draw();
    }

    function clearProjectile() {
      clearInterval(projectileTimer);
      projectileTimer = null;
      projectile = null;
    }

    function updateHud() {
      ui.score.textContent = String(score).padStart(4, '0');
      ui.time.textContent = String(seconds).padStart(2, '0');
      ui.pucks.textContent = String(pucks).padStart(2, '0');
      ui.lives.textContent = String(lives);
      ui.stage.textContent = String(stage + 1).padStart(2, '0');
    }

    function resetStage() {
      stopMove();
      buildMap();
      const spawn = findSpawn();
      snake = [{ ...spawn, layer: 0 }];
      visualFrom = [];
      moveAnimStart = 0;
      dir = { x: 1, y: 0 };
      facing = { x: 1, y: 0 };
      clearProjectile();
      clearTimeout(extraExpireTimer);
      extraExpireTimer = null;
      extra = null;
      clearTimeout(speedTimer); speedTimer = null;
      clearTimeout(sunEffectTimer); sunEffectTimer = null;
      clearTimeout(respawnTimer); respawnTimer = null;
      growthPerFood = 1;
      foodScoreMultiplier = 1;
      foodRadius = 3.5;
      fruitCount = 0;
      moveDelay = 200;
      placePellets();
      pellets.delete(key(spawn.x, spawn.y));
      seconds = 120;
      updateHud();
      draw();
    }

    function start() {
      if (state === 'playing' || state === 'lost') return;
      highscoreForThisRunSaved = false;
      score = 0;
      lives = 3;
      pucks = 0;
      fruitCount = 0;
      moveDelay = 200;
      if (state === 'title' || state === 'gameover' || state === 'won') stage = selectedStartLevel;
      state = 'playing';
      resetStage();
      clearInterval(clockTimer);
      clearTimeout(extraTimer);
      clearTimeout(respawnTimer); respawnTimer = null;
      clockTimer = setInterval(() => {
        if (state !== 'playing') return;
        seconds--;
        updateHud();
        if (seconds <= 0) loseLife('ZEIT ABGELAUFEN');
      }, 1000);
      function scheduleNextExtra() {
        extraTimer = setTimeout(() => {
          if (state === 'playing') placeExtra();
          if (state !== 'gameover' && state !== 'won') scheduleNextExtra();
        }, Math.floor(5000 + Math.random() * 15001));
      }
      scheduleNextExtra();
      canvas.focus();
    }

    function stopMove() {
      clearInterval(moveTimer);
      moveTimer = null;
    }

    function setDirection(d) {
      if (state === 'title' || state === 'gameover' || state === 'won') {
        start();
        // FIX: Richtung wird nach dem Start direkt angewendet
      }
      if (state !== 'playing') return;
      if (snake.length > 1 && d.x === -dir.x && d.y === -dir.y) return;
      dir = d;
      facing = d;
      if (!moveTimer) {
        if (step()) moveTimer = setInterval(step, moveDelay);
      } else {
        clearInterval(moveTimer);
        if (step()) moveTimer = setInterval(step, moveDelay);
      }
      if (!animationFrame) animationFrame = requestAnimationFrame(animate);
    }

    function activateSpeed() {
      moveDelay = 120;
      clearTimeout(speedTimer);
      if (moveTimer) { clearInterval(moveTimer); moveTimer = setInterval(step, moveDelay); }
      speedTimer = setTimeout(() => {
        moveDelay = 200;
        if (moveTimer) { clearInterval(moveTimer); moveTimer = setInterval(step, moveDelay); }
      }, 7000);
    }

    function collectExtra(type) {
      clearTimeout(extraExpireTimer);
      extraExpireTimer = null;
      extra = null;
      switch (type) {
        case 'puck': pucks += 2; break;
        case 'uhr': seconds += 40; break;
        case 'eiswuerfel': snake = snake.slice(0, Math.max(1, Math.floor(snake.length / 2))); break;
        case 'frucht': {
          const bonus = [100, 200, 400, 800];
          score += bonus[Math.min(fruitCount++, bonus.length - 1)];
          break;
        }
        case 'sonne-klein':
          clearTimeout(sunEffectTimer);
          foodRadius = 2.2; growthPerFood = 0; foodScoreMultiplier = 1;
          sunEffectTimer = setTimeout(() => {
            foodRadius = 3.5; growthPerFood = 1; foodScoreMultiplier = 1;
            sunEffectTimer = null;
          }, 10000);
          break;
        case 'sonne-gross':
          clearTimeout(sunEffectTimer);
          foodRadius = 5.5; growthPerFood = 1; foodScoreMultiplier = 2;
          sunEffectTimer = setTimeout(() => {
            foodRadius = 3.5; growthPerFood = 1; foodScoreMultiplier = 1;
            sunEffectTimer = null;
          }, 10000);
          break;
        case 'elixier-kurz': snake = snake.slice(0, Math.max(1, snake.length - 5)); break;
        case 'elixier-leer': snake = snake.slice(0, 1); break;
        case 'totenschaedel': loseLife('SCHÄDEL!'); return true;
        case 'blitz': advanceLevel(); return true;
        case 'herz': lives++; break;
        case 'powerdose': activateSpeed(); break;
      }
      updateHud();
      return false;
    }

    function step() {
      if (state !== 'playing') return;
      const head = snake[0];
      const next = { x: head.x + dir.x, y: head.y + dir.y };
      const nextLayer = layerForEntry(next.x, next.y, dir.x, dir.y);
      if (nextLayer === null) { stopMove(); return false; }
      next.layer = nextLayer;

      const nextKey = key(next.x, next.y);
      const eatingPellet = pellets.has(nextKey);
      const willGrow = eatingPellet && growthPerFood > 0;
      const tailIndex = snake.length - 1;
      const hitBody = snake.some((part, i) =>
        i > 0 &&
        !(i === tailIndex && !willGrow) &&
        part.x === next.x && part.y === next.y &&
        (part.layer || 0) === nextLayer
      );
      if (hitBody) { loseLife('KÖRPERKOLLISION'); return false; }

      const before = snake.map(s => ({ ...s }));
      snake.unshift(next);
      const k = key(next.x, next.y);

      if (eatingPellet) {
        pellets.delete(k);
        score += 10 * foodScoreMultiplier;
        if (pellets.size === 0) { advanceLevel(); return; }
        updateHud();
      }
      if (!willGrow) snake.pop();

      if (extra && next.x === extra.x && next.y === extra.y && collectExtra(extra.type)) return;

      visualFrom = before;
      moveAnimStart = performance.now();
      if (!animationFrame) animationFrame = requestAnimationFrame(animate);
      draw();
      return true;
    }

    function animate() {
      animationFrame = 0;
      if (state !== 'playing') return;
      draw();
      const progress = (performance.now() - moveAnimStart) / moveDelay;
      if (moveTimer || projectile || progress < 1) animationFrame = requestAnimationFrame(animate);
    }

    function fire() {
      if (state === 'title' || state === 'gameover' || state === 'won') {
        start();
        return;
      }
      if (state !== 'playing' || pucks < 1 || projectile) return;
      const head = snake[0];
      const x = head.x + facing.x;
      const y = head.y + facing.y;
      if (blocked(x, y)) return;
      pucks--;
      projectile = { x, y, dx: facing.x, dy: facing.y };

      if (extra && extra.x === x && extra.y === y) {
        if (collectExtra(extra.type)) { updateHud(); return; }
      }
      if (pellets.delete(key(x, y))) {
        score += 10;
        if (pellets.size === 0) { advanceLevel(); updateHud(); return; }
      }
      updateHud();
      draw();
      projectileTimer = setInterval(moveProjectile, 90);
      if (!animationFrame) animationFrame = requestAnimationFrame(animate);
    }

    function moveProjectile() {
      if (!projectile || state !== 'playing') { clearProjectile(); return; }
      const nx = projectile.x + projectile.dx;
      const ny = projectile.y + projectile.dy;
      if (blocked(nx, ny)) { clearProjectile(); draw(); return; }
      projectile.x = nx;
      projectile.y = ny;
      if (extra && extra.x === nx && extra.y === ny) {
        if (collectExtra(extra.type)) { updateHud(); return; }
      }
      if (pellets.delete(key(nx, ny))) {
        score += 10;
        if (pellets.size === 0) { advanceLevel(); return; }
      }
      updateHud();
      draw();
    }

    function advanceLevel() {
      stopMove();
      clearProjectile();
      stage++;
      if (stage >= LEVEL_COUNT) {
        state = 'won';
        clearInterval(clockTimer); clockTimer = null;
        clearTimeout(extraTimer); extraTimer = null;
        clearTimeout(respawnTimer); respawnTimer = null;
        recordHighscore();
        updateHud();
        draw(`ALLE ${LEVEL_COUNT} LEVEL GESCHAFFT!`);
        return;
      }
      resetStage();
    }

    function loseLife(message) {
      stopMove();
      clearTimeout(speedTimer);
      speedTimer = null;
      moveDelay = 200;
      clearProjectile();
      state = 'lost';
      lives--;
      updateHud();
      draw(message);
      clearTimeout(respawnTimer);
      respawnTimer = setTimeout(() => {
        respawnTimer = null;
        if (state !== 'lost') return;
        if (lives <= 0) {
          state = 'gameover';
          clearInterval(clockTimer); clockTimer = null;
          clearTimeout(extraTimer); extraTimer = null;
          recordHighscore();
          draw('SPIEL VORBEI');
          return;
        }
        const spawn = findSpawn();
        snake = [{ ...spawn, layer: 0 }];
        pellets.delete(key(spawn.x, spawn.y));
        visualFrom = [];
        moveAnimStart = 0;
        dir = { x: 1, y: 0 };
        facing = { x: 1, y: 0 };
        seconds = 120;
        state = 'playing';
        updateHud();
        draw();
      }, 1200);
    }

    // ---- Rendering ----
    function tile(x, y, p) {
      const px = x * T, py = y * T;
      if (grid[y][x] === 1) {
        ctx.fillStyle = p.wall;
        ctx.fillRect(px, py, T, T);
        ctx.strokeStyle = p.ink;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(px + 0.5, py + 0.5, T - 1, T - 1);
        ctx.fillStyle = p.trim;
        ctx.fillRect(px + 2, py + 2, T - 4, 3);
        ctx.fillRect(px + 2, py + 2, 3, T - 4);
        ctx.fillStyle = p.cream + 'aa';
        ctx.fillRect(px + 4, py + 4, 2, 2);
      } else {
        ctx.fillStyle = p.floor;
        ctx.fillRect(px, py, T, T);
        ctx.strokeStyle = p.ink + '20';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, py + 0.5, T - 1, T - 1);
        if ((x * 13 + y * 7) % 5 === 0) {
          ctx.fillStyle = p.cream + '50';
          ctx.beginPath();
          ctx.arc(px + T / 2, py + T / 2, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawBridgeTile(x, y, p, overlay = false) {
      const value = grid[y][x];
      if (value !== 4 && value !== 5) return;
      const axis = bridgeAxisAt(x, y);
      const vertical = axis === 'vertical';
      let first = axis === 'horizontal' ? x : y;
      let last = first;
      const isBridgeAt = n => {
        const bx = axis === 'horizontal' ? n : x;
        const by = axis === 'horizontal' ? y : n;
        if (bx < 0 || by < 0 || bx >= W || by >= H) return false;
        const v = grid[by][bx];
        if (v !== 4 && v !== 5) return false;
        return bridgeAxisAt(bx, by) === axis;
      };
      while (isBridgeAt(first - 1)) first--;
      while (isBridgeAt(last + 1)) last++;
      const span = Math.max(1, last - first + 1);
      const u0 = ((axis === 'horizontal' ? x : y) - first) / span;
      const u1 = u0 + 1 / span;
      const localX = u => -T / 2 + (u - u0) * span * T;
      const archY = u => {
        const n = Math.max(-1, Math.min(1, (u - 0.5) * 2));
        return T * (0.43 - 0.39 * Math.sqrt(Math.max(0, 1 - n * n)));
      };
      ctx.save();
      ctx.translate(x * T + T / 2, y * T + T / 2);
      if (vertical) ctx.rotate(Math.PI / 2);

      if (!overlay) {
        ctx.fillStyle = 'rgba(8, 13, 22, 0.30)';
        ctx.fillRect(-T / 2, T * 0.02, T, T * 0.43);

        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.13);
        ctx.lineTo(T / 2, -T * 0.13);
        ctx.lineTo(T / 2, archY(u1));
        for (let i = 12; i >= 0; i--) {
          const u = u0 + (u1 - u0) * i / 12;
          ctx.lineTo(localX(u), archY(u));
        }
        ctx.closePath();
        const wall = ctx.createLinearGradient(0, -T * 0.13, 0, T * 0.44);
        wall.addColorStop(0, '#b18a63');
        wall.addColorStop(0.55, '#806044');
        wall.addColorStop(1, '#49372d');
        ctx.fillStyle = wall;
        ctx.fill();

        ctx.save();
        ctx.clip();
        ctx.strokeStyle = 'rgba(48, 34, 27, 0.55)';
        ctx.lineWidth = 1;
        for (let row = 0; row < 4; row++) {
          const yy = -T * 0.08 + row * T * 0.105;
          ctx.beginPath(); ctx.moveTo(-T / 2, yy); ctx.lineTo(T / 2, yy); ctx.stroke();
        }
        for (let xx = -T / 2 + 5; xx < T / 2; xx += 10) {
          ctx.beginPath(); ctx.moveTo(xx, -T * 0.13); ctx.lineTo(xx, T * 0.38); ctx.stroke();
        }
        ctx.restore();

        ctx.strokeStyle = '#35271f';
        ctx.lineWidth = Math.max(4, T * 0.10);
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) {
          const u = u0 + (u1 - u0) * i / 12;
          const xx = localX(u), yy = archY(u);
          if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.stroke();

        ctx.strokeStyle = '#d9bd98';
        ctx.lineWidth = Math.max(2, T * 0.045);
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) {
          const u = u0 + (u1 - u0) * i / 12;
          const xx = localX(u), yy = archY(u) - T * 0.025;
          if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.stroke();

        ctx.fillStyle = '#49301f';
        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.15);
        ctx.quadraticCurveTo(0, -T * 0.43, T / 2, -T * 0.15);
        ctx.lineTo(T / 2, -T * 0.055);
        ctx.quadraticCurveTo(0, -T * 0.31, -T / 2, -T * 0.055);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#c58a4d';
        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.20);
        ctx.quadraticCurveTo(0, -T * 0.47, T / 2, -T * 0.20);
        ctx.lineTo(T / 2, -T * 0.13);
        ctx.quadraticCurveTo(0, -T * 0.37, -T / 2, -T * 0.13);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#704522';
        ctx.lineWidth = 1.2;
        for (let i = 1; i < 6; i++) {
          const u = i / 6;
          const xx = -T / 2 + u * T;
          const rise = Math.sqrt(Math.max(0, 1 - Math.pow((u - 0.5) * 2, 2)));
          const yy = -T * (0.20 + 0.27 * rise);
          ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx, yy + T * 0.07); ctx.stroke();
        }

        ctx.strokeStyle = '#f2c78d';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.23);
        ctx.quadraticCurveTo(0, -T * 0.51, T / 2, -T * 0.23);
        ctx.stroke();

        ctx.strokeStyle = '#714626';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.12);
        ctx.quadraticCurveTo(0, -T * 0.40, T / 2, -T * 0.12);
        ctx.stroke();
      } else {
        ctx.strokeStyle = '#3b2b22';
        ctx.lineWidth = Math.max(4, T * 0.10);
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) {
          const u = u0 + (u1 - u0) * i / 12;
          const xx = localX(u), yy = archY(u);
          if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBridges(p) {
      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++)
          drawBridgeTile(x, y, p);
    }

    function drawFood(x, y, p) {
      const px = x * T + T / 2;
      const py = y * T + T / 2;
      let imageKey = 'food';
      let size = T;
      if (foodRadius === 2.2) { imageKey = 'foodKlein'; size = T * 0.65; }
      else if (foodRadius === 5.5) { imageKey = 'foodGross'; size = T * 1.2; }
      if (!drawAsset(imageKey, px, py, size)) {
        ctx.fillStyle = p.dot;
        ctx.beginPath();
        ctx.arc(px, py, foodRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = p.ink;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function drawExtraItem(x, y, type) {
      const px = x * T + T / 2;
      const py = y * T + T / 2;
      if (drawAsset(type, px, py, T * 0.9)) return;
      const icons = {
        uhr: '🕒', eiswuerfel: '🧊', frucht: '🍑', totenschaedel: '💀',
        blitz: '⚡', herz: '❤️', powerdose: '🥤', puck: '🟡',
        'elixier-kurz': '🧪', 'elixier-leer': '🧪',
        'sonne-gross': '☀️', 'sonne-klein': '🌤️'
      };
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(icons[type] || '⭐', px, py);
    }

    function drawHead(s, dx, dy) {
      const x = s.x * T + T / 2;
      const y = s.y * T + T / 2;
      const angle = Math.atan2(dy, dx) + Math.PI / 2;
      if (drawAsset('snakeHead', x, y, T, angle)) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#24142f';
      const bodyGrad = ctx.createLinearGradient(0, -9, 0, 9);
      bodyGrad.addColorStop(0, '#ff81b5');
      bodyGrad.addColorStop(0.5, '#f52e83');
      bodyGrad.addColorStop(1, '#c91469');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, 10, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff80';
      ctx.beginPath();
      ctx.ellipse(-2, -4, 4, 1.5, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff8df';
      ctx.beginPath();
      ctx.arc(3, -3, 2.8, 0, Math.PI * 2);
      ctx.arc(6, -1.5, 2.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#24142f';
      ctx.beginPath();
      ctx.arc(4, -3, 1.2, 0, Math.PI * 2);
      ctx.arc(7, -1.5, 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawWormBody(points) {
      if (!points.length) return;
      if (points.length > 1) {
        const centers = points.map(p => ({ x: p.x * T + T / 2, y: p.y * T + T / 2 }));
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(centers[0].x, centers[0].y);
        if (centers.length === 2) {
          ctx.lineTo(centers[1].x, centers[1].y);
        } else {
          for (let i = 1; i < centers.length - 1; i++) {
            const midX = (centers[i].x + centers[i + 1].x) / 2;
            const midY = (centers[i].y + centers[i + 1].y) / 2;
            ctx.quadraticCurveTo(centers[i].x, centers[i].y, midX, midY);
          }
          const last = centers[centers.length - 1];
          const beforeLast = centers[centers.length - 2];
          ctx.quadraticCurveTo(beforeLast.x, beforeLast.y, last.x, last.y);
        }
        ctx.strokeStyle = '#e6257a';
        ctx.lineWidth = T * 0.50;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();
      }
      for (let i = 1; i < points.length - 1; i++) {
        const prev = points[i - 1];
        const next = points[i + 1];
        const s = points[i];
        const x = s.x * T + T / 2;
        const y = s.y * T + T / 2;
        const inDir = { x: s.x - prev.x, y: s.y - prev.y };
        const outDir = { x: next.x - s.x, y: next.y - s.y };
        const cross = inDir.x * outDir.y - inDir.y * outDir.x;
        const isCorner = cross !== 0;
        if (isCorner) {
          const incomingAngle = Math.atan2(inDir.y, inDir.x);
          if (!drawAsset('snakeCorner', x, y, T, incomingAngle, cross < 0)) {
            ctx.save();
            ctx.strokeStyle = '#e6257a';
            ctx.lineWidth = T * 0.50;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(prev.x * T + T / 2, prev.y * T + T / 2);
            ctx.quadraticCurveTo(x, y, next.x * T + T / 2, next.y * T + T / 2);
            ctx.stroke();
            ctx.restore();
          }
        } else {
          const angle = Math.atan2(outDir.y, outDir.x);
          drawAsset('snakeBody', x, y, T, angle);
        }
      }
      if (points.length > 1) {
        const tail = points[points.length - 1];
        const before = points[points.length - 2];
        const x = tail.x * T + T / 2;
        const y = tail.y * T + T / 2;
        const outwardAngle = Math.atan2(tail.y - before.y, tail.x - before.x);
        const tailRotation = outwardAngle - Math.PI / 2;
        if (!drawAsset('snakeTail', x, y, T, tailRotation)) {
          ctx.fillStyle = '#e6257a';
          ctx.beginPath();
          ctx.arc(x, y, T * 0.29, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawPuckShot(s) {
      const x = s.x * T + T / 2;
      const y = s.y * T + T / 2;
      const angle = Math.atan2(s.dy, s.dx) + Math.PI / 2;
      if (drawAsset('puck', x, y, T * 0.65, angle)) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = '#f8c94e';
      ctx.strokeStyle = '#24142f';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function draw(message = '') {
      const p = palettes[stage % palettes.length];
      ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++)
          tile(x, y, p);

      drawBridges(p);

      for (const k of pellets) {
        if (extra && k === `${extra.x},${extra.y}`) continue;
        const [x, y] = k.split(',').map(Number);
        drawFood(x, y, p);
      }

      if (extra) drawExtraItem(extra.x, extra.y, extra.type);

      const progress = visualFrom.length ? Math.min(1, (performance.now() - moveAnimStart) / moveDelay) : 1;
      const shownSnake = snake.map((s, i) => {
        const from = visualFrom.length
          ? visualFrom[Math.min(Math.max(i - 1, 0), visualFrom.length - 1)]
          : s;
        return {
          x: from.x + (s.x - from.x) * progress,
          y: from.y + (s.y - from.y) * progress,
          layer: s.layer || 0
        };
      });

      drawWormBody(shownSnake);
      if (shownSnake.length) drawHead(shownSnake[0], facing.x, facing.y);

      for (const part of shownSnake) {
        if (part.layer === 2) {
          drawBridgeTile(Math.round(part.x), Math.round(part.y), p, true);
        }
      }

      if (projectile) drawPuckShot(projectile);

      if (ui.picker) ui.picker.hidden = state === 'playing';

      if (state === 'title' || state === 'gameover' || state === 'won' || message) {
        ctx.fillStyle = '#24142fcd';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        ctx.textAlign = 'center';
        ctx.font = '700 22px "Press Start 2P", cursive, sans-serif';
        const titleText = message || (state === 'gameover' ? 'SPIEL VORBEI' : state === 'won' ? 'GESCHAFFT!' : 'SUPER PIMMELCHEN');
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#24142f';
        ctx.strokeText(titleText, GAME_WIDTH / 2, GAME_HEIGHT / 2 - 10);
        ctx.fillStyle = '#ffd34f';
        ctx.fillText(titleText, GAME_WIDTH / 2, GAME_HEIGHT / 2 - 10);
        ctx.fillStyle = '#fff0bd';
        ctx.font = '700 12px "Fredoka", sans-serif';
        const subText = (state === 'gameover' || state === 'won')
          ? 'DRÜCKE ENTER / LEERTASTE FÜR NEUSTART'
          : 'DRÜCKE ENTER / PFEILTASTE ZUM STARTEN';
        ctx.fillText(subText, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 30);
      }
    }

    // ---- Eingaben ----
    function handleKey(e) {
      const d = dirs[e.key];
      if (d) {
        e.preventDefault();
        if (e.repeat) return;
        activeDirectionKey = e.key;
        setDirection(d);
        return;
      }
      if (e.code === 'Space') { e.preventDefault(); fire(); return; }
      if (e.key === 'Enter') { e.preventDefault(); start(); }
    }

    window.addEventListener('keydown', handleKey);
    window.addEventListener('keyup', e => {
      if (dirs[e.key]) {
        e.preventDefault();
        if (e.key === activeDirectionKey) {
          activeDirectionKey = null;
          stopMove();
        }
      }
    });
    window.addEventListener('blur', stopMove);

    const fullscreenButton = document.querySelector('#fullscreen-button');
    const cabinet = document.querySelector('.cabinet');
    if (fullscreenButton) {
      fullscreenButton.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
            if (screen.orientation && screen.orientation.unlock) {
              screen.orientation.unlock();
            }
          } else if (cabinet.requestFullscreen) {
            await cabinet.requestFullscreen();

            // Das Spielfeld ist im Querformat deutlich größer.
            // Die Sperre wird nur versucht; nicht jeder Browser unterstützt sie.
            if (isTouch && screen.orientation && screen.orientation.lock) {
              try {
                await screen.orientation.lock('landscape');
              } catch (orientationError) {
                console.info('Automatisches Querformat wird vom Browser nicht unterstützt.');
              }
            }
          } else {
            fullscreenButton.textContent = 'Vollbild nicht verfügbar';
          }
        } catch (error) {
          console.warn('Vollbild konnte nicht gestartet werden:', error);
          fullscreenButton.textContent = 'Vollbild nicht verfügbar';
        }
      });
      document.addEventListener('fullscreenchange', () => {
        const isFullscreen = !!document.fullscreenElement;
        fullscreenButton.textContent = isFullscreen ? '⤢ FENSTER' : '⛶ VOLLBILD';

        if (!isFullscreen) {
          if (isTouch && screen.orientation && screen.orientation.unlock) {
            try { screen.orientation.unlock(); } catch (_) {}
          }

          // Einige Mobilbrowser behalten nach dem Vollbildwechsel kurz alte
          // Viewport-Maße. Die Seite wird ausdrücklich wieder scrollbar gemacht.
          document.documentElement.style.removeProperty('overflow');
          document.documentElement.style.removeProperty('overflow-y');
          document.body.style.removeProperty('overflow');
          document.body.style.removeProperty('overflow-y');
          document.body.style.removeProperty('height');
          document.body.style.removeProperty('position');
          requestAnimationFrame(() => window.dispatchEvent(new Event('resize')));
        }

        stopMove();
      });
    }

    // ---- Touch-Steuerung (Multi-Touch-fähig) ----
    // heldDirections speichert pro Pointer-ID die zuletzt gedrückte Richtung.
    // stopMove() wird erst aufgerufen, wenn der LETZTE Finger losgelassen wird.
    const heldDirections = new Map();

    document.querySelectorAll('[data-dir]').forEach(btn => {
      const dirMap = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
      const d = dirs[dirMap[btn.dataset.dir]];
      btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        if (btn.setPointerCapture) {
          try { btn.setPointerCapture(e.pointerId); } catch (_) {}
        }
        heldDirections.set(e.pointerId, d);
        setDirection(d);
      });
      const release = e => {
        if (heldDirections.delete(e.pointerId) && heldDirections.size === 0) {
          stopMove();
        }
      };
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('lostpointercapture', release);
      // Fallback: alte Touch-Events auf iOS < 13
      btn.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    });

    const fireBtn = document.querySelector('#btn-fire');
    if (fireBtn) {
      fireBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        fire();
      });
      fireBtn.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    }

    // ---- Init ----
    resetStage();
    state = 'title';
    draw();
  })();
  </script>
</body>
</html>
