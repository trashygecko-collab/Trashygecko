<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>
/* ===========================================================================
   ZENTRALER GRAFIKSTIL

   Eine Wahl, alle Spiele. Der Stil gehört dem Spieler, nicht dem Raum:
   er liegt ausschließlich im localStorage dieses Browsers (Schlüssel
   "tg-stil") und wird von keinem Server, keiner Raumkonfiguration und
   keiner Admin-Einstellung überschrieben.

   Drei Werte, überall dieselben:
     klassisch · maedchen · buben

   Ein Spiel liest ihn so:
       <script src="/spiele/stil.js"><\/script>
       var stil = TGStil.hole();          // "klassisch" | "maedchen" | "buben"

   Hat ein Spiel eigene Namen für die Ansichten (z. B. "normal" oder
   "jungs"), bildet es sie einmal ab:
       var stil = TGStil.lokal({ klassisch: "normal", maedchen: "maedchen", buben: "buben" });

   Ein Spiel ohne Alternativen braucht nichts zu tun und bleibt klassisch.

   Die zentrale Auswahl steht nur auf der Connector-Seite. Dort füllt dieses
   Skript jede Stelle
       <div data-tg-stil></div>
   mit den drei Knöpfen und hält sie mit der gespeicherten Wahl synchron.
   =========================================================================== */
(function () {
  "use strict";

  var SCHLUESSEL = "tg-stil";
  var WERTE = ["klassisch", "maedchen", "buben"];
  var TEXTE = { klassisch: "Klassisch", maedchen: "Mädchen", buben: "Buben" };

  function gueltig(wert) {
    return WERTE.indexOf(wert) >= 0 ? wert : "klassisch";
  }

  /* Die persönliche Wahl. Unbekanntes oder fehlender Speicher heißt klassisch. */
  function hole() {
    try { return gueltig(localStorage.getItem(SCHLUESSEL)); } catch (e) { return "klassisch"; }
  }

  /* Dieselbe Wahl im Vokabular eines Spiels. */
  function lokal(abbild) {
    var wert = hole();
    if (!abbild) return wert;
    return abbild[wert] || "klassisch";
  }

  function zeigeKnopfZustand(gruppe, wert) {
    var knoepfe = gruppe.querySelectorAll("button[data-stil]");
    for (var i = 0; i < knoepfe.length; i++) {
      var an = knoepfe[i].dataset.stil === wert;
      knoepfe[i].classList.toggle("aktiv", an);
      knoepfe[i].setAttribute("aria-pressed", an ? "true" : "false");
    }
  }

  function anwenden(wert) {
    document.documentElement.dataset.stil = wert;
    /* Natives Erscheinungsbild mitführen: Auswahlfelder, Kontrollkästchen und
       Bildlaufleisten zeichnet der Browser sonst nach dem Betriebssystem.
       Im System-Dunkelmodus würden so schwarze Felder auf den hellen
       Mädchen- und Klassisch-Flächen entstehen. */
    document.documentElement.style.colorScheme = wert === "buben" ? "dark" : "light";
    var gruppen = document.querySelectorAll("[data-tg-stil]");
    for (var i = 0; i < gruppen.length; i++) zeigeKnopfZustand(gruppen[i], wert);
  }

  /* Wahl setzen: speichern, anzeigen, alle offenen Seiten und Spiele rufen. */
  function setze(wert) {
    wert = gueltig(wert);
    try { localStorage.setItem(SCHLUESSEL, wert); } catch (e) { /* ohne Speicher gilt die Wahl für diese Seite */ }
    anwenden(wert);
    window.dispatchEvent(new CustomEvent("tg-stil", { detail: wert }));
    return wert;
  }

  /* Ein Spiel meldet sich hier an und wird bei einer neuen Wahl neu gezeichnet. */
  function beiWechsel(cb) {
    if (typeof cb !== "function") return;
    window.addEventListener("tg-stil", function (e) { cb(e.detail); });
    window.addEventListener("storage", function (e) {
      if (e.key !== SCHLUESSEL) return;
      var wert = hole();
      anwenden(wert);
      cb(wert);
    });
  }

  function style() {
    if (document.getElementById("tg-stil-css")) return;
    var css = document.createElement("style");
    css.id = "tg-stil-css";
    css.textContent =
      ".tg-stil{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:inherit}" +
      ".tg-stil .tg-titel{opacity:.75;letter-spacing:.04em;margin-right:2px}" +
      ".tg-stil button{font:inherit;font-size:12.5px;line-height:1.2;padding:5px 11px;border-radius:999px;" +
      "cursor:pointer;border:1px solid currentColor;background:transparent;color:inherit;opacity:.7}" +
      ".tg-stil button:hover,.tg-stil button:focus-visible{opacity:1}" +
      ".tg-stil button.aktiv{opacity:1;font-weight:700;border-color:transparent;background:#e8cd8e;color:#0b241d}" +
      ".tg-stil button[data-stil=\"maedchen\"].aktiv{background:linear-gradient(#ffd0e4,#ff9ec4);color:#43182c}" +
      ".tg-stil button[data-stil=\"buben\"].aktiv{background:#e0242f;color:#ffffff}";
    document.head.appendChild(css);
  }

  /* Baut die drei Knöpfe in jede vorbereitete Stelle. */
  function steuerung(ziel) {
    if (!ziel) return null;
    style();
    ziel.classList.add("tg-stil");
    ziel.setAttribute("role", "group");
    ziel.setAttribute("aria-label", "Grafikstil");
    ziel.innerHTML = "";

    var titel = document.createElement("span");
    titel.className = "tg-titel";
    titel.textContent = "Grafikstil";
    ziel.appendChild(titel);

    WERTE.forEach(function (wert) {
      var knopf = document.createElement("button");
      knopf.type = "button";
      knopf.dataset.stil = wert;
      knopf.textContent = TEXTE[wert];
      knopf.title = "Gilt für alle Spiele – nur für dich";
      knopf.addEventListener("click", function () { setze(wert); });
      ziel.appendChild(knopf);
    });

    zeigeKnopfZustand(ziel, hole());
    return ziel;
  }

  function montiere() {
    var stellen = document.querySelectorAll("[data-tg-stil]");
    for (var i = 0; i < stellen.length; i++) steuerung(stellen[i]);
  }

  window.TGStil = {
    schluessel: SCHLUESSEL,
    werte: WERTE.slice(),
    hole: hole,
    lokal: lokal,
    setze: setze,
    beiWechsel: beiWechsel,
    steuerung: steuerung
  };

  anwenden(hole());
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { montiere(); anwenden(hole()); });
  } else {
    montiere();
  }
  window.addEventListener("storage", function (e) {
    if (e.key === SCHLUESSEL) anwenden(hole());
  });
})();

  </script>

  overscroll-behavior-y: auto;
}

html {
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.cabinet {
  width: min(100%, 960px);
  margin: auto;
  padding: 12px;
  background: #0a211b;
}

.brand-title {
  margin: 0;
  color: var(--cyan);
  font-family:var(--tg-schrift);
  font-size: clamp(22px, 4vw, 32px);
  letter-spacing: .06em;
  text-shadow: 0 0 10px #00eaff55;
}

.cabinet > section {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  margin: 0 0 12px;
}

.hud-box {
  min-width: 0;
  padding: 7px 3px;
  text-align: center;
  background: #0a211b;
  border: 1px solid var(--cyan);
  border-radius: 5px;
}

.hud-label {
  color: var(--muted);
  font-size: 9px;
  font-weight: 900;
  letter-spacing: .08em;
}

.hud-value {
  color: var(--pink);
  font-family:var(--tg-schrift);
  font-size: clamp(14px, 2.8vw, 20px);
  font-weight: bold;
}

.game-area {
  position: relative;
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
  min-width: 0;
}

.screen-wrapper {
  position: relative;
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
  overflow: hidden;
  background: #0a211b;
  border: 1px solid #184536;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  outline: none;
  touch-action: manipulation;   /* ← changed from 'none' */
}

#level-picker {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0;
  background: transparent;
  border: 0;
  color: var(--cyan);
}

#level-picker label {
  color: var(--cyan);
  font-weight: 900;
}

#level-picker select {
  padding: 8px 10px;
  color: var(--cyan);
  background: #0a211b;
  border: 1px solid var(--cyan);
  border-radius: 4px;
  font: inherit;
}

.arcade-btn {
  padding: 8px 12px;
  color: var(--cyan);
  background: #0a211b;
  border: 1px solid var(--cyan);
  border-radius: 5px;
  font-weight: bold;
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.arcade-btn:active { transform: translateY(1px); }

/* Vollbild verlassen */
#exit-fullscreen-button { display: none; }

.cabinet:fullscreen #exit-fullscreen-button {
  display: block;
  position: absolute;
  z-index: 20;
  top: 6px;
  right: 6px;
  padding: 6px 9px;
  color: var(--pink);
  background: #0a211b;
  border: 1px solid var(--pink);
  border-radius: 4px;
  font-size: 10px;
  font-weight: bold;
}

/* Touch-Steuerung */
#touch-controls { display: none; }

.touch-device #touch-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin: 12px auto 0;
  padding: 0 4px;
  gap: 8px;
  background: transparent;
  border: 0;
}

#touch-controls button {
  touch-action: none;
  user-select: none;
}

.touch-device #btn-fire {
  flex: 0 0 108px;
  width: 108px;
  min-height: 48px;
  padding: 5px;
  color: var(--pink);
  background: #0a211b;
  border: 1px solid var(--pink);
  font-size: 10px;
  font-weight: 900;
  line-height: 1.2;
}

.touch-device #touch-dpad {
  display: grid;
  grid-template-areas:
    ". up ."
    "left . right"
    ". down .";
  grid-template-columns: repeat(3, 42px);
  grid-template-rows: repeat(3, 42px);
  gap: 4px;
  width: max-content;
  margin-left: auto;
  background: transparent;
  border: 0;
}

.touch-device #touch-dpad [data-dir="up"]    { grid-area: up; }
.touch-device #touch-dpad [data-dir="left"]  { grid-area: left; }
.touch-device #touch-dpad [data-dir="right"] { grid-area: right; }
.touch-device #touch-dpad [data-dir="down"]  { grid-area: down; }

.touch-device #touch-dpad button {
  width: 42px;
  min-width: 42px;
  min-height: 42px;
  padding: 0;
  color: var(--cyan);
  background: #0a211b;
  border: 1px solid var(--cyan);
  border-radius: 5px;
  font-size: 18px;
}

/* Handy: randlos */
@media (pointer: coarse) {
  body {
    padding: 0;
    align-items: stretch;
  }

  .cabinet {
    width: 100%;
    max-width: none;
    margin: 0;
    padding: 0;
  }

  .cabinet > section {
    padding: 0 5px;
    gap: 3px;
    margin-bottom: 6px;
  }

  .game-area,
  .screen-wrapper {
    width: 100%;
    max-width: none;
    margin: 0;
  }

  .screen-wrapper {
    border: 0;
    border-radius: 0;
  }
}

/* Vollbild */
.cabinet:fullscreen {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  max-width: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #0a211b;
}

.cabinet:fullscreen > section {
  flex: 0 0 auto;
  gap: 3px;
  margin: 0;
  padding: 4px 5px;
}

.cabinet:fullscreen .hud-box {
  padding: 3px 1px;
  border-radius: 3px;
}

.cabinet:fullscreen .hud-label { font-size: 8px; }

.cabinet:fullscreen .hud-value {
  font-size: clamp(13px, 3.5vh, 18px);
  line-height: 1.05;
}

.cabinet:fullscreen .game-area {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  min-width: 0;
  width: 100%;
  max-width: none;
  margin: 0;
}

.cabinet:fullscreen .screen-wrapper {
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  margin: 0;
  border: 0;
  border-radius: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cabinet:fullscreen canvas {
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  aspect-ratio: auto;
  object-fit: contain;   /* ← changed from 'fill' */
}

/* Der Startbildschirm darf auch im Vollbild da sein (Regel weiter unten). */

/* Touch-Steuerung schwebt über dem Spielfeld */
.touch-device .cabinet:fullscreen #touch-controls {
  position: absolute;
  z-index: 10;
  left: 0;
  right: 0;
  bottom: max(6px, env(safe-area-inset-bottom));
  width: 100%;
  margin: 0;
  padding: 0 max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left));
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 8px;
  background: transparent;
  border: 0;
  pointer-events: none;
}

.touch-device .cabinet:fullscreen #btn-fire,
.touch-device .cabinet:fullscreen #touch-dpad {
  pointer-events: auto;
}

.touch-device .cabinet:fullscreen #btn-fire {
  width: 108px;
  min-height: 46px;
}

.touch-device .cabinet:fullscreen #touch-dpad {
  margin: 0;
  grid-template-columns: repeat(3, 40px);
  grid-template-rows: repeat(3, 40px);
}

.touch-device .cabinet:fullscreen #touch-dpad button {
  width: 40px;
  min-width: 40px;
  min-height: 40px;
}

/* Position Vollbild-Verlassen-Button auf Touch */
@media (pointer: coarse) {
  .cabinet:fullscreen #exit-fullscreen-button {
    display: block !important;
    position: absolute !important;
    z-index: 30 !important;
    left: max(8px, env(safe-area-inset-left)) !important;
    right: auto !important;
    top: auto !important;
    bottom: calc(max(6px, env(safe-area-inset-bottom)) + 54px) !important;
    width: max-content !important;
    height: auto !important;
    margin: 0 !important;
    padding: 5px 7px !important;
    color: #a9c3b6 !important;
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    font-size: 10px !important;
    font-weight: bold !important;
    text-shadow: 0 0 5px #0a211b, 0 0 8px #a9c3b6 !important;
    white-space: nowrap;
    pointer-events: auto !important;
  }
}

  <script>
  (() => {
    'use strict';

    // ---- Touch-Erkennung ----
    const isTouch =
      navigator.maxTouchPoints > 0 ||
      'ontouchstart' in window ||
      (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
      (window.matchMedia && window.matchMedia('(hover: none)').matches);
    if (isTouch) document.documentElement.classList.add('touch-device');

    const W = 20, H = 11, T = 28;
    const GAME_WIDTH = W * T;
    const GAME_HEIGHT = H * T;
    const LEVEL_COUNT = 61;

    /* Schwierigkeitsstufen: sie ändern nur den Takt, in dem ein Special
       erscheint (wie in spimmel.html). */
    const STUFEN = { leicht: 5000, mittel: 15000, schwer: 20000 };
    const STUFE_SCHLUESSEL = 'superPimmelchenStufe';
    let stufe = 'mittel';
    try {
      const gespeichert = localStorage.getItem(STUFE_SCHLUESSEL);
      if (gespeichert && STUFEN[gespeichert]) stufe = gespeichert;
    } catch (_) { /* ohne Speicher gilt MITTEL */ }

    const canvas = document.querySelector('#game');
    const pixelRatio = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(GAME_WIDTH * pixelRatio);
    canvas.height = Math.round(GAME_HEIGHT * pixelRatio);

    const ctx = canvas.getContext('2d');
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // ---- Assets ----
    const ASSET_FILES = {
      food: 'futter',
      foodKlein: 'futterklein',
      foodGross: 'futtergross',
      uhr: 'uhr',
      puck: 'puck',
      eiswuerfel: 'eiswuerfel',
      frucht: 'frucht',
      totenschaedel: 'totenschaedel',
      blitz: 'blitz',
      herz: 'herz',
      powerdose: 'powerdose',
      'elixier-kurz': 'elixier-kurz',
      'elixier-leer': 'elixier-leer',

    const assets = {};

    function loadAsset(key, basename) {
      const quelle = ASSET_DATA[basename];
      if (!quelle) {
        assets[key] = null;
        return;
      }
      const img = new Image();
      assets[key] = img;
      img.onload = () => { if (typeof draw === 'function') draw(); };
      img.src = quelle;
    }

    for (const [key, basename] of Object.entries(ASSET_FILES)) loadAsset(key, basename);

    function drawAsset(key, x, y, size = T, angle = null, flipY = false) {
      const img = assets[key];
      if (!img || !img.complete || !img.naturalWidth) return false;
      ctx.save();
      ctx.translate(x, y);
      if (angle !== null) ctx.rotate(angle);
      if (flipY) ctx.scale(1, -1);
      ctx.drawImage(img, -size / 2, -size / 2, size, size);
      ctx.restore();
      return true;
    }

    // ---- UI-Refs ----
    const ui = {
      score:  document.querySelector('#score'),
      time:   document.querySelector('#time'),
      pucks:  document.querySelector('#pucks'),
      lives:  document.querySelector('#lives'),
      stage:  document.querySelector('#stage-display'),
      picker: document.querySelector('#level-picker'),
      levelSelect: document.querySelector('#start-level'),
      startButton: document.querySelector('#start-game'),
      stufeInfo: document.querySelector('#start-stufe-info'),
      taktAnzeige: document.querySelector('#start-takt'),
      letzteZeile: document.querySelector('#start-letzte')
    };

    // ---- Highscore ----
    const HIGHSCORE_STORAGE_KEY = 'superPimmelchenHighscore';
    let highscoreForThisRunSaved = false;

    function readHighscores() {
      try {
        const entries = JSON.parse(localStorage.getItem(HIGHSCORE_STORAGE_KEY) || '[]');
        return Array.isArray(entries) ? entries.filter(entry =>
          entry && typeof entry.name === 'string' &&
          Number.isFinite(Number(entry.score)) && Number.isFinite(Number(entry.level))
        ) : [];
      } catch (error) {
        console.warn('Highscore konnte nicht gelesen werden:', error);
        return [];
      }
    }

    function showHighscore() {
      const entries = readHighscores().sort((a, b) =>
        Number(b.score) - Number(a.score) || Number(b.level) - Number(a.level)
      ).slice(0, 10);
      if (!entries.length) {
        alert('Noch keine Highscores vorhanden. Spiele eine Runde und sichere dir den ersten Platz!');
        return;
      }
      const lines = entries.map((entry, index) =>
        `${String(index + 1).padStart(2, '0')}. ${entry.name} – ${Number(entry.score)} Punkte | Level ${Number(entry.level)} | ${entry.date || ''}`
      );
      alert('🏆 SUPER PIMMELCHEN – TOP 10\n\n' + lines.join('\n'));
    }

    function recordHighscore() {
      if (highscoreForThisRunSaved || score <= 0) return;
      highscoreForThisRunSaved = true;
      const entries = readHighscores();
      entries.sort((a, b) => Number(b.score) - Number(a.score) || Number(b.level) - Number(a.level));
      if (entries.length >= 10) {
        const last = entries[9];
        const reachedLevel = Math.min(stage + 1, LEVEL_COUNT);
        if (score < Number(last.score) ||
            (score === Number(last.score) && reachedLevel <= Number(last.level))) return;
      }
      const enteredName = prompt(
        `Neuer Highscore!\n${score} Punkte – Level ${Math.min(stage + 1, LEVEL_COUNT)}\n\nWie soll dein Name in der Rangliste lauten?`,
        'Thomas'
      );
      if (enteredName === null || !enteredName.trim()) return;
      entries.push({
        name: enteredName.trim().slice(0, 20),
        score: Number(score),
        level: Number(Math.min(stage + 1, LEVEL_COUNT)),
        date: new Date().toLocaleDateString('de-DE')
      });
      entries.sort((a, b) => Number(b.score) - Number(a.score) || Number(b.level) - Number(a.level));
      try {
        localStorage.setItem(HIGHSCORE_STORAGE_KEY, JSON.stringify(entries.slice(0, 10)));
        alert('🏆 Dein Ergebnis wurde in der Highscore gespeichert!');
      } catch (error) {
        alert('Die Highscore konnte leider nicht gespeichert werden. Bitte prüfe, ob der Browser lokale Daten speichern darf.');
        console.error('Highscore konnte nicht gespeichert werden:', error);
      }
    }

    const highscoreButton = document.querySelector('#show-highscore');
    if (highscoreButton) highscoreButton.addEventListener('click', showHighscore);

    // ---- Level-Auswahl ----
    let selectedStartLevel = 0;
    for (let i = 2; i <= LEVEL_COUNT; i++) {
      const option = document.createElement('option');
      option.value = String(i - 1);
      option.textContent = `Level ${i}`;
      ui.levelSelect.appendChild(option);
    }
    ui.levelSelect.addEventListener('change', () => {
      if (state === 'playing' || state === 'lost') {
        ui.levelSelect.value = String(stage);
        return;
      }
      selectedStartLevel = Number(ui.levelSelect.value) || 0;
      stage = selectedStartLevel;
      updateHud();
      resetStage();
    });
    ui.startButton.addEventListener('click', () => starteSpiel({}));

    // ---- Stufe: nur der Special-Takt hängt daran ----
    const stufeKnoepfe = [...document.querySelectorAll('#stufe-wahl [data-stufe]')];
    function zeigeStufe() {
      stufeKnoepfe.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.stufe === stufe)));
      const taktSekunden = Math.round(STUFEN[stufe] / 1000);
      if (ui.stufeInfo) ui.stufeInfo.textContent = `Specials alle ${taktSekunden} s`;
      if (ui.taktAnzeige) ui.taktAnzeige.textContent = `alle ${taktSekunden} s`;
    }
    stufeKnoepfe.forEach(b => b.addEventListener('click', () => {
      if (!STUFEN[b.dataset.stufe]) return;
      stufe = b.dataset.stufe;
      try { localStorage.setItem(STUFE_SCHLUESSEL, stufe); } catch (_) { /* egal */ }
      zeigeStufe();
      if (state === 'playing' && !isPaused) scheduleNextExtra();
      draw();
    }));
    zeigeStufe();

    /* Startbildschirm: einzige Stelle, die ihn ein- und ausblendet (siehe draw()). */
    function aktualisiereStartInfo() {
      zeigeStufe();
      if (!ui.letzteZeile) return;
      const zeigen = state === 'gameover' || state === 'won';
      ui.letzteZeile.hidden = !zeigen;
      if (zeigen) {
        ui.letzteZeile.textContent = `Letzte Runde: ${score} Punkte · Level ${Math.min(stage + 1, LEVEL_COUNT)}`;
      }
    }

    // ---- Map / Spielfeld ----
function getLevelMap(levelIndex) {
  if (levelIndex === 0) {
    return LEVEL_1_MAP.map(row => [...row]);
  }
  const map = LEVEL_MAPS[levelIndex - 1];
  if (!Array.isArray(map) || map.length !== H) {
    console.warn(`Level ${levelIndex + 1} fehlt oder hat falsche Dimension – Fallback Level 1`);
    return LEVEL_1_MAP.map(row => [...row]);
  }
  return map.map(row => [...row]);
}

    function buildMap() {
      grid = getLevelMap(Math.min(stage, LEVEL_COUNT - 1));
    }

    function placePellets() {
      pellets.clear();
      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++)
          if (grid[y][x] === 2) pellets.add(`${x},${y}`);
    }

    function blocked(x, y) {
      return x < 0 || y < 0 || x >= W || y >= H || grid[y][x] === 1;
    }

    function bridgeAxisAt(x, y) {
      const isBridge = (nx, ny) =>
        nx >= 0 && ny >= 0 && nx < W && ny < H &&
        (grid[ny][nx] === 4 || grid[ny][nx] === 5);
      const left = isBridge(x - 1, y);
      const right = isBridge(x + 1, y);
      const up = isBridge(x, y - 1);
      const down = isBridge(x, y + 1);
      if (left && right) return 'horizontal';
      if (up && down) return 'vertical';
      if ((left || right) && !(up || down)) return 'horizontal';
      if ((up || down) && !(left || right)) return 'vertical';
      if ((left || right) && (up || down)) {
        return (left && right) || !(up && down) ? 'horizontal' : 'vertical';
      }
      return 'horizontal';
    }

    function layerForEntry(x, y, dx, dy) {
      if (x < 0 || y < 0 || x >= W || y >= H || grid[y][x] === 1) return null;
      const value = grid[y][x];
      if (value !== 4 && value !== 5) return 0;
      const axis = bridgeAxisAt(x, y);
      const alongBridge = axis === 'horizontal' ? dy === 0 : dx === 0;
      if (alongBridge) return 1;
      if (value === 5) return 2;
      return null;
    }

    function findSpawn() {
      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++)
          if (grid[y][x] === 3 && !blocked(x, y)) return { x, y };
      const wanted = { x: 12, y: 9 };
      if (!blocked(wanted.x, wanted.y)) return wanted;
      for (let y = H - 2; y >= 1; y--)
        for (let x = 1; x < W - 1; x++)
          if (!blocked(x, y)) return { x, y };
      return { x: 1, y: 1 };
    }

    // ---- Bonus-Item ----
    function placeExtra() {
      if (state !== 'playing' || extra || isPaused) return;
      const free = [];
      for (let y = 1; y < H - 1; y++) {
        for (let x = 1; x < W - 1; x++) {
          if (!blocked(x, y) &&
              !snake.some(s => s.x === x && s.y === y) &&
              (!projectile || projectile.x !== x || projectile.y !== y)) {
            free.push({ x, y });
          }
        }
      }
      if (free.length) {
        const types = [
          'puck','puck','puck','uhr','eiswuerfel','frucht','totenschaedel','blitz',
          'herz','powerdose','sonne-klein','sonne-gross','elixier-kurz','elixier-leer'
        ];
        const type = types[Math.floor(Math.random() * types.length)];
        extra = { ...free[Math.floor(Math.random() * free.length)], type };
        if (type === 'totenschaedel') {
          clearTimeout(extraExpireTimer);
          const thisSkull = extra;
          extraExpireTimer = setTimeout(() => {
            if (extra === thisSkull) { extra = null; draw(); }
            extraExpireTimer = null;
          }, 5000 + Math.random() * 5000);
        }
      }
      draw();
    }

    function clearProjectile() {
      clearInterval(projectileTimer);
      projectileTimer = null;
      projectile = null;
    }

    function updateHud() {
      ui.score.textContent = String(score).padStart(4, '0');
      ui.time.textContent = String(seconds).padStart(2, '0');
      ui.pucks.textContent = String(pucks).padStart(2, '0');
      ui.lives.textContent = String(lives);
      ui.stage.textContent = String(stage + 1).padStart(2, '0');
    }

    function resetStage() {
      stopMove();
      buildMap();
      const spawn = findSpawn();
      snake = [{ ...spawn, layer: 0 }];
      visualFrom = [];
      moveAnimStart = 0;
      dir = { x: 1, y: 0 };
      facing = { x: 1, y: 0 };
      clearProjectile();
      clearTimeout(extraExpireTimer);
      extraExpireTimer = null;
      extra = null;
      clearTimeout(speedTimer); speedTimer = null;
      clearTimeout(sunEffectTimer); sunEffectTimer = null;
      clearTimeout(respawnTimer); respawnTimer = null;
      growthPerFood = 1;
      foodScoreMultiplier = 1;
      foodRadius = 3.5;
      fruitCount = 0;
      moveDelay = 200;
      placePellets();
      pellets.delete(key(spawn.x, spawn.y));
      seconds = 120;
      updateHud();
      draw();
    }

    // ---- Timer-Helfer ----
    function startClock() {
      clearInterval(clockTimer);
      clockTimer = setInterval(() => {
        if (state !== 'playing' || isPaused) return;
        seconds--;
        updateHud();
        if (seconds <= 0) loseLife('ZEIT ABGELAUFEN');
      }, 1000);
    }

    function taktLaenge() {
      return STUFEN[stufe] || STUFEN.mittel;
    }

    function scheduleNextExtra() {
      clearTimeout(extraTimer);
      extraTimer = setTimeout(() => {
        if (state === 'playing' && !isPaused) placeExtra();
        if (state !== 'gameover' && state !== 'won') scheduleNextExtra();
      }, taktLaenge());
    }

    function pauseGame() {
      if (isPaused) return;
      isPaused = true;
      stopMove();
      clearInterval(clockTimer); clockTimer = null;
      clearTimeout(extraTimer); extraTimer = null;
    }

    function resumeGame() {
      if (!isPaused) return;
      isPaused = false;
      if (state === 'playing') {
        startClock();
        scheduleNextExtra();
      }
    }

    /* Einziger Weg in eine Partie – Startknopf, Tastatur und Schnittstelle
       laufen hier zusammen, damit nichts doppelt initialisiert wird. */
    function starteSpiel(konfiguration) {
      if (state === 'playing' || state === 'lost') {
        return { gestartet: false, stufe, level: stage + 1 };
      }
      const ziel = konfiguration || {};
      if (STUFEN[ziel.stufe]) stufe = ziel.stufe;
      try { localStorage.setItem(STUFE_SCHLUESSEL, stufe); } catch (_) { /* ohne Speicher egal */ }
      if (Number.isInteger(ziel.level)) {
        selectedStartLevel = Math.min(Math.max(ziel.level - 1, 0), LEVEL_COUNT - 1);
      }
      if (ui.levelSelect) ui.levelSelect.value = String(selectedStartLevel);
      zeigeStufe();
      start();
      return { gestartet: true, stufe, level: stage + 1 };
    }

    /* Alles anhalten, was tickt – für Rückkehr und Neustart. */
    function stoppeAlles() {
      stopMove();
      clearInterval(clockTimer); clockTimer = null;
      clearTimeout(extraTimer); extraTimer = null;
      clearTimeout(extraExpireTimer); extraExpireTimer = null;
      clearInterval(projectileTimer); projectileTimer = null;
      clearTimeout(speedTimer); speedTimer = null;
      clearTimeout(sunEffectTimer); sunEffectTimer = null;
      clearTimeout(respawnTimer); respawnTimer = null;
      if (animationFrame) { cancelAnimationFrame(animationFrame); animationFrame = 0; }
    }

    /* Zurück zum Startbildschirm: Timer aus, Level neu aufbauen, Werte der
       letzten Runde stehen im Startblatt. Highscore und Einstellungen bleiben. */
    function zurueckZumStart() {
      isPaused = false;
      stoppeAlles();
      state = 'title';
      stage = selectedStartLevel;
      resetStage();
    }

    // ---- Spielablauf ----
    function start() {
      if (state === 'playing' || state === 'lost') return;
      highscoreForThisRunSaved = false;
      score = 0;
      lives = 3;
      pucks = 0;
      fruitCount = 0;
      moveDelay = 200;
      if (state === 'title' || state === 'gameover' || state === 'won') stage = selectedStartLevel;
      isPaused = false;
      state = 'playing';
      resetStage();
      clearInterval(clockTimer); clockTimer = null;
      clearTimeout(extraTimer); extraTimer = null;
      clearTimeout(respawnTimer); respawnTimer = null;
      startClock();
      scheduleNextExtra();
      canvas.focus();
    }

    function stopMove() {
      clearInterval(moveTimer);
      moveTimer = null;
    }

    function setDirection(d) {
      if (state === 'title' || state === 'gameover' || state === 'won') {
        starteSpiel({});
      }
      if (state !== 'playing' || isPaused) return;
      if (snake.length > 1 && d.x === -dir.x && d.y === -dir.y) return;
      dir = d;
      facing = d;
      if (moveTimer) clearInterval(moveTimer);
      if (step()) moveTimer = setInterval(step, moveDelay);
      if (!animationFrame) animationFrame = requestAnimationFrame(animate);
    }

    function activateSpeed() {
      moveDelay = 120;
      clearTimeout(speedTimer);
      if (moveTimer) { clearInterval(moveTimer); moveTimer = setInterval(step, moveDelay); }
      speedTimer = setTimeout(() => {
        moveDelay = 200;
        if (moveTimer) { clearInterval(moveTimer); moveTimer = setInterval(step, moveDelay); }
      }, 7000);
    }

    function collectExtra(type) {
      clearTimeout(extraExpireTimer);
      extraExpireTimer = null;
      extra = null;
      switch (type) {
        case 'puck': pucks += 2; break;
        case 'uhr': seconds += 40; break;
        case 'eiswuerfel': snake = snake.slice(0, Math.max(1, Math.floor(snake.length / 2))); break;
        case 'frucht': {
          const bonus = [100, 200, 400, 800];
          score += bonus[Math.min(fruitCount++, bonus.length - 1)];
          break;
        }
        case 'sonne-klein':
          clearTimeout(sunEffectTimer);
          foodRadius = 2.2; growthPerFood = 0; foodScoreMultiplier = 1;
          sunEffectTimer = setTimeout(() => {
            foodRadius = 3.5; growthPerFood = 1; foodScoreMultiplier = 1;
            sunEffectTimer = null;
          }, 10000);
          break;
        case 'sonne-gross':
          clearTimeout(sunEffectTimer);
          foodRadius = 5.5; growthPerFood = 1; foodScoreMultiplier = 2;
          sunEffectTimer = setTimeout(() => {
            foodRadius = 3.5; growthPerFood = 1; foodScoreMultiplier = 1;
            sunEffectTimer = null;
          }, 10000);
          break;
        case 'elixier-kurz': snake = snake.slice(0, Math.max(1, snake.length - 5)); break;
        case 'elixier-leer': snake = snake.slice(0, 1); break;
        case 'totenschaedel': loseLife('SCHÄDEL!'); return true;
        case 'blitz': advanceLevel(); return true;
        case 'herz': lives++; break;
        case 'powerdose': activateSpeed(); break;
      }
      updateHud();
      return false;
    }

    function step() {
      if (state !== 'playing' || isPaused) return false;
      const head = snake[0];
      const next = { x: head.x + dir.x, y: head.y + dir.y };
      const nextLayer = layerForEntry(next.x, next.y, dir.x, dir.y);
      if (nextLayer === null) { stopMove(); return false; }
      next.layer = nextLayer;

      const nextKey = key(next.x, next.y);
      const eatingPellet = pellets.has(nextKey);
      const willGrow = eatingPellet && growthPerFood > 0;
      const tailIndex = snake.length - 1;
      const hitBody = snake.some((part, i) =>
        i > 0 &&
        !(i === tailIndex && !willGrow) &&
        part.x === next.x && part.y === next.y &&
        (part.layer || 0) === nextLayer
      );
      if (hitBody) { loseLife('KÖRPERKOLLISION'); return false; }

      const before = snake.map(s => ({ ...s }));
      snake.unshift(next);

      if (eatingPellet) {
        pellets.delete(nextKey);
        score += 10 * foodScoreMultiplier;
        if (pellets.size === 0) { advanceLevel(); return false; }
        updateHud();
      }
      if (!willGrow) snake.pop();

      if (extra && next.x === extra.x && next.y === extra.y && collectExtra(extra.type)) return false;

      visualFrom = before;
      moveAnimStart = performance.now();
      if (!animationFrame) animationFrame = requestAnimationFrame(animate);
      draw();
      return true;
    }

    function animate() {
      animationFrame = 0;
      if (isPaused || state !== 'playing') return;
      draw();
      const progress = (performance.now() - moveAnimStart) / moveDelay;
      if (moveTimer || projectile || progress < 1) animationFrame = requestAnimationFrame(animate);
    }

    function fire() {
      if (state === 'title' || state === 'gameover' || state === 'won') {
        starteSpiel({});
        return;
      }
      if (state !== 'playing' || isPaused || pucks < 1 || projectile) return;
      const head = snake[0];
      const x = head.x + facing.x;
      const y = head.y + facing.y;
      if (blocked(x, y)) return;
      pucks--;
      projectile = { x, y, dx: facing.x, dy: facing.y };

      if (extra && extra.x === x && extra.y === y) {
        if (collectExtra(extra.type)) { updateHud(); return; }
      }
      if (pellets.delete(key(x, y))) {
        score += 10;
        if (pellets.size === 0) { advanceLevel(); updateHud(); return; }
      }
      updateHud();
      draw();
      projectileTimer = setInterval(moveProjectile, 90);
      if (!animationFrame) animationFrame = requestAnimationFrame(animate);
    }

    function moveProjectile() {
      if (isPaused) return;
      if (!projectile || state !== 'playing') { clearProjectile(); return; }
      const nx = projectile.x + projectile.dx;
      const ny = projectile.y + projectile.dy;
      if (blocked(nx, ny)) { clearProjectile(); draw(); return; }
      projectile.x = nx;
      projectile.y = ny;
      if (extra && extra.x === nx && extra.y === ny) {
        if (collectExtra(extra.type)) { updateHud(); return; }
      }
      if (pellets.delete(key(nx, ny))) {
        score += 10;
        if (pellets.size === 0) { advanceLevel(); return; }
      }
      updateHud();
      draw();
    }

    function advanceLevel() {
      stopMove();
      clearProjectile();
      stage++;
      if (stage >= LEVEL_COUNT) {
        state = 'won';
        clearInterval(clockTimer); clockTimer = null;
        clearTimeout(extraTimer); extraTimer = null;
        clearTimeout(respawnTimer); respawnTimer = null;
        recordHighscore();
        updateHud();
        draw(`ALLE ${LEVEL_COUNT} LEVEL GESCHAFFT!`);
        return;
      }
      resetStage();
    }

    function loseLife(message) {
      stopMove();
      clearTimeout(speedTimer);
      speedTimer = null;
      moveDelay = 200;
      clearProjectile();
      state = 'lost';
      lives--;
      updateHud();
      draw(message);
      clearTimeout(respawnTimer);
      respawnTimer = setTimeout(() => {
        respawnTimer = null;
        if (state !== 'lost') return;
        if (lives <= 0) {
          state = 'gameover';
          clearInterval(clockTimer); clockTimer = null;
          clearTimeout(extraTimer); extraTimer = null;
          recordHighscore();
          draw('SPIEL VORBEI');
          return;
        }
        const spawn = findSpawn();
        snake = [{ ...spawn, layer: 0 }];
        pellets.delete(key(spawn.x, spawn.y));
        visualFrom = [];
        moveAnimStart = 0;
        dir = { x: 1, y: 0 };
        facing = { x: 1, y: 0 };
        seconds = 120;
        state = 'playing';
        updateHud();
        draw();
      }, 1200);
    }

    // ---- Rendering ----
    function tile(x, y, p) {
      const px = x * T, py = y * T;
      if (grid[y][x] === 1) {
        ctx.fillStyle = p.wall;
        ctx.fillRect(px, py, T, T);
        ctx.strokeStyle = p.ink;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(px + 0.5, py + 0.5, T - 1, T - 1);
        ctx.fillStyle = p.trim;
        ctx.fillRect(px + 2, py + 2, T - 4, 3);
        ctx.fillRect(px + 2, py + 2, 3, T - 4);
        ctx.fillStyle = p.cream + 'aa';
        ctx.fillRect(px + 4, py + 4, 2, 2);
      } else {
        ctx.fillStyle = p.floor;
        ctx.fillRect(px, py, T, T);
        ctx.strokeStyle = p.ink + '20';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, py + 0.5, T - 1, T - 1);
        if ((x * 13 + y * 7) % 5 === 0) {
          ctx.fillStyle = p.cream + '50';
          ctx.beginPath();
          ctx.arc(px + T / 2, py + T / 2, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawBridgeTile(x, y, p, overlay = false) {
      const value = grid[y][x];
      if (value !== 4 && value !== 5) return;
      const axis = bridgeAxisAt(x, y);
      const vertical = axis === 'vertical';
      let first = axis === 'horizontal' ? x : y;
      let last = first;
      const isBridgeAt = n => {
        const bx = axis === 'horizontal' ? n : x;
        const by = axis === 'horizontal' ? y : n;
        if (bx < 0 || by < 0 || bx >= W || by >= H) return false;
        const v = grid[by][bx];
        if (v !== 4 && v !== 5) return false;
        return bridgeAxisAt(bx, by) === axis;
      };
      while (isBridgeAt(first - 1)) first--;
      while (isBridgeAt(last + 1)) last++;
      const span = Math.max(1, last - first + 1);
      const u0 = ((axis === 'horizontal' ? x : y) - first) / span;
      const u1 = u0 + 1 / span;
      const localX = u => -T / 2 + (u - u0) * span * T;
      const archY = u => {
        const n = Math.max(-1, Math.min(1, (u - 0.5) * 2));
        return T * (0.43 - 0.39 * Math.sqrt(Math.max(0, 1 - n * n)));
      };
      ctx.save();
      ctx.translate(x * T + T / 2, y * T + T / 2);
      if (vertical) ctx.rotate(Math.PI / 2);

      if (!overlay) {
        ctx.fillStyle = 'rgba(24,69,54,0.30)';
        ctx.fillRect(-T / 2, T * 0.02, T, T * 0.43);

        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.13);
        ctx.lineTo(T / 2, -T * 0.13);
        ctx.lineTo(T / 2, archY(u1));
        for (let i = 12; i >= 0; i--) {
          const u = u0 + (u1 - u0) * i / 12;
          ctx.lineTo(localX(u), archY(u));
        }
        ctx.closePath();
        const wall = ctx.createLinearGradient(0, -T * 0.13, 0, T * 0.44);
        wall.addColorStop(0, '#6f8f80');
        wall.addColorStop(0.55, '#2c5a49');
        wall.addColorStop(1, '#12332a');
        ctx.fillStyle = wall;
        ctx.fill();

        ctx.save();
        ctx.clip();
        ctx.strokeStyle = 'rgba(15,43,35,0.55)';
        ctx.lineWidth = 1;
        for (let row = 0; row < 4; row++) {
          const yy = -T * 0.08 + row * T * 0.105;
          ctx.beginPath(); ctx.moveTo(-T / 2, yy); ctx.lineTo(T / 2, yy); ctx.stroke();
        }
        for (let xx = -T / 2 + 5; xx < T / 2; xx += 10) {
          ctx.beginPath(); ctx.moveTo(xx, -T * 0.13); ctx.lineTo(xx, T * 0.38); ctx.stroke();
        }
        ctx.restore();

        ctx.strokeStyle = '#0f2b23';
        ctx.lineWidth = Math.max(4, T * 0.10);
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) {
          const u = u0 + (u1 - u0) * i / 12;
          const xx = localX(u), yy = archY(u);
          if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.stroke();

        ctx.strokeStyle = '#d9bc7c';
        ctx.lineWidth = Math.max(2, T * 0.045);
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) {
          const u = u0 + (u1 - u0) * i / 12;
          const xx = localX(u), yy = archY(u) - T * 0.025;
          if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.stroke();

        ctx.fillStyle = '#5b4a2c';
        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.15);
        ctx.quadraticCurveTo(0, -T * 0.43, T / 2, -T * 0.15);
        ctx.lineTo(T / 2, -T * 0.055);
        ctx.quadraticCurveTo(0, -T * 0.31, -T / 2, -T * 0.055);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#d9bc7c';
        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.20);
        ctx.quadraticCurveTo(0, -T * 0.47, T / 2, -T * 0.20);
        ctx.lineTo(T / 2, -T * 0.13);
        ctx.quadraticCurveTo(0, -T * 0.37, -T / 2, -T * 0.13);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#5b4a2c';
        ctx.lineWidth = 1.2;
        for (let i = 1; i < 6; i++) {
          const u = i / 6;
          const xx = -T / 2 + u * T;
          const rise = Math.sqrt(Math.max(0, 1 - Math.pow((u - 0.5) * 2, 2)));
          const yy = -T * (0.20 + 0.27 * rise);
          ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx, yy + T * 0.07); ctx.stroke();
        }

        ctx.strokeStyle = '#d9bc7c';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.23);
        ctx.quadraticCurveTo(0, -T * 0.51, T / 2, -T * 0.23);
        ctx.stroke();

        ctx.strokeStyle = '#5b4a2c';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-T / 2, -T * 0.12);
        ctx.quadraticCurveTo(0, -T * 0.40, T / 2, -T * 0.12);
        ctx.stroke();
      } else {
        ctx.strokeStyle = '#12332a';
        ctx.lineWidth = Math.max(4, T * 0.10);
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) {
          const u = u0 + (u1 - u0) * i / 12;
          const xx = localX(u), yy = archY(u);
          if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBridges(p) {
      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++)
          drawBridgeTile(x, y, p);
    }

    function drawFood(x, y, p) {
      const px = x * T + T / 2;
      const py = y * T + T / 2;
      let imageKey = 'food';
      let size = T;
      if (foodRadius === 2.2) { imageKey = 'foodKlein'; size = T * 0.65; }
      else if (foodRadius === 5.5) { imageKey = 'foodGross'; size = T * 1.2; }
      if (!drawAsset(imageKey, px, py, size)) {
        ctx.fillStyle = p.dot;
        ctx.beginPath();
        ctx.arc(px, py, foodRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = p.ink;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function drawExtraItem(x, y, type) {
      const px = x * T + T / 2;
      const py = y * T + T / 2;
      if (drawAsset(type, px, py, T * 0.9)) return;
      const icons = {
        uhr: '🕒', eiswuerfel: '🧊', frucht: '🍑', totenschaedel: '💀',
        blitz: '⚡', herz: '❤️', powerdose: '🥤', puck: '🟡',
        'elixier-kurz': '🧪', 'elixier-leer': '🧪',
        'sonne-gross': '☀️', 'sonne-klein': '🌤️'
      };
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(icons[type] || '⭐', px, py);
    }

    function drawHead(s, dx, dy) {
      const x = s.x * T + T / 2;
      const y = s.y * T + T / 2;
      const angle = Math.atan2(dy, dx) + Math.PI / 2;
      if (drawAsset('snakeHead', x, y, T, angle)) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#12332a';
      const bodyGrad = ctx.createLinearGradient(0, -9, 0, 9);
      bodyGrad.addColorStop(0, '#a9c3b6');
      bodyGrad.addColorStop(0.5, '#a9c3b6');
      bodyGrad.addColorStop(1, '#12332a');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, 10, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff80';
      ctx.beginPath();
      ctx.ellipse(-2, -4, 4, 1.5, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f6edda';
      ctx.beginPath();
      ctx.arc(3, -3, 2.8, 0, Math.PI * 2);
      ctx.arc(6, -1.5, 2.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#12332a';
      ctx.beginPath();
      ctx.arc(4, -3, 1.2, 0, Math.PI * 2);
      ctx.arc(7, -1.5, 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawWormBody(points) {
      if (!points.length) return;
      if (points.length > 1) {
        const centers = points.map(p => ({ x: p.x * T + T / 2, y: p.y * T + T / 2 }));
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(centers[0].x, centers[0].y);
        if (centers.length === 2) {
          ctx.lineTo(centers[1].x, centers[1].y);
        } else {
          for (let i = 1; i < centers.length - 1; i++) {
            const midX = (centers[i].x + centers[i + 1].x) / 2;
            const midY = (centers[i].y + centers[i + 1].y) / 2;
            ctx.quadraticCurveTo(centers[i].x, centers[i].y, midX, midY);
          }
          const last = centers[centers.length - 1];
          const beforeLast = centers[centers.length - 2];
          ctx.quadraticCurveTo(beforeLast.x, beforeLast.y, last.x, last.y);
        }
        ctx.strokeStyle = '#e8b3a6';
        ctx.lineWidth = T * 0.50;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();
      }
      for (let i = 1; i < points.length - 1; i++) {
        const prev = points[i - 1];
        const next = points[i + 1];
        const s = points[i];
        const x = s.x * T + T / 2;
        const y = s.y * T + T / 2;
        const inDir = { x: s.x - prev.x, y: s.y - prev.y };
        const outDir = { x: next.x - s.x, y: next.y - s.y };
        const cross = inDir.x * outDir.y - inDir.y * outDir.x;
        const isCorner = cross !== 0;
        if (isCorner) {
          const incomingAngle = Math.atan2(inDir.y, inDir.x);
          if (!drawAsset('snakeCorner', x, y, T, incomingAngle, cross < 0)) {
            ctx.save();
            ctx.strokeStyle = '#e8b3a6';
            ctx.lineWidth = T * 0.50;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(prev.x * T + T / 2, prev.y * T + T / 2);
            ctx.quadraticCurveTo(x, y, next.x * T + T / 2, next.y * T + T / 2);
            ctx.stroke();
            ctx.restore();
          }
        } else {
          const angle = Math.atan2(outDir.y, outDir.x);
          drawAsset('snakeBody', x, y, T, angle);
        }
      }
      if (points.length > 1) {
        const tail = points[points.length - 1];
        const before = points[points.length - 2];
        const x = tail.x * T + T / 2;
        const y = tail.y * T + T / 2;
        const outwardAngle = Math.atan2(tail.y - before.y, tail.x - before.x);
        const tailRotation = outwardAngle - Math.PI / 2;
        if (!drawAsset('snakeTail', x, y, T, tailRotation)) {
          ctx.fillStyle = '#a9c3b6';
          ctx.beginPath();
          ctx.arc(x, y, T * 0.29, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawPuckShot(s) {
      const x = s.x * T + T / 2;
      const y = s.y * T + T / 2;
      const angle = Math.atan2(s.dy, s.dx) + Math.PI / 2;
      if (drawAsset('puck', x, y, T * 0.65, angle)) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = '#d9bc7c';
      ctx.strokeStyle = '#12332a';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function draw(message = '') {
      const p = stilPalette();
      ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++)
          tile(x, y, p);

      drawBridges(p);

      for (const k of pellets) {
        if (extra && k === `${extra.x},${extra.y}`) continue;
        const [x, y] = k.split(',').map(Number);
        drawFood(x, y, p);
      }

      if (extra) drawExtraItem(extra.x, extra.y, extra.type);

      const progress = visualFrom.length
        ? Math.min(1, (performance.now() - moveAnimStart) / Math.max(1, moveDelay))
        : 1;
      const shownSnake = snake.map((s, i) => {
        const from = visualFrom.length
          ? visualFrom[Math.min(Math.max(i - 1, 0), visualFrom.length - 1)]
          : s;
        return {
          x: from.x + (s.x - from.x) * progress,
          y: from.y + (s.y - from.y) * progress,
          layer: s.layer || 0
        };
      });

      drawWormBody(shownSnake);
      if (shownSnake.length) drawHead(shownSnake[0], facing.x, facing.y);

      for (const part of shownSnake) {
        if (part.layer === 2) {
          drawBridgeTile(Math.round(part.x), Math.round(part.y), p, true);
        }
      }

      if (projectile) drawPuckShot(projectile);

      if (ui.picker) {
        const spielt = state === 'playing' || state === 'lost';
        if (ui.picker.hidden !== spielt) {
          ui.picker.hidden = spielt;
          document.body.classList.toggle('start-aktiv', !spielt);
          if (!spielt) aktualisiereStartInfo();
        }
      }

      if (state === 'title' || state === 'gameover' || state === 'won' || message) {
        ctx.fillStyle = 'rgba(10,33,27,0.88)';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        ctx.textAlign = 'center';
        ctx.font = '700 22px "Press Start 2P", cursive, sans-serif';
        const titleText = message || (state === 'gameover' ? 'SPIEL VORBEI' : state === 'won' ? 'GESCHAFFT!' : '');
        if (titleText) {
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#12332a';
          ctx.strokeText(titleText, GAME_WIDTH / 2, GAME_HEIGHT / 2 - 10);
          ctx.fillStyle = '#e8cd8e';
          ctx.fillText(titleText, GAME_WIDTH / 2, GAME_HEIGHT / 2 - 10);
        }
        ctx.fillStyle = '#efe6d2';
        ctx.font = '700 12px "Fredoka", sans-serif';
        const subText = (state === 'gameover' || state === 'won')
          ? 'DRÜCKE ENTER / LEERTASTE FÜR NEUSTART'
          : 'DRÜCKE ENTER / PFEILTASTE ZUM STARTEN';
        ctx.fillText(subText, GAME_WIDTH / 2, GAME_HEIGHT / 2 + (titleText ? 30 : 0));
      }
    }

    // ---- Eingaben: Tastatur ----
    function handleKeyDown(e) {
      const d = dirs[e.key];
      if (d) {
        e.preventDefault();
        if (e.repeat) return;
        pressedDirs.add(e.key);
        activeDirectionKey = e.key;
        setDirection(d);
        return;
      }
      if (e.code === 'Space') { e.preventDefault(); fire(); return; }
      if (e.key === 'Enter') { e.preventDefault(); starteSpiel({}); }
    }

    function handleKeyUp(e) {
      if (!dirs[e.key]) return;
      e.preventDefault();
      pressedDirs.delete(e.key);
      if (pressedDirs.size === 0) {
        activeDirectionKey = null;
        stopMove();
      } else if (e.key === activeDirectionKey) {
        activeDirectionKey = [...pressedDirs].pop();
      }
    }

    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);
    window.addEventListener('blur', () => {
      pressedDirs.clear();
      activeDirectionKey = null;
      pauseGame();
    });
    window.addEventListener('focus', resumeGame);

    // ---- Fullscreen ----
    const exitFullscreenButton = document.querySelector('#exit-fullscreen-button');
    if (exitFullscreenButton) {
      exitFullscreenButton.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
        } catch (error) {
          console.warn('Vollbild konnte nicht beendet werden:', error);
        }
      });
    }

    const fullscreenButton = document.querySelector('#fullscreen-button');
    const cabinet = document.querySelector('.cabinet');
    if (fullscreenButton) {
      fullscreenButton.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
            if (screen.orientation && screen.orientation.unlock) {
              screen.orientation.unlock();
            }
          } else if (cabinet.requestFullscreen) {
            await cabinet.requestFullscreen();
            if (isTouch && screen.orientation && screen.orientation.lock) {
              try {
                await screen.orientation.lock('landscape');
              } catch (_) {
                console.info('Automatisches Querformat wird vom Browser nicht unterstützt.');
              }
            }
          } else {
            fullscreenButton.textContent = 'Vollbild nicht verfügbar';
          }
        } catch (error) {
          console.warn('Vollbild konnte nicht gestartet werden:', error);
          fullscreenButton.textContent = 'Vollbild nicht verfügbar';
        }
      });
      document.addEventListener('fullscreenchange', () => {
        const isFullscreen = !!document.fullscreenElement;
        fullscreenButton.textContent = isFullscreen ? '⤢ FENSTER' : '⛶ VOLLBILD';

        if (!isFullscreen) {
          if (isTouch && screen.orientation && screen.orientation.unlock) {
            try { screen.orientation.unlock(); } catch (_) {}
          }
          document.documentElement.style.removeProperty('overflow');
          document.documentElement.style.removeProperty('overflow-y');
          document.body.style.removeProperty('overflow');
          document.body.style.removeProperty('overflow-y');
          document.body.style.removeProperty('height');
          document.body.style.removeProperty('position');
          requestAnimationFrame(() => window.dispatchEvent(new Event('resize')));
        }

        stopMove();
      });
    }

    // ---- Touch-Steuerung ----
    const heldDirections = new Map();

    document.querySelectorAll('[data-dir]').forEach(btn => {
      const dirMap = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
      const d = dirs[dirMap[btn.dataset.dir]];
      btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        if (btn.setPointerCapture) {
          try { btn.setPointerCapture(e.pointerId); } catch (_) {}
        }
        heldDirections.set(e.pointerId, d);
        setDirection(d);
      });
      const release = e => {
        if (heldDirections.delete(e.pointerId) && heldDirections.size === 0) {
          stopMove();
        }
      };
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('lostpointercapture', release);
      btn.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    });

    const fireBtn = document.querySelector('#btn-fire');
    if (fireBtn) {
      fireBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        fire();
      });
      fireBtn.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    }

    /* ---- Öffentliche Startschnittstelle (wie in spimmel.html) ----
       window.SuperPimmelchen.start({ stufe, level }): stufe ist
       'leicht' | 'mittel' | 'schwer', level 1–61. Fehlende Felder bleiben auf
       der aktuellen Auswahl, ungültige Werte brechen ab, ohne das Spiel
       anzufassen. bereit = true, sobald das Spiel initialisiert ist (dazu das
       Ereignis 'superpimmelchen:bereit'). Unbekannte Felder werden ignoriert. */
    const SCHNITTSTELLE_VERSION = '1.0.0';

    function pruefeStartKonfiguration(konfiguration) {
      if (konfiguration === undefined || konfiguration === null) {
        return { ok: true, wert: { stufe, level: selectedStartLevel + 1 } };
      }
      if (typeof konfiguration !== 'object' || Array.isArray(konfiguration)) {
        return { ok: false, fehler: 'konfiguration-muss-objekt-sein' };
      }
      const wert = { stufe, level: selectedStartLevel + 1 };
      if ('stufe' in konfiguration) {
        const gewuenscht = String(konfiguration.stufe).toLowerCase();
        if (!STUFEN[gewuenscht]) return { ok: false, fehler: 'unbekannte-stufe' };
        wert.stufe = gewuenscht;
      }
      if ('level' in konfiguration) {
        const zahl = Number(konfiguration.level);
        if (!Number.isInteger(zahl) || zahl < 1 || zahl > LEVEL_COUNT) {
          return { ok: false, fehler: `level-muss-1-bis-${LEVEL_COUNT}-sein` };
        }
        wert.level = zahl;
      }
      return { ok: true, wert };
    }

    const schnittstelle = {
      version: SCHNITTSTELLE_VERSION,
      bereit: false,
      start(konfiguration) {
        if (!schnittstelle.bereit) return { ok: false, fehler: 'spiel-nicht-bereit' };
        const pruefung = pruefeStartKonfiguration(konfiguration);
        if (!pruefung.ok) return { ok: false, fehler: pruefung.fehler };
        const lauf = starteSpiel(pruefung.wert);
        if (!lauf.gestartet) return { ok: false, fehler: 'spiel-laeuft' };
        return { ok: true, stufe: lauf.stufe, level: lauf.level, levelAnzahl: LEVEL_COUNT };
      },
      einstellungen() {
        return {
          bereit: schnittstelle.bereit,
          stufe,
          level: selectedStartLevel + 1,
          levelAnzahl: LEVEL_COUNT,
          specialsTaktMs: STUFEN[stufe]
        };
      },
      zustand() {
        return {
          laeuft: state === 'playing' || state === 'lost',
          pausiert: isPaused,
          stufe,
          level: stage + 1,
          punkte: score,
          leben: lives,
          sekunden: seconds,
          specials: extra ? 1 : 0,
          laenge: snake.length,
          kopf: snake.length ? { x: snake[0].x, y: snake[0].y } : null,
          startbildschirm: document.body.classList.contains('start-aktiv')
        };
      },
      startbildschirm() {
        zurueckZumStart();
        return { ok: true };
      }
    };
    window.SuperPimmelchen = schnittstelle;

    // ---- Init ----
    resetStage();
    state = 'title';
    draw();
    aktualisiereStartInfo();
    schnittstelle.bereit = true;
    window.dispatchEvent(new CustomEvent('superpimmelchen:bereit', {
      detail: { version: SCHNITTSTELLE_VERSION }
    }));
  })();
  </script>
<script data-ziel="main.cabinet > section">
/*
 * TRASHYGECKO – „Zurück zum Connector“ für Einzelspieler-Spiele
 *
 * Eine Datei für alle Spiele: sie setzt einen kleinen Knopf in die Seite und
 * regelt die Rückkehr je nach Umgebung.
 *
 *   PC (Connector):        Das Spiel läuft im rechten Rahmen. Der Knopf meldet
 *                          sich beim Connector; der leert nur den Rahmen. Chat
 *                          und Spieleliste links bleiben, kein Neuladen.
 *   Handy / Tablet:        Das Spiel läuft im eigenen Tab. Der Knopf schließt
 *                          ihn (window.close). Verhindert der Browser das,
 *                          geht es wie bisher zurück zum Connector.
 *
 * Einbau: eine Zeile vor </body>, Pfad je nach Tiefe der Spielseite:
 *
 *   <script src="../zurueck.js"><\/script>
 *   <script src="../../zurueck.js"><\/script>
 *
 * Platzwahl über data-Attribute am Script-Tag (alle freiwillig):
 *
 *   data-ziel=".titelleiste"   Behälter, in den der Knopf kommt
 *   data-vor=".kreuz"          darin vor dieses Element
 *   data-anfang="1"            als erstes Kind des Behälters
 *   data-auf="karte"           als eigene Zeile oben in einer Karte
 *   data-nur="ohne-room"       nicht zeigen, wenn ?room= in der Adresse steht
 *   data-kein-knopf="1"        nur window.tgZurueck() bereitstellen
 *
 * Ohne data-ziel landet der Knopf in der Titelleiste des Fensters
 * (.titelleiste), sonst fest in der Ecke oben rechts.
 *
 * Für Spiele mit eigenem Zurück-Knopf: window.tgZurueck() aufrufen.
 */
(function () {
    "use strict";

    // In der Android-App (WebView mit Bruecke TMahjong) gibt es weder Connector
    // noch Rahmen: die App hat ihren eigenen Knopf "SPIEL VERLASSEN".  Hier also
    // gar nichts tun - kein Knopf, kein window.tgZurueck.
    if (window.TMahjong) return;

    // Nie zwei Knöpfe in einer Seite.
    if (document.querySelector(".tg-zurueck")) return;

    const skript = document.currentScript;
    const daten = skript ? skript.dataset : {};
    const CONNECTOR = "../spiele.html";

    // In einer laufenden Mehrspieler-Partie gehört das Verlassen dem Spiel.
    if (daten.nur === "ohne-room") {
        try {
            if (new URLSearchParams(location.search).has("room")) return;
        } catch (fehler) {
            return;
        }
    }

    // --------------------------------------------------
    // WOHIN ZURÜCK?
    // --------------------------------------------------

    // Connector-Adresse: die des Tabs, der das Spiel geöffnet hat (Referrer),
    // sonst dieselbe Herkunft wie die Seite, sonst die bekannte Online-Adresse.
    function connectorAdresse() {
        const herkunft = String(document.referrer || "");

        if (/\/connector(?:[/?#]|$)/.test(herkunft)) {
            return herkunft.replace(/[?#].*$/, "");
        }

        if (location.protocol === "http:" || location.protocol === "https:") {
            return location.origin + "/connector";
        }

        return CONNECTOR;
    }

    function imRahmen() {
        try {
            return Boolean(window.parent) && window.parent !== window;
        } catch (fehler) {
            // Fremder Rahmen: dann lieber wie ein eigener Tab behandeln.
            return false;
        }
    }

    function zurueck() {
        // PC: nur den rechten Rahmen schließen. Der Connector hört zu.
        if (imRahmen()) {
            try {
                window.parent.postMessage(
                    { tg: "spiel", art: "verlassen", hinweis: "Spiel geschlossen." },
                    location.origin === "null" ? "*" : location.origin
                );

                return;
            } catch (fehler) {
                // Weiter unten mit window.close / Adresse versuchen.
            }
        }

        // Eigener Tab: erst schließen versuchen.
        let zu = false;

        try {
            window.close();
            zu = window.closed;
        } catch (fehler) {
            zu = false;
        }

        if (zu) return;

        // Der Browser lässt das Schließen nicht zu: zurück zum Connector,
        // ohne den Tab dahinter (die Homepage) anzufassen.
        setTimeout(function () {
            try {
                if (!window.closed) location.href = connectorAdresse();
            } catch (fehler) {
                location.href = CONNECTOR;
            }
        }, 60);
    }

    // --------------------------------------------------
    // AUSSEHEN
    // --------------------------------------------------

    function stilEinsetzen() {
        if (document.getElementById("tg-zurueck-stil")) return;

        const stil = document.createElement("style");

        stil.id = "tg-zurueck-stil";
        stil.textContent = [
            // Dezent: kleine Schrift, dunkles Grün, goldener Rand wie in den
            // Spielen selbst. Erst beim Berühren wird er kräftiger.
            ".tg-zurueck{",
            "  font:inherit;font-size:11px;line-height:1.35;letter-spacing:.02em;",
            "  padding:3px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;",
            "  color:#e8cd8e;background:#0b241d;border:1px solid #d9bc7c66;opacity:.85;",
            "  transition:background .15s,color .15s,opacity .15s,border-color .15s;",
            "}",
            ".tg-zurueck:hover,.tg-zurueck:focus-visible{",
            "  background:#184536;color:#f6edda;border-color:#e8cd8e;opacity:1;outline:none;",
            "}",
            // In einer Reihe (Titelleiste, HUD) rutscht der Knopf nach rechts.
            // Red Reactor (Buben-Ansicht): Metallfläche mit roter LED-Kante.
            '[data-stil="buben"] .tg-zurueck,[data-stil="jungs"] .tg-zurueck,',
            '[data-stil="maenner"] .tg-zurueck{',
            "  color:#e6e9ec;background:#16181c;border-color:#e0242f;opacity:.9;",
            "}",
            '[data-stil="buben"] .tg-zurueck:hover,[data-stil="buben"] .tg-zurueck:focus-visible,',
            '[data-stil="jungs"] .tg-zurueck:hover,[data-stil="jungs"] .tg-zurueck:focus-visible,',
            '[data-stil="maenner"] .tg-zurueck:hover,[data-stil="maenner"] .tg-zurueck:focus-visible{',
            "  background:#23262c;color:#ffffff;border-color:#ff5560;",
            "}",
            // Mädchen-Ansicht: das helle Bonbonrosa der Spielseiten, nicht das
            // dunkle Grün des Klassikers (fehlte bisher ganz).
            '[data-stil="maedchen"] .tg-zurueck{',
            "  color:#5b0f2e;background:#fff6fa;border-color:#ef7aa8;opacity:.95;",
            "}",
            '[data-stil="maedchen"] .tg-zurueck:hover,[data-stil="maedchen"] .tg-zurueck:focus-visible{',
            "  background:#ffe3ef;color:#3a0f24;border-color:#b06bff;",
            "}",
            ".tg-zurueck--rechts{margin-left:auto}",
            // Eigene Zeile in einer Karte (1×1-Rennen, Paare).
            ".tg-zurueck--karte{display:block;margin:0 0 10px auto}",
            // Notnagel, wenn ein Spiel keine passende Leiste hat.
            ".tg-zurueck--ecke{position:fixed;top:8px;right:8px;z-index:2147483000}",
            // Lange Titel bekommen Platz, statt die Leiste zu sprengen.
            ".tg-mit-zurueck .titel{min-width:0;overflow:hidden;text-overflow:ellipsis;",
            "  white-space:nowrap}",
            // Am Handy wird der Knopf mit dem Finger getroffen: mindestens
            // 30 px hoch statt der 23 px der dezenten PC-Fassung.
            "@media(max-width:520px){.tg-zurueck{font-size:11px;padding:4px 9px;min-height:30px;box-sizing:border-box}}"
        ].join("");

        (document.head || document.documentElement).appendChild(stil);
    }

    function istReihe(element) {
        try {
            const anzeige = getComputedStyle(element).display;

            return anzeige.indexOf("flex") !== -1 || anzeige.indexOf("grid") !== -1;
        } catch (fehler) {
            return false;
        }
    }

    function knopfEinsetzen() {
        const knopf = document.createElement("button");

        knopf.type = "button";
        knopf.className = "tg-zurueck";
        knopf.id = "tgZurueck";
        knopf.textContent = "Zurück zur Spieleliste";
        knopf.title = "Spiel schließen und zurück zur Spieleliste";
        knopf.addEventListener("click", zurueck);

        const ziel = daten.ziel ? document.querySelector(daten.ziel) : null;
        const vor = daten.vor ? document.querySelector(daten.vor) : null;
        const leiste = document.querySelector(".titelleiste");

        // 1. Ausdrücklich genannter Behälter.
        if (ziel) {
            if (daten.anfang === "1") {
                ziel.insertBefore(knopf, ziel.firstChild);
                if (daten.auf === "karte") knopf.classList.add("tg-zurueck--karte");
            } else if (vor && vor.parentElement === ziel) {
                ziel.insertBefore(knopf, vor);
                if (istReihe(ziel)) knopf.classList.add("tg-zurueck--rechts");
            } else {
                ziel.appendChild(knopf);
                if (istReihe(ziel)) knopf.classList.add("tg-zurueck--rechts");
            }

            return;
        }

        // 2. Die Fensterleiste der Brett- und Denkspiele.
        if (leiste) {
            leiste.classList.add("tg-mit-zurueck");

            const kreuz = leiste.querySelector(".kreuz");

            if (kreuz) {
                kreuz.parentElement.insertBefore(knopf, kreuz);
            } else {
                leiste.appendChild(knopf);
            }

            knopf.classList.add("tg-zurueck--rechts");

            return;
        }

        // 2b. Keine Fensterleiste mehr (Titelzeile entfernt): die oberste
        // Bedienzeile des Spiels nehmen, damit der Knopf nicht über dem Feld
        // schwebt. Rechtsbündig, wenn die Zeile eine Reihe ist.
        const reihe = document.querySelector(".menueleiste") || document.querySelector(".kopf");

        if (reihe) {
            reihe.classList.add("tg-mit-zurueck");
            reihe.appendChild(knopf);

            if (istReihe(reihe)) knopf.classList.add("tg-zurueck--rechts");

            return;
        }

        // 3. Notnagel: Ecke oben rechts.
        knopf.classList.add("tg-zurueck--ecke");
        document.body.appendChild(knopf);
    }

    // Spiele mit eigenem Zurück-Knopf (Mahjong, Tetris) rufen das hier auf.
    window.tgZurueck = zurueck;

    // data-kein-knopf="1": nur die Funktion bereitstellen, nichts einbauen.
    function start() {
        if (daten.keinKnopf === "1") return;

        stilEinsetzen();
        knopfEinsetzen();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start);
    } else {
        start();
    }
})();

</script>

  <script>
/* Rechnet die Feldbreite aus der freien Höhe: Höhe mal 20/11, nie breiter als
   der Platz daneben. Nur die Darstellung – Spiel, Level und Steuerung bleiben. */
(function () {
  'use strict';
  /* Schriften sofort bereitstellen – die Zeichenflaeche zeichnet sonst mit Ersatzschrift,
     weil der Browser Schriften fuer Canvas nicht selbst nachlaedt. */
  if (document.fonts && document.fonts.load) {
    document.fonts.load('700 22px "Press Start 2P"');
    document.fonts.load('600 12px Fredoka');
    document.fonts.load('700 12px Fredoka');
  }
  const wrap = document.querySelector('.screen-wrapper');
  const area = document.querySelector('.game-area');
  if (!wrap || !area) return;

  function passe() {
    wrap.style.maxWidth = '';
    if (!window.matchMedia('(orientation: landscape) and (max-height: 560px)').matches) return;
    let reserviert = 24; /* Rand des Kastens oben und unten */
    ['main.cabinet > section', '#level-picker'].forEach(function (sel) {
      const e = document.querySelector(sel);
      if (e) reserviert += e.getBoundingClientRect().height + 8;
    });
    const freiHoehe = Math.max(120, window.innerHeight - reserviert - 6);
    const steuer = document.getElementById('touch-controls');
    const steuerBreite = steuer && steuer.offsetParent ? steuer.getBoundingClientRect().width + 8 : 0;
    const freiBreite = Math.max(160, area.clientWidth - steuerBreite);
    wrap.style.maxWidth = Math.round(Math.min(freiHoehe * 20 / 11, freiBreite)) + 'px';
  }

  window.addEventListener('resize', passe);
  window.addEventListener('orientationchange', passe);
  document.addEventListener('fullscreenchange', passe);
  passe();
})();
  </script>
