<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.Spiele – Vorschau Startbildschirm</title>
<style>
  html, body { margin:0; height:100%; }
  body{
    background:#070f0d;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    font-family:Georgia, "Times New Roman", serif;
  }

  /* Der Handy-Rahmen: 390 × 844 Bildpunkte wie ein gängiges Handy. */
  .handy{
    position:relative;
    width:390px; height:844px;
    box-sizing:border-box;
    display:flex; flex-direction:column; align-items:center;
    padding:62px 32px 44px;
    border-radius:26px;
    overflow:hidden;
    /* wie GradientDrawable: helles Grün in der Mitte, dunkel am Rand */
    background:radial-gradient(circle 658px at 50% 50%,
      #1d4b3e 0%, #123329 55%, #0a211b 100%);
    box-shadow:0 18px 50px #000a, inset 0 0 0 1px #ffffff10;
  }

  .schmuck{
    color:#d9bc7c; font-size:12px; letter-spacing:.35em;
    text-align:center; white-space:nowrap;
  }
  h1{
    margin:18px 0 0;
    font-size:38px; font-weight:400; letter-spacing:.10em;
    color:#f1dca8; text-align:center;
  }
  .unter{
    margin-top:12px;
    font-size:11px; letter-spacing:.32em;
    color:#efe6d2; text-align:center;
  }
  .strich{
    width:104px; height:1px; margin-top:30px;
    background:#d9bc7c66;
  }

  .luft-oben{ flex:1 1 0; }
  .luft-unten{ flex:0.618 1 0; }   /* goldener Schnitt: 1 : 0,618 */

  .weg{
    width:100%; box-sizing:border-box;
    display:flex; flex-direction:column; align-items:center;
    padding:20px;
    border-radius:6px;
    background:#12332af2;
    border:1px solid #d9bc7caa;
    text-align:center;
  }
  .weg .name{
    font-size:19px; letter-spacing:.06em; color:#f1dca8;
  }
  .weg .zusatz{
    margin-top:7px;
    font-size:12px; letter-spacing:.10em; color:#c9bfa8;
  }
  .luecke{ height:34px; }

  .hinweis{
    font-family:system-ui, sans-serif;
    font-size:12px; color:#7d8b86; letter-spacing:.02em;
  }
</style>
</head>
<body>

<div class="handy">
  <div class="schmuck">✦&nbsp;&nbsp;&nbsp;✦&nbsp;&nbsp;&nbsp;✦</div>
  <h1>T.Spiele</h1>
  <div class="unter">CHAT UND SPIELE</div>
  <div class="strich"></div>

  <div class="luft-oben"></div>

  <div class="weg">
    <div class="name">Connector öffnen</div>
    <div class="zusatz">Chat und alle Spiele</div>
  </div>

  <div class="luecke"></div>

  <div class="weg">
    <div class="name">Meine Homepage</div>
  </div>

  <div class="luft-unten"></div>
</div>

<p class="hinweis">Vorschau des Startbildschirms – Farben, Schrift und Abstände wie in der App</p>

</body>
</html>
