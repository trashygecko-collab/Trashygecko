html.hiphop-theme{min-height:100%;background:#000;color:#f5f5ff;color-scheme:dark;font-family:Arial,Helvetica,sans-serif}
body.hiphop-theme{max-width:960px;margin:0 auto;padding:clamp(1rem,4vw,3rem);box-sizing:border-box;background:#000;color:#f5f5ff}
.hiphop-theme table{width:100%;text-align:center;border-collapse:collapse;margin:0 auto 1rem}.hiphop-theme td{vertical-align:top}.hiphop-theme p{color:#f5f5ff}
.hiphop-theme p.zwei,.hiphop-theme h1.zwei{margin:1.25rem 0;padding:.65rem 1rem;text-align:center;font-size:clamp(2rem,5vw,3.2rem);font-weight:900;letter-spacing:.04em;color:#fff;background:none;border:0;border-left:0;box-shadow:none;text-shadow:0 0 5px #fff,0 0 12px #ff00d4,0 0 24px #b000ff,0 0 40px #00eaff}
.hiphop-theme p.zwei::before,.hiphop-theme p.zwei::after,.hiphop-theme h1.zwei::before,.hiphop-theme h1.zwei::after{content:none;display:none}
.hiphop-theme p.zwei{background-image:linear-gradient(90deg,#ff00b8,#ff5b00,#ffe600,#37ff00,#00efff,#a000ff,#ff4fc3);background-repeat:no-repeat;background-position:center bottom;background-size:100% 4px;padding-bottom:1rem}
.hiphop-theme p.vier,.hiphop-theme section.vier{margin:1rem auto;padding:clamp(1rem,3vw,2rem);max-width:760px;text-align:left;font-size:1.08rem;line-height:1.7;background:#080808;border:1px solid #00eaff88;border-radius:12px;box-shadow:0 0 18px #00eaff25}
.hiphop-theme p.vier a.class2{display:inline-block;margin:.18rem .3rem .18rem 0;color:#00efff;font-size:1.12rem;line-height:1.55;font-weight:700;text-shadow:0 0 9px #00efff99}.hiphop-theme p.vier a.class2:hover,.hiphop-theme p.vier a.class2:focus{color:#fff;text-shadow:0 0 8px #00efff,0 0 18px #ff00b8}
.hiphop-theme .song{display:block;margin:.6rem 0;padding:.8rem 1rem;border:1px solid #ff00b866;border-left:3px solid #ff00b8;border-radius:7px;background:#101010;color:#fff;text-shadow:0 0 8px #ff00b855}
.hiphop-theme .song:nth-child(6n+2){border-left-color:#00efff}.hiphop-theme .song:nth-child(6n+3){border-left-color:#39ff14}.hiphop-theme .song:nth-child(6n+4){border-left-color:#ffe600}.hiphop-theme .song:nth-child(6n+5){border-left-color:#ff7a00}.hiphop-theme .song:nth-child(6n+6){border-left-color:#b000ff}
.hiphop-theme .song-title{font-size:1.12rem;font-weight:800}.hiphop-theme .lyrics-status{display:block;margin-top:.35rem;color:#d2d2dd;font-size:.92rem;text-shadow:none}.hiphop-theme .lyrics-status a{color:#00efff;text-decoration:underline}
.hiphop-theme a.class1:link,.hiphop-theme a.class1:active,.hiphop-theme a.class1:visited{display:inline-block;padding:.45rem .8rem;border:1px solid #ff00b8;border-radius:6px;color:#fff;background:#160714;font-size:1rem;line-height:1.3;text-decoration:none;box-shadow:0 0 12px #ff00b844}.hiphop-theme a.class1:hover,.hiphop-theme a.class1:focus{background:#35102d;color:#fff;box-shadow:0 0 18px #ff00b888}
.hiphop-theme a:focus-visible{outline:2px solid #c7ff00;outline-offset:3px}
@media(max-width:600px){body.hiphop-theme{padding:1rem .75rem}.hiphop-theme p.vier,.hiphop-theme section.vier{padding:1rem;font-size:1rem}.hiphop-theme p.vier a.class2{font-size:1.05rem}}
 .hiphop-theme section.vier .song + .song{position:relative;margin-top:1.2rem}.hiphop-theme section.vier .song + .song::before{content:"";position:absolute;left:0;right:0;top:-.8rem;height:2px;background:linear-gradient(90deg,#ff00b8,#00efff,#39ff14,#ffe600,#ff7a00,#ff4fc3,#a000ff);box-shadow:0 0 9px #00efff88}
